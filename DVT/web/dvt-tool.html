function linearFit(pts) {
  if (pts.length < 2) return null;
  const n = pts.length;
  let sx = 0, sy = 0, sxx = 0, sxy = 0, syy = 0;
  for (const [x, y] of pts) { sx += x; sy += y; sxx += x * x; sxy += x * y; syy += y * y; }
  const d = n * sxx - sx * sx;
  if (d === 0) return null;
  const m = (n * sxy - sx * sy) / d, b = (sy - m * sx) / n;
  const ssTot = syy - (sy * sy) / n;
  const ssRes = pts.reduce((acc, [x, y]) => acc + (y - (m * x + b)) ** 2, 0);
  return { m, b, r2: ssTot ? 1 - ssRes / ssTot : 1 };
}

/** Same numbers as DVT/dvt_tool/instruments/uvsweep.py analyze() + values(). */
function analyzeSweep(st) {
  const r4 = (v) => Math.round(v * 1e4) / 1e4;
  const has = (v) => v !== null && v !== undefined;
  const steps = (st.steps || []).map((x) => ({ i: x.intensity, mean: x.mean_mw_cm2, led: x.led_max_c }));
  const measured = steps.filter((x) => has(x.mean));
  const want = (st.config && st.config.steps) || [];
  const v = {
    meter_detected: !!st.meter,
    meter_wavelength_verified: !!st.meter_wavelength_verified,
    all_steps_measured: want.length > 0 && JSON.stringify(steps.map((x) => x.i)) === JSON.stringify(want) && steps.every((x) => has(x.mean)),
  };
  if (has(st.meter_wavelength_nm)) v.meter_wavelength_nm = st.meter_wavelength_nm;
  if (st.meter && st.meter.head) v.meter_head = String(st.meter.head);
  if (has(st.dark_mw_cm2)) v.dark_mw_cm2 = r4(st.dark_mw_cm2);
  measured.forEach((x) => { v['irradiance_' + x.i] = Math.round(x.mean * 1000) / 1000; });
  let fit = null;
  if (measured.length >= 2) {
    fit = linearFit(measured.map((x) => [x.i, x.mean]));
    if (fit) {
      const full = fit.m * 100 + fit.b;
      const devs = measured.map((x) => (full ? Math.abs(((x.mean - (fit.m * x.i + fit.b)) / full) * 100) : null)).filter((d) => d !== null);
      Object.assign(v, { slope_mw_per_pct: r4(fit.m), intercept_mw_cm2: r4(fit.b), r2: r4(fit.r2) });
      if (devs.length) v.max_dev_pct = r4(Math.max(...devs));
    }
    v.monotonic = measured.every((x, k) => k === 0 || x.mean > measured[k - 1].mean);
    v.gain_30 = r4(measured[0].mean / measured[0].i);
    v.gain_100 = r4(measured[measured.length - 1].mean / measured[measured.length - 1].i);
    v.graph_attached = true;                     // drawn on the page from the sweep stored with the run
  }
  const leds = steps.map((x) => x.led).filter(has);
  if (leds.length) v.led_max_c = r4(Math.max(...leds));
  return { values: v, fit, steps };
}

async function runUvSweep(tid) {
  const test = TESTS[tid];
  const run = currentRun(tid);
  if (!FOLDER.ok) { alert(t('folderFirst')); return; }
  if (!state.api || !machineInfo) { AUTO[tid] = { runId: run.id }; autoSay(tid, t('needMachine'), 'fail'); return; }
  if (Object.values(AUTO).some((x) => x.busy)) { alert(t('busyElsewhere')); return; }
  const nm = test.uv_wavelength_nm || 405;
  const steps = sweepSteps(test);
  AUTO[tid] = { busy: true, runId: run.id, text: t('autoMeter') };
  refreshTest(tid);
  try {
    const m = await api('/api/dvt/meter');
    if (!m.present) throw new Error(m.message || 'no StarBright on the machine');
    if (m.wavelength_nm !== nm) {
      autoSay(tid, t('autoSetWl')(nm));
      const w = await api(`/api/dvt/meter/wavelength?nm=${nm}`, 'POST');
      if (!w.ok) throw new Error(w.message || `the meter did not take ${nm} nm`);
    }
    const start = await api(`/api/dvt/uv-sweep?wavelength=${nm}&steps=${steps.join(',')}&dwell=10&baseline=5&settle=5&hz=5`, 'POST');
    if (!start.ok) throw new Error(start.message || 'refused');
    log('info', `${run.id}: ${start.message}`);
    let st;
    do {
      await sleep(1000);
      st = await api('/api/dvt/uv-sweep?samples=0');
      const i = st.phase === 'step' && st.step_index !== null && st.step_index !== undefined ? st.step_index : null;
      autoSay(tid, t('autoRunning')(st.phase, st.intensity, st.reading, i, steps.length));
    } while (st.running);
    st = await api('/api/dvt/uv-sweep');
    const res = analyzeSweep(st);
    const known = new Set(test.data_fields.map((f) => f.name));
    const rec = state.results[run.id] || (state.results[run.id] = { values: {} });
    if (!rec.verdict) {
      for (const [k, val] of Object.entries(res.values)) if (known.has(k)) rec.values[k] = val;
      rec.autoFields = Object.keys(res.values).filter((k) => known.has(k));
      rec.auto = { kind: 'uv_sweep', status: st.status, error: st.error, at: new Date().toISOString(), machine: machineInfo,
                   config: st.config, meter: st.meter, dark: st.dark_mw_cm2, steps: st.steps, samples: st.samples };
      persist(run.id, true);
      journal('measurement', run.id);
    }
    const ok = st.status === 'OK';
    AUTO[tid] = { busy: false, runId: run.id, text: ok ? t('autoDone')(st.status) : t('autoFailed')(st.error || st.status), cls: ok ? 'pass' : 'fail' };
    log(ok ? 'pass' : 'fail', t('logAuto')(run.id, st.status + (st.error ? ' - ' + st.error : '')));
  } catch (e) {
    AUTO[tid] = { busy: false, runId: run.id, text: t('autoFailed')(e.message), cls: 'fail' };
    log('fail', `${run.id}: ${e.message}`);
  }
  refreshTest(tid);
}

// ---------- DVT-SAF-008 step 1 (tool: door_open_cure): the door opened, the machine tries to start a cure, the StarBright watches ----------
const DOOR_UV_THRESHOLD = 0.5;       // mW/cm2 above the dark reading = UV seen (catalog field note: CONFIRM)
const DOOR_WATCH_MS = 5000;

function renderDoorCard(test, run, locked) {
  const tid = test.test_id;
  const a = AUTO[tid] && AUTO[tid].runId === run.id ? AUTO[tid] : null;
  const busy = Object.values(AUTO).some((x) => x.busy);
  return `<div class="auto-card">
      <div class="auto-note" style="margin:0 0 8px">${esc(t('doorIntro')(DOOR_UV_THRESHOLD))}</div>
      <div class="auto-row">
        <button class="btn btn-auto btn-small" data-act="door-auto" data-test="${tid}" ${locked || busy ? 'disabled' : ''}>▶ ${t('doorStart')}</button>
        ${a && a.busy ? `<button class="btn btn-outline btn-small" data-act="door-stop" data-test="${tid}">■ ${t('abortRun')}</button>` : ''}
        <span class="auto-text ${a ? a.cls || '' : ''}" id="auto-text-${tid}">${a ? esc(a.text) : ''}</span>
      </div>
    </div>`;
}

async function postJson(path, body) {
  const r = await fetch(state.api + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: AbortSignal.timeout(10000) });
  return r.json();
}

async function runDoorOpenCure(tid) {
  const test = TESTS[tid];
  const run = currentRun(tid);
  if (!FOLDER.ok) { alert(t('folderFirst')); return; }
  if (!state.api || !machineInfo) { AUTO[tid] = { runId: run.id }; autoSay(tid, t('needMachine'), 'fail'); return; }
  if (Object.values(AUTO).some((x) => x.busy)) { alert(t('busyElsewhere')); return; }
  AUTO[tid] = { busy: true, runId: run.id, text: t('autoMeter') };
  refreshTest(tid);
  const stopped = () => AUTO[tid] && AUTO[tid].stop;
  const t0 = performance.now();
  const trace = [];                  // [t_s, mW/cm2, phase, door_open, uv_on]
  const sec = () => Math.round(performance.now() - t0) / 1000;
  const read = async (phase) => {
    const [m, s] = await Promise.all([api('/api/dvt/meter'), api('/api/state')]);
    const v = m.present && typeof m.reading_mw_cm2 === 'number' ? m.reading_mw_cm2 : null;
    trace.push([sec(), v, phase, s.doorClosed === false, !!s.uvOn]);
    await sleep(150);                  // about 5 readings a second
    return { v, s };
  };
  let accepted = { recipe: false, uv: false };
  const allOff = async () => {
    try { await api('/api/uv?on=0', 'POST'); } catch (e) { /* next */ }
    if (accepted.recipe) { try { await api('/api/recipe/abort', 'POST'); } catch (e) { /* next */ } }
    if (accepted.recipe || accepted.uv) { try { await api('/api/cure/stop?immediate=1', 'POST'); } catch (e) { /* best effort */ } }
  };
  try {
    const st0 = await api('/api/state');
    if (st0.uvOn || st0.isHeating || st0.isCooling || st0.nitrogenActive) throw new Error(t('doorBusy'));
    const m = await api('/api/dvt/meter');
    if (!m.present) throw new Error(m.message || 'no StarBright on the machine');
    if (m.wavelength_nm !== 405) {
      autoSay(tid, t('autoSetWl')(405));
      const w = await api('/api/dvt/meter/wavelength?nm=405', 'POST');
      if (!w.ok) throw new Error(w.message || 'the meter did not take 405 nm');
    }

    try { await api('/api/door/open', 'POST'); } catch (e) { /* the door lock release is best effort; the operator may open it otherwise */ }
    autoSay(tid, t('doorOpenNow'));
    const until = Date.now() + 60000;
    let opened = false;
    while (Date.now() < until && !stopped()) {
      const s = await api('/api/state');
      if (s.doorClosed === false) { opened = true; break; }
      await sleep(300);
    }
    if (stopped()) throw new Error(t('doorStopped'));
    if (!opened) throw new Error(t('doorNotSeen'));

    autoSay(tid, t('doorDark'));
    const darkEnd = performance.now() + 2000;
    while (performance.now() < darkEnd) await read('dark');
    const darkVals = trace.filter((r) => r[2] === 'dark' && r[1] !== null).map((r) => r[1]);
    if (!darkVals.length) throw new Error(t('doorNoReading'));
    const dark = Math.max(...darkVals);
    if (trace.some((r) => r[2] === 'dark' && !r[3])) throw new Error(t('doorClosedDuring'));

    autoSay(tid, t('doorAttempt'));
    const material = { id: 'dvt-saf-012', name: 'DVT-SAF-008 door interlock', steps: [{ step: 1, process: 'Cure', time: 1, uvIntensity: 30 }] };
    const rRecipe = await postJson('/api/recipe/start', { material });
    accepted.recipe = rRecipe.ok === true;
    let recipeStop = null;
    if (accepted.recipe) {           // "started" can still be stopped by the program's own pre-flight a moment later (6015 door open)
      const until3 = Date.now() + 3000;
      while (Date.now() < until3) {
        const rs = await api('/api/recipe/status');
        if (String(rs.state).toLowerCase() === 'error') { recipeStop = { state: rs.state, message: rs.message, code: rs.errorCode }; break; }
        await sleep(300);
      }
      if (recipeStop) accepted.recipe = false;
    }
    trace.push([sec(), null, 'recipe_start:' + (rRecipe.ok ? (recipeStop ? `stopped by the machine (${recipeStop.code} ${recipeStop.message})` : 'accepted') : 'refused'), null, null]);
    const rUv = await api('/api/uv?on=1&intensity=30&wavelength=405', 'POST');
    accepted.uv = rUv.ok === true;
    trace.push([sec(), null, 'uv_command:' + (accepted.uv ? 'accepted' : 'refused'), null, null]);
    if (accepted.recipe || accepted.uv) log('fail', t('doorAccepted')(run.id));

    let peak = dark;
    let uvOnSeen = false;
    let doorStayed = true;
    const watchEnd = performance.now() + DOOR_WATCH_MS;
    while (performance.now() < watchEnd && !stopped()) {
      const { v, s } = await read('watch');
      if (v !== null) peak = Math.max(peak, v);
      if (s.uvOn) uvOnSeen = true;
      if (s.doorClosed !== false) doorStayed = false;
      if (v !== null && v - dark > DOOR_UV_THRESHOLD) { await allOff(); break; }     // UV seen: off at once, the step has failed
    }
    await allOff();
    if (stopped()) throw new Error(t('doorStopped'));
    if (!doorStayed) throw new Error(t('doorClosedDuring'));

    const uvDetected = peak - dark > DOOR_UV_THRESHOLD;
    const values = {
      door_open_detected: true,
      cure_start_refused: !accepted.recipe,
      uv_command_refused: !accepted.uv,
      uv_detected: uvDetected,
      uv_peak_above_dark: Math.round(Math.max(0, peak - dark) * 1e4) / 1e4,
      cure_start_inhibited: !accepted.recipe && !accepted.uv && !uvDetected && !uvOnSeen,
    };
    const known = new Set(test.data_fields.map((f) => f.name));
    const rec = state.results[run.id] || (state.results[run.id] = { values: {} });
    if (!rec.verdict) {
      for (const [k, val] of Object.entries(values)) if (known.has(k)) rec.values[k] = val;
      rec.autoFields = [...new Set([...(rec.autoFields || []), ...Object.keys(values).filter((k) => known.has(k))])];
      setAuto(rec, { kind: 'door_open_cure', status: values.cure_start_inhibited ? 'INHIBITED' : 'NOT_INHIBITED', at: new Date().toISOString(),
                   machine: machineInfo, dark_mw_cm2: dark, peak_mw_cm2: peak, threshold_mw_cm2: DOOR_UV_THRESHOLD,
                   recipe_response: rRecipe, recipe_stopped_by_machine: recipeStop, uv_response: rUv, uv_on_seen: uvOnSeen, samples: trace,
                   columns: ['t_s', 'irradiance_mw_cm2', 'phase', 'door_open', 'uv_on'] });
      persist(run.id, true);
      journal('measurement', run.id);
    }
    const ok = values.cure_start_inhibited;
    AUTO[tid] = { busy: false, runId: run.id, text: ok ? t('doorPass')(values.uv_peak_above_dark) : t('doorFail')(values), cls: ok ? 'pass' : 'fail',
                  advance: values };
    log(ok ? 'pass' : 'fail', `${run.id}: ${AUTO[tid].text}`);
  } catch (e) {
    await allOff();
    AUTO[tid] = { busy: false, runId: run.id, text: t('autoFailed')(e.message), cls: 'fail' };
    log('fail', `${run.id}: ${e.message}`);
  }
  refreshTest(tid);
  if (AUTO[tid] && AUTO[tid].advance) { const v = AUTO[tid].advance; delete AUTO[tid].advance; await autoAdvance(tid, 'door_open_cure', v); }
}

// ---------- TC-08 on the machine (tool: tc08_record): readiness gate, then CH1 logged at 1 Hz ----------
const TC08 = { ready: {}, rec: null, fan: {} };   // ready[tid] = last check; rec = { tid, runId, timer, t0, max, n, badSince }; fan[tid] = { state, at, message } for tests with external heat
const TC_MIN_C = -25, TC_MAX_C = 400;    // the machine's valid CH1 range (PicoLogTc08Probe; 400 leaves headroom above a 250 C cutout)
const TC_OPEN_MARGIN_C = 60;             // above the cold junction, with nothing running = an open thermocouple
const TC_JITTER_OPEN_C = 5, TC_JITTER_POLLS = 3;   // external heat: a reading moving this much across 3 polls (~6 s) is an open input, not a body
TC08.hist = {};                          // hist[tid] = the last CH1 readings of the readiness poll
let machineState = null;                 // the last /api/state the readiness poll saw

function renderTc08Card(test, run, locked) {
  const tid = test.test_id;
  const recording = TC08.rec && TC08.rec.runId === run.id;
  const a = AUTO[tid] && AUTO[tid].runId === run.id ? AUTO[tid] : null;
  const row = (id, label) => `<div class="tc-row" id="tc-${id}-${tid}"><span class="tc-dot"></span><span class="tc-label">${esc(label)}</span><span class="tc-val"></span></div>`;
  return `<div class="auto-card">
      <div class="tc-checks">${row('machine', t('tcMachine'))}${row('dev', t('tcDevice'))}${row('ch1', t('tcCh1'))}${row('amb', t('tcAmbient'))}${test.external_heat ? row('fan', t('tcFan')) : ''}</div>
      <div class="auto-row" style="margin-top:8px">
        ${recording ? `<button class="btn btn-outline btn-small" data-act="tc-stop" data-test="${tid}">■ ${t('tcStop')}</button>`
                    : `<button class="btn btn-auto btn-small" id="tc-start-${tid}" data-act="tc-start" data-test="${tid}" disabled>▶ ${t('tcStart')}</button>`}
        ${!recording && !locked && hasRecording(run) ? `<button class="btn btn-outline btn-small" data-act="tc-reread" data-test="${tid}">${t('tcReread')}</button>` : ''}
        <span class="auto-text ${a ? a.cls || '' : ''}" id="auto-text-${tid}">${a ? esc(a.text) : recording ? '' : esc(t('tcNotReady'))}</span>
      </div>
      ${hasRecording(run) || recording ? `<canvas class="chart" id="tc08-${tid}" width="720" height="280" aria-label="heater body and chamber against time"></canvas>` : ''}
    </div>`;
}

/** The recording as a graph: heater body (CH1) and chamber against time, with the trip and the reset marked. */
function drawTc08(tid) {
  const canvas = $('tc08-' + tid);
  if (!canvas) return;
  const rec = state.results[currentRun(tid).id];
  const a = rec && ((rec.autos && rec.autos.tc08_record) || (rec.auto && rec.auto.kind === 'tc08_record' ? rec.auto : null));
  if (!a || !a.samples || !a.samples.length) return;
  const rows = a.samples;
  const body = rows.filter((r) => typeof r[1] === 'number').map((r) => [r[0] / 60, r[1]]);
  const chamber = rows.filter((r) => typeof r[2] === 'number').map((r) => [r[0] / 60, r[2]]);
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height, L = 56, R = 16, T = 22, B = 36;
  ctx.fillStyle = '#0a0a0a'; ctx.fillRect(0, 0, W, H);
  if (!body.length && !chamber.length) return;
  const all = body.concat(chamber);
  const xmax = Math.max(1, ...all.map((p) => p[0]));
  const ymin = Math.min(...all.map((p) => p[1])) - 5, ymax = Math.max(...all.map((p) => p[1])) + 5;
  const X = (x) => L + (x / xmax) * (W - L - R);
  const Y = (y) => H - B - ((y - ymin) / (ymax - ymin)) * (H - T - B);
  ctx.font = '11px Segoe UI, sans-serif'; ctx.lineWidth = 1;
  for (let k = 0; k <= 4; k++) {
    const v = ymin + ((ymax - ymin) * k) / 4;
    ctx.strokeStyle = '#2a2a2a'; ctx.beginPath(); ctx.moveTo(L, Y(v)); ctx.lineTo(W - R, Y(v)); ctx.stroke();
    ctx.fillStyle = '#777'; ctx.textAlign = 'right'; ctx.fillText(v.toFixed(0), L - 6, Y(v) + 4);
  }
  ctx.textAlign = 'center';
  const step = xmax > 40 ? 10 : xmax > 15 ? 5 : xmax > 6 ? 2 : 1;
  for (let x = 0; x <= xmax; x += step) ctx.fillText(x + ' min', X(x), H - B + 16);
  ctx.save(); ctx.translate(14, (H - B + T) / 2); ctx.rotate(-Math.PI / 2); ctx.fillText('°C', 0, 0); ctx.restore();
  const line = (pts, color) => {
    if (!pts.length) return;
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.beginPath();
    pts.forEach((p, k) => (k ? ctx.lineTo(X(p[0]), Y(p[1])) : ctx.moveTo(X(p[0]), Y(p[1])))); ctx.stroke();
  };
  line(chamber, '#ff9800');
  line(body, '#64b5f6');
  const m = rec.marks || {};
  const vline = (sec, color, label, row) => {
    if (sec === null || sec === undefined) return;
    ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.setLineDash([4, 3]); ctx.beginPath();
    ctx.moveTo(X(sec / 60), T); ctx.lineTo(X(sec / 60), H - B); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.fillText(label, X(sec / 60) + 3, T + 12 + row * 13);
  };
  vline(m.onset_s, '#9e9e9e', t('gOnset'), 0);
  vline(m.trip_s, '#f44336', t('gTrip'), 1);
  vline(m.reset_s, '#4caf50', t('gReset'), 2);
  const v = rec.values || {};
  ctx.fillStyle = '#ddd'; ctx.textAlign = 'right';
  ctx.fillText(`${t('gLegend')} · ${v.cutout_trip_temp ?? '-'} °C · ${v.time_to_trip ?? '-'} min · ${v.reset_temp ?? '-'} °C`, W - R, T - 8);
}

/** Does this run already hold a TC-08 recording with samples in it? */
function hasRecording(run) {
  const rec = state.results[run.id];
  const a = rec && ((rec.autos && rec.autos.tc08_record) || (rec.auto && rec.auto.kind === 'tc08_record' ? rec.auto : null));
  return !!(a && a.samples && a.samples.length);
}

/** Read the stored recording again - a run measured before an analysis improvement gets it now. */
function rereadTc08(tid) {
  const run = currentRun(tid);
  const rec = state.results[run.id];
  if (!rec || rec.verdict) return;
  const read = DVT_AUTO.fromTrace(TESTS[tid], rec);
  AUTO[tid] = { busy: false, runId: run.id, cls: read.filled.length ? 'pass' : 'warn',
                text: read.filled.length ? t('tcRead')(read.filled.length) : read.message || t('tcNothingRead') };
  if (read.message) log(read.filled.length ? 'pass' : 'warn', `${run.id}: ${read.message}`);
  persist(run.id, true);
  refreshTest(tid);
}

function setTcRow(tid, id, ok, value) {
  const el = $(`tc-${id}-${tid}`);
  if (!el) return;
  el.classList.toggle('ok', ok === true);
  el.classList.toggle('bad', ok === false);
  el.classList.toggle('warn', ok === 'warn');
  el.querySelector('.tc-val').textContent = value || '';
}

/**
 * A test that heats from an external supply (catalog external_heat) needs the heater fan running from the moment
 * the element can be fed - not only once the operator presses Start - so the fan goes on as soon as the readiness
 * check sees the TC-08 on the machine (DVT_AUTO.prepare turns it on and waits for the tach; finish gives it back).
 */
function ensureHeaterFan(tid) {
  const f = TC08.fan[tid];
  if (f && (f.state === 'on' || f.state === 'pending')) return f;
  if (f && f.state === 'failed' && Date.now() - f.at < 10000) return f;     // try again every 10 s (e.g. the start-up self-test)
  TC08.fan[tid] = { state: 'pending', at: Date.now(), message: '' };
  DVT_AUTO.prepare(TESTS[tid]).then((r) => {
    TC08.fan[tid] = { state: r.ok ? 'on' : 'failed', at: Date.now(), message: r.message || '' };
    log(r.ok ? 'info' : 'warn', `${tid}: ${r.message || (r.ok ? 'heater fan on' : 'heater fan not on')}`);
    checkTc08(tid);
  }).catch((e) => { TC08.fan[tid] = { state: 'failed', at: Date.now(), message: String(e.message || e) }; });
  return TC08.fan[tid];
}

async function checkTc08(tid) {
  const machine = !!machineInfo;
  let st = null;
  if (machine) {
    try { st = await api('/api/dev/picolog/status'); } catch (e) { st = null; }
    try { machineState = await api('/api/state'); } catch (e) { /* keep the last one */ }
  }
  const driverMissing = !!(st && st.error && /driver unavailable|usbtc08/i.test(st.error));
  const connected = !!(st && st.connected);
  const temp = st && typeof st.temperature === 'number' ? st.temperature : null;
  const inBand = connected && st.ch1Available && temp !== null && temp >= TC_MIN_C && temp <= TC_MAX_C;
  const ambient = st && typeof st.ambient === 'number' ? st.ambient : null;       // the TC-08's cold junction (sCureBox 1.0.39+)
  // An open thermocouple does not read null: it floats near the top of the valid band, so an in-band
  // reading is not enough. The cold junction is the reference - the instrument's terminal block is at
  // ambient, so a probe far above it while nothing runs is open, not hot (DVT_AUTO.P.tcCheck does the same).
  const running = !!(machineState && (machineState.uvOn || machineState.isHeating));
  const floating = inBand && !running && ambient !== null && temp - ambient > TC_OPEN_MARGIN_C;
  // With the heater fed from an external supply (catalog external_heat) the machine never reports heating while the
  // body is genuinely hot, so there the rule cannot decide: it becomes a warning and Start asks the operator.
  // Level alone cannot tell them apart there, behaviour can: an open input FLOATS (105 then 180 C within minutes on the
  // idle unit) while a hot body moves less than a degree between polls - so a reading that jumps more than
  // TC_JITTER_OPEN_C across the last polls is open even on an external-heat test, and a steady one is a hot body.
  const external = !!(TESTS[tid] && TESTS[tid].external_heat);
  const hist = (TC08.hist[tid] = (TC08.hist[tid] || []).concat(temp === null ? [] : [temp]).slice(-TC_JITTER_POLLS));
  const jittery = hist.length >= 2 && Math.max(...hist) - Math.min(...hist) > TC_JITTER_OPEN_C;
  const steady = external && floating && hist.length >= TC_JITTER_POLLS && !jittery;
  const ch1 = inBand && (!floating || steady);
  let fan = null;
  if (external && machine && connected && inBand && !(TC08.rec && TC08.rec.tid === tid)) fan = ensureHeaterFan(tid);
  const fanOk = !external || !!(fan && fan.state === 'on');
  const ready = machine && connected && ch1 && fanOk;
  TC08.ready[tid] = { ready, temp, ambient, floating: steady, device: st && st.deviceInfo };
  setTcRow(tid, 'machine', machine, machine ? machineInfo : t('needMachine'));
  setTcRow(tid, 'dev', machine ? connected : null, !machine ? '' : connected ? (st.deviceInfo || '') : driverMissing ? t('tcDriver') : t('tcPlug'));
  setTcRow(tid, 'ch1', !connected ? null : steady ? 'warn' : ch1,
    !connected ? '' : steady ? t('tcOpenExt')(temp, ambient) : ch1 ? temp.toFixed(1) + ' °C'
      : floating && external && !jittery ? t('tcSettling') : floating ? t('tcOpen')(temp, ambient) : t('tcNoCh1'));
  // the ambient / reference a run records is the REAL thermocouple on CH2 when one is plugged in (sCureBox 1.0.50+, user
  // 2026-10-01); the cold junction stays the fallback and remains the reference of the open-probe rule above
  const reference = st && typeof st.ch2 === 'number' ? st.ch2 : null;
  TC08.ready[tid].reference = reference;
  const ambRow = $(`tc-amb-${tid}`);
  if (ambRow) ambRow.querySelector('.tc-label').textContent = reference !== null ? t('tcRef') : t('tcAmbient');
  const shown = reference !== null ? reference : ambient;
  setTcRow(tid, 'amb', connected ? shown !== null : null, !connected ? '' : shown !== null ? shown.toFixed(1) + ' °C' : t('tcNoAmbient'));
  if (external) setTcRow(tid, 'fan', !fan ? null : fan.state === 'on' ? true : fan.state === 'failed' ? false : null,
    !fan ? '' : fan.state === 'pending' ? t('tcFanWait') : fan.message);
  const btn = $('tc-start-' + tid);
  if (btn) btn.disabled = !ready || Object.values(AUTO).some((x) => x.busy);
  const txt = $('auto-text-' + tid);
  if (txt && !(TC08.rec && TC08.rec.tid === tid) && !(AUTO[tid] && AUTO[tid].text)) txt.textContent = ready ? t('tcReady') : t('tcNotReady');
  return ready;
}

async function startTc08(tid) {
  if (!FOLDER.ok) { alert(t('folderFirst')); return; }
  if (!state.operator.trim()) { alert(t('operatorFirst')); $('operator').focus(); return; }
  if (!(await checkTc08(tid))) return;
  const test = TESTS[tid];
  const rd = TC08.ready[tid];
  if (rd.floating && !confirm(t('tcConfirmExt')(rd.temp, rd.ambient))) return;   // hot from outside, or open: the operator knows
  const fan = TC08.fan[tid];
  if (!(fan && fan.state === 'on')) {                 // the fan is normally on already (ensureHeaterFan); other tests: the UV self-test check
    const prep = await DVT_AUTO.prepare(test);        // what this test needs of the machine before it logs anything
    if (!prep.ok) { AUTO[tid] = { busy: false, runId: currentRun(tid).id, text: prep.message, cls: 'fail' }; refreshTest(tid); return; }
    if (prep.message) log('info', `${tid}: ${prep.message}`);
  }
  const run = currentRun(tid);
  const first = TC08.ready[tid].temp;
  const rec = state.results[run.id] || (state.results[run.id] = { values: {} });
  if (rec.verdict) return;
  // a new recording starts clean: the values and marks the previous recording's analysis put here would otherwise show
  // on the card and in the graph header until the new trace is read (78.91 / 0 min / 73.23 from an earlier run, seen live)
  (rec.autoFields || []).forEach((f) => { delete rec.values[f]; });
  rec.autoFields = [];
  delete rec.marks;
  const amb = TC08.ready[tid].reference !== null && TC08.ready[tid].reference !== undefined ? TC08.ready[tid].reference : TC08.ready[tid].ambient;   // CH2 first
  if (amb !== null && test.data_fields.some((f) => f.name === 'ambient_temp')) {        // older machines: left to the operator
    rec.values.ambient_temp = Math.round(amb * 100) / 100;
    rec.autoFields = [...new Set([...(rec.autoFields || []), 'ambient_temp'])];
  }
  if (test.data_fields.some((f) => f.name === 'start_temp')) {
    rec.values.start_temp = Math.round(first * 100) / 100;
    rec.autoFields = [...new Set([...(rec.autoFields || []), 'start_temp'])];
  }
  rec.auto = { kind: 'tc08_record', status: 'RECORDING', at: new Date().toISOString(), machine: machineInfo, device: TC08.ready[tid].device,
               columns: ['t_s', 'ch1_c', 'machine_chamber_c', 'machine_heating', 'alerts', 'heater_commanded', 'heater_pwm_pct'], samples: [] };
  setAuto(rec, rec.auto);
  TC08.rec = { tid, runId: run.id, t0: performance.now(), max: first, n: 0, badSince: null };
  AUTO[tid] = { busy: true, runId: run.id, text: t('tcRecording')(first, first, '0:00', 0) };
  persist(run.id, true);
  journal('measurement_start', run.id);
  log('info', `${run.id}: ${t('tcStarted')}`);
  refreshTest(tid);
  TC08.rec.timer = setInterval(() => tcTick().catch(() => {}), 1000);
}

async function tcTick() {
  const r = TC08.rec;
  if (!r || r.busyTick) return;
  r.busyTick = true;
  try {
    const [p, s] = await Promise.all([api('/api/dev/picolog/status').catch(() => null), api('/api/state').catch(() => null)]);
    const rec = state.results[r.runId];
    if (!rec || !rec.auto || TC08.rec !== r) return;
    const temp = p && p.ch1Available && typeof p.temperature === 'number' ? p.temperature : null;
    const secs = Math.round(performance.now() - r.t0) / 1000;
    // the alarm AND the machine's own heater command ride in the trace: with the heater driven
    // externally, the drive going low while the temperature still climbs is the protection acting
    rec.auto.samples.push([secs, temp, s && typeof s.chamberTemp === 'number' ? Math.round(s.chamberTemp * 100) / 100 : null, s ? !!s.isHeating : null,
                           s && s.alerts ? s.alerts.join('|') : '',
                           s ? s.heaterOut === true : null,
                           s && typeof s.heaterPwm === 'number' ? Math.round(s.heaterPwm * 10) / 10 : null]);
    r.n++;
    if (temp !== null) { r.max = Math.max(r.max, temp); r.badSince = null; } else if (r.badSince === null) r.badSince = secs;
    const mmss = `${Math.floor(secs / 60)}:${String(Math.floor(secs % 60)).padStart(2, '0')}`;
    const lost = r.badSince !== null && secs - r.badSince >= 10;
    autoSay(r.tid, lost ? t('tcLost')(Math.round(secs - r.badSince)) : t('tcRecording')(temp, r.max, mmss, r.n), lost ? 'fail' : '');
    drawTc08(r.tid);                                    // the graph grows live, one point a second
    if (r.n % 30 === 0) persist(r.runId, true);         // the trace reaches the results folder every 30 s
    // the analyser decides when the run is over (DVT-SAF-009: trip seen, then the reset or the wait after it) - the operator does not
    const as = typeof DVT_AUTO.autoStop === 'function' ? DVT_AUTO.autoStop(TESTS[r.tid], rec) : { stop: false };
    if (as && as.stop) { log('info', `${r.runId}: ${t('tcAutoStopped')(as.why || '')}`); stopTc08(r.tid); return; }
  } finally {
    r.busyTick = false;
  }
}

function stopTc08(tid) {
  const r = TC08.rec;
  if (!r || r.tid !== tid) return;
  clearInterval(r.timer);
  TC08.rec = null;
  const rec = state.results[r.runId];
  if (rec && rec.auto) rec.auto.status = 'STOPPED';
  DVT_AUTO.finish(TESTS[tid]);
  delete TC08.fan[tid];                                 // the fan is the machine's again; the next readiness check turns it on for a new run
  const read = rec ? DVT_AUTO.fromTrace(TESTS[tid], rec) : { filled: [], message: '' };
  AUTO[tid] = { busy: false, runId: r.runId, cls: 'pass',
    text: t('tcStopped')(r.n, r.max) + (read.filled.length ? ` · ${t('tcRead')(read.filled.length)}` : '') };
  if (read.message) log(read.filled.length ? 'pass' : 'warn', `${r.runId}: ${read.message}`);
  persist(r.runId, true);
  journal('measurement', r.runId);
  log('info', `${r.runId}: ${AUTO[tid].text}`);
  // a run whose every needed value came out of the trace is complete: verdict recorded, the operator told in one line
  const done = rec && typeof DVT_AUTO.completed === 'function' ? DVT_AUTO.completed(TESTS[tid], rec) : { ok: false };
  if (done && done.ok) {
    AUTO[tid].text = done.message || AUTO[tid].text;
    AUTO[tid].cls = done.verdict === 'FAIL' ? 'fail' : 'pass';
    log(done.verdict === 'FAIL' ? 'fail' : 'pass', `${r.runId}: ${done.message || done.verdict}`);
    if (FOLDER.ok && state.operator.trim() && !rec.verdict) recordVerdict(tid);
  }
  refreshTest(tid);
  syncing.then(() => { if (!FOLDER.ok || dirty.has(r.runId)) { log('fail', t('tcNotSaved')); alert(t('tcNotSaved')); } });
}

setInterval(() => {                      // keep the readiness checks of every open TC-08 step current
  for (const tid of openTests) {
    const test = TESTS[tid];
    if (!test || !test.procedure_steps.some((s) => s.tool === 'tc08_record')) continue;
    if (TC08.rec && TC08.rec.tid === tid) continue;
    checkTc08(tid);
  }
}, 2000);

// ---------- DVT-SAF-008 steps 2-6: guided door checks, each measured by the machine ----------
// every automatic step keeps its own record in rec.autos[kind] (and its own CSV in sweeps/); rec.auto is the latest one
function setAuto(rec, auto) {
  rec.autos = rec.autos || {};
  rec.autos[auto.kind] = auto;
  rec.auto = auto;
}
function fillAuto(test, rec, values) {
  const known = new Set(test.data_fields.map((f) => f.name));
  const keys = Object.keys(values).filter((k) => known.has(k));
  keys.forEach((k) => { rec.values[k] = values[k]; });
  rec.autoFields = [...new Set([...(rec.autoFields || []), ...keys])];
}

const GUIDED = {
  uv_off_timing: { intro: 'g2Intro', start: 'gStart' },
  door_lock_check: { intro: 'g3Intro', start: 'gStart' },
  door_magnet_defeat: { intro: 'g4Intro', start: 'gStart' },
  door_status_check: { intro: 'g5Intro', start: 'gStart' },
  door_alarm_check: { intro: 'g6Intro', start: 'g6Read' },
};

// ---------- auto-advance: a guided step that passed its part of the criteria starts the next one by itself ----------
const NEEDS_DOOR_CLOSED = new Set(['uv_off_timing', 'door_lock_check']);   // these refuse to start with the door open

/**
 * Pure: after `tool` produced `values`, which step comes next by itself? Only the catalog criteria clauses whose
 * fields this step produced are judged - top-level AND list, each clause through the page's evaluator with the
 * catalog thresholds - so the page has no number of its own: "under 2 s" is whatever the catalog says.
 * Returns { next, checked, failed, why }.
 */
function nextStepAfter(test, rec, tool, values) {
  const tools = (test.procedure_steps || []).map((s) => s.tool);
  const i = tools.indexOf(tool);
  const next = i >= 0 ? tools.slice(i + 1).find((x) => x && GUIDED[x]) || null : null;
  const expr = String(test.pass_criteria || '');
  if (/\(|\bOR\b/.test(expr)) return { next: null, checked: [], failed: [], why: 'criteria are not a plain AND list' };
  const produced = new Set(Object.keys(values || {}));
  const all = { ...((rec && rec.values) || {}), ...(values || {}) };
  const checked = [], failed = [];
  for (const clause of expr.split(/\s+AND\s+/).map((c) => c.trim()).filter(Boolean)) {
    let refs;
    try { refs = CRIT.referencedNames(clause); } catch (e) { return { next: null, checked, failed, why: 'unreadable clause: ' + clause }; }
    if (!refs.some((n) => produced.has(n))) continue;
    const r = CRIT.evaluate(clause, all, CAT.thresholds);
    checked.push(clause);
    if (r.verdict !== 'PASS') failed.push(clause + (r.detail ? ' (' + r.detail + ')' : ''));
  }
  if (failed.length) return { next: null, checked, failed, why: failed.join('; ') };
  if (!next) return { next: null, checked, failed, why: 'last step' };
  return { next, checked, failed, why: '' };
}

/** Act on nextStepAfter: wait for what the next step needs (the door closed), tell the operator, then start it. */
async function autoAdvance(tid, tool, values) {
  const test = TESTS[tid], run = currentRun(tid), rec = state.results[run.id];
  if (!rec || rec.verdict) return;
  const d = nextStepAfter(test, rec, tool, values);
  const stepNo = (x) => test.procedure_steps.findIndex((s) => s.tool === x) + 1;
  if (!d.next) { if (d.failed.length) log('warn', `${run.id}: ${t('gNoAdvance')(d.why)}`); return; }
  const key = tid + ':' + d.next;
  const n = stepNo(d.next);
  AUTO[key] = { busy: true, runId: run.id, text: t('gAdvancing')(n), prompt: '' };
  log('info', `${run.id}: ${t('gAdvancing')(n)}`);
  refreshTest(tid);
  const stop = () => { AUTO[key] = { busy: false, runId: run.id, text: t('gAdvanceStopped'), cls: 'warn' }; refreshTest(tid); };
  if (NEEDS_DOOR_CLOSED.has(d.next)) {
    gPrompt(key, t('gCloseToContinue')(n));
    const s = await waitState(key, (x) => x.doorClosed === true, 300);
    gPrompt(key, '');
    if (!s) return stop();
  } else {
    for (let left = 3; left > 0; left--) {
      if (AUTO[key].stop) return stop();
      gSay(key, t('gAdvancingIn')(n, left));
      await sleep(1000);
    }
  }
  if (AUTO[key].stop) return stop();
  AUTO[key] = { busy: false, runId: run.id };          // runGuided refuses to start while anything is busy
  await runGuided(tid, d.next);
}

function renderGuidedCard(test, run, locked, tool) {
  const tid = test.test_id;
  const key = tid + ':' + tool;
  const a = AUTO[key] && AUTO[key].runId === run.id ? AUTO[key] : null;
  const busy = Object.values(AUTO).some((x) => x.busy);
  const decay = tool === 'uv_off_timing' && (state.results[run.id] || {}).autos && state.results[run.id].autos.uv_off_timing;
  return `<div class="auto-card">
      <div class="auto-note" style="margin:0 0 8px">${esc(t(GUIDED[tool].intro))}</div>
      <div class="auto-row">
        <button class="btn btn-auto btn-small" data-act="guided" data-tool="${tool}" data-test="${tid}" ${locked || busy ? 'disabled' : ''}>▶ ${t(GUIDED[tool].start)}</button>
        ${a && a.busy ? `<button class="btn btn-outline btn-small" data-act="guided-stop" data-tool="${tool}" data-test="${tid}">■ ${t('abortRun')}</button>` : ''}
        <span class="auto-text ${a ? a.cls || '' : ''}" id="auto-text-${key.replace(':', '-')}">${a ? esc(a.text) : ''}</span>
      </div>
      <div class="g-prompt" id="prompt-${key.replace(':', '-')}" ${a && a.prompt ? '' : 'hidden'}>${a && a.prompt ? esc(a.prompt) : ''}</div>
      ${decay && decay.samples && decay.samples.length ? `<canvas class="chart" id="decay-${tid}" width="720" height="260" aria-label="irradiance against time after the door opened"></canvas>` : ''}
    </div>`;
}

function gSay(key, text, cls = '') {
  if (!AUTO[key]) return;
  AUTO[key].text = text; AUTO[key].cls = cls;
  const el = $('auto-text-' + key.replace(':', '-'));
  if (el) { el.textContent = text; el.className = 'auto-text ' + cls; }
}
function gPrompt(key, text) {
  if (!AUTO[key]) return;
  AUTO[key].prompt = text;
  const el = $('prompt-' + key.replace(':', '-'));
  if (el) { el.textContent = text || ''; el.hidden = !text; }
}

/** Poll until cond(state) holds; returns the state or null on timeout / stop. */
async function waitState(key, cond, seconds) {
  const until = Date.now() + seconds * 1000;
  while (Date.now() < until) {
    if (AUTO[key] && AUTO[key].stop) return null;
    const s = await api('/api/state');
    if (cond(s)) return s;
    await sleep(250);
  }
  return null;
}

async function runGuided(tid, tool) {
  const test = TESTS[tid];
  const run = currentRun(tid);
  const key = tid + ':' + tool;
  if (!FOLDER.ok) { alert(t('folderFirst')); return; }
  if (!state.api || !machineInfo) { alert(t('needMachine')); return; }
  if (Object.values(AUTO).some((x) => x.busy)) { alert(t('busyElsewhere')); return; }
  const rec = state.results[run.id] || (state.results[run.id] = { values: {} });
  if (rec.verdict) return;
  AUTO[key] = { busy: true, runId: run.id, text: t('gChecking') };
  refreshTest(tid);
  const trace = [];
  const t0 = performance.now();
  const sec = () => Math.round(performance.now() - t0) / 1000;
  const stopped = () => AUTO[key] && AUTO[key].stop;
  let started = { recipe: false };
  let advanceValues = null;                                 // set when the step finished: the next step may follow by itself
  const safe = async () => {
    try { await api('/api/uv?on=0', 'POST'); } catch (e) { /* next */ }
    if (started.recipe) { try { await api('/api/recipe/abort', 'POST'); } catch (e) { /* best effort */ } }
  };
  try {
    const st0 = await api('/api/state');
    if (st0.uvOn || st0.isHeating || st0.isCooling || st0.nitrogenActive) throw new Error(t('doorBusy'));
    let values = {};
    let auto = { kind: tool, at: new Date().toISOString(), machine: machineInfo, columns: ['t_s', 'door_open', 'uv_on', 'phase'], samples: trace };
    const mark = (s, phase) => trace.push([sec(), s ? s.doorClosed === false : null, s ? !!s.uvOn : null, phase]);

    if (tool === 'uv_off_timing') {
      const m = await api('/api/dvt/meter');
      if (!m.present) throw new Error(m.message || 'no StarBright on the machine');
      if (m.wavelength_nm !== 405) {
        gSay(key, t('autoSetWl')(405));
        const w = await api('/api/dvt/meter/wavelength?nm=405', 'POST');
        if (!w.ok) throw new Error(w.message || 'the meter did not take 405 nm');
      }
      if (st0.doorClosed !== true) throw new Error(t('gCloseFirst'));
      const r = await api('/api/dvt/uv-off?wavelength=405&intensity=100', 'POST');
      if (!r.ok) throw new Error(r.message || 'refused');
      let st;
      do {
        await sleep(400);
        if (stopped()) { await api('/api/dvt/uv-off/abort', 'POST'); }
        st = await api('/api/dvt/uv-off?samples=0');
        gSay(key, t('g2Phase')(st.phase, st.reading, st.plateau_mw_cm2));
        gPrompt(key, st.phase === 'open_door' ? t('g2OpenNow') : st.phase === 'plateau' ? t('g2Wait') : '');
      } while (st.running);
      gPrompt(key, '');
      st = await api('/api/dvt/uv-off');
      if (st.status !== 'OK') throw new Error(st.error || st.status);
      values = { uv_off_time: st.uv_off_time_s, uv_zero_time: st.uv_zero_time_s, residual_irradiance: st.residual_mw_cm2 };
      auto = { ...auto, columns: ['t_s', 'irradiance_mw_cm2', 'door_open', 'phase'], samples: st.samples, status: st.status,
               plateau_mw_cm2: st.plateau_mw_cm2, dark_mw_cm2: st.dark_mw_cm2, release_to_off_s: st.release_to_off_s,
               release_at_s: st.release_at_s, door_open_at_s: st.door_open_at_s, below_10pct_at_s: st.below_10pct_at_s,
               zero_at_s: st.zero_at_s, zero_threshold_mw_cm2: st.zero_threshold_mw_cm2, release_to_zero_s: st.release_to_zero_s,
               graph: true,
               uv_off_before_door_open: st.uv_off_before_door_open, program_end: st.program_end, alerts_before: st.alerts_before,
               alerts_after: st.alerts_after, alert_details: st.alert_details, door_aborted: st.door_aborted, ui_alerts: st.ui_alerts, mode: st.mode };
    }

    if (tool === 'door_lock_check') {
      if (st0.doorClosed !== true) throw new Error(t('gCloseFirst'));
      const material = { id: 'dvt-saf-012-lock', name: 'DVT-SAF-008 lock check', steps: [{ step: 1, process: 'Cure', time: 1, uvIntensity: 30 }] };
      const r = await postJson('/api/recipe/start', { material });
      if (!r.ok) throw new Error(r.message || 'the program did not start');
      started.recipe = true;
      gSay(key, t('g3Starting'));
      const lit = await waitState(key, (s) => s.uvOn, 30);
      if (!lit) throw new Error(stopped() ? t('doorStopped') : t('g3NoUv'));
      gPrompt(key, t('g3PullNow'));
      let opened = false;
      const end = Date.now() + 10000;
      while (Date.now() < end && !stopped()) {
        const s = await api('/api/state');
        mark(s, 'pull');
        if (s.doorClosed === false) { opened = true; await safe(); break; }
        gSay(key, t('g3Pulling')(Math.ceil((end - Date.now()) / 1000)));
        await sleep(200);
      }
      gPrompt(key, '');
      if (stopped()) throw new Error(t('doorStopped'));
      const rs = await api('/api/recipe/status');
      const sEnd = await api('/api/state');
      await safe();                                          // the cure has done its job: stop it and the UV
      values = { lock_engaged: !opened };
      auto = { ...auto, status: opened ? 'OPENED' : 'HELD', program_end: { state: rs.state, message: rs.message, error_code: rs.errorCode },
               alerts_after: sEnd.alerts, alert_details: sEnd.alertDetails, door_aborted: sEnd.doorAborted };
    }

    if (tool === 'door_magnet_defeat') {
      await api('/api/door/open', 'POST');
      gPrompt(key, t('g4OpenNow'));
      const open = await waitState(key, (s) => s.doorClosed === false, 30);
      if (!open) throw new Error(stopped() ? t('doorStopped') : t('doorNotSeen'));
      mark(open, 'open');
      gPrompt(key, t('g4MagnetNow'));
      let fooled = false;
      const end = Date.now() + 10000;
      while (Date.now() < end && !stopped()) {
        const s = await api('/api/state');
        mark(s, 'magnet');
        if (s.doorClosed === true) fooled = true;
        gSay(key, t('g4Holding')(Math.ceil((end - Date.now()) / 1000), fooled));
        await sleep(200);
      }
      gPrompt(key, t('g4Done'));
      if (stopped()) throw new Error(t('doorStopped'));
      if (fooled && !confirm(t('g4Confirm'))) throw new Error(t('g4Repeat'));   // a door that fell shut also reads closed
      values = { defeat_by_magnet_possible: fooled };
      auto = { ...auto, status: fooled ? 'SENSOR_FOOLED' : 'SENSOR_HELD' };
    }

    if (tool === 'door_status_check') {
      gPrompt(key, t('g5Close'));
      const c1 = await waitState(key, (s) => s.doorClosed === true, 30);
      if (!c1) throw new Error(stopped() ? t('doorStopped') : t('g5NoClose'));
      mark(c1, 'closed_1');
      await api('/api/door/open', 'POST');
      gPrompt(key, t('g5Open'));
      const o = await waitState(key, (s) => s.doorClosed === false, 30);
      if (!o) throw new Error(stopped() ? t('doorStopped') : t('doorNotSeen'));
      mark(o, 'open');
      gPrompt(key, t('g5Close'));
      const c2 = await waitState(key, (s) => s.doorClosed === true, 30);
      if (!c2) throw new Error(stopped() ? t('doorStopped') : t('g5NoClose'));
      mark(c2, 'closed_2');
      gPrompt(key, t('g5Hold'));
      await sleep(2500);
      await api('/api/door/open', 'POST');                  // the only software actuator on the door: the lock release
      let flipped = false;
      const end = Date.now() + 3000;
      while (Date.now() < end) {
        const s = await api('/api/state');
        mark(s, 'release_held');
        if (s.doorClosed !== true) flipped = true;
        await sleep(200);
      }
      gPrompt(key, '');
      values = { door_status_read_only_confirmed: !flipped };
      auto = { ...auto, status: flipped ? 'CHANGED_BY_RELEASE' : 'FOLLOWS_THE_DOOR_ONLY' };
    }

    if (tool === 'door_alarm_check') {
      const src = rec.autos && rec.autos.uv_off_timing;
      if (!src) throw new Error(t('g6NeedStep2'));
      const before = new Set((src.alerts_before || []).map(String));
      const codes = [...new Set([...(src.alerts_after || []).map(String).filter((c) => !before.has(c)),
        ...(src.ui_alerts || []).map(String),
        ...(src.program_end && src.program_end.error_code ? [String(src.program_end.error_code)] : []),
        ...(src.door_aborted ? ['6016'] : [])])];
      values = { alarm_raised: codes.length > 0, error_code: codes.join(', ') };
      auto = { ...auto, status: codes.length ? 'ALARM' : 'NO_ALARM', source: 'uv_off_timing', program_end: src.program_end, codes, samples: [] };
    }

    fillAuto(test, rec, values);
    setAuto(rec, auto);
    persist(run.id, true);
    journal('measurement', run.id);
    if (tool === 'uv_off_timing') { AUTO[key] = { busy: false, runId: run.id }; refreshTest(tid); await saveDecayPng(tid, run, auto); }
    const text = Object.entries(values).map(([k, v]) => `${k} = ${v}`).join(', ');
    AUTO[key] = { busy: false, runId: run.id, text: t('gDone')(text), cls: 'pass' };
    log('info', `${run.id} ${tool}: ${text}`);
    advanceValues = values;
  } catch (e) {
    await safe();
    AUTO[key] = { busy: false, runId: run.id, text: t('autoFailed')(e.message), cls: 'fail' };
    log('fail', `${run.id} ${tool}: ${e.message}`);
  }
  refreshTest(tid);
  if (advanceValues) await autoAdvance(tid, tool, advanceValues);
}

/** Irradiance against time, t = 0 at the door opening: release, door open, 10 % and zero marked. */
function drawDecay(tid) {
  const canvas = $('decay-' + tid);
  if (!canvas) return;
  const rec = state.results[currentRun(tid).id];
  const a = rec && rec.autos && rec.autos.uv_off_timing;
  if (!a || !a.samples || !a.samples.length) return;
  const t0 = a.door_open_at_s ?? a.release_at_s ?? 0;
  const from = (a.release_at_s ?? t0) - 2;
  const to = Math.max((a.zero_at_s ?? t0) + 2, t0 + 3);
  const pts = a.samples.filter((s) => s[1] !== null && s[0] >= from && s[0] <= to).map((s) => [s[0] - t0, s[1]]);
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height, L = 56, R = 16, T = 18, B = 36;
  ctx.fillStyle = '#0a0a0a'; ctx.fillRect(0, 0, W, H);
  if (!pts.length) return;
  const xmin = from - t0, xmax = to - t0;
  const ymax = Math.max(a.plateau_mw_cm2 || 0, ...pts.map((p) => p[1])) * 1.08 || 1;
  const X = (x) => L + ((x - xmin) / (xmax - xmin)) * (W - L - R);
  const Y = (y) => H - B - (Math.max(0, y) / ymax) * (H - T - B);
  ctx.font = '11px Segoe UI, sans-serif'; ctx.lineWidth = 1;
  for (let k = 0; k <= 4; k++) {
    const v = (ymax * k) / 4;
    ctx.strokeStyle = '#2a2a2a'; ctx.beginPath(); ctx.moveTo(L, Y(v)); ctx.lineTo(W - R, Y(v)); ctx.stroke();
    ctx.fillStyle = '#777'; ctx.textAlign = 'right'; ctx.fillText(v.toFixed(v < 10 ? 1 : 0), L - 6, Y(v) + 4);
  }
  ctx.textAlign = 'center';
  const step = xmax - xmin > 12 ? 2 : xmax - xmin > 5 ? 1 : 0.5;
  for (let x = Math.ceil(xmin / step) * step; x <= xmax; x += step) ctx.fillText(x.toFixed(step < 1 ? 1 : 0) + ' s', X(x), H - B + 16);
  ctx.save(); ctx.translate(14, (H - B + T) / 2); ctx.rotate(-Math.PI / 2); ctx.fillText('mW/cm²', 0, 0); ctx.restore();
  const vline = (x, color, label, row) => {                  // one label row each: the three can fall on the same instant
    if (x === null || x === undefined) return;
    ctx.strokeStyle = color; ctx.setLineDash([4, 3]); ctx.beginPath(); ctx.moveTo(X(x - t0), T); ctx.lineTo(X(x - t0), H - B); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.fillText(label, X(x - t0) + 3, T + 24 + row * 13);
  };
  vline(a.release_at_s, '#ff9800', 'release', 0);
  vline(a.door_open_at_s, '#f44336', 'door open', 1);
  vline(a.zero_at_s, '#4caf50', 'zero', 2);
  if (a.plateau_mw_cm2) {
    const ten = (a.dark_mw_cm2 || 0) + 0.1 * (a.plateau_mw_cm2 - (a.dark_mw_cm2 || 0));
    ctx.strokeStyle = '#555'; ctx.setLineDash([2, 3]); ctx.beginPath(); ctx.moveTo(L, Y(ten)); ctx.lineTo(W - R, Y(ten)); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#888'; ctx.textAlign = 'right'; ctx.fillText('10 %', W - R - 2, Y(ten) - 3);
  }
  ctx.strokeStyle = '#64b5f6'; ctx.lineWidth = 2; ctx.beginPath();
  pts.forEach((p, k) => (k ? ctx.lineTo(X(p[0]), Y(p[1])) : ctx.moveTo(X(p[0]), Y(p[1])))); ctx.stroke();
  ctx.fillStyle = '#ddd'; ctx.textAlign = 'right';
  ctx.fillText(`door open -> zero ${a.uv_zero_time_s ?? rec.values.uv_zero_time ?? '-'} s · release -> zero ${a.release_to_zero_s ?? '-'} s`, W - R, T + 10);
}

// ---------- script traces (rec.autos['auto_<name>'], the runner's watch() columns): one chart each, and a PNG beside the CSV ----------
const TRACE_SERIES = [
  { col: 'chamber_c', color: '#ff9800', label: 'trDisplayed' },
  { col: 'tc08_ch2_c', color: '#64b5f6', label: 'trRef' },
  { col: 'tc08_ch1_c', color: '#f44336', label: 'trBody' },
  { col: 'led_right_c', color: '#ab47bc', label: 'trPanel', suffix: ' R' },
  { col: 'led_left_c', color: '#7e57c2', label: 'trPanel', suffix: ' L' },
  { col: 'led_back_c', color: '#26a69a', label: 'trPanel', suffix: ' B' },
  { col: 'led_door_c', color: '#ffca28', label: 'trPanel', suffix: ' D' },
];   // a series is drawn only when its column holds numbers, so a heater-only trace shows no panel lines
const TRACE_RPM_SERIES = [                 // right-hand rpm axis, dashed: the damper position is read off the cooling fan's speed
  { col: 'fan_cooling_rpm', color: '#4dd0e1', label: 'trFanCooling' },
  { col: 'fan_heater_rpm', color: '#ffab91', label: 'trFanHeater' },
];
const isTrace = (a) => !!(a && a.kind && a.kind.indexOf('auto_') === 0 && Array.isArray(a.columns) && a.columns.indexOf('t_s') === 0
  && a.samples && a.samples.length > 1 && TRACE_SERIES.some((s) => a.columns.indexOf(s.col) >= 0));

function traceAutos(rec) {
  return rec && rec.autos ? Object.values(rec.autos).filter(isTrace) : [];
}

function renderTraceCharts(test, run) {
  const rec = state.results[run.id];
  return traceAutos(rec).map((a) => `<canvas class="chart" id="trace-${test.test_id}-${a.kind}" width="900" height="320" aria-label="${esc(a.kind)} against time"></canvas>
      <div class="auto-note" style="margin-top:4px">${esc(a.kind.slice(5))} · ${esc(t('trRows')(a.samples.length, a.graph_file || ''))}</div>`).join('');
}

/** The trace on a canvas: temperatures against minutes, the heater / UV bands at the bottom, the first alarm marked with its code. */
/** An X-Y curve (a.xy = {x, y, xLabel, yLabel}): one point per settled step, e.g. LED fan duty against panel temperature. */
function drawXY(canvas, a) {
  const ctx = canvas.getContext('2d');
  const xi = a.columns.indexOf(a.xy.x), yi = a.columns.indexOf(a.xy.y);
  const pts = a.samples.filter((r) => typeof r[xi] === 'number' && typeof r[yi] === 'number').map((r) => [r[xi], r[yi]]).sort((p, q) => p[0] - q[0]);
  const W = canvas.width, H = canvas.height, L = 56, R = 16, T = 26, B = 46;
  ctx.fillStyle = '#0a0a0a'; ctx.fillRect(0, 0, W, H);
  if (!pts.length) return;
  const xmin = Math.min(0, ...pts.map((p) => p[0])), xmax = Math.max(...pts.map((p) => p[0]), xmin + 1);
  const ymin = Math.min(...pts.map((p) => p[1])) - 3, ymax = Math.max(...pts.map((p) => p[1])) + 3;
  const X = (x) => L + ((x - xmin) / (xmax - xmin)) * (W - L - R);
  const Y = (y) => H - B - ((y - ymin) / (ymax - ymin)) * (H - T - B);
  ctx.font = '11px Segoe UI, sans-serif'; ctx.lineWidth = 1;
  for (let k = 0; k <= 4; k++) {
    const v = ymin + ((ymax - ymin) * k) / 4;
    ctx.strokeStyle = '#2a2a2a'; ctx.beginPath(); ctx.moveTo(L, Y(v)); ctx.lineTo(W - R, Y(v)); ctx.stroke();
    ctx.fillStyle = '#777'; ctx.textAlign = 'right'; ctx.fillText(v.toFixed(1), L - 6, Y(v) + 4);
  }
  ctx.textAlign = 'center';
  pts.forEach((p) => ctx.fillText(String(p[0]), X(p[0]), H - B + 16));
  ctx.fillText(a.xy.xLabel || a.xy.x, (L + W - R) / 2, H - 8);
  ctx.save(); ctx.translate(14, (H - B + T) / 2); ctx.rotate(-Math.PI / 2); ctx.fillText(a.xy.yLabel || a.xy.y, 0, 0); ctx.restore();
  ctx.strokeStyle = '#4fc3f7'; ctx.lineWidth = 2; ctx.beginPath();
  pts.forEach((p, i) => (i ? ctx.lineTo(X(p[0]), Y(p[1])) : ctx.moveTo(X(p[0]), Y(p[1]))));
  ctx.stroke();
  ctx.fillStyle = '#4fc3f7';
  pts.forEach((p) => { ctx.beginPath(); ctx.arc(X(p[0]), Y(p[1]), 4, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#ddd'; ctx.textAlign = 'left';
                       ctx.fillText(p[1].toFixed(1) + ' °C', X(p[0]) + 6, Y(p[1]) - 6); ctx.fillStyle = '#4fc3f7'; });
}

function drawTrace(canvas, a) {
  if (a.xy) return drawXY(canvas, a);
  const ctx = canvas.getContext('2d');
  const ix = (c) => a.columns.indexOf(c);
  const tI = ix('t_s');
  const pick = (defs) => defs.map((s) => ({ ...s, i: ix(s.col) })).filter((s) => s.i >= 0)
    .map((s) => ({ ...s, pts: a.samples.filter((r) => typeof r[s.i] === 'number' && typeof r[tI] === 'number').map((r) => [r[tI] / 60, r[s.i]]) }))
    .filter((s) => s.pts.length > 1);
  const series = pick(TRACE_SERIES);
  // fan tachs on a second, right-hand axis (rpm) - the damper position is read off the cooling fan's speed
  const rpmSeries = pick(TRACE_RPM_SERIES);
  const W = canvas.width, H = canvas.height, L = 56, R = rpmSeries.length ? 58 : 16, T = 26, B = 56;
  ctx.fillStyle = '#0a0a0a'; ctx.fillRect(0, 0, W, H);
  if (!series.length) return;
  const all = series.flatMap((s) => s.pts);
  const xmax = Math.max(1 / 60, ...all.map((p) => p[0]));
  const ymin = Math.min(...all.map((p) => p[1])) - 3, ymax = Math.max(...all.map((p) => p[1])) + 3;
  const X = (x) => L + (x / xmax) * (W - L - R);
  const Y = (y) => H - B - ((y - ymin) / (ymax - ymin)) * (H - T - B);
  ctx.font = '11px Segoe UI, sans-serif'; ctx.lineWidth = 1;
  for (let k = 0; k <= 4; k++) {
    const v = ymin + ((ymax - ymin) * k) / 4;
    ctx.strokeStyle = '#2a2a2a'; ctx.beginPath(); ctx.moveTo(L, Y(v)); ctx.lineTo(W - R, Y(v)); ctx.stroke();
    ctx.fillStyle = '#777'; ctx.textAlign = 'right'; ctx.fillText(v.toFixed(0), L - 6, Y(v) + 4);
  }
  ctx.textAlign = 'center';
  const step = xmax > 40 ? 10 : xmax > 15 ? 5 : xmax > 6 ? 2 : xmax > 2 ? 1 : 0.5;
  for (let x = 0; x <= xmax + 1e-9; x += step) ctx.fillText((step < 1 ? x.toFixed(1) : x) + ' min', X(x), H - B + 16);
  ctx.save(); ctx.translate(14, (H - B + T) / 2); ctx.rotate(-Math.PI / 2); ctx.fillText('°C', 0, 0); ctx.restore();
  // what the machine was doing: heater / UV bands along the bottom
  const band = (col, color, label, row) => {
    const i = ix(col);
    if (i < 0) return;
    let from = null;
    const y = H - B + 24 + row * 7;
    const flush = (to) => { if (from !== null) { ctx.fillStyle = color; ctx.fillRect(X(from), y, Math.max(1, X(to) - X(from)), 5); from = null; } };
    a.samples.forEach((r) => { const on = r[i] === true; const x = r[tI] / 60; if (on && from === null) from = x; if (!on) flush(x); });
    flush(xmax);
    ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.fillText(label, L, y + 5 + 7 * 0);
  };
  band('heater_on', '#ff572266', t('trHeaterOn'), 0);
  band('uv_on', '#7c4dff66', t('trUvOn'), 1);
  band('damper_open', '#4dd0e166', t('trDamperOpen'), 2);
  if (rpmSeries.length) {
    const rmax = Math.max(100, ...rpmSeries.flatMap((s) => s.pts.map((p) => p[1]))) * 1.05;
    const YR = (v) => H - B - (v / rmax) * (H - T - B);
    ctx.textAlign = 'left'; ctx.fillStyle = '#777';
    for (let k = 0; k <= 4; k++) { const v = (rmax * k) / 4; ctx.fillText(Math.round(v).toString(), W - R + 6, YR(v) + 4); }
    ctx.save(); ctx.translate(W - 10, (H - B + T) / 2); ctx.rotate(Math.PI / 2); ctx.textAlign = 'center'; ctx.fillText('rpm', 0, 0); ctx.restore();
    rpmSeries.forEach((s) => {
      ctx.strokeStyle = s.color; ctx.lineWidth = 1.5; ctx.setLineDash([6, 4]); ctx.beginPath();
      s.pts.forEach((p, k) => (k && p[0] >= s.pts[k - 1][0] ? ctx.lineTo(X(p[0]), YR(p[1])) : ctx.moveTo(X(p[0]), YR(p[1])))); ctx.stroke();
      ctx.setLineDash([]);
    });
  }
  series.forEach((s) => {
    // a trace that holds several passes (DVT-SAF-005: one per fan, each timed from 0) restarts its clock: start a new line
    // there instead of drawing a stroke back to the left edge
    ctx.strokeStyle = s.color; ctx.lineWidth = 2; ctx.beginPath();
    s.pts.forEach((p, k) => (k && p[0] >= s.pts[k - 1][0] ? ctx.lineTo(X(p[0]), Y(p[1])) : ctx.moveTo(X(p[0]), Y(p[1])))); ctx.stroke();
  });
  // the first alarm, with its code
  const alI = ix('alerts');
  if (alI >= 0) {
    const first = a.samples.find((r) => typeof r[alI] === 'string' && r[alI] !== '');
    if (first) {
      const x = X(first[tI] / 60);
      ctx.strokeStyle = '#f44336'; ctx.setLineDash([4, 3]); ctx.beginPath(); ctx.moveTo(x, T); ctx.lineTo(x, H - B); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = '#f44336'; ctx.textAlign = 'left'; ctx.fillText(t('trAlarm')(String(first[alI]).split('|')[0]) + ` · ${(first[tI] / 60).toFixed(2)} min`, x + 4, T + 12);
    }
  }
  ctx.textAlign = 'right';
  let lx = W - R;
  rpmSeries.concat(series).reverse().forEach((s) => {
    const text = t(s.label) + (s.suffix || '');
    ctx.fillStyle = s.color; ctx.fillText(text, lx, T - 8);
    lx -= ctx.measureText(text).width + 18;
  });
}
