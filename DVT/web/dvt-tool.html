<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sCure DVT Tool</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0a0a0a; color: #e0e0e0; min-height: 100vh; }
  code, .mono { font-family: Consolas, 'Courier New', monospace; }

  .header { background: #111; border-bottom: 2px solid #f44336; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; gap: 12px; }
  .header h1 { font-size: 18px; color: #f44336; }
  .header .version { font-size: 11px; color: #666; margin-top: 2px; }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #f44336; flex: none; }
  .status-dot.connected { background: #4caf50; box-shadow: 0 0 6px #4caf50; }
  .status-label { font-size: 11px; color: #888; }

  .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

  .config-bar { background: #151515; border: 1px solid #222; border-radius: 10px; padding: 14px 18px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .config-bar label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
  .config-bar input, .config-bar select { background: #0a0a0a; border: 1px solid #333; border-radius: 6px; padding: 6px 10px; color: #fff; font-size: 13px; }
  .config-bar input:focus, .config-bar select:focus { outline: none; border-color: #f44336; }
  #apiUrl { width: 220px; } #operator { width: 150px; }
  .spacer { flex: 1; }
  .pair { display: inline-flex; align-items: center; gap: 8px; }

  .btn { padding: 8px 18px; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.2s; }
  .btn:active { transform: scale(0.97); }
  .btn-run { background: #f44336; color: #fff; }
  .btn-run:hover { background: #e53935; }
  .btn-run:disabled { background: #333; color: #666; cursor: not-allowed; }
  .btn-outline { background: transparent; border: 1px solid #444; color: #ccc; }
  .btn-outline:hover { border-color: #888; color: #fff; }
  .btn-small { padding: 5px 12px; font-size: 11px; border-radius: 6px; }
  .btn:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, .cat-header:focus-visible, .test-head:focus-visible { outline: 2px solid #ff9800; outline-offset: 1px; }

  .folder-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: -8px 0 20px; padding: 10px 18px; border-radius: 10px; background: #151515; border: 1px solid #222; font-size: 12px; }
  .folder-bar.missing { border-color: #5a2323; background: #1d1111; }
  .folder-dot { width: 10px; height: 10px; border-radius: 50%; background: #f44336; flex: none; }
  .folder-dot.ok { background: #4caf50; box-shadow: 0 0 6px #4caf50; }
  .folder-text { color: #bbb; }
  .folder-bar.missing .folder-text { color: #f44336; }

  .summary { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 12px; }
  .summary-card { background: #151515; border: 1px solid #222; border-radius: 10px; padding: 14px; text-align: center; }
  .summary-card .num { font-size: 28px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .summary-card .label { font-size: 10px; color: #888; text-transform: uppercase; margin-top: 4px; letter-spacing: 0.5px; }
  .num.pass { color: #4caf50; } .num.fail { color: #f44336; } .num.warn { color: #ff9800; } .num.skip { color: #777; }

  .progress-bar { height: 6px; background: #1a1a1a; border-radius: 3px; overflow: hidden; margin-bottom: 20px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #f44336, #ff9800); width: 0; transition: width 0.3s; }

  .category { background: #151515; border: 1px solid #222; border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
  .cat-header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; user-select: none; }
  .cat-header:hover { background: #1a1a1a; }
  .cat-header .phase-no { font-size: 12px; font-weight: 700; color: #f44336; min-width: 22px; }
  .cat-header .name { font-weight: 600; font-size: 14px; }
  .cat-header .gate { font-size: 11px; color: #666; flex: 1; }
  .cat-header .stats { font-size: 11px; color: #888; white-space: nowrap; }
  .cat-header .arrow { color: #666; transition: transform 0.2s; }
  .category.open .cat-header .arrow { transform: rotate(90deg); }
  [dir="rtl"] .cat-header .arrow { transform: scaleX(-1); }
  [dir="rtl"] .category.open .cat-header .arrow { transform: rotate(90deg); }
  .cat-body { display: none; border-top: 1px solid #222; }
  .category.open .cat-body { display: block; }
  .closed-badge { font-size: 10px; background: #1b3d1f; color: #4caf50; padding: 2px 8px; border-radius: 10px; }

  .test { border-bottom: 1px solid #1a1a1a; }
  .test:last-child { border-bottom: none; }
  .test-head { display: grid; grid-template-columns: 28px 1fr auto 18px; gap: 10px; align-items: center; padding: 8px 16px; font-size: 12px; cursor: pointer; }
  .test-head:hover { background: #181818; }
  .test.na .test-head { opacity: 0.45; }
  .test-status { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; background: #222; color: #666; }
  .test-status.pass { background: #1b3d1f; color: #4caf50; }
  .test-status.fail { background: #3d1b1b; color: #f44336; }
  .test-status.warn { background: #3d2e10; color: #ff9800; }
  .test-status.skip { background: #222; color: #888; }
  .test-status.progress { background: #3d3410; color: #ffc107; }
  .test-name { font-weight: 600; color: #ddd; }
  .test-id { color: #f44336; font-weight: 700; margin-inline-end: 2px; }
  .test-desc { font-size: 11px; color: #777; margin-top: 2px; }
  .test-meta { color: #666; font-size: 11px; white-space: nowrap; font-variant-numeric: tabular-nums; text-align: end; }
  .badge { display: inline-block; font-size: 10px; padding: 1px 7px; border-radius: 9px; margin-inline-start: 6px; vertical-align: 1px; font-weight: 600; }
  .badge.crit { background: #3d1b1b; color: #f44336; }
  .badge.auto { background: #10283d; color: #64b5f6; }
  .badge.meth { background: #222; color: #aaa; }
  .test .arrow { color: #555; transition: transform 0.2s; }
  .test.open .arrow { transform: rotate(90deg); }
  [dir="rtl"] .test .arrow { transform: scaleX(-1); }
  [dir="rtl"] .test.open .arrow { transform: rotate(90deg); }

  .test-body { display: none; padding: 4px 16px 18px 54px; font-size: 12px; line-height: 1.55; }
  [dir="rtl"] .test-body { padding: 4px 54px 18px 16px; }
  .test.open .test-body { display: block; }
  .test-body h4 { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin: 14px 0 6px; }
  .test-body p { color: #bbb; max-width: 90ch; }
  .test-body ul, .test-body ol { padding-inline-start: 18px; color: #bbb; }
  .test-body li { margin-bottom: 3px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .safety { border: 1px solid #5a2323; background: #1d1111; border-radius: 8px; padding: 8px 14px; margin-top: 12px; }
  .safety h4 { color: #f44336; margin-top: 4px; }
  .na-note { margin-top: 12px; padding: 10px 14px; background: #1a1a1a; border-radius: 8px; color: #999; }
  .dep-ok { color: #4caf50; } .dep-open { color: #ff9800; }

  .run-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 16px; padding: 10px 12px; background: #101010; border: 1px solid #222; border-radius: 8px; }
  .run-bar select { background: #0a0a0a; border: 1px solid #333; border-radius: 6px; padding: 5px 8px; color: #fff; font-size: 12px; max-width: 100%; }
  .variant { color: #ffb74d; font-size: 12px; margin-top: 8px; }

  .step { margin-top: 12px; padding: 10px 12px; border: 1px solid #1f1f1f; border-radius: 8px; background: #121212; }
  .step-text { color: #ddd; }
  .step-no { color: #f44336; font-weight: 700; margin-inline-end: 6px; }
  .auto-note { margin-top: 6px; color: #64b5f6; font-size: 11px; }
  .fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px 14px; margin-top: 10px; }
  .field label { display: block; font-size: 11px; color: #9a9a9a; margin-bottom: 3px; }
  .field .unit { color: #666; }
  .field .note { display: block; font-size: 10px; color: #666; margin-top: 2px; }
  .field input, .field select { width: 100%; background: #0a0a0a; border: 1px solid #333; border-radius: 6px; padding: 5px 8px; color: #fff; font-size: 12px; }
  .field input:focus, .field select:focus { outline: none; border-color: #f44336; }
  .field input[readonly], .field select:disabled, .field input:disabled { color: #888; border-color: #222; }
  .field.filled input, .field.filled select { border-color: #2e4d31; }

  .auto-card { margin-top: 10px; padding: 10px 12px; border: 1px solid #1d3a57; border-radius: 8px; background: #0d1620; }
  .auto-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .auto-text { font-size: 12px; color: #9ecbf0; }
  .auto-text.fail { color: #f44336; } .auto-text.pass { color: #4caf50; }
  /* c.act(): a step the person must do now - readable from across the bench, not a status line */
  .auto-text.act { font-size: 17px; font-weight: 800; color: #ffb300; letter-spacing: .2px; }
  .btn-auto { background: #1565c0; color: #fff; }
  .btn-auto:hover { background: #1976d2; }
  .btn-auto:disabled { background: #333; color: #666; cursor: not-allowed; }
  .auto-script { border-color: #2a4a6b; background: #0e1a26; }
  .auto-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
  .auto-est { font-size: 11px; color: #8aa4bb; font-variant-numeric: tabular-nums; }
  .auto-prompt { margin-top: 10px; padding: 10px 12px; border: 1px solid #5a4a12; border-radius: 6px; background: #1d1809; }
  .auto-prompt-text { font-size: 13px; color: #ffd76a; margin-bottom: 8px; line-height: 1.5; }
  /* the step the person must confirm ("I did it"): the same card as a question, read across the bench */
  .auto-prompt-text:has(+ .auto-prompt-row [data-act="as-acted"]) { font-size: 16px; font-weight: 700; }
  .auto-prompt-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .auto-prompt-row input, .auto-prompt-row select { background: #0a0a0a; border: 1px solid #444; border-radius: 6px; padding: 5px 8px; color: #fff; font-size: 12px; min-width: 160px; }
  .g-prompt { margin-top: 10px; padding: 12px 14px; border-radius: 8px; background: #3d2e10; border: 1px solid #ff9800; color: #ffcc80; font-size: 15px; font-weight: 700; }
  .tc-checks { display: grid; gap: 6px; }
  .tc-row { display: flex; align-items: center; gap: 10px; font-size: 12px; color: #bbb; }
  .tc-dot { width: 10px; height: 10px; border-radius: 50%; background: #444; flex: none; }
  .tc-row.ok .tc-dot { background: #4caf50; box-shadow: 0 0 6px #4caf50; }
  .tc-row.bad .tc-dot { background: #f44336; }
  .tc-row.warn .tc-dot { background: #ff9800; }
  .tc-label { min-width: 190px; }
  .tc-val { color: #9ecbf0; font-variant-numeric: tabular-nums; }
  .tc-row.bad .tc-val { color: #f44336; }
  .tc-row.warn .tc-val { color: #ff9800; }
  .chart { display: block; width: 100%; max-width: 640px; height: auto; margin-top: 10px; background: #0a0a0a; border: 1px solid #1f1f1f; border-radius: 6px; }
  .criteria { margin-top: 16px; padding: 10px 12px; border-radius: 8px; background: #101010; border: 1px solid #222; }
  .criteria code { display: block; color: #bbb; font-size: 11px; white-space: pre-wrap; word-break: break-word; }
  .verdict { display: inline-block; font-weight: 700; font-size: 12px; padding: 2px 10px; border-radius: 10px; margin-top: 8px; }
  .verdict.PASS { background: #1b3d1f; color: #4caf50; } .verdict.FAIL { background: #3d1b1b; color: #f44336; } .verdict.BLOCKED { background: #3d2e10; color: #ff9800; }
  .verdict-detail { font-size: 11px; color: #888; margin-inline-start: 8px; }
  .record { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; margin-top: 12px; }
  .record textarea { flex: 1; min-width: 240px; min-height: 44px; background: #0a0a0a; border: 1px solid #333; border-radius: 6px; padding: 6px 8px; color: #ddd; font: inherit; font-size: 12px; resize: vertical; }
  .recorded { font-size: 11px; color: #888; margin-top: 8px; }

  .log-section { background: #151515; border: 1px solid #222; border-radius: 10px; margin-top: 20px; }
  .log-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid #222; }
  .log-header h3 { font-size: 13px; }
  .log-box { font-family: Consolas, 'Courier New', monospace; font-size: 11px; padding: 10px 16px; max-height: 260px; overflow-y: auto; line-height: 1.6; }
  .log-box .pass { color: #4caf50; } .log-box .fail { color: #f44336; } .log-box .warn { color: #ff9800; } .log-box .info { color: #888; }

  .report-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 20; align-items: center; justify-content: center; }
  .report-modal.open { display: flex; }
  .report-content { background: #151515; border: 1px solid #333; border-radius: 10px; width: min(900px, 92vw); max-height: 88vh; display: flex; flex-direction: column; padding: 16px; gap: 10px; }
  .report-content textarea { flex: 1; min-height: 50vh; background: #0a0a0a; color: #ddd; border: 1px solid #333; border-radius: 6px; padding: 10px; font-family: Consolas, monospace; font-size: 11px; resize: vertical; direction: ltr; }
  .report-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .banner { background: #3d1b1b; color: #f44336; padding: 10px 16px; border-radius: 8px; margin-bottom: 16px; display: none; }

  @media (max-width: 720px) {
    .summary { grid-template-columns: repeat(3, 1fr); }
    .cols { grid-template-columns: 1fr; }
    .test-body, [dir="rtl"] .test-body { padding-inline: 16px; }
    .cat-header .gate { display: none; }
    #apiUrl { width: 150px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="header">
  <div>
    <h1 id="appTitle">sCure DVT Tool</h1>
    <div class="version" id="catalogInfo"></div>
  </div>
  <div class="header-right">
    <span class="status-label" id="statusLabel">not connected</span>
    <div class="status-dot" id="statusDot"></div>
  </div>
</div>

<div class="container">
  <div class="banner" id="banner">dvt-catalog.js / dvt-criteria.js could not be loaded - open dvt-tool.html from the DVT/web folder (next to both files).</div>

  <div class="config-bar">
    <span class="pair"><label for="unit" data-t="unit">Unit</label><select id="unit"></select></span>
    <span class="pair"><label for="operator" data-t="operator">Operator</label><input id="operator" spellcheck="false"></span>
    <span class="pair"><label for="apiUrl" data-t="machine">Machine</label><input id="apiUrl" placeholder="scurebox.local" spellcheck="false" dir="ltr">
    <button class="btn btn-outline btn-small" id="connectBtn" data-t="connect">Connect</button>
    <select id="machinePick" aria-label="Machine" hidden></select></span>
    <span class="spacer"></span>
    <select id="lang" aria-label="Language"><option value="en">English</option><option value="he">עברית</option></select>
    <button class="btn btn-run" id="reportBtn" data-t="report">Export report</button>
  </div>

  <div class="folder-bar" id="folderBar">
    <span class="folder-dot" id="folderDot"></span>
    <span class="folder-text" id="folderText"></span>
    <span class="spacer"></span>
    <button class="btn btn-outline btn-small" id="folderReconnectBtn" hidden></button>
    <button class="btn btn-outline btn-small" id="folderBtn" data-t="folderBtn">Choose results folder</button>
  </div>

  <!-- sCure Cloud (Google Apps Script): every recorded run and its raw measurement files also go to the portal's DVT tab -->
  <div class="folder-bar" id="cloudBar">
    <span class="folder-dot" id="cloudDot"></span>
    <span class="folder-text" id="cloudText"></span>
    <span class="spacer"></span>
    <span class="pair"><label for="cloudUrl" data-t="cloudUrl">Cloud</label>
      <input id="cloudUrl" placeholder="https://script.google.com/macros/s/.../exec" spellcheck="false" dir="ltr" style="min-width:260px"></span>
    <span class="pair"><label for="cloudKey" data-t="cloudKey">Key</label>
      <input id="cloudKey" type="password" spellcheck="false" dir="ltr" style="min-width:140px"></span>
    <span class="pair"><label for="cloudMachine" data-t="cloudMachine">CureBox</label>
      <select id="cloudMachine" style="min-width:150px"></select></span>
    <button class="btn btn-outline btn-small" id="cloudSyncBtn" data-t="cloudSyncAll">Sync all</button>
  </div>

  <div class="summary">
    <div class="summary-card"><div class="num" id="sumTotal">0</div><div class="label" data-t="sumRuns">Runs owed</div></div>
    <div class="summary-card"><div class="num pass" id="sumPass">0</div><div class="label" data-t="sumPass">Pass</div></div>
    <div class="summary-card"><div class="num fail" id="sumFail">0</div><div class="label" data-t="sumFail">Fail</div></div>
    <div class="summary-card"><div class="num warn" id="sumBlocked">0</div><div class="label" data-t="sumBlocked">Blocked</div></div>
    <div class="summary-card"><div class="num skip" id="sumOpen">0</div><div class="label" data-t="sumOpen">Open</div></div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

  <div id="phases"></div>

  <div class="log-section">
    <div class="log-header">
      <h3 data-t="log">Log</h3>
      <button class="btn btn-outline btn-small" id="clearLogBtn" data-t="clear">Clear</button>
    </div>
    <div class="log-box" id="logBox"></div>
  </div>
</div>

<div class="report-modal" id="reportModal">
  <div class="report-content" role="dialog" aria-modal="true" aria-labelledby="reportTitle">
    <h3 id="reportTitle" data-t="reportTitle">DVT report (text)</h3>
    <textarea id="reportText" spellcheck="false"></textarea>
    <div class="report-actions">
      <button class="btn btn-outline btn-small" id="copyBtn" data-t="copy">Copy to clipboard</button>
      <button class="btn btn-outline btn-small" id="downloadBtn" data-t="download">Download .txt</button>
      <button class="btn btn-outline btn-small" id="saveReportBtn" data-t="saveToFolder">Save to results folder</button>
      <button class="btn btn-run btn-small" id="closeBtn" data-t="close">Close</button>
    </div>
  </div>
</div>

<script src="dvt-catalog.js"></script>
<script src="dvt-criteria.js"></script>
<script src="dvt-auto.js"></script>
<script>
// ============================================================
// DVT runner. Catalog data: dvt-catalog.js (generated by build_dvt_web.py
// from DVT/catalog). Verdicts: dvt-criteria.js (same rules as the console).
// ============================================================
const CAT = window.SCURE_DVT;
const CRIT = window.DVT_CRITERIA;
const STORE_KEY = 'scure-dvt-web-v1';

const T = {
  en: {
    unit: 'Unit', operator: 'Operator', machine: 'Machine', connect: 'Connect',
    folderBtn: 'Choose results folder', saveToFolder: 'Save to results folder',
    folderNone: 'No results folder - choose one: every value, verdict and measurement is written there',
    folderOk: (name, at) => `Results folder: ${name}${at ? ' · saved ' + at : ''}`,
    folderLost: (name) => `Results folder ${name} needs your permission again`, folderReconnect: (name) => `Reconnect ${name}`,
    folderFirst: 'Choose the results folder first - every result is written there', folderUnsupported: 'This browser cannot write to a folder - use Chrome or Edge',
    folderError: (m) => `could not write to the results folder: ${m}`,
    folderRetry: (m, s) => `the results folder refused a write (${m}) - trying again in ${s} s; the run stays queued (a CSV open in Excel? OneDrive?)`,
    folderRetrying: (name, m) => `Results folder: ${name} · a write failed (${m}) - retrying, nothing is lost`,
    cloudUrl: 'Cloud', cloudKey: 'Key', cloudSyncAll: 'Sync all', cloudMachine: 'CureBox',
    cloudMachinePick: '- which CureBox is this unit? -',
    logCloudMachine: (u, m) => m ? `${u} is ${m} on sCure Cloud - its runs are filed under it` : `${u}: no CureBox on sCure Cloud`,
    cloudNone: 'sCure Cloud: not set - paste the portal web-app URL and the DVT key to publish results to the DVT tab',
    cloudOk: (n, at) => `sCure Cloud: ${n} runs published${at ? ' · ' + at : ''}`,
    cloudQueued: (n) => `sCure Cloud: sending ${n} run${n === 1 ? '' : 's'}…`,
    cloudError: (m) => `sCure Cloud: not reached (${m}) - results stay queued and in the results folder`,
    logCloud: (id) => `${id}: published to sCure Cloud`,
    logCloudAll: (n) => `sCure Cloud: ${n} runs queued for upload`,
    logCloudFail: (m) => `sCure Cloud upload failed: ${m}`,
    tcNotSaved: 'The recording is NOT in the results folder yet - it is only in this browser. Reconnect the folder (top bar) before closing the page.',
    tcAutoStopped: (why) => `stopped by itself: ${why}`,
    logFolder: (name, n) => `results folder ${name}: ${n} runs read from it`, reportSaved: (f) => `report saved: ${f}`,
    report: 'Export report', sumRuns: 'Runs owed', sumPass: 'Pass', sumFail: 'Fail', sumBlocked: 'Blocked', sumOpen: 'Open',
    log: 'Log', clear: 'Clear', reportTitle: 'DVT report (text)', copy: 'Copy to clipboard', download: 'Download .txt', close: 'Close',
    catalog: 'Catalog', tool: 'tool', notConnected: 'not connected', connected: 'connected', phase: 'Phase', gate: 'Gate', closed: 'closed', tests: 'tests',

let state = { unit: '', operator: '', lang: (navigator.language || '').startsWith('he') ? 'he' : 'en', api: '', results: {} };
let machineInfo = '';
const openTests = new Set();
const openPhases = new Set();
const selectedRun = {};
const logLines = [];

const t = (k) => T[state.lang][k];
const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const $ = (id) => document.getElementById(id);

function load() {
  try { const s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); if (s && typeof s === 'object') state = { ...state, ...s, results: s.results || {} }; }
  catch (e) { /* storage unavailable: start empty */ }
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable */ }
}

// ---------- catalog helpers ----------
const TESTS = CAT ? CAT.tests : {};
function tx(test, key) { return state.lang === 'he' && test.he && test.he[key] ? test.he[key] : test[key]; }
function stepText(test, i) { return state.lang === 'he' && test.he.steps[i] ? test.he.steps[i] : test.procedure_steps[i].step; }
function equipText(test, i) { return state.lang === 'he' && test.he.equipment[i] ? test.he.equipment[i] : (test.equipment[i].label || test.equipment[i].name); }
function fieldNote(test, f) { return state.lang === 'he' && test.he.notes[f.name] ? test.he.notes[f.name] : (f.note || ''); }
function phaseText(p, key) { return state.lang === 'he' && p.he[key] ? p.he[key] : p[key]; }
function variantLabel(v) { return Object.entries(v).map(([k, x]) => `${k}=${x}`).join(','); }
function caseText(test, v) {
  if (!v.case || !test.case_matrix) return '';
  const i = test.case_matrix.findIndex((c) => c.case === v.case);
  return i < 0 ? '' : (state.lang === 'he' && test.he.cases[i]) || test.case_matrix[i].description || '';
}

function runsFor(tid, unit) {
  const test = TESTS[tid];
  if (!test.units.includes(unit)) return [];
  const reps = Number(test.repetitions) || 1;
  const out = [];
  test.variants.forEach((v) => { for (let r = 1; r <= reps; r++) out.push({ id: `${tid}|${unit}|${variantLabel(v)}|${r}`, variant: v, rep: r }); });
  return out;
}
function testVerdict(tid, unit) {
  const runs = runsFor(tid, unit);
  if (!runs.length) return 'na';
  const vs = runs.map((r) => state.results[r.id] && state.results[r.id].verdict);
  if (vs.some((v) => !v)) return vs.some(Boolean) ? 'progress' : null;
  for (const v of ['FAIL', 'BLOCKED', 'WAIVED', 'PASS']) if (vs.includes(v)) return v;
  return null;
}
function phaseClosed(p, unit) { return p.tests.filter((tid) => TESTS[tid].units.includes(unit)).every((tid) => ['PASS', 'WAIVED'].includes(testVerdict(tid, unit))); }
function runValues(test, run) {
  const rec = state.results[run.id] || {};
  const vals = { ...(rec.values || {}) };
  for (const [k, v] of Object.entries(run.variant)) if (test.data_fields.some((f) => f.name === k)) vals[k] = v;
  return vals;
}
function evaluateRun(test, run) {
  try { return CRIT.evaluate(test.pass_criteria, runValues(test, run), CAT.thresholds); }
  catch (e) { return { verdict: 'BLOCKED', detail: e.message }; }
}

// ---------- rendering ----------
const ICON = { PASS: ['pass', '✓'], FAIL: ['fail', '✗'], BLOCKED: ['warn', '!'], WAIVED: ['skip', 'W'], progress: ['progress', '…'], na: ['skip', '—'] };

function renderAll() {
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang === 'he' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t(el.dataset.t); });
  $('catalogInfo').textContent = `${t('catalog')} ${CAT.catalog_version} · ${Object.keys(TESTS).length} ${t('tests')} · SRS-DVT-SW Rev B · ${t('tool')} ${DVT_AUTO.version}`;
  $('unit').innerHTML = CAT.units.map((u) => {
    const role = state.lang === 'he' && u.he.role ? u.he.role : u.role;
    return `<option value="${esc(u.id)}"${u.id === state.unit ? ' selected' : ''}>${esc(u.id)} · ${esc(role)}</option>`;
  }).join('');
  $('lang').value = state.lang;
  renderStatus();
  renderPhases();
  updateSummary();
  renderFolder();
  renderCloud();
}

function renderPhases() {
  $('phases').innerHTML = CAT.phases.map((p) => `
    <div class="category${openPhases.has(p.id) ? ' open' : ''}" id="phase-${p.id}">
      <div class="cat-header" tabindex="0" role="button" aria-expanded="${openPhases.has(p.id)}" data-phase="${p.id}">
        <span class="phase-no">${p.id}</span>
        <span class="name">${esc(phaseText(p, 'name'))}</span>
        <span class="gate">${p.gate ? esc(t('gate') + ': ' + phaseText(p, 'gate')) : ''}</span>
        <span id="phase-badge-${p.id}"></span>
        <span class="stats" id="phase-stats-${p.id}"></span>
        <span class="arrow">▶</span>
      </div>
      <div class="cat-body">${p.tests.map(renderTest).join('')}</div>
    </div>`).join('');
  CAT.phases.forEach(updatePhaseStats);
}

function renderTest(tid) {
  const test = TESTS[tid];
  const na = !test.units.includes(state.unit);
  const auto = DVT_AUTO.has(tid) || test.procedure_steps.some((s) => s.auto);
  return `
    <div class="test${na ? ' na' : ''}${openTests.has(tid) ? ' open' : ''}" id="test-${tid}">
      <div class="test-head" tabindex="0" role="button" aria-expanded="${openTests.has(tid)}" data-test="${tid}">
        <div class="test-status" id="status-${tid}">-</div>
        <div>
          <div class="test-name"><bdi class="test-id mono">${tid}</bdi> ${esc(tx(test, 'title'))}${test.safety_critical ? `<span class="badge crit">${t('safetyCritical')}</span>` : ''}${auto ? `<span class="badge auto">${t('auto')}</span>` : ''}${test.method !== 'Test' ? `<span class="badge meth">${t('inspection')}</span>` : ''}</div>
        </div>
        <div class="test-meta" id="meta-${tid}"></div>
        <span class="arrow">▶</span>
      </div>
      <div class="test-body" id="body-${tid}">${openTests.has(tid) ? renderBody(tid) : ''}</div>
    </div>`;
}

function renderBody(tid) {
  const test = TESTS[tid];
  let h = `<h4>${t('purpose')}</h4><p>${esc(tx(test, 'purpose'))}</p>`;
  const rationale = tx(test, 'sample_rationale');
  if (rationale) h += `<h4>${t('rationale')}</h4><p>${esc(rationale)}</p>`;
  const runs = runsFor(tid, state.unit);
  if (!runs.length) {
    const who = test.units.length ? test.units.join(', ') : t('unitTbd');
    return h + `<div class="na-note">${esc(t('notOwed')(state.unit, who))}</div>`;
  }
  const plan = tx(test, 'safety_plan');
  if (plan && plan.length) h += `<div class="safety"><h4>${t('safetyPlan')}</h4><ul>${plan.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>`;
  const equip = test.equipment || [];
  const pre = tx(test, 'preconditions') || [];
  h += `<div class="cols"><div>${equip.length ? `<h4>${t('equipment')}</h4><ul>${equip.map((_, i) => `<li>${esc(equipText(test, i))}</li>`).join('')}</ul>` : ''}</div>
        <div>${pre.length ? `<h4>${t('preconditions')}</h4><ul>${pre.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}</div></div>`;
  if (test.dependencies && test.dependencies.length) {
    h += `<h4>${t('dependencies')}</h4><p>${test.dependencies.map((d) => {
      const ok = ['PASS', 'WAIVED'].includes(testVerdict(d, state.unit));
      return `<bdi class="mono ${ok ? 'dep-ok' : 'dep-open'}">${d} ${ok ? '✓' : '…'}</bdi>`;
    }).join(' &nbsp; ')}</p>`;
  }
  return h + renderRun(tid, runs);
}

function renderRun(tid, runs) {
  const test = TESTS[tid];
  let idx = Math.min(selectedRun[tid] || 0, runs.length - 1);
  const run = runs[idx];
  const rec = state.results[run.id] || {};
  const locked = !!rec.verdict;
  const vals = runValues(test, run);
  const options = runs.map((r, i) => {
    const v = state.results[r.id] && state.results[r.id].verdict;
    const vl = variantLabel(r.variant);
    return `<option value="${i}"${i === idx ? ' selected' : ''}>${t('run')} ${i + 1}/${runs.length}${vl ? ' · ' + esc(vl) : ''}${runs.length > test.variants.length ? ` · ${t('repetition')} ${r.rep}` : ''}${v ? ' · ' + v : ''}</option>`;
  }).join('');
  let h = `<div class="run-bar">
      <button class="btn btn-outline btn-small" data-act="prev" data-test="${tid}" ${idx === 0 ? 'disabled' : ''} aria-label="previous run">${t('prev')}</button>
      <select data-act="pick" data-test="${tid}" aria-label="${t('run')}">${options}</select>
      <button class="btn btn-outline btn-small" data-act="next" data-test="${tid}" ${idx === runs.length - 1 ? 'disabled' : ''} aria-label="next run">${t('next')}</button>
    </div>`;
  const vl = variantLabel(run.variant);
  if (vl) h += `<div class="variant"><bdi class="mono">${esc(vl)}</bdi>${caseText(test, run.variant) ? ' - ' + esc(caseText(test, run.variant)) : ''}</div>`;

  const captured = new Set();
  h += `<h4>${t('procedure')}</h4>`;
  h += DVT_AUTO.has(tid) ? DVT_AUTO.card(test, run, locked) + renderTraceCharts(test, run) : '';   // one Start button for the whole test (dvt-auto.js), then its traces as charts
  test.procedure_steps.forEach((s, i) => {
    const fields = (s.capture || []).map((n) => test.data_fields.find((f) => f.name === n)).filter(Boolean);
    fields.forEach((f) => captured.add(f.name));
    h += `<div class="step"><div class="step-text"><span class="step-no">${i + 1}.</span>${esc(stepText(test, i))}</div>
      ${s.tool === 'auto_script' ? DVT_AUTO.stepNote() : s.tool === 'uv_linearity' ? renderAutoCard(test, run, locked) : s.tool === 'door_open_cure' ? renderDoorCard(test, run, locked) : s.tool === 'tc08_record' ? renderTc08Card(test, run, locked) : s.tool === 'bench' ? renderBenchCard(test, run, locked) : GUIDED[s.tool] ? renderGuidedCard(test, run, locked, s.tool) : s.auto || s.tool ? `<div class="auto-note">${esc(t('autoStep')(s.tool || 'console'))}</div>` : ''}
      ${fields.length ? `<div class="fields">${fields.map((f) => renderField(test, run, f, vals, locked)).join('')}</div>` : ''}</div>`;
  });
  const rest = test.data_fields.filter((f) => !captured.has(f.name));
  if (rest.length) h += `<div class="step"><div class="step-text">${t('otherData')}</div><div class="fields">${rest.map((f) => renderField(test, run, f, vals, locked)).join('')}</div></div>`;

  const ev = locked ? { verdict: rec.verdict, detail: rec.detail || '' } : evaluateRun(test, run);
  h += `<div class="criteria"><h4 style="margin-top:0">${t('criteria')}</h4><code dir="ltr">${esc(test.pass_criteria)}</code>
      <span class="verdict ${ev.verdict}" id="verdict-${tid}">${ev.verdict}</span><span class="verdict-detail" id="vdetail-${tid}"><bdi>${esc(ev.detail)}</bdi></span></div>`;
  h += `<div class="record">
      <textarea data-act="note" data-test="${tid}" placeholder="${esc(t('note'))}" aria-label="${esc(t('note'))}" ${locked ? 'readonly' : ''}>${esc(rec.note || '')}</textarea>
      ${locked ? `<button class="btn btn-outline btn-small" data-act="reopen" data-test="${tid}">${t('reopen')}</button>`
               : `<button class="btn btn-run btn-small" data-act="record" data-test="${tid}">${t('record')}</button>`}
    </div>`;
  if (locked) h += `<div class="recorded">${esc(t('recordedBy')(rec.verdict, rec.by, new Date(rec.at).toLocaleString()))}</div>`;
  return h;
}

function renderField(test, run, f, vals, locked) {
  const id = `f-${test.test_id}-${f.name}`;
  const fromVariant = Object.prototype.hasOwnProperty.call(run.variant, f.name);
  const measured = ((state.results[run.id] || {}).autoFields || []).includes(f.name);   // filled by the machine: not typed over
  const v = vals[f.name];
  const dis = locked || fromVariant || measured ? ' disabled' : '';
  let input;
  if (f.type === 'bool') {
    input = `<select id="${id}" data-field="${f.name}" data-test="${test.test_id}"${dis}>
      <option value="">${t('choose')}</option><option value="true"${v === true ? ' selected' : ''}>${t('yes')}</option><option value="false"${v === false ? ' selected' : ''}>${t('no')}</option></select>`;
  } else if (f.type === 'enum') {
    input = `<select id="${id}" data-field="${f.name}" data-test="${test.test_id}"${dis}><option value="">${t('choose')}</option>${(f.values || []).map((x) => `<option value="${esc(x)}"${v === x ? ' selected' : ''}>${esc(x)}</option>`).join('')}</select>`;
  } else {
    const num = f.type === 'float' || f.type === 'int';
    input = `<input id="${id}" dir="ltr" data-field="${f.name}" data-test="${test.test_id}" ${num ? `type="number" step="${f.type === 'int' ? 1 : 'any'}"` : 'type="text"'} value="${v === undefined || v === null ? '' : esc(v)}"${dis}>`;
  }
  const filled = v !== undefined && v !== null && v !== '';
  const note = fieldNote(test, f);
  return `<div class="field${filled ? ' filled' : ''}"><label for="${id}"><bdi class="mono">${esc(f.name)}</bdi>${f.unit ? ` <span class="unit">[${esc(f.unit)}]</span>` : ''}</label>${input}${note ? `<span class="note">${esc(note)}</span>` : ''}</div>`;
}
