// ---------- bench readiness: what the run would refuse on, shown BEFORE Start (a refused run looked like a half-recorded one) ----------
const BENCH = { ready: {} };

function setBenchRow(tid, id, ok, value) {
  const el = $(`bench-${id}-${tid}`);
  if (!el) return;
  el.classList.toggle('ok', ok === true);
  el.classList.toggle('bad', ok === false);
  el.classList.toggle('warn', ok === 'warn');
  el.querySelector('.tc-val').textContent = value || '';
}

/** The bench's own refusal texts, in the operator's language where the reason is a known one; the bench's words otherwise. */
function benchReason(msg) {
  const m = String(msg || '');
  if (/TEMP_CHAMBER.*not reading/i.test(m)) return t('benchChamberOpen');
  if (/does not answer/i.test(m)) return t('benchFwDead');
  if (/program is running|outputs are on|is heating|UV is on/i.test(m)) return t('benchMachineBusy');
  if (/no TC-08|TC-08 not usable|CH1 gives no reading/i.test(m)) return t('tcPlug');
  if (/jumps by .* open or badly seated/i.test(m)) return t('benchProbeOpen')(m);
  if (/bench is busy/i.test(m)) return t('benchBusy')(m.replace(/^.*\(|\).*$/g, ''));
  return m;
}

async function checkBench(tid) {
  const machine = !!machineInfo;
  let bs = null, st = null, p = null;
  if (machine) {
    [bs, st, p] = await Promise.all([benchApi('/bench/status').catch(() => null), api('/api/state').catch(() => null), api('/api/dev/picolog/status').catch(() => null)]);
  }
  const svc = !!(bs && bs.ok && bs.tests && bs.tests.includes(tid));
  const temp = p && p.connected && p.ch1Available && typeof p.temperature === 'number' ? p.temperature : null;
  const ambient = p && typeof p.ambient === 'number' ? p.ambient : null;
  const running = !!(st && (st.uvOn || st.isHeating || st.isCooling || st.nitrogenActive || (st.recipe && st.recipe.state && st.recipe.state !== 'idle')));
  const hot = temp !== null && ambient !== null && temp - ambient > TC_OPEN_MARGIN_C && !running;   // steady or floating: the bench watches it 3 s before deciding
  const tc08 = temp !== null && temp >= TC_MIN_C && temp <= TC_MAX_C;
  const chamber = st && st.sensors && st.sensors.chamber ? st.sensors.chamber.ok === true : null;
  const idle = st ? !running : null;
  const ready = machine && svc && tc08 && chamber === true && idle === true && !(TC08.rec) && !Object.values(AUTO).some((x) => x.busy);
  BENCH.ready[tid] = { ready, temp, ambient, chamber, idle, svc, version: bs && bs.version };
  setBenchRow(tid, 'machine', machine, machine ? machineInfo : t('needMachine'));
  setBenchRow(tid, 'svc', machine ? svc : null, !machine ? '' : svc ? `sCureBox ${bs.version}${bs.run && bs.run.running ? ' · ' + t('benchBusy')(bs.run.test_id) : ''}` : bs && bs.ok ? t('benchNoTest')(tid) : t('benchMissing'));
  setBenchRow(tid, 'tc08', !machine ? null : !p || !p.connected ? false : tc08 ? (hot ? 'warn' : true) : false,
    !machine ? '' : !p || !p.connected ? t('tcPlug') : tc08 ? temp.toFixed(1) + ' °C' + (hot ? ' · ' + t('benchHotBody')(ambient) : '') : t('tcNoCh1'));
  setBenchRow(tid, 'chamber', chamber, chamber === null ? '' : chamber ? (typeof st.chamberTemp === 'number' ? st.chamberTemp.toFixed(1) + ' °C' : 'ok') : t('benchChamberOpen'));
  setBenchRow(tid, 'idle', idle, idle === null ? '' : idle ? t('benchIdleOk') : t('benchMachineBusy'));
  const btn = $('bench-start-' + tid);
  if (btn) btn.disabled = !ready;
  const txt = $('auto-text-' + tid + '-bench');
  const a = AUTO[tid + ':bench'];
  if (txt && !(a && (a.busy || a.text))) txt.textContent = ready ? t('benchReady') : t('benchNotReady');
  return ready;
}

setInterval(() => {                      // keep the bench readiness current while such a step is open and no run is on
  for (const tid of openTests) {
    const test = TESTS[tid];
    if (!test || !test.procedure_steps.some((s) => s.tool === 'bench')) continue;
    const a = AUTO[tid + ':bench'];
    if (a && a.busy) continue;
    checkBench(tid);
  }
}, 2000);

async function runBench(tid) {
  const test = TESTS[tid];
  const run = currentRun(tid);
  const key = tid + ':bench';
  if (!FOLDER.ok) { alert(t('folderFirst')); return; }
  if (!state.api || !machineInfo) { alert(t('needMachine')); return; }
  if (Object.values(AUTO).some((x) => x.busy)) { alert(t('busyElsewhere')); return; }
  if (!(await checkBench(tid))) return;
  const rec = state.results[run.id] || (state.results[run.id] = { values: {} });
  if (rec.verdict) return;
  // a new run starts clean: a timestamp and raw_log_attached from a run four days earlier made a refused run look half-recorded
  (rec.autoFields || []).forEach((f) => { delete rec.values[f]; });
  rec.autoFields = [];
  delete rec.marks;
  AUTO[key] = { busy: true, runId: run.id, text: t('gChecking') };
  refreshTest(tid);
  try {
    const bs = await benchApi('/bench/status');
    if (!bs.tests.includes(tid)) throw new Error(t('benchNoTest')(tid));
    if (bs.run && bs.run.running) throw new Error(t('benchBusy')(bs.run.test_id));
    const start = await benchApi(`/bench/run?test=${encodeURIComponent(tid)}`, 'POST');
    if (!start.ok) throw new Error(start.message || 'refused');
    log('info', `${run.id}: ${start.message}`);
    let st;
    do {
      await sleep(1000);
      if (AUTO[key] && AUTO[key].stop) { await benchApi('/bench/run/abort?by=page', 'POST').catch(() => {}); AUTO[key].stop = false; }
      st = await benchApi('/bench/run?samples=0');
      const last = st.last || [];
      gSay(key, t('benchPhase')(st.phase, st.elapsed, last[1], last[7]));
      gPrompt(key, st.prompt || '');
    } while (st.running);
    gPrompt(key, '');
    st = await benchApi('/bench/run');
    const known = new Set(test.data_fields.map((f) => f.name));
    const values = {};
    // every value the bench measured is kept, also when a LATER phase failed (a run that measured nine values and then
    // waited 180 s for the thermistor to come back showed nothing at all); the failed phase's own fields stay empty
    // because the bench never set them. A run that never reached the disconnect fills nothing - its trace is still kept
    const measured = st.status === 'OK' || !!(st.marks && st.marks.disconnect);
    if (measured) {
      for (const [k, v] of Object.entries(st.values || {})) if (known.has(k) && v !== null && v !== undefined) values[k] = v;
      if (known.has('raw_log_attached') && st.samples && st.samples.length) values.raw_log_attached = true;   // the samples go to sweeps/ with this run
    }
    fillAuto(test, rec, values);
    setAuto(rec, { kind: 'bench', status: st.status, error: st.error, at: new Date().toISOString(), machine: machineInfo,
                   test_id: st.test_id, config: st.config, marks: st.marks, phases: st.phases, notes: st.notes, extra: st.values,
                   tc08: st.tc08, columns: st.columns, samples: st.samples });
    persist(run.id, true);
    journal('measurement', run.id);
    const ok = st.status === 'OK';
    const neverHeated = !(st.marks && st.marks.heat_on);                     // ended in prepare / cooldown: the test itself never began
    const failedPhase = (st.phases || []).length ? st.phases[st.phases.length - 1].name : st.phase;
    AUTO[key] = { busy: false, runId: run.id, cls: ok ? 'pass' : 'fail',
                  text: ok ? t('benchDone')(Object.keys(values).length) : neverHeated ? t('benchNotStarted')(benchReason(st.error || st.status))
                      : t('benchFailedAt')(failedPhase, benchReason(st.error || st.status), Object.keys(values).length) };
    log(ok ? 'pass' : 'fail', `${run.id} bench: ${st.status}${st.error ? ' - ' + st.error : ''}`);
    refreshTest(tid);
    await saveBenchPng(tid, run, rec.autos.bench);
  } catch (e) {
    AUTO[key] = { busy: false, runId: run.id, text: t('benchNotStarted')(benchReason(e.message)), cls: 'fail' };
    log('fail', `${run.id} bench: ${e.message}`);
    refreshTest(tid);
  }
}

/** Heater body (TC-08 CH1) against time with the run's marks; the chamber temperature as a thin second line. */
function drawBench(tid) {
  const canvas = $('bench-' + tid);
  if (!canvas) return;
  const rec = state.results[currentRun(tid).id];
  const a = rec && rec.autos && rec.autos.bench;
  if (!a || !a.samples || !a.samples.length) return;
  const pts = a.samples.filter((s) => s[1] !== null).map((s) => [s[0], s[1]]);
  const ch = a.samples.filter((s) => s[7] !== null).map((s) => [s[0], s[7]]);
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height, L = 56, R = 16, T = 18, B = 36;
  ctx.fillStyle = '#0a0a0a'; ctx.fillRect(0, 0, W, H);
  if (!pts.length) return;
  const xmax = Math.max(...pts.map((p) => p[0])) || 1;
  const all = pts.concat(ch).map((p) => p[1]);
  const ymin = Math.floor(Math.min(...all) - 2), ymax = Math.ceil(Math.max(...all) + 2);
  const X = (x) => L + (x / xmax) * (W - L - R);
  const Y = (y) => H - B - ((y - ymin) / (ymax - ymin)) * (H - T - B);
  ctx.font = '11px Segoe UI, sans-serif'; ctx.lineWidth = 1;
  for (let k = 0; k <= 4; k++) {
    const v = ymin + ((ymax - ymin) * k) / 4;
    ctx.strokeStyle = '#2a2a2a'; ctx.beginPath(); ctx.moveTo(L, Y(v)); ctx.lineTo(W - R, Y(v)); ctx.stroke();
    ctx.fillStyle = '#777'; ctx.textAlign = 'right'; ctx.fillText(v.toFixed(0), L - 6, Y(v) + 4);
  }
  ctx.textAlign = 'center';
  const step = xmax > 300 ? 60 : xmax > 60 ? 10 : 5;
  for (let x = 0; x <= xmax; x += step) ctx.fillText(x + ' s', X(x), H - B + 16);
  ctx.save(); ctx.translate(14, (H - B + T) / 2); ctx.rotate(-Math.PI / 2); ctx.fillText('°C', 0, 0); ctx.restore();
  const colors = { heat_on: '#ff9800', disconnect: '#f44336', alarm: '#e91e63', reconnect: '#4caf50' };
  let row = 0;
  for (const [name, x] of Object.entries(a.marks || {})) {
    const c = colors[name] || '#9e9e9e';
    ctx.strokeStyle = c; ctx.setLineDash([4, 3]); ctx.beginPath(); ctx.moveTo(X(x), T); ctx.lineTo(X(x), H - B); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = c; ctx.textAlign = 'left'; ctx.fillText(name, X(x) + 3, T + 12 + (row++ % 4) * 13);
  }
  ctx.strokeStyle = '#9e9e9e'; ctx.lineWidth = 1; ctx.beginPath();
  ch.forEach((p, k) => (k ? ctx.lineTo(X(p[0]), Y(p[1])) : ctx.moveTo(X(p[0]), Y(p[1])))); ctx.stroke();
  ctx.strokeStyle = '#64b5f6'; ctx.lineWidth = 2; ctx.beginPath();
  pts.forEach((p, k) => (k ? ctx.lineTo(X(p[0]), Y(p[1])) : ctx.moveTo(X(p[0]), Y(p[1])))); ctx.stroke();
  ctx.fillStyle = '#ddd'; ctx.textAlign = 'right';
  const v = rec.values || {};
  ctx.fillText(`heater body (blue) · chamber (grey)${v.heater_off_time !== undefined ? ` · heater off ${v.heater_off_time} s after the disconnect` : ''}`, W - R, H - 6);
}

async function saveBenchPng(tid, run, auto) {
  drawBench(tid);
  const canvas = $('bench-' + tid);
  if (!canvas || !FOLDER.ok) return;
  const blob = await new Promise((r) => canvas.toBlob(r, 'image/png'));
  const { dir, stem } = runPath(run.id);
  const name = `${stem}_bench_${auto.at.replace(/[-:]/g, '').replace(/\..*$/, '')}.png`;
  try {
    const f = await (await dirAt(['sweeps', ...dir])).getFileHandle(name, { create: true });
    const w = await f.createWritable();
    await w.write(blob);
    await w.close();
    auto.graph_file = `sweeps/${dir.join('/')}/${name}`;
    persist(run.id, true);
    log('info', t('graphSaved')(auto.graph_file));
  } catch (e) {
    log('fail', t('folderError')(e.message));
  }
}

async function abortUvSweep(tid) {
  try { const r = await api('/api/dvt/uv-sweep/abort', 'POST'); autoSay(tid, r.message || 'abort requested'); }
  catch (e) { autoSay(tid, e.message, 'fail'); }
}

function drawCharts(tid) {
  const canvas = $('chart-' + tid);
  if (!canvas) return;
  const rec = state.results[currentRun(tid).id];
  if (!rec || !rec.auto) return;
  const { fit, steps } = analyzeSweep({ steps: rec.auto.steps, config: rec.auto.config });
  const pts = steps.filter((x) => x.mean !== null && x.mean !== undefined);
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height, L = 52, R = 14, T = 14, B = 34;
  ctx.fillStyle = '#0a0a0a'; ctx.fillRect(0, 0, W, H);
  if (!pts.length) return;
  const ymax = Math.max(...pts.map((x) => x.mean)) * 1.1 || 1;
  const X = (pct) => L + (pct / 100) * (W - L - R);
  const Y = (v) => H - B - (v / ymax) * (H - T - B);
  ctx.strokeStyle = '#2a2a2a'; ctx.fillStyle = '#777'; ctx.font = '11px Segoe UI, sans-serif'; ctx.lineWidth = 1;
  for (let k = 0; k <= 4; k++) {
    const v = (ymax * k) / 4, y = Y(v);
    ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(W - R, y); ctx.stroke();
    ctx.textAlign = 'right'; ctx.fillText(v.toFixed(0), L - 6, y + 4);
  }
  ctx.textAlign = 'center';
  for (let pct = 0; pct <= 100; pct += 20) ctx.fillText(pct + ' %', X(pct), H - B + 16);
  ctx.save(); ctx.translate(14, (H - B + T) / 2); ctx.rotate(-Math.PI / 2); ctx.fillText('mW/cm²', 0, 0); ctx.restore();
  if (fit) {
    ctx.strokeStyle = '#ff9800'; ctx.setLineDash([5, 4]); ctx.beginPath();
    ctx.moveTo(X(0), Y(Math.max(0, fit.b))); ctx.lineTo(X(100), Y(fit.m * 100 + fit.b)); ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.strokeStyle = '#64b5f6'; ctx.lineWidth = 2; ctx.beginPath();
  pts.forEach((x, k) => (k ? ctx.lineTo(X(x.i), Y(x.mean)) : ctx.moveTo(X(x.i), Y(x.mean)))); ctx.stroke();
  ctx.fillStyle = '#64b5f6';
  pts.forEach((x) => { ctx.beginPath(); ctx.arc(X(x.i), Y(x.mean), 3.5, 0, Math.PI * 2); ctx.fill(); });
}

// ---------- actions ----------
function log(kind, msg) {
  const ts = new Date().toLocaleTimeString();
  logLines.push({ ts, kind, msg });
  const line = document.createElement('div');
  line.className = kind;
  line.textContent = `[${ts}] ${msg}`;
  $('logBox').appendChild(line);
  $('logBox').scrollTop = $('logBox').scrollHeight;
}

function currentRun(tid) {
  const runs = runsFor(tid, state.unit);
  return runs[Math.min(selectedRun[tid] || 0, runs.length - 1)];
}

function setValue(tid, field, raw) {
  const test = TESTS[tid];
  const f = test.data_fields.find((x) => x.name === field);
  const run = currentRun(tid);
  let v = raw;
  if (raw === '') v = null;
  else if (f.type === 'bool') v = raw === 'true';
  else if (f.type === 'float') v = Number(raw);
  else if (f.type === 'int') v = Math.round(Number(raw));
  if (typeof v === 'number' && !Number.isFinite(v)) v = null;
  const rec = state.results[run.id] || (state.results[run.id] = { values: {} });
  if (v === null) delete rec.values[field]; else rec.values[field] = v;
  persist(run.id);
}

function recordVerdict(tid) {
  if (!FOLDER.ok) { alert(t('folderFirst')); return; }
  if (!state.operator.trim()) { alert(t('operatorFirst')); $('operator').focus(); return; }
  const test = TESTS[tid];
  const run = currentRun(tid);
  const ev = evaluateRun(test, run);
  const rec = state.results[run.id] || (state.results[run.id] = { values: {} });
  Object.assign(rec, { verdict: ev.verdict, detail: ev.detail, by: state.operator.trim(), at: new Date().toISOString(), catalog: CAT.catalog_version });
  persist(run.id, true);
  journal('record', run.id);
  log(ev.verdict === 'PASS' ? 'pass' : ev.verdict === 'FAIL' ? 'fail' : 'warn', t('logRecorded')(run.id, ev.verdict));
  const runs = runsFor(tid, state.unit);
  const nextOpen = runs.findIndex((r) => !(state.results[r.id] && state.results[r.id].verdict));
  if (nextOpen >= 0) selectedRun[tid] = nextOpen;
  refreshTest(tid);
}

function reopen(tid) {
  const run = currentRun(tid);
  const rec = state.results[run.id];
  if (!rec) return;
  delete rec.verdict; delete rec.detail; delete rec.by; delete rec.at;
  persist(run.id, true);
  journal('reopen', run.id);
  log('info', t('logReopen')(run.id));
  refreshTest(tid);
}

const normUrl = (u) => {
  u = String(u || '').trim().replace(/\/+$/, '');
  if (u && !/^https?:\/\//i.test(u)) u = 'http://' + u;
  if (u && !/:\d+$/.test(u.replace(/^https?:\/\//i, ''))) u += ':3001';
  return u;
};
const serialOf = (v) => (v && (v.emmcSerial || v.serial) ? String(v.emmcSerial || v.serial).replace(/^0x/i, '') : null);

// A search or connect belongs to the unit it started for; a newer one (unit switch, Connect) makes it stale.
let connGen = 0;
let conn = { busy: false, owner: null, many: 0, notFound: false };

function renderStatus() {
  const s = conn.busy ? t('searching')
    : machineInfo ? `${t('connected')} - ${machineInfo}${conn.owner ? ' - ' + t('otherUnit')(conn.owner) : ''}`
    : conn.many ? t('foundMany')(conn.many)
    : conn.notFound ? t('notFound') : t('notConnected');
  $('statusLabel').textContent = s;
  $('statusDot').classList.toggle('connected', !!machineInfo && !conn.busy);
}

/** manual = the operator pressed Connect / chose a machine: that choice re-pairs the machine with this unit. */
async function checkConnection(gen = ++connGen, unit = state.unit, manual = false) {
  const url = normUrl($('apiUrl').value);
  $('apiUrl').value = url;
  conn = { busy: true, owner: null, many: 0, notFound: false };
  machineInfo = '';
  renderStatus();
  let serial = null;
  let ip = null;
  let info = '';
  if (url) {
    try {
      const s = await (await fetch(url + '/api/state', { signal: AbortSignal.timeout(4000) })).json();
      let ver = '';
      try {
        const v = await (await fetch(url + '/api/system/version', { signal: AbortSignal.timeout(4000) })).json();
        ver = v.appVersion || v.version || '';
        serial = serialOf(v);
      } catch (e) { /* version endpoint optional */ }
      const temp = typeof s.chamberTemp === 'number' ? ' · ' + s.chamberTemp.toFixed(1) + '°C' : '';
      info = [ver && 'v' + ver, serial, s.hwSource].filter(Boolean).join(' · ') + temp;
      try {                                                  // the IP behind a name like scurebox.local: tried next time, and its network scanned
        const n = await (await fetch(url + '/api/network/status', { signal: AbortSignal.timeout(4000) })).json();
        ip = typeof n.ip === 'string' && /^\d+\.\d+\.\d+\.\d+$/.test(n.ip) ? n.ip : null;
      } catch (e) { /* optional */ }
    } catch (e) { /* not reachable */ }
  }
  if (gen !== connGen) return false;                       // overtaken by a newer search / connect
  state.api = url;
  machineInfo = info;
  conn = { busy: false, owner: null, many: 0, notFound: false };
  if (info) {
    log('info', t('logConnect')(info));
    state.machines = state.machines || {};
    const owner = serial && Object.entries(state.machines).find(([u, m]) => u !== unit && m.serial === serial);
    if (owner && !manual) {
      conn.owner = owner[0];
      log('warn', t('otherUnit')(owner[0]));
    } else {
      if (owner) {
        delete state.machines[owner[0]];
        log('warn', t('repaired')(serial, owner[0], unit));
      }
      state.machines[unit] = { url, serial, ip };
    }
  }
  save();
  renderStatus();
  return !!info;
}

async function probe(url, ms = 2500) {
  try {
    const v = await (await fetch(url + '/api/system/version', { signal: AbortSignal.timeout(ms) })).json();
    return v && (v.appVersion || v.version) ? { url, version: v.appVersion || v.version, serial: serialOf(v) } : null;
  } catch (e) {
    return null;
  }
}

/** The /24 networks of every IPv4 address the page already knows. */
function knownSubnets() {
  const urls = [state.api, ...Object.values(state.machines || {}).flatMap((m) => [m.url, m.ip && `http://${m.ip}:3001`])];
  const nets = new Set();
  urls.forEach((u) => { const m = /^https?:\/\/(\d+\.\d+\.\d+)\.\d+/.exec(u || ''); if (m) nets.add(m[1]); });
  return [...nets];
}

async function scan(nets, wantSerial) {
  const found = [];
  for (const net of nets) {
    const ips = Array.from({ length: 254 }, (_, i) => `http://${net}.${i + 1}:3001`);
    for (let k = 0; k < ips.length; k += 64) {
      const batch = await Promise.all(ips.slice(k, k + 64).map((u) => probe(u, 1500)));
      found.push(...batch.filter(Boolean));
      if (wantSerial && found.some((f) => f.serial === wantSerial)) return found;
    }
  }
  return found;
}

/** Find the machine of the selected unit without typing: its remembered address, scurebox.local, then a scan of the known networks. */
async function autoConnect() {
  const gen = ++connGen;
  const unit = state.unit;
  const mine = (state.machines || {})[unit];
  machineInfo = '';
  conn = { busy: true, owner: null, many: 0, notFound: false };
  $('machinePick').hidden = true;
  renderStatus();
  const direct = [...new Set([mine && mine.url, mine && mine.ip && `http://${mine.ip}:3001`, state.api, 'http://scurebox.local:3001'].filter(Boolean))];
  let found = (await Promise.all(direct.map((u) => probe(u)))).filter(Boolean);
  if (gen !== connGen) return;
  const pick = (list) => (mine && mine.serial ? list.find((f) => f.serial === mine.serial) : null);
  let hit = pick(found);
  if (!hit && (!mine || !mine.serial) && new Set(found.map((f) => f.serial)).size === 1) hit = found[0];
  if (!hit) {
    const more = await scan(knownSubnets(), mine && mine.serial);
    if (gen !== connGen) return;
    found = [...new Map([...found, ...more].map((f) => [f.serial || f.url, f])).values()];
    hit = pick(found) || (!mine || !mine.serial ? (found.length === 1 ? found[0] : null) : null);
  }
  if (hit) {
    $('apiUrl').value = hit.url;
    await checkConnection(gen, unit);
    return;
  }
  conn = { busy: false, owner: null, many: found.length, notFound: !found.length };
  if (found.length) {
    const sel = $('machinePick');
    sel.innerHTML = `<option value="">${esc(t('pickMachine')(found.length))}</option>` +
      found.map((f) => `<option value="${esc(f.url)}">${esc(f.url.replace(/^https?:\/\//, ''))} · ${esc(f.serial || '?')} · v${esc(f.version)}</option>`).join('');
    sel.hidden = false;
  }
  renderStatus();
}

function buildReport() {
  const unit = state.unit;
  const now = new Date();
  const owed = Object.keys(TESTS).flatMap((tid) => runsFor(tid, unit));
  const vs = owed.map((r) => state.results[r.id] && state.results[r.id].verdict);
  const n = (k) => vs.filter((v) => v === k).length;
  let r = `sCure DVT Report - ${unit}\n` + '='.repeat(60) + '\n';
  r += `Date: ${now.toLocaleString()}\nOperator: ${state.operator || '-'}\nCatalog: ${CAT.catalog_version} (${CAT.source})\n`;
  r += `Machine: ${machineInfo || 'not connected'}\n\n`;
  r += `Runs: ${owed.length} owed / ${n('PASS')} PASS / ${n('FAIL')} FAIL / ${n('BLOCKED')} BLOCKED / ${owed.length - vs.filter(Boolean).length} open\n` + '='.repeat(60) + '\n\n';
  CAT.phases.forEach((p) => {
    const tests = p.tests.filter((tid) => runsFor(tid, unit).length);
    if (!tests.length) return;
    r += `[Phase ${p.id}] ${p.name}${phaseClosed(p, unit) ? '  - CLOSED' : ''}\n  Gate: ${p.gate || '-'}\n`;
    tests.forEach((tid) => {
      const test = TESTS[tid];
      const runs = runsFor(tid, unit);
      r += `  ${(testVerdict(tid, unit) || 'OPEN').toUpperCase().padEnd(8)} ${tid}  ${test.title}\n`;
      runs.forEach((run, i) => {
        const rec = state.results[run.id];
        if (!rec || !rec.verdict) return;
        const vals = Object.entries(rec.values || {}).map(([k, v]) => `${k}=${v}`).join(', ');
        r += `      run ${i + 1}/${runs.length} ${variantLabel(run.variant) || ''} rep ${run.rep}: ${rec.verdict}${rec.detail ? ' (' + rec.detail + ')' : ''} - ${rec.by}, ${new Date(rec.at).toLocaleString()}\n`;
        if (vals) r += `        ${vals}\n`;
        if (rec.note) r += `        note: ${rec.note}\n`;
      });
    });
    r += '\n';
  });
  if (logLines.length) r += 'Log:\n' + '-'.repeat(60) + '\n' + logLines.map((l) => `[${l.ts}] ${l.msg}`).join('\n') + '\n';
  return r;
}

function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ---------- results folder: every run, value, verdict and measurement is written to a folder the user picks ----------
// <folder>/runs.csv            one row per run (verdict, operator, times)         - regenerated
// <folder>/values.csv          one row per value (long format, for analysis)      - regenerated
// <folder>/journal.jsonl       every record / reopen / measurement, append-only
// <folder>/runs/<unit>/<test>/<variant>_r<n>.json   the full run
// <folder>/sweeps/<unit>/<test>/<variant>_r<n>_<time>.csv   raw samples of an automatic measurement
// <folder>/reports/            text reports saved from Export report
const FOLDER = { handle: null, ok: false, name: '', savedAt: '', retrying: null };   // retrying = the last transient write error, while a retry is pending
const dirty = new Set();
let syncTimer = null;
let syncing = Promise.resolve();

function kvOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('scure-dvt-web', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function kv(key, value) {
  const db = await kvOpen();
  return new Promise((res) => {
    const tx = db.transaction('kv', value === undefined ? 'readonly' : 'readwrite');
    const q = value === undefined ? tx.objectStore('kv').get(key) : tx.objectStore('kv').put(value, key);
    q.onsuccess = () => res(value === undefined ? q.result : true);
    q.onerror = () => res(undefined);
  });
}

const safeName = (s) => String(s).replace(/[<>:"/\\|?*\u0000-\u001f]/g, '_');
function runPath(id) {
  const [tid, unit, vl, rep] = id.split('|');
  return { dir: [safeName(unit), safeName(tid)], stem: `${vl ? safeName(vl) + '_' : ''}r${rep}` };
}
async function dirAt(parts) {
  let d = FOLDER.handle;
  for (const p of parts) d = await d.getDirectoryHandle(p, { create: true });
  return d;
}
async function writeText(parts, name, text) {
  const f = await (await dirAt(parts)).getFileHandle(name, { create: true });
  const w = await f.createWritable();
  await w.write(text);
  await w.close();
}
async function appendText(parts, name, text) {
  const f = await (await dirAt(parts)).getFileHandle(name, { create: true });
  const size = (await f.getFile()).size;
  const w = await f.createWritable({ keepExistingData: true });
  await w.seek(size);
  await w.write(text);
  await w.close();
}

function csvCell(v) {
  if (v === null || v === undefined) return '';
  const s = typeof v === 'object' ? JSON.stringify(v) : String(v);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
const csvText = (rows) => '﻿' + rows.map((r) => r.map(csvCell).join(',')).join('\r\n') + '\r\n';   // BOM: Excel reads the Hebrew notes

function runInfo(id) {
  const [tid, unit, variant, rep] = id.split('|');
  const test = TESTS[tid];
  const runs = test ? runsFor(tid, unit) : [];
  const phase = CAT.phases.find((p) => p.tests.includes(tid));
  return { tid, unit, variant, rep: Number(rep), test, index: runs.findIndex((r) => r.id === id) + 1, total: runs.length, phase: phase ? phase.id : '' };
}

function runsCsv() {
  const rows = [['unit', 'test_id', 'phase', 'subsystem', 'title', 'run', 'runs_total', 'variant', 'repetition', 'verdict', 'detail',
    'operator', 'recorded_at', 'updated_at', 'catalog_version', 'values_measured_by_machine', 'machine', 'measurement_status', 'note']];
  for (const id of Object.keys(state.results).sort()) {
    const rec = state.results[id];
    const i = runInfo(id);
    rows.push([i.unit, i.tid, i.phase, i.test && i.test.subsystem, i.test && i.test.title, i.index || '', i.total || '', i.variant, i.rep,
      rec.verdict || '', rec.detail || '', rec.by || '', rec.at || '', rec.updated || '', rec.catalog || CAT.catalog_version,
      (rec.autoFields || []).length, rec.auto ? rec.auto.machine : '', rec.auto ? rec.auto.status : '', rec.note || '']);
  }
  return csvText(rows);
}

function valuesCsv() {
  const rows = [['unit', 'test_id', 'run', 'variant', 'repetition', 'field', 'value', 'unit_of_measure', 'type', 'source', 'verdict', 'recorded_at', 'updated_at']];
  for (const id of Object.keys(state.results).sort()) {
    const rec = state.results[id];
    const i = runInfo(id);
    const fields = i.test ? i.test.data_fields : [];
    for (const [k, v] of Object.entries(rec.values || {})) {
      const f = fields.find((x) => x.name === k) || {};
      rows.push([i.unit, i.tid, i.index || '', i.variant, i.rep, k, v, f.unit || '', f.type || '',
        (rec.autoFields || []).includes(k) ? 'machine' : 'manual', rec.verdict || '', rec.at || '', rec.updated || '']);
    }
  }
  return csvText(rows);
}

function sweepCsv(auto) {
  const rows = [Array.isArray(auto.columns) ? auto.columns      // any automatic step may name its own sample columns
    : auto.kind === 'tc08_record' ? ['t_s', 'ch1_c', 'machine_chamber_c', 'machine_heating']
    : auto.kind === 'door_open_cure'
    ? ['t_s', 'irradiance_mw_cm2', 'phase', 'door_open', 'uv_on']
    : ['t_s', 'irradiance_mw_cm2', 'intensity_pct', 'phase', 'led_max_c', 'uv_on']];
  (auto.samples || []).forEach((s) => rows.push(s));
  return csvText(rows);
}

const README = `sCure DVT results - written by DVT/web/dvt-tool.html

runs.csv       one row per run: unit, test, variant, repetition, verdict, operator, times, note
values.csv     one row per recorded value (long format): filter / pivot by unit, test, field
               source = machine (measured automatically) or manual (typed by the operator)
journal.jsonl  every record / reopen / automatic measurement, append-only, one JSON per line
runs/<unit>/<test>/<variant>_r<n>.json       the full run (values, verdict, note, measurement summary)
sweeps/<unit>/<test>/<variant>_r<n>[_<step tool>]_<time>.csv  raw samples of an automatic measurement
sweeps/<unit>/<test>/<variant>_r<n>_uv_off_timing_<time>.png  the UV-off graph (DVT-SAF-008 step 2)
reports/       text reports saved from "Export report"

The page reads runs/ back when this folder is chosen, so the folder - not the browser - is the record.
`;

// Only a lost permission takes the folder away (the operator reconnects it); any other write failure - a CSV open in
// Excel, OneDrive or an antivirus holding the file for a moment - is transient: the run stays queued and the write is
// tried again, so a recording in progress never silently stops reaching the folder (a 734-sample run was lost that way).
const isPermissionLoss = (e) => !!e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
const RETRY_DELAYS_MS = [5000, 15000, 60000];
let retryTimer = null, retries = 0;

async function syncNow() {
  if (!FOLDER.ok || !dirty.size) return;
  const ids = [...dirty];
  dirty.clear();
  let failure = null;                                             // the first transient error of this pass
  const attempt = async (fn) => {
    try { await fn(); return true; }
    catch (e) { if (isPermissionLoss(e)) throw e; failure = failure || e; return false; }
  };
  try {
    for (const id of ids) {
      const rec = state.results[id];
      if (!rec) continue;
      const { dir, stem } = runPath(id);
      const i = runInfo(id);
      const autos = rec.autos ? Object.values(rec.autos) : rec.auto ? [rec.auto] : [];
      let ok = true;
      for (const a of autos) {                     // raw samples only in hand right after a measurement - never overwrite them with nothing
        if (!a.samples || !a.samples.length || !a.at) continue;
        const file = `${stem}${rec.autos ? '_' + a.kind : ''}_${a.at.replace(/[-:]/g, '').replace(/\..*$/, '')}.csv`;
        a.samples_file = `sweeps/${dir.join('/')}/${file}`;
        if (!(await attempt(() => writeText(['sweeps', ...dir], file, sweepCsv(a))))) ok = false;
        if (isTrace(a) && !a.graph_file && !a.live) {          // a script trace gets its picture beside the CSV, once - when the run is over, not from a live snapshot
          const png = file.replace(/\.csv$/, '.png');
          const wrote = await attempt(async () => {
            const blob = await tracePng(a);
            const f = await (await dirAt(['sweeps', ...dir])).getFileHandle(png, { create: true });
            const w = await f.createWritable(); await w.write(blob); await w.close();
          });
          if (wrote) { a.graph_file = `sweeps/${dir.join('/')}/${png}`; log('info', t('graphSaved')(a.graph_file)); } else ok = false;
        }
      }
      const strip = (a) => ({ ...a, samples: undefined, n_samples: (a.samples || []).length || a.n_samples || 0 });
      const doc = { run_id: id, unit: i.unit, test_id: i.tid, run: i.index, runs_total: i.total, variant: i.variant, repetition: i.rep,
        ...rec, auto: rec.auto ? strip(rec.auto) : undefined,
        autos: rec.autos ? Object.fromEntries(Object.entries(rec.autos).map(([k, a]) => [k, strip(a)])) : undefined };
      if (!(await attempt(() => writeText(['runs', ...dir], stem + '.json', JSON.stringify(doc, null, 1))))) ok = false;
      if (!ok) dirty.add(id);                                     // one locked file does not hold the other runs back
    }
    if (!(await attempt(() => writeText([], 'runs.csv', runsCsv()))) | !(await attempt(() => writeText([], 'values.csv', valuesCsv()))))
      ids.forEach((id) => dirty.add(id));
    if (failure) {
      FOLDER.retrying = failure.message;
      const delay = RETRY_DELAYS_MS[Math.min(retries++, RETRY_DELAYS_MS.length - 1)];
      clearTimeout(retryTimer);
      retryTimer = setTimeout(() => { retryTimer = null; syncing = syncing.then(syncNow); }, delay);
      log('warn', t('folderRetry')(failure.message, Math.round(delay / 1000)));
    } else {
      FOLDER.retrying = null;
      retries = 0;
      FOLDER.savedAt = new Date().toLocaleTimeString();
    }
  } catch (e) {                                                   // permission gone: everything waits for the reconnect
    ids.forEach((id) => dirty.add(id));
    FOLDER.ok = false;
    FOLDER.retrying = null;
    log('fail', t('folderError')(e.message));
  }
  renderFolder();
}

setInterval(() => { if (FOLDER.ok && dirty.size && !retryTimer) syncing = syncing.then(syncNow); }, 60000);   // nothing stays queued for long

function persist(id, now = false) {
  const rec = state.results[id];
  if (rec) rec.updated = new Date().toISOString();
  save();
  dirty.add(id);
  cloudQueue(id);
  clearTimeout(syncTimer);
  if (now) syncing = syncing.then(syncNow);
  else syncTimer = setTimeout(() => { syncing = syncing.then(syncNow); }, 800);
}

// ---------- sCure Cloud: the same runs published to the portal's DVT tab (Code.gs kinds "dvt_run" / "dvt_file") ----------
// The results folder stays THE record; the cloud is the copy everyone else sees. A failed upload only queues the run
// again (and is retried every minute), so nothing recorded here can be lost by the network.
const CLOUD = { queue: new Set(), busy: false, sent: 0, at: '', error: '', timer: null, machines: [], catalogSent: false };

const cloudCfg = () => state.cloud || (state.cloud = { url: '', key: '' });
const cloudReady = () => !!(cloudCfg().url && cloudCfg().key);
// which CureBox (portal machine name) each DVT unit is - chosen from the portal's list, remembered per unit
const cloudMachineFor = (unit) => ((cloudCfg().machines || {})[unit] || '');

async function cloudPost(body) {
  // text/plain: no CORS preflight (Apps Script answers OPTIONS with a redirect, which the browser rejects)
  const r = await fetch(cloudCfg().url, {
    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow',
    body: JSON.stringify({ ...body, machineKey: cloudCfg().key }), signal: AbortSignal.timeout(60000) });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const out = await r.json().catch(() => null);
  if (!out || !out.ok) throw new Error((out && out.message) || 'the portal refused the upload');
  return out;
}

const textB64 = (text) => btoa(String.fromCharCode(...new TextEncoder().encode(text)));
const blobB64 = (blob) => new Promise((res, rej) => {
  const fr = new FileReader();
  fr.onload = () => res(String(fr.result).split(',')[1]);
  fr.onerror = () => rej(fr.error || new Error('could not read the file'));
  fr.readAsDataURL(blob);
});

/** One run as the portal stores it: catalog identity, verdict and every recorded value. */
function cloudRunBody(id) {
  const rec = state.results[id] || {};
  const i = runInfo(id);
  return { kind: 'dvt_run', unit: i.unit, testId: i.tid, variant: i.variant || '', rep: i.rep, runId: id,
           verdict: rec.verdict || '', operator: rec.by || state.operator || '', startedAt: rec.at || rec.updated || '',
           note: rec.note || '', machine: cloudMachineFor(i.unit), values: rec.values || {} };
}

/** The catalog as the portal needs it to list EVERY test: phases + gates, and per test its units and the runs it owes
 *  (the same `variant|rep` keys runsFor builds), so a test nobody started still shows - as open. */
function cloudCatalogBody() {
  const tests = {};
  for (const [tid, t] of Object.entries(TESTS)) {
    const reps = Number(t.repetitions) || 1;
    const isBench = (t.procedure_steps || []).some((s) => s.tool === 'bench');
    tests[tid] = { title: t.title, safety: !!t.safety_critical, auto: !!(DVT_AUTO.has && DVT_AUTO.has(tid)) || isBench, minutes: t.duration_est_min || null,
                   d: DVT_AUTO.detailOf ? DVT_AUTO.detailOf(t) : undefined,
                   units: t.units || [], runs: (t.variants || [{}]).flatMap((v) => Array.from({ length: reps }, (_, r) => `${variantLabel(v)}|${r + 1}`)) };
  }
  return { kind: 'dvt_catalog', catalog: { version: CAT.catalog_version,
    phases: CAT.phases.map((ph) => ({ id: ph.id, name: ph.name, gate: ph.gate || '', tests: ph.tests })), tests } };
}

/** The run, then every raw measurement it carries (sweep CSV, and the trace graph once the run is over). */
async function cloudSendRun(id) {
  const rec = state.results[id] || {};
  const i = runInfo(id);
  await cloudPost(cloudRunBody(id));
  const { stem } = runPath(id);
  const autos = rec.autos ? Object.values(rec.autos) : rec.auto ? [rec.auto] : [];
  for (const a of autos) {
    if (!a.samples || !a.samples.length || !a.at) continue;
    const name = `${stem}${rec.autos ? '_' + a.kind : ''}_${a.at.replace(/[-:]/g, '').replace(/\..*$/, '')}.csv`;
    await cloudPost({ kind: 'dvt_file', unit: i.unit, runId: id, fileKind: a.kind || 'sweep', fileName: name,
                      mimeType: 'text/csv', contentBase64: textB64(sweepCsv(a)) });
    if (isTrace(a) && !a.live) {
      const png = name.replace(/\.csv$/, '.png');
      await cloudPost({ kind: 'dvt_file', unit: i.unit, runId: id, fileKind: `${a.kind || 'sweep'}_graph`, fileName: png,
                        mimeType: 'image/png', contentBase64: await blobB64(await tracePng(a)) });
    }
  }
}

async function cloudSyncNow() {
  if (!cloudReady() || CLOUD.busy || (!CLOUD.queue.size && CLOUD.catalogSent)) return;   // a catalog that failed is retried even with no run queued
  CLOUD.busy = true;
  const ids = [...CLOUD.queue];
  CLOUD.queue.clear();
  renderCloud();
  let failed = null;
  if (!CLOUD.catalogSent) {                     // first: the catalog, so the portal can lay out every test
    try { await cloudPost(cloudCatalogBody()); CLOUD.catalogSent = true; } catch (e) { failed = e; }
  }
  for (const id of ids) {
    if (!state.results[id]) continue;
    try { await cloudSendRun(id); CLOUD.sent++; log('info', t('logCloud')(id)); }
    catch (e) { CLOUD.queue.add(id); failed = failed || e; }
  }
  CLOUD.busy = false;
  CLOUD.error = failed ? failed.message : '';
  if (failed) {
    log('warn', t('logCloudFail')(failed.message));
    clearTimeout(CLOUD.timer);
    CLOUD.timer = setTimeout(cloudSyncNow, 60000);
  } else {
    CLOUD.at = new Date().toLocaleTimeString();
  }
  renderCloud();
}

function cloudQueue(id) {
  if (!cloudReady()) return;
  CLOUD.queue.add(id);
  clearTimeout(CLOUD.timer);
  CLOUD.timer = setTimeout(cloudSyncNow, 1500);
  renderCloud();
}

/** "Sync all": everything this browser holds, including runs recorded before the cloud was set up. */
function cloudSyncAll() {
  if (!cloudReady()) { alert(t('cloudNone')); return; }
  CLOUD.catalogSent = false;                    // the catalog goes again too (a newer catalog version)
  Object.keys(state.results).forEach((id) => CLOUD.queue.add(id));
  log('info', t('logCloudAll')(CLOUD.queue.size));
  renderCloud();
  cloudSyncNow();
}

/** The portal's CureBoxes for the list (names only; the DVT key may read nothing else). */
async function cloudLoadMachines() {
  if (!cloudReady()) { CLOUD.machines = []; renderCloud(); return; }
  try { CLOUD.machines = (await cloudPost({ kind: 'dvt_machines' })).machines || []; CLOUD.error = ''; }
  catch (e) { CLOUD.error = e.message; }
  renderCloud();
}

/** Assign the current DVT unit to a CureBox: its runs already on the portal are re-sent and filed under it. */
function cloudSetMachine(name) {
  const c = cloudCfg();
  c.machines = c.machines || {};
  if (name) c.machines[state.unit] = name; else delete c.machines[state.unit];
  save();
  Object.keys(state.results).filter((id) => id.split('|')[1] === state.unit).forEach((id) => CLOUD.queue.add(id));
  log('info', t('logCloudMachine')(state.unit, name));
  renderCloud();
  cloudSyncNow();
}

function renderCloud() {
  const bar = $('cloudBar');
  if (!bar) return;
  const ready = cloudReady();
  bar.classList.toggle('missing', !ready || !!CLOUD.error);
  $('cloudDot').classList.toggle('ok', ready && !CLOUD.error && !CLOUD.queue.size && !CLOUD.busy);
  const sel = $('cloudMachine');
  if (sel) {
    const mine = cloudMachineFor(state.unit);
    const names = [...new Set([...CLOUD.machines, ...(mine ? [mine] : [])])];
    sel.innerHTML = `<option value="">${esc(t('cloudMachinePick'))}</option>` +
      names.map((n) => `<option value="${esc(n)}"${n === mine ? ' selected' : ''}>${esc(n)}</option>`).join('');
    sel.disabled = !ready;
  }
  $('cloudText').textContent = !ready ? t('cloudNone')
    : CLOUD.error ? t('cloudError')(CLOUD.error)
    : (CLOUD.busy || CLOUD.queue.size) ? t('cloudQueued')(CLOUD.queue.size || 1)
    : t('cloudOk')(CLOUD.sent, CLOUD.at);
}


async function journal(event, id) {
  if (!FOLDER.ok) return;
  const rec = state.results[id] || {};
  const line = JSON.stringify({ ts: new Date().toISOString(), event, run_id: id, operator: state.operator || null, machine: machineInfo || null,
    verdict: rec.verdict || null, detail: rec.detail || null, values: rec.values || {}, note: rec.note || null,
    measurement: rec.auto ? { status: rec.auto.status, error: rec.auto.error, at: rec.auto.at } : null });
  try { await appendText([], 'journal.jsonl', line + '\n'); }
  catch (e) { log('fail', t('folderError')(e.message)); }
}

async function readRunsFromFolder() {
  let count = 0;
  let runsDir;
  try { runsDir = await FOLDER.handle.getDirectoryHandle('runs'); } catch (e) { return 0; }
  for await (const unitDir of runsDir.values()) {
    if (unitDir.kind !== 'directory') continue;
    for await (const testDir of unitDir.values()) {
      if (testDir.kind !== 'directory') continue;
      for await (const f of testDir.values()) {
        if (f.kind !== 'file' || !f.name.endsWith('.json')) continue;
        try {
          const doc = JSON.parse(await (await f.getFile()).text());
          const mine = state.results[doc.run_id];
          if (mine && (mine.updated || '') >= (doc.updated || '')) continue;
          const { run_id, unit, test_id, run, runs_total, variant, repetition, auto, autos, ...rec } = doc;
          if (auto) rec.auto = { ...auto, samples: mine && mine.auto && mine.auto.at === auto.at ? mine.auto.samples : [] };
          if (autos) {
            rec.autos = Object.fromEntries(Object.entries(autos).map(([k, a]) => [k,
              { ...a, samples: mine && mine.autos && mine.autos[k] && mine.autos[k].at === a.at ? mine.autos[k].samples : [] }]));
            if (rec.auto && rec.autos[rec.auto.kind]) rec.auto = rec.autos[rec.auto.kind];
          }
          state.results[run_id] = rec;
          count++;
        } catch (e) { /* unreadable file: left for the analysis to flag */ }
      }
    }
  }
  return count;
}

async function attachFolder(handle) {
  FOLDER.handle = handle;
  FOLDER.name = handle.name;
  FOLDER.ok = true;
  try { await kv('folder', handle); } catch (e) { /* the folder is just asked for again next time */ }
  try {
    const n = await readRunsFromFolder();
    save();
    Object.keys(state.results).forEach((id) => dirty.add(id));   // what was only in the browser goes to the folder now
    await writeText([], 'README.txt', README);
    await syncNow();
    log('info', t('logFolder')(FOLDER.name, n));
  } catch (e) {
    FOLDER.ok = false;
    log('fail', t('folderError')(e.message));
  }
  renderAll();
}

async function chooseFolder() {
  if (!window.showDirectoryPicker) { alert(t('folderUnsupported')); return; }
  let h;
  try { h = await window.showDirectoryPicker({ id: 'scure-dvt-results', mode: 'readwrite' }); } catch (e) { return; }
  await attachFolder(h);
}

async function reconnectFolder() {
  if (!FOLDER.handle) return chooseFolder();
  try { if (await FOLDER.handle.requestPermission({ mode: 'readwrite' }) === 'granted') await attachFolder(FOLDER.handle); }
  catch (e) { log('fail', t('folderError')(e.message)); }
}

async function restoreFolder() {
  let h;
  try { h = await kv('folder'); } catch (e) { return; }
  if (!h) return;
  FOLDER.handle = h;
  FOLDER.name = h.name;
  let perm = 'prompt';
  try { perm = await h.queryPermission({ mode: 'readwrite' }); } catch (e) { /* unknown: ask */ }
  if (perm === 'granted') await attachFolder(h);
  else renderFolder();
}

function renderFolder() {
  const bar = $('folderBar');
  const lost = !FOLDER.ok && FOLDER.handle;
  bar.classList.toggle('missing', !FOLDER.ok || !!FOLDER.retrying);
  $('folderDot').classList.toggle('ok', FOLDER.ok && !FOLDER.retrying);
  $('folderText').textContent = FOLDER.ok ? (FOLDER.retrying ? t('folderRetrying')(FOLDER.name, FOLDER.retrying) : t('folderOk')(FOLDER.name, FOLDER.savedAt))
    : lost ? t('folderLost')(FOLDER.name) : t('folderNone');
  $('folderReconnectBtn').hidden = !lost;
  $('folderReconnectBtn').textContent = lost ? t('folderReconnect')(FOLDER.name) : '';
}

async function saveReport() {
  if (!FOLDER.ok) { alert(t('folderFirst')); return; }
  const name = `report_${safeName(state.unit)}_${new Date().toISOString().replace(/[-:]/g, '').slice(0, 15)}.txt`;
  try { await writeText(['reports'], name, $('reportText').value); log('info', t('reportSaved')('reports/' + name)); }
  catch (e) { log('fail', t('folderError')(e.message)); }
}

// ---------- wiring ----------
function toggle(set, key, el) {
  if (set.has(key)) set.delete(key); else set.add(key);
  el.classList.toggle('open', set.has(key));
  el.querySelector('[aria-expanded]').setAttribute('aria-expanded', set.has(key));
}

function init() {
  if (!CAT || !CRIT) { $('banner').style.display = 'block'; return; }
  load();
  if (!T[state.lang]) state.lang = 'en';
  if (!CAT.units.some((u) => u.id === state.unit)) state.unit = CAT.units[0].id;
  $('operator').value = state.operator || '';
  if (state.api) $('apiUrl').value = state.api;
  $('cloudUrl').value = cloudCfg().url || '';
  $('cloudKey').value = cloudCfg().key || '';

  DVT_AUTO.attach({                       // everything the automatic runner needs from this page
    base: () => state.api, lang: () => state.lang, connected: () => !!machineInfo, machine: () => machineInfo,
    folderOk: () => FOLDER.ok, operator: () => state.operator.trim(),
    test: (tid) => TESTS[tid], run: (tid) => currentRun(tid), results: () => state.results,
    log, persist, journal, refreshTest, record: recordVerdict, setAuto,
    drawTraces, hasTraceCanvas: (tid) => !!document.querySelector(`canvas[id^="trace-${tid}-"]`),   // live chart: the runner sets its rows and asks for a redraw
    autoMap: () => AUTO, busy: () => Object.values(AUTO).some((x) => x.busy),
  });

  $('unit').addEventListener('change', (e) => { state.unit = e.target.value; save(); renderAll(); autoConnect(); });
  $('machinePick').addEventListener('change', async (e) => {
    if (!e.target.value) return;
    $('apiUrl').value = e.target.value;
    if (await checkConnection(++connGen, state.unit, true)) e.target.hidden = true;
  });
  $('lang').addEventListener('change', (e) => { state.lang = e.target.value; save(); renderAll(); });
  $('operator').addEventListener('input', (e) => { state.operator = e.target.value; save(); });
  $('connectBtn').addEventListener('click', () => checkConnection(++connGen, state.unit, true));
  $('reportBtn').addEventListener('click', () => { $('reportText').value = buildReport(); $('reportModal').classList.add('open'); $('closeBtn').focus(); });
  $('closeBtn').addEventListener('click', () => $('reportModal').classList.remove('open'));
  $('reportModal').addEventListener('click', (e) => { if (e.target === e.currentTarget) e.currentTarget.classList.remove('open'); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('reportModal').classList.remove('open'); });
  $('copyBtn').addEventListener('click', async () => { try { await navigator.clipboard.writeText($('reportText').value); } catch (e) { $('reportText').select(); document.execCommand('copy'); } });
  $('downloadBtn').addEventListener('click', () => download(`scure-dvt-report-${state.unit}-${new Date().toISOString().slice(0, 10)}.txt`, $('reportText').value, 'text/plain'));
  $('folderBtn').addEventListener('click', chooseFolder);
  $('folderReconnectBtn').addEventListener('click', reconnectFolder);
  let machinesTimer = null;
  const cloudEdited = () => { CLOUD.error = ''; save(); renderCloud(); clearTimeout(machinesTimer); machinesTimer = setTimeout(cloudLoadMachines, 800); };
  $('cloudUrl').addEventListener('input', (e) => { cloudCfg().url = e.target.value.trim(); cloudEdited(); });
  $('cloudKey').addEventListener('input', (e) => { cloudCfg().key = e.target.value.trim(); cloudEdited(); });
  $('cloudMachine').addEventListener('change', (e) => cloudSetMachine(e.target.value));
  cloudLoadMachines();
  $('cloudSyncBtn').addEventListener('click', cloudSyncAll);
  $('saveReportBtn').addEventListener('click', saveReport);
  $('clearLogBtn').addEventListener('click', () => { logLines.length = 0; $('logBox').innerHTML = ''; });

  const host = $('phases');
  const activate = (e) => {
    const ph = e.target.closest('[data-phase]');
    if (ph && e.target.closest('.cat-header')) { toggle(openPhases, Number(ph.dataset.phase), $('phase-' + ph.dataset.phase)); return; }
    const head = e.target.closest('.test-head');
    if (head) {
      const tid = head.dataset.test;
      toggle(openTests, tid, $('test-' + tid));
      $('body-' + tid).innerHTML = openTests.has(tid) ? renderBody(tid) : '';
      if (openTests.has(tid)) { drawCharts(tid); drawDecay(tid); drawBench(tid); drawTc08(tid); drawTraces(tid); }
    }
  };
  host.addEventListener('click', (e) => {
    const act = e.target.closest('[data-act]');
    if (act && act.tagName === 'BUTTON') {
      const tid = act.dataset.test;
      if (act.dataset.act === 'prev') { selectedRun[tid] = Math.max(0, (selectedRun[tid] || 0) - 1); refreshTest(tid); }
      if (act.dataset.act === 'next') { selectedRun[tid] = (selectedRun[tid] || 0) + 1; refreshTest(tid); }
      if (act.dataset.act.indexOf('as-') === 0) DVT_AUTO.click(act.dataset.act, tid);   // the automatic runner's own buttons
      if (act.dataset.act === 'record') recordVerdict(tid);
      if (act.dataset.act === 'reopen') reopen(tid);
      if (act.dataset.act === 'auto') runUvSweep(tid);
      if (act.dataset.act === 'auto-abort') abortUvSweep(tid);
      if (act.dataset.act === 'door-auto') runDoorOpenCure(tid);
      if (act.dataset.act === 'tc-start') startTc08(tid);
      if (act.dataset.act === 'tc-stop') stopTc08(tid);
      if (act.dataset.act === 'tc-reread') rereadTc08(tid);
      if (act.dataset.act === 'guided') runGuided(tid, act.dataset.tool);
      if (act.dataset.act === 'bench') runBench(tid);
      if (act.dataset.act === 'bench-stop' && AUTO[tid + ':bench']) AUTO[tid + ':bench'].stop = true;
      if (act.dataset.act === 'guided-stop' && AUTO[tid + ':' + act.dataset.tool]) { AUTO[tid + ':' + act.dataset.tool].stop = true; if (act.dataset.tool === 'uv_off_timing') api('/api/dvt/uv-off/abort', 'POST').catch(() => {}); }
      if (act.dataset.act === 'door-stop' && AUTO[tid]) { AUTO[tid].stop = true; api('/api/uv?on=0', 'POST').catch(() => {}); }
      return;
    }
    if (e.target.closest('.test-body')) return;
    activate(e);
  });
  host.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && (e.target.classList.contains('cat-header') || e.target.classList.contains('test-head'))) { e.preventDefault(); activate(e); }
  });
  host.addEventListener('change', (e) => {
    const el = e.target;
    if (el.dataset.act === 'pick') { selectedRun[el.dataset.test] = Number(el.value); refreshTest(el.dataset.test); return; }
    if (el.dataset.field) {
      setValue(el.dataset.test, el.dataset.field, el.value);
      el.closest('.field').classList.toggle('filled', el.value !== '');
      liveVerdict(el.dataset.test);
    }
  });
  host.addEventListener('input', (e) => {
    const el = e.target;
    if (el.dataset.act === 'note') {
      const run = currentRun(el.dataset.test);
      const rec = state.results[run.id] || (state.results[run.id] = { values: {} });
      rec.note = el.value;
      persist(run.id);
    } else if (el.dataset.field && el.tagName === 'INPUT') {
      setValue(el.dataset.test, el.dataset.field, el.value);
      liveVerdict(el.dataset.test);
    }
  });

  renderAll();
  restoreFolder();
  autoConnect();
}

init();
</script>
</body>
</html>
