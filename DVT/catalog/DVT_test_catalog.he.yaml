# Hebrew display overlay for DVT_test_catalog.yaml (SRS-DVT-194).
#
# This file translates TEXT ONLY. Identifiers never change: test ids, data
# field names, enum values, pass_criteria, equipment `name` (the calibration
# key) — the tool keeps those from the source catalog and shows the Hebrew
# text next to / instead of the English prose.
#
# Lists (safety_plan, preconditions, procedure_steps, equipment, case_matrix)
# are positional and MUST have the same length as the source catalog — the
# loader refuses the overlay otherwise, so a step added in English without
# its Hebrew line is caught at start-up, not on the bench.
#
# catalog_version must match the source catalog.

language: he
catalog_version: "0.25"
subsystems:
  Safety: בטיחות
  Thermal: תרמי
  Electrical: חשמל
  Environmental: סביבתי
  Process: תהליך
  Optical: אופטי

methods:
  Test: בדיקה
  Analysis: ניתוח
  Inspection: סקירה
  Demonstration: הדגמה

roles:
  reference: ייחוס
  standard: רגיל
  destructive: הרסני

rules:
  ALL: כל היחידות
  SINGLE: יחידה אחת
  SUBSET: תת-קבוצה

units:
  UUT-01: {notes: "סקירת SAF-010, מחסנית תוכנה SAF-018"}
  UUT-05: {notes: "THM-004 / SAF-001 / SAF-002 — אחרונה"}

phases:
  0: {name: קליטה וקונפיגורציה, gate: "הקונפיגורציה הוקפאה ונחתמה; כיולי הציוד בתוקף"}
  1: {name: בטיחות חשמלית, gate: "כל בדיקות ELE עברו (PASS)"}
  2: {name: פונקציות הגנה, gate: "כל פונקציות ההגנה PASS או disposition מאושר"}
  3: {name: ביצועים, gate: "הנתונים מלאים"}
  4: {name: שינוע, gate: "בדיקה פונקציונלית אחרי המשלוח PASS"}
  5: {name: הרסני}

tests:

  # ---------------------------------------------------------------- SAFETY
  DVT-SAF-001:
    title: אי-התאמת בורר מתח — בורר על 110 V ברשת 230 V
    purpose: >
      לאמת שהפעלת היחידה כשבורר המתח מכוון ל-110 V בעודה מחוברת לרשת 230 V
      נבלמת על ידי הגנת הענף: נתיך ענף גוף החימום נפתח, התא אינו מתחמם, ולא
      נגרמים שריפה, עשן, נזק למארז או סיכון בחלק נגיש.
    sample_rationale: >
      בדיקת הזרקת-תקלה הרסנית שמעמיסה את חיווט ענף גוף החימום ומכלה התקני
      הגנה. היא מאמתת תכונת תכן של חלוקת ה-AC, הזהה בכל היחידות, ולא משתנה
      בין-יחידתי. מבוצעת על היחידה שיועדה לבדיקות הרסניות.
    safety_plan:
      - הבדיקה מבוצעת כשהיחידה בתוך מתחם עמיד-אש או על שולחן בלתי-דליק, מטף בהישג יד, אין אנשים ברדיוס 2 מ'
      - מתח הרשת מוזן דרך מגען המופעל מרחוק; אף אחד לא נוגע ביחידה כשהיא תחת מתח
      - מצלמה תרמית והקלטת וידאו פועלות לאורך כל הבדיקה
      - ציוד מגן אישי מדורג לקשת חשמלית למפעיל שמחבר את המתח
    equipment:
      - שנאי בידוד / מקור AC מתוכנת, 230 V, ≥3 kVA
      - פרוב זרם + אוסילוסקופ עם לכידת single-shot על ענף גוף החימום
      - מצלמה תרמית
      - נתיכים חלופיים — 0BLF005.T (ענף 5 A), 0215015.MXP (כניסה 15 A)
    preconditions:
      - היחידה בטמפרטורת הסביבה, התא ריק, הדלת סגורה
      - בורר המתח מכוון ל-110 V, מאומת חזותית ומצולם
      - מקור הרשת מכוון ל-230 V נומינלי
      - נתיכים חדשים ומאומתים מותקנים גם במחזיק הכניסה וגם בענף גוף החימום
    procedure_steps:
      - רשום את מספרי החלק של הנתיכים ואת מצב הבורר (צלם את שניהם)
      - חבר את פרוב הזרם סביב מוליך ענף גוף החימום
      - הפעל את היחידה מרחוק ורשום את זרם ההתנעה (inrush) ואת הזרם היציב
      - פקוד על מצב HEAT ליעד 80°C
      - צפה במשך 10 דקות או עד שהנתיך נפתח, המוקדם מביניהם
      - נתק מהמתח, בודד, הנח להתקרר ואז בדוק
      - החלף את הנתיך שנפתח, כוון את הבורר נכון, והרץ חימום פונקציונלי לאישור שאין נזק נלווה

  DVT-SAF-002:
    title: קצר במבוא הרשת — ניתוק על ידי נתיך הכניסה
    purpose: >
      לאמת שקצר במורד נתיך הכניסה מנותק על ידי נתיך הכניסה 15 A בעל השהיה,
      ללא שריפה, התפשטות קשת, נזק לכניסה המסוננת או להדקי החלוקה, וללא סיכון
      למפעיל.
    sample_rationale: >
      בדיקה הרסנית של תכונת תכן המשותפת לכל היחידות. בדיקות תנאי-פעולה חריגים
      לפי EN 62368-1 מבוצעות על דגימה יחידה.
    safety_plan:
      - התקלה מופעלת מרחוק דרך מגען וגשר קצר מוגדר; אין קצר ידני
      - המקור חייב להיות מסוגל לספק את זרם הקצר הצפוי המוצהר; רשום את עכבת המקור בפועל
      - ציוד מגן מלא, תצפית מרחוק, משמר-אש למשך 30 דקות אחרי האירוע
    equipment:
      - מקור AC עם זרם קצר צפוי ידוע
      - גשר קצר עם מגען המופעל מרחוק
      - פרוב זרם רחב-סרט + אוסילוסקופ, single-shot
      - כניסה חלופית Schaffner FN9264-10-06, נתיכי 0215015.MXP חלופיים
    preconditions:
      - היחידה מוזנת מ-230 V נומינלי
      - נקודת התקלה מוגדרת ורשומה
      - רציפות PE מאומתת לפני הבדיקה
    procedure_steps:
      - מדוד ורשום את זרם הקצר הצפוי של המקור ואת התנגדות ה-PE
      - הפעל את היחידה ואשר מצב המתנה תקין
      - הפעל את הקצר מרחוק; לכוד את צורת גל הזרם
      - נתק מהמתח ובדוק את הכניסה, המסנן, ההדקים והחיווט
      - אמת רציפות PE והתנגדות בידוד אחרי האירוע

  DVT-SAF-003:
    title: כשל מאוורר הסחרור של התא בזמן חימום — ניתוק גוף החימום בתוכנה
    purpose: >
      לאמת שאובדן מאוורר הסחרור של גוף החימום מזוהה, שהתוכנה מנטרלת את גוף
      החימום בתוך זמן התגובה הנדרש, מוציאה פקודת כיבוי ומעלה אזעקה למפעיל
      שמזהה את המאוורר. רגע הסרת ההספק מגוף החימום נקרא מהתרמוקפל המודבק
      לגוף החימום (PicoLog TC-08), לא מהתוכנה: הרגע שבו הטמפרטורה שלו הופכת
      מעלייה לירידה הוא ניתוק ההזנה, והזמן מניתוק המאוורר עד לאותו מפנה הוא
      heater_off_time.
    equipment:
      - רשם תרמוקפלים PicoLog TC-08
      - תרמוקפל Type-K מודבק לגוף החימום (אותה הדבקה כמו DVT-SAF-013), נרשם ב-1 Hz
      - תרמוקפל Type-K בתעלת החימום במורד הזרם של האלמנט
      - כבל ביניים (break-out) עם מפסק על הזנת מאוורר הסחרור
    preconditions:
      - תרמוקפלי גוף החימום והתעלה מודבקים ונרשמים ב-TC-08 ב-1 Hz; שעון ה-TC-08 הוא בסיס הזמן לכל הריצה
      - התא מתחמם לכיוון 80°C מטמפרטורת הסביבה עם גוף החימום בהספק מלא (שלב חימום, לא מצב יציב) — גוף החימום חייב להיות בעלייה כשהמאוורר מנותק, כך שהסרת ההספק תיראה כמפנה חד-משמעי מעלייה לירידה בגרף
      - כשל המאוורר מוזרק על ידי פתיחת הזנת המאוורר בכבל הביניים
    procedure_steps:
      - כשגוף החימום בעלייה בגרף ה-TC-08, פתח את הזנת מאוורר הסחרור ורשום את חותמת הזמן של הניתוק בשעון ה-TC-08 (סמן או קריאת שעון)
      - מיומן המכונה, רשום את הזמן מהניתוק עד לזיהוי כשל המאוורר (חותמת הזמן של האזעקה)
      - מגרף גוף החימום, מצא את הרגע שבו הטמפרטורה מפסיקה לעלות ומתחילה לרדת — זהו ניתוק ההזנה של גוף החימום. רשום את heater_off_time כזמן מהניתוק עד לאותו מפנה, ואת השיא שאליו הגיע הגוף ללא זרימת אוויר
      - רשום את טקסט האזעקה וקוד השגיאה שהוצגו למפעיל
      - חבר מחדש את המאוורר ואמת שהאזעקה נמחקת רק אחרי אישור המפעיל; גרף גוף החימום חייב להמשיך לרדת עד אז
      - צרף את יומן ה-TC-08 של הריצה
    field_notes:
      heater_off_time: מהניתוק עד למפנה מעלייה לירידה בתרמוקפל גוף החימום
      heater_body_drop_observed: מפנה ברור מעלייה לירידה נראה בגרף גוף החימום
      detection_time: מהניתוק עד לאזעקה ביומן המכונה

  DVT-SAF-004:
    title: חיישן טמפרטורת גוף החימום מנותק — מעגל פתוח
    purpose: >
      לאמת שחיישן טמפרטורה של גוף החימום במעגל פתוח מזוהה, החימום מנוטרל,
      והמפעיל מונחה לחבר מחדש את החיישן. רגע הסרת ההספק מגוף החימום נקרא
      מהתרמוקפל המודבק לגוף החימום (PicoLog TC-08): הרגע שבו הטמפרטורה שלו
      מתהפכת מעלייה לירידה הוא הניתוק, והזמן מניתוק החיישן עד אותה נקודה
      הוא heater_off_time.
    equipment:
      - רשם תרמוקפלים PicoLog TC-08
      - תרמוקפל מסוג K מודבק לגוף החימום (אותה הדבקה כמו ב-DVT-SAF-013), נרשם ב-1 Hz
      - גישה למחבר החיישן בלי לפתוח תאים תחת מתח
    preconditions:
      - תרמוקפל גוף החימום מודבק ונרשם ב-TC-08 ב-1 Hz; שעון ה-TC-08 הוא בסיס הזמן של כל הריצה
      - התא מתחמם לכיוון 80°C מטמפרטורת הסביבה כשגוף החימום בהספק מלא (שלב החימום, לא מצב יציב) — גוף החימום חייב להיות בעלייה כשמנתקים את החיישן, כך שהסרת ההספק תיראה כהתהפכות ברורה מעלייה לירידה בגרף
    procedure_steps:
      - אוטומטי במכונה - לחץ "התחל". שירות הספסל של ה-DVT במכונה לוקח את ה-TC-08 (התרמוקפל על גוף החימום ב-CH1), מחמם את התא לכיוון 80°C וממתין עד שגוף החימום עולה; אז הוא מבקש ממך לנתק את תרמיסטור גוף החימום. מצב החיישן של המכונה עצמה נותן את רגע הניתוק; הספסל מודד את המפנה של גוף החימום, רושם את האזעקה ואת הטקסט שלה, מנסה פקודת חימום (חייבת להיסרב, הגוף חייב להמשיך לרדת), מבקש ממך לחבר מחדש, ובודק שהחימום לא חוזר לבד. הפעולות הידניות היחידות הן שני החיבורים. הרישום (5 Hz) והגרף נשמרים בתיקיית התוצאות
      - מגרף גוף החימום, מצא את הרגע שבו הטמפרטורה מפסיקה לעלות ומתחילה לרדת — זהו ניתוק ההספק מגוף החימום. רשום את heater_off_time כזמן מניתוק החיישן עד אותה התהפכות, ואת השיא שגוף החימום הגיע אליו
      - רשום את טקסט האזעקה וקוד השגיאה
      - נסה לפקוד שוב על מצב HEAT כשהחיישן מנותק; גרף גוף החימום חייב להמשיך לרדת
      - חבר מחדש ואמת שהפעולה הרגילה מתחדשת רק אחרי אישור
      - צרף את יומן ה-TC-08 של הריצה
    field_notes:
      disconnect_timestamp: שעון ה-TC-08
      heater_body_drop_observed: התהפכות ברורה מעלייה לירידה נראית בגרף גוף החימום
      heater_off_time: מניתוק החיישן עד ההתהפכות מעלייה לירידה בתרמוקפל גוף החימום

  DVT-SAF-005:
    title: חיישן טמפרטורת גוף החימום מוחלף בנגד קבוע 5 kΩ — קריאה סבירה אך קפואה
    purpose: >
      לאמת זיהוי של קריאת טמפרטורה סבירה אך קפואה. נגד קבוע 5 kΩ במקום ה-NTC
      של בקרת החימום (10 kΩ ב-25°C, בטא 3934) קורא 41.5°C קבועים לא משנה מה
      קורה בתא — שום בדיקת טווח לא תתפוס זאת, והוא מביא את גוף החימום להספק
      מלא כל עוד החימום מותר. עם פיקוד HEAT, הבקר חייב להבין תוך 3 דקות
      שהקריאה אינה מגיבה להספק חימום מלא, להוציא שגיאה למשתמש שנוקבת בקריאת
      הטמפרטורה, לכבות את גוף החימום מיידית, ולסרב לכל פקודת HEAT נוספת עד
      שהחיישן תוקן והאזעקה אושרה. המנתק התרמי הבלתי-תלוי (DVT-SAF-013) הוא
      גיבוי, לא הזיהוי.
    equipment:
      - נגד קבוע 5 kΩ, 1%, מותקן בתקע תואם למחבר חיישן בקרת החימום
      - רשם תרמוקפלים PicoLog TC-08
      - תרמוקפל ייחוס בלתי-תלוי בתא, בסמוך למיקום חיישן הבקרה
      - תרמוקפל מסוג K מודבק לגוף החימום (ההדבקה של DVT-SAF-013) — לחותמת זמן של כיבוי גוף החימום
    preconditions:
      - היחידה מנותקת ממתח; NTC בקרת החימום מנותק והנגד הקבוע 5 kΩ מחובר במקומו; החיבור מצולם
      - תרמוקפל הייחוס (תא) ותרמוקפל גוף החימום נרשמים ב-TC-08 ב-1 Hz; שעון ה-TC-08 הוא בסיס הזמן
      - היחידה בטמפרטורת הסביבה, התא ריק, הדלת סגורה
      - המנתק התרמי הבלתי-תלוי שלם וללא שינוי (גיבוי בלבד)
    procedure_steps:
      - הפעל. רשום את הטמפרטורה שהבקר מציג עם הנגד הקבוע (צפוי כ-41.5°C) ואת טמפרטורת התא האמיתית מתרמוקפל הייחוס
      - פקוד HEAT ל-80°C והתחל את הטיימר על שעון ה-TC-08
      - כל 30 שניות רשום את הקריאה המוצגת, את הספק גוף החימום ואת טמפרטורת הייחוס. רשום אם הקריאה המוצגת השתנתה בכלל בעוד הייחוס עלה
      - רשום את האזעקה — הזמן מפקודת ה-HEAT עד האזעקה, טקסט האזעקה (חייב לומר שקריאת הטמפרטורה היא הבעיה) וקוד השגיאה
      - מגרף גוף החימום, אשר שגוף החימום כבה ברגע האזעקה — רשום את הזמן מהאזעקה עד ההתהפכות מעלייה לירידה בתרמוקפל גוף החימום
      - רשום את טמפרטורת התא האמיתית המרבית שהושגה (תרמוקפל הייחוס) ואם המנתק התרמי נאלץ לפעול
      - כשהנגד הקבוע עדיין מחובר, אשר את האזעקה ופקוד HEAT שוב — החימום חייב להידחות והתקלה חייבת לדווח שוב
      - נתק ממתח, החזר את ה-NTC, אשר, ואמת חימום רגיל ל-80°C
      - צרף את יומן ה-TC-08 ואת יומן המכונה של הריצה
    field_notes:
      displayed_temp_fixed: מה שהבקר מציג עם 5 kΩ מחובר — כ-41.5°C
      heat_command_timestamp: שעון ה-TC-08
      time_to_alarm: מפקודת ה-HEAT
      heater_off_at_alarm: התהפכות מעלייה לירידה בתרמוקפל גוף החימום ברגע האזעקה
      heater_off_delay: מהאזעקה עד ההתהפכות בגוף החימום
      max_chamber_temp: תרמוקפל הייחוס

  DVT-SAF-007:
    title: תרמיסטור LED מנותק — מעגל פתוח
    purpose: >
      לאמת שתרמיסטור LED במעגל פתוח מזוהה, שהזנת ה-LED מנוטרלת, ושהאזעקה
      מזהה איזה חיישן חסר - עבור כל אחד מארבעת תרמיסטורי ה-LED בתורו (ימין,
      שמאל, אחור, דלת), בריצה אחת, כשכל ניתוק מעלה אזעקה משלו שמזהה את החיישן.
    equipment:
      - מד הספק Ophir StarBright עם ראש פוטודיודה ל-UV (למשל PD300-UV)
      - מתקן אחיזה לראש החיישן בפתח הדלת, מופנה אל הלדים
    preconditions:
      - היחידה מוכנה למצב CURE, אין אזעקה פעילה
      - ה-Ophir StarBright מחובר ל-USB של המכונה וראש ה-UV ממוקם בפתח הדלת, מופנה אל הלדים, הדלת סגורה
      - ארבעת מחברי תרמיסטורי ה-LED נגישים כשהדלת סגורה והלדים דולקים (כבלי הארכה במידת הצורך), כך שאפשר לשלוף אחד באמצע קיור
    procedure_steps:
      - הרנר עובר על ארבעת תרמיסטורי ה-LED בתורם - ימין, שמאל, אחור, דלת. עבור כל אחד הוא מבקש ממך לנתק רק את החיישן הזה, ממתין שהמכונה תדווח שהוא חסר ובודק ששלושת האחרים עדיין קוראים
      - כשהחיישן הזה מנותק, הרנר מנסה להתחיל קיור - הוא חייב להידחות
      - מדידה מכשירית — הרנר מבקש ממך לחבר בחזרה, מעלה את הלדים למקסימום, ממתין לקריאה יציבה ב-StarBright, מבקש ממך לשלוף את אותו מחבר, ומודד מתי עוצמת הקרינה יורדת מתחת ל-10% מהמישור. led_off_time הוא האיטי מבין הארבעה
      - האזעקה של המכונה לכל ניתוק נקראת וחייבת לזהות את החיישן הזה - ארבעה חיישנים, ארבע אזעקות תואמות. הרנר ממתין שכל אזעקה תתנקה (אשר אותה על המסך אם מתבקש) לפני החיישן הבא, כך שאזעקה של חיישן אחד לא תיזקף לחיישן אחר
    field_notes:
      positions_tested: החיישנים שנבדקו בריצה הזו, לפי הסדר - ימין, שמאל, אחור, דלת
      cure_start_inhibited: נכון רק אם הקיור נדחה עם כל אחד מארבעת החיישנים מנותק
      led_off_time: האיטי מבין הארבעה - מהניתוק עד עוצמת קרינה מתחת ל-10% מהמישור ב-StarBright
      alarm_raised: אזעקה לכל אחד מארבעת הניתוקים
      alarm_identifies_sensor: כל אזעקה זיהתה את החיישן שנותק בפועל
      error_right: השגיאה שהמכונה העלתה כשתרמיסטור הימין מנותק - קוד וטקסט
      error_left: השגיאה שהמכונה העלתה כשתרמיסטור השמאל מנותק - קוד וטקסט
      error_back: השגיאה שהמכונה העלתה כשתרמיסטור האחור מנותק - קוד וטקסט
      error_door: השגיאה שהמכונה העלתה כשתרמיסטור הדלת מנותק - קוד וטקסט
  DVT-SAF-008:
    title: כשל מאוורר קירור LED — חסימת התחלת עבודה וזיהוי המאוורר
    purpose: >
      לאמת שמאוורר קירור LED שאינו פועל מונע התחלת עבודה, עוצר עבודה פעילה,
      ומייצר שגיאה ששמה את המאוורר הספציפי - עבור כל אחד מארבעת מאווררי ה-LED
      בתורו (ימין, שמאל, אחור, דלת), בריצה מודרכת אחת: הרנר מבקש לנתק מאוורר
      אחד, בודק שהמכונה דוחה את העבודה ומזהה את המאוורר, מבקש לחבר אותו בחזרה,
      חוזר על הניתוק כשהלדים דולקים, ועובר למאוורר הבא.
    preconditions:
      - היחידה מוכנה למצב CURE, כל המאווררים פועלים בהתחלה, אין אזעקה פעילה
      - ארבעת מחברי מאווררי ה-LED נגישים כשהדלת סגורה והלדים דולקים
    procedure_steps:
      - הרנר עובר על ארבעת מאווררי ה-LED בתורם - ימין, שמאל, אחור, דלת. עבור כל אחד הוא מבקש ממך לנתק רק את המאוורר הזה
      - כשהמאוורר הזה מנותק, הרנר מנסה להתחיל קיור - הוא חייב להידחות
      - האזעקה של המכונה למאוורר הזה נקראת וחייבת לזהות אותו - שגיאה אחת לכל מאוורר, נרשמת לפי צד. אתה מחבר את המאוורר בחזרה ומאשר את האזעקה; הרנר ממתין שהיא תתנקה לפני שהוא ממשיך
      - הלדים עולים למקסימום, אתה מנתק שוב את אותו מאוורר, והרנר מודד מתי הלדים כבים. led_off_time_midjob הוא האיטי מבין הארבעה
      - ארבע טמפרטורות הפאנלים נרשמות לאורך כל הריצה ומוצגות בזמן אמת; max_led_temp הוא החם ביותר שפאנל כלשהו הגיע אליו
    field_notes:
      positions_tested: המאווררים שנבדקו בריצה הזו, לפי הסדר - ימין, שמאל, אחור, דלת
      job_start_inhibited: נכון רק אם הקיור נדחה עם כל אחד מארבעת המאווררים מנותק
      alarm_raised: אזעקה לכל אחד מארבעת המאווררים
      alarm_identifies_correct_fan: כל אזעקה זיהתה את המאוורר שנותק בפועל
      error_right: השגיאה שהמכונה העלתה כשמאוורר הימין מנותק - קוד וטקסט
      error_left: השגיאה שהמכונה העלתה כשמאוורר השמאל מנותק - קוד וטקסט
      error_back: השגיאה שהמכונה העלתה כשמאוורר האחור מנותק - קוד וטקסט
      error_door: השגיאה שהמכונה העלתה כשמאוורר הדלת מנותק - קוד וטקסט
      led_off_time_midjob: האיטי מבין הארבעה - מניתוק המאוורר עד כיבוי הלדים
      max_led_temp: הטמפרטורה הגבוהה ביותר שפאנל LED כלשהו הגיע אליה בריצה
  DVT-SAF-009:
    title: כשל מאוורר קירור התא — חסימת התחלת עבודה וזיהוי המאוורר
    purpose: >
      לאמת שמאוורר קירור / יניקה של התא שאינו פועל מונע התחלת עבודה, עוצר
      עבודה פעילה ומייצר שגיאה ששמה את המאוורר.
    preconditions:
      - היחידה מוכנה למחזור קיור או קירור
    procedure_steps:
      - נטרל את מאוורר קירור התא (מנותק, ואז רוטור חסום)
      - נסה להתחיל עבודת ייבוש - המכונה בודקת את מאוורר קירור התא לפני כל שלב ייבוש וקירור (לא לפני חימום או UV), ולכן זו ההתחלה שחייבת להידחות
      - רשום את הודעת השגיאה ואשר שהיא שמה את המאוורר הנכון
      - הזרק את הכשל במהלך מחזור קירור פעיל

    field_notes:
      job_start_inhibited: עבודת ייבוש נדחתה כשמאוורר קירור התא מושבת
  DVT-SAF-010:
    title: הצגת אזעקות תקלה — סקירת כיסוי ובהירות
    purpose: >
      לאמת שכל מצב תקלה שהופעל ב-DVT-SAF-003 עד -009 מייצר קוד שגיאה ייחודי,
      הודעה ששמה את הרכיב הפגוע, והנחיה למפעיל להתאוששות, באופן עקבי בממשק
      המשתמש וביומן.
    sample_rationale: >
      טקסט האזעקות וקודי השגיאה הם תכונות תוכנה זהות בכל היחידות. סקירה יחידה
      מול מרשם השגיאות המרכזי מספיקה.
    procedure_steps:
      - אסוף את קודי השגיאה וההודעות שנרשמו ב-SAF-003 עד SAF-009
      - הצלב כל אחד מהם מול מרשם השגיאות המרכזי
      - אמת שכל הודעה שמה את הרכיב ומציינת את פעולת ההתאוששות
      - אמת שכל אירוע מופיע ביומן הקבוע עם חותמת זמן

  DVT-SAF-011:
    title: אי-התאמת בורר מתח — בורר על 220 V ברשת 110 V (תת-הספק)
    purpose: >
      לאמת את הכיוון השפיר של אי-התאמת הבורר. כשהבורר על 220 V ומוזן 110 V,
      גוף החימום רואה חצי מתח ובערך רבע מההספק הנקוב. שום התקן הגנה לא פועל
      ודבר לא ניזוק — הכשל הוא תת-ביצוע שקט. יש לאמת שהמערכת מזהה זאת
      ומתריעה במקום לחמם ללא הגבלה, ולתעד את התנהגות החימום הנובעת בכל חמש
      היחידות.
    equipment:
      - מקור AC מתוכנת או ואריאק מכוון ל-110 V
      - מד True-RMS בכניסה
      - מד צבת על ענף גוף החימום
      - תרמוקפל ייחוס בתא
    preconditions:
      - היחידה בטמפרטורת הסביבה, התא ריק, הדלת סגורה
      - בורר המתח מכוון ל-220 V, מאומת חזותית ומצולם
      - מקור הרשת מכוון ל-110 V נומינלי, נמדד ורשום
      - נתיכי הכניסה וענף גוף החימום מאומתים שלמים לפני הריצה
    procedure_steps:
      - רשום את מצב הבורר ואת מתח הכניסה שנמדד
      - הפעל ואשר שהיחידה עולה כרגיל
      - פקוד HEAT לנקודת היעד והתחל את הטיימר
      - רשום את זרם ענף גוף החימום וחשב את ההספק המסופק
      - רשום את טמפרטורת התא במשך 60 דקות או עד שנקודת היעד מושגת, המוקדם מביניהם
      - רשום אם הועלתה אזעקה, מתי, ומה היא אומרת
      - אשר ששום התקן הגנה לא פעל ולא נגרם נזק
      - שחזר את הקונפיגורציה הנכונה ואמת חימום תקין
    field_notes:
      heat_up_time: null אם נקודת היעד אינה מושגת כלל
      plateau_temp: היכן שהספק גוף החימום שווה להפסדי התא

  DVT-SAF-012:
    title: מנעול בטיחות דלת — UV חסום כשהדלת פתוחה
    purpose: >
      לאמת ש-UV אינו יכול להיות מופעל כשהדלת פתוחה, שפתיחת הדלת במהלך קיור
      מסירה את ה-UV בתוך הזמן הנדרש, ושאי אפשר לעקוף את מנעול הבטיחות
      באמצעים רגילים.
    equipment:
      - מד הספק Ophir StarBright עם ראש פוטודיודה ל-UV (למשל PD300-UV)
      - מתקן אחיזה לראש החיישן בפתח הדלת, מופנה אל הלדים
    safety_plan:
      - משקפי מגן ל-UV לכל מי שנמצא ליד פתח הדלת בשלב 1 - אם מנעול הבטיחות נכשל הלדים נדלקים כשהדלת פתוחה (הניסיון ב-30% והלדים מקבלים פקודת כיבוי ברגע שנראה UV)
    preconditions:
      - היחידה מוכנה למצב CURE, אין תהליך פעיל
      - ה-Ophir StarBright מחובר ל-USB של המכונה לשלב 1 (לקונסולת ה-DVT, StarLab USB או טורי, לשלב 2) וראש ה-UV ממוקם בפתח הדלת, מופנה אל הלדים
    procedure_steps:
      - אוטומטי - לחץ "התחל" ופתח את הדלת כשתתבקש. המכונה מזהה את פתיחת הדלת בחיישן שלה, ה-StarBright לוקח קריאת חושך, ואז המכונה מנסה להתחיל קיור פעמיים כשהדלת פתוחה - כמו שמפעיל היה עושה (תוכנית 405 ננומטר ב-30%) וכפקודת UV ישירה - בזמן שה-StarBright צופה בפתח הדלת במשך 5 שניות. UV שהחיישן רואה (יותר מ-0.5 mW/cm2 מעל קריאת החושך), או התחלה שהמכונה מקבלת, מכשילים את השלב; הלדים מקבלים פקודת כיבוי מיד. הדלת חייבת להישאר פתוחה לאורך כל השלב, אחרת חוזרים על הריצה
      - אוטומטי, StarBright במכונה - לחץ "התחל". המכונה לוקחת קריאת חושך ומריצה תוכנית קיור אמיתית ב-405 ננומטר ו-100% עד שה-StarBright יציב; ואז פתח את הדלת בעצמך כשה-UV דולק (המכונה לא שולחת פקודת פתיחת דלת - הפקודה הזאת מכבה קודם את ה-UV). המכונה דוגמת את חיישן הדלת ואת ה-StarBright ב-20 Hz בשעון שלה עד שהקריאה חוזרת לאפס (רמת החושך), וממשיכה לצפות 15 שניות באזעקה; UV שעדיין מעל 10% 12 שניות אחרי פתיחת הדלת נכבה על ידי הריצה והשלב נכשל. uv_off_time = מפתיחת הדלת עד שהקריאה מתחת ל-10% מהמישור; uv_zero_time = מפתיחת הדלת עד אפס. גרף העוצמה מול הזמן (פתיחת הדלת ב-t = 0) וה-CSV הגולמי נשמרים בתיקיית התוצאות. (קונסולת ה-DVT מודדת אותו דבר עם המד מחובר למחשב.)
      - אוטומטי - לחץ "התחל". המכונה מריצה קיור ב-405 ננומטר ו-30% כשהדלת סגורה ונעולה; כשה-UV דולק, משוך את הדלת בחוזקה 10 שניות לפי ההנחיה. lock_engaged = חיישן הדלת לא דיווח שהדלת נפתחה בזמן שה-UV דלק (משקפי מגן ל-UV)
      - אוטומטי - לחץ "התחל". המכונה משחררת את הדלת; פתח אותה והשאר אותה פתוחה, ואז הצמד את המגנט הידני לחיישן הדלת מבחוץ 10 שניות לפי ההנחיה. defeat_by_magnet_possible = חיישן הדלת דיווח שהדלת סגורה בזמן שהייתה פתוחה עם המגנט. בשלב הזה לא מנסים להדליק UV
      - אוטומטי - לחץ "התחל" ופעל לפי ההנחיות (סגור, פתח, סגור, החזק את הדלת סגורה). הדף בודק ש-DOOR_STATUS (GPIO27) עוקב אחרי כל תנועה אמיתית של הדלת, ושהמפעיל היחיד של המכונה על הדלת - שחרור המנעול - לא משנה את הקריאה כשהדלת מוחזקת סגורה
      - אוטומטי - לחץ "קרא" אחרי שלב 2. האזעקה וקוד השגיאה נלקחים ממה שהמכונה דיווחה כשהדלת נפתחה במהלך הקיור של שלב 2 - מצב הסיום והקוד של התוכנית, התראות חדשות של המכונה, התראות המסך ונעילת ביטול-הדלת (6016)
    field_notes:
      door_open_detected: חיישן הדלת של המכונה דיווח שהדלת פתוחה לפני הניסיון ועדיין פתוחה אחריו
      cure_start_refused: המכונה סירבה להתחיל תוכנית 405 ננומטר כשהדלת פתוחה (הדרך של המפעיל)
      uv_command_refused: המכונה סירבה לפקודת UV ישירה כשהדלת פתוחה
      uv_detected: ה-StarBright קרא יותר מ-0.5 mW/cm2 מעל קריאת החושך במהלך הניסיון (סף CONFIRM)
      uv_peak_above_dark: הקריאה הגבוהה ביותר של ה-StarBright במהלך הניסיון פחות קריאת החושך
      cure_start_inhibited: פתיחת הדלת זוהתה וגם שתי ההתחלות סורבו וגם לא נראה UV
      uv_zero_time: מפתיחת הדלת עד שה-StarBright חוזר לרמת החושך (חושך + המקסימום מבין 0.5% מהרמה הדולקת, 3 סטיות תקן של רעש החושך ו-0.01 mW/cm2) למשך 0.5 שניות

  DVT-SAF-013:
    title: מנתק תרמי בלתי-תלוי — טמפרטורת וזמן הניתוק בחימום רציף ללא מגבלה
    purpose: >
      לאמת את המנתק התרמי החומרתי, שאינו תלוי בבקר, בתנאי שלשמו הוא קיים: גוף
      החימום מוזן ברציפות כששום דבר מלבד המנתק לא יכול לעצור אותו. גוף החימום
      מוזן מהזנה חיצונית לאורך כל הריצה — המכונה לא יכולה להניע אותו בלי נקודת
      יעד, ושום מגבלת תוכנה שלה לא משתנה — וה-TC-08 על גוף החימום רושם את הריצה.
      שלושה מספרים יוצאים מהרישום הזה: כמה זמן הגוף טיפס עד שהמנתק נפתח,
      באיזו טמפרטורה הוא נפתח, ובאיזו טמפרטורה הוא נסגר שוב. הרישום עצמו הוא
      התוצר הרביעי.
    safety_plan:
      - גוף החימום מובא בכוונה מעבר לטווח הרגיל שלו כששום דבר מלבד המנתק לא עוצר אותו. משמר-אש לאורך כל הריצה, מטף בהישג יד, אף אחד לא עוזב את השולחן כשההזנה פועלת
      - תקרת עצירה ידנית — מגבלה אנושית — אם תרמוקפל גוף החימום חוצה 250°C (CONFIRM לפי דירוגי גוף החימום והבידוד) והמנתק לא נפתח, נתק את ההזנה במגען. זה FAIL של המנתק ונרשם ככזה
      - אל תפתח את הדלת עד שהתא מתחת ל-60°C; משטחים חמים בפנים — כפפות לכל מגע עם תעלת החימום
    equipment:
      - רשם תרמוקפלים PicoLog TC-08
      - תרמוקפל מסוג K מודבק לגוף החימום ליד המנתק התרמי (דבק לטמפרטורה גבוהה או קלמרה, במגע תרמי בסמוך למנתק — לא על האלמנט)
      - הזנה חיצונית לגוף החימום עם מגען רשת המופעל מרחוק (מניעה את גוף החימום לאורך כל הריצה; המגען הוא העצירה הידנית)
    preconditions:
      - גוף החימום מוזן מהזנה חיצונית לאורך כל הריצה. המכונה לא מפקדת חימום וכל מגבלות התוכנה שלה נשארות במקומן — היא לא יכולה להניע את גוף החימום בלי נקודת יעד, ושום דבר בה לא משתנה לבדיקה הזו. המנתק חייב להיות ההתקן היחיד שיכול לעצור את החימום
      - מנעול בטיחות הדלת והגנות ה-LED נשארים שלמים; UV כבוי לאורך כל הריצה
      - התרמוקפל מודבק לגוף החימום ליד המנתק, ב-CH1 של ה-TC-08; המיקום מצולם
      - היחידה בטמפרטורת הסביבה, התא ריק, הדלת סגורה — והרישום מתחיל לפני ההזנה, כדי שהעקומה תכיל את כל הטיפוס
      - מאוורר גוף החימום פועל לאורך כל הריצה — הדף מדליק אותו לפני תחילת הרישום ומסרב להתחיל אם הוא לא מסתובב
    procedure_steps:
      - קרא את טמפרטורת הניתוק הנקובה של המנתק מהסימון / הדאטהשיט והדבק את התרמוקפל ליד המנתק ב-CH1 (צלם)
      - חבר את ה-TC-08 ל-USB של המכונה. הדף בודק שהמכונה רואה את ה-TC-08 וקריאה אמינה ב-CH1 — גשוש הרבה מעל נקודת הייחוס של ה-TC-08 עצמו כששום דבר לא פועל הוא מנותק, לא חם — מדליק את מאוורר גוף החימום, ומאפשר "התחל". לחץ "התחל" כשהגוף עדיין בטמפרטורת הסביבה, לפני ההזנה — המכונה רושמת את CH1, את התא ואת פיקוד החימום שלה עצמה לאורך כל הריצה
      - הנע את גוף החימום ברציפות מההזנה החיצונית. המכונה לא יכולה לעשות את זה — כל פקודות החימום שלה דורשות נקודת יעד ונעצרות ב-80°C — ומגבלות התוכנה שלה נשארות במקומן. אל תפסיק ואל תצמצם את ההזנה עד שהמנתק נפתח
      - השאר את ההזנה פועלת. הרישום נעצר מעצמו ברגע שהגוף מטפס פעם שנייה אחרי הניתוק (המנתק נסגר שוב), או 20 דקות אחרי הניתוק אם זה לא קורה; ואז הדף קורא את העקומה — זמן עד הניתוק, טמפרטורת הניתוק, טמפרטורת הסגירה מחדש — מצייר את הגרף ורושם את התוצאה
    field_notes:
      rated_trip_temp: מהסימון / הדאטהשיט של המנתק — הערך היחיד שמוקלד, הייחוס שהניתוק נשפט מולו
      time_to_trip: מרגע שגוף החימום מתחיל לטפס עד פתיחת המנתק, נקרא מעקומת CH1
      cutout_trip_temp: גוף החימום ליד המנתק ברגע הפתיחה, TC-08
      reset_temp: גוף החימום כשהמנתק נסגר שוב והגוף התחיל טיפוס שני; ריק אם לא קרה בתוך הרישום
      graph_attached: עקומת CH1 והתא עם הניתוק והסגירה מחדש מסומנים — מצוירת בדף, נשמרת כ-CSV
  DVT-SAF-014:
    title: watchdog של הבקר ואובדן heartbeat
    purpose: >
      לאמת שאובדן ה-heartbeat של הבקר מנתק את ה-SSR-ים דרך חומרה, ללא תלות
      בתוכנה, ומכסה תקיעת בקר, קריסת תהליך ואובדן יישום הבקרה. ההוכחה שההספק
      באמת הוסר מגיעה מהיציאות, לא מהבקר: תרמוקפל גוף החימום (PicoLog TC-08)
      שהופך מעלייה לירידה עבור ה-SSR של גוף החימום, וגרף העוצמה של
      Ophir StarBright שקורס עבור ה-SSR-ים של הלדים.
    equipment:
      - רשם תרמוקפלים PicoLog TC-08
      - תרמוקפל Type-K מודבק לגוף החימום (אותה הדבקה כמו DVT-SAF-013), נרשם ב-1 Hz
      - מד הספק Ophir StarBright עם ראש פוטודיודה ל-UV (למשל PD300-UV)
      - אמצעי לעצירת ה-heartbeat ולהריגת תהליך הבקרה
    preconditions:
      - תרמוקפל גוף החימום נרשם ב-TC-08 ב-1 Hz וראש ה-Ophir בפתח הדלת, מופנה אל הלדים; שעון ה-TC-08 הוא בסיס הזמן לכל הריצה
      - גוף החימום בהספק מלא (שלב חימום) במקרי החימום, כך שהגוף בעלייה כשה-heartbeat נעצר; UV במקסימום במקרי הקיור
      - גישה לאות ה-heartbeat ולהזנת ה-SSR לניטור
    procedure_steps:
      - כשגוף החימום בעלייה בגרף ה-TC-08, עצור את ה-heartbeat ורשום את חותמת הזמן ב-TC-08; מהגרף מצא את הרגע שבו הטמפרטורה מפסיקה לעלות ומתחילה לרדת — זהו ניתוק ה-SSR של גוף החימום. ssr_off_time הוא הזמן מהעצירה עד לאותו מפנה
      - חזור עם UV במקסימום; ssr_off_time_uv הוא הזמן מעצירת ה-heartbeat עד שקריאת ה-Ophir יורדת מתחת ל-10% מהמישור שלה
      - חזור על ידי הריגת תהליך הבקרה במקום עצירת ה-heartbeat ישירות, וקרא את אותם גרפים
      - אמת שההתאוששות דורשת הפעלה מחדש מפורשת, לא אוטומטית; גרף גוף החימום חייב להמשיך לרדת עד אז
      - אמת שהאירוע נרשם ביומן עם קוד שגיאה נפרד
      - צרף את יומן ה-TC-08 ואת גרף ה-Ophir של הריצה
    field_notes:
      ssr_off_time: מעצירת ה-heartbeat עד למפנה מעלייה לירידה בתרמוקפל גוף החימום
      ssr_off_time_uv: מעצירת ה-heartbeat עד שהעוצמה יורדת מתחת ל-10% מהמישור בגרף ה-Ophir
      heater_body_drop_observed: מפנה ברור מעלייה לירידה נראה בגרף גוף החימום
      uv_drop_observed: גרף ה-Ophir קורס

  DVT-SAF-015:
    title: אובדן הקישור לבקר במהלך חימום (כבל 40 פין של ה-CM5) וחזרתו
    purpose: >
      לאמת שה-SSR של ההיטר כבה כשה-CM5 מאבד את הקישור לכרטיס ה-IO במהלך חימום,
      ושהחימום ופליטת ה-UV לא מתחדשים מעצמם כשהקישור חוזר. ריצה אחת.
    equipment:
      - רשם תרמוקפלים PicoLog TC-08
      - תרמוקפל Type-K מודבק לגוף החימום (אותה הדבקה כמו DVT-SAF-013), נרשם ב-1 Hz
    preconditions:
      - היחידה במנוחה, אין התראה פעילה; תרמוקפל גוף החימום ב-CH1 של ה-TC-08
      - כבל הפלט 40 פין של ה-CM5 לכרטיס ה-IO נגיש כשהיחידה פועלת
    procedure_steps:
      - הרנר מדליק חימום (50 C) וממתין עד שגוף החימום עולה בבירור בתרמוקפל
      - נתק את כבל הפלט 40 פין של ה-CM5 כשתתבקש; הרנר מודד מאותו רגע מתי גוף החימום עובר מעלייה לירידה
      - ענה האם ה-SSR של ההיטר כבה
      - חבר בחזרה את הכבל כשתתבקש; ברגע שהמכונה עונה שוב הרנר צופה 2.5 דקות - החימום וה-UV לא יתחדשו מעצמם וגוף החימום ימשיך לרדת (בלי עלייה חדשה)
      - הרנר בודק שהתצורה ויומן המכונה שרדו
    field_notes:
      heater_ssr_switched_off: תשובת המפעיל - האם ה-SSR של ההיטר כבה אחרי ניתוק הכבל
      heater_off_time: נמדד - מניתוק הכבל עד שגוף החימום עובר מעלייה לירידה (TC-08 CH1)
      heater_temp_peak: שיא גוף החימום אחרי ניתוק הכבל
      heater_body_stays_falling: אין עלייה חדשה בתרמוקפל גוף החימום במשך 2 דקות אחרי חזרת הקישור
  DVT-SAF-016:
    title: פליטת UV מחוץ למארז
    purpose: >
      לאמת שה-UV הבורח מהמארז הסגור נמוך ממגבלת החשיפה למפעיל העומד ליד המכונה
      יום עבודה מלא.
    equipment:
      - מד UV מסוג Ophir StarBright המחובר ל-USB של המכונה, מכוון ל-405 nm על ידי הרנר
    preconditions:
      - הלדים בהזנה מרבית ב-405 nm, הדלת סגורה ונעולה
      - החדר הוחשך למניעת תרומת אור סביבה (הרנר קורא קודם את החדר החשוך)
    procedure_steps:
      - כשהלדים במקסימום ב-405 nm, סרוק עם ראש המד את תפר הדלת, קו הצירים, הדמפר, פתחי האוורור, כניסות הכבלים וכל חיבור פאנל כשראש המד צמוד למקור האור; הרנר דוגם את המד ב-4 הרץ ושומר את המקסימום
      - החזק את ראש המד בעמדת המפעיל בחזית המכונה; הרנר ממצע את המד במשך 10 שניות
      - חשב את משך החשיפה היומי המותר ברמה שנמדדה לפי מגבלת UV-A לעין בתקן IEC 62471 / EN 62471 סעיף 4.3.5

  DVT-SAF-017:
    title: מנעול בטיחות מנוטרל, מנותק או מעוקף
    purpose: >
      לאמת שהמערכת נכשלת לכיוון הבטוח כששרשרת מנעול הבטיחות אינה שלמה.
      DVT-SAF-012 מכסה את המקרה הרגיל של דלת פתוחה. בדיקה זו מכסה את המקרים
      החריגים: חיישן מנעול הבטיחות מנותק, השרשרת מקוצרת, וכל עקיפת שירות
      מכוונת.
    preconditions:
      - היחידה מוכנה ל-CURE ול-HEAT
      - גישה למחבר חיישן הדלת ולשרשרת מנעול הבטיחות
    procedure_steps:
      - נתק את חיישן הדלת. נסה להתחיל קיור ומחזור חימום
      - נתק את החיישן במהלך קיור פעיל ורשום את הזמן עד הסרת ה-UV
      - קצר את שרשרת מנעול הבטיחות לסימולציית חיישן מעוקף, דלת פתוחה. נסה להתחיל קיור
      - אמת שנתיב אפשור ה-SSR החומרתי, ולא רק התוכנה, נשבר כשהשרשרת פתוחה — מדוד בהזנת ה-SSR כשהבקר פוקד על מוצא
      - אם קיימת עקיפת שירות, אמת שהיא דורשת כלי או הרשאה, מוגבלת בזמן, נרשמת ביומן, בלתי אפשרית מממשק המשתמש הרגיל, ומסומנת בבירור כשהיא פעילה
      - אמת שאחרי כל תקלת מנעול בטיחות המערכת דורשת אישור מפעיל מפורש לפני החידוש

  DVT-SAF-018:
    title: כשל מחסנית התוכנה — תגובת גוף החימום וה-UV לכל שכבה
    purpose: >
      לאמת שגוף החימום וה-LED-ים מוסרים בכשל של כל שכבה במחסנית התוכנה,
      ושההגנה אינה תלויה בשכבה שנכשלה. DVT-SAF-014 מאמת את נתיב ה-heartbeat
      עצמו; בדיקה זו מפעילה את הדרכים הריאליסטיות שבהן המחסנית באמת נכשלת.
    sample_rationale: >
      מחסנית התוכנה זהה בכל היחידות, ולכן זו תכונת תכן ולא משתנה בין-יחידתי.
      כיסוי פר-יחידה של אותה הגנה ניתן על ידי DVT-SAF-014, שרץ על כל החמש.
    case_matrix:
      - הרוג רק את תהליך ממשק ה-React
      - הרוג רק את תהליך ה-API
      - הרוג את דמון הבקרה
      - השהה את הדמון (SIGSTOP) — תהליך תקוע שמחזיק את הידיות שלו
      - כפה הקפאה ברמת מערכת ההפעלה או kernel panic
      - כפה מערכת קבצים לקריאה בלבד או הסר את האחסון
      - הפרע לאפיק ה-I2C אל מרחיב ה-IO ובקר ה-PWM
    preconditions:
      - היחידה פועלת ב-70°C ב-HEAT, ובנפרד עם UV פעיל ב-CURE
      - גישת קונסולה להזרקת כל כשל
      - מכשור על הזנת ה-SSR ועל גוף החימום
    procedure_steps:
      - הזרק את מצב הכשל של המקרה הזה. רשום את מצב גוף החימום וה-UV, את זמן התגובה ומה המכונה מציגה
      - אמת שאין חידוש אוטומטי של חימום או UV בהתאוששות, ושהאירוע נרשם ביומן עם קוד נפרד

  DVT-SAF-019:
    title: קירור LED מוחלש — זיהוי, זיהוי צד ובידוד תקלה
    purpose: >
      לאמת שאובדן הדרגתי של קירור ה-LED מזוהה לפני שמגבלת טמפרטורת ה-LED
      נחצית, שהאזעקה מזהה את הצד הפגוע, ושהודעת האבחון משקפת נכונה מה המערכת
      באמת יכולה ואינה יכולה לדעת על איזה מאוורר נכשל.
    case_matrix:
      - "מקרה A: מאוורר מנוטר מוחלש, הצד החם ביותר"
      - "מקרה B: מאוורר לא-מנוטר מוחלש, ימין"
      - "מקרה B: מאוורר לא-מנוטר מוחלש, שמאל"
      - "מקרה B: מאוורר לא-מנוטר מוחלש, אחור"
      - "מקרה B: מאוורר לא-מנוטר מוחלש, דלת"
      - "מקרה C: כניסה משותפת או נתיב אוויר חסום, שני המאווררים תקינים, הצד החם ביותר"
      - "מקרה D: שני המאווררים מוחלשים, הצד החם ביותר"
    equipment:
      - תרמוקפלים מודבקים לפי DVT-THM-002, על כל ארבעת הפאנלים
      - אמצעי לקביעת עומס כל מאוורר בנפרד לאחוז מפוקד
      - קריאת טאכומטר נרשמת מהמאוורר המנוטר
      - אנמומטר בכניסת הפאנל, לקורלציה של זרימת אוויר מול טאכומטר
      - חסימה חלקית מוגדרת למקרה C, למשל רשת המכסה אחוז רשום משטח הכניסה
    preconditions:
      - DVT-THM-002 הושלם על יחידה זו, כך שטמפרטורת קו הבסיס התקינה וקריאת הטאכומטר התקינה של כל פאנל ידועות
      - התא בנקודת היעד הגרועה ביותר ששימשה ב-THM-002
      - ספי ההגנה בקושחה בערכי הייצור שלהם, כשהכיבוי המגן מכוון מעל מגבלת העבודה של 75°C
    procedure_steps:
      - רשום את המקרה, הצד, ואת טמפרטורת קו הבסיס וקריאת הטאכומטר התקינות של אותו צד
      - הפעל את ההחלשה בצעדים מוגדרים — 75%, 50%, 25% מהעומס הרגיל למאוורר, או אחוז חסימה רשום למקרה C — והחזק כל צעד עד שטמפרטורת הפאנל מתייצבת
      - רשום את רמת ההחלשה וטמפרטורת הפאנל שבהן האזעקה מופעלת לראשונה
      - רשום את טקסט האזעקה מילה במילה ואת קוד השגיאה
      - אשר שהאזעקה מזהה את הצד הנכון
      - רשום מה ההודעה טוענת לגבי איזה מאוורר, ואם הטענה נכונה למקרה זה. במקרים B ו-C ההודעה צריכה לבטא את העמימות ולא לנקוב במאוורר יחיד
      - רשום את קריאת הטאכומטר ברגע האזעקה, כדי לאשר שלוגיקת האלימינציה פעלה כמתוכנן
      - אחרי שההגנה פועלת, רשום כמה עוד עולה טמפרטורת ה-LED לפני שהיא מתחילה לרדת
      - אשר ששלושת הפאנלים האחרים אינם מעלים אזעקת שווא
      - שחזר קירור תקין ואשר שההתאוששות דורשת אישור

  DVT-SAF-020:
    title: פאנל LED מנותק חשמלית — זיהוי בהדלקה וזיהוי הפאנל
    purpose: >
      לאמת שכאשר פאנל LED אחד מנותק חשמלית והלדים מודלקים, המערכת מזהה
      שהפאנל אינו מאיר, מעלה התראה שפאנל LED אינו עובד, נוקבת בפאנל הנכון,
      מנחה את המפעיל לבדוק את הלד, ואינה מריצה את העבודה עם פאנל כבוי. קיור
      שרץ עם אחד מארבעת הפאנלים כבוי מקייר בחסר את החלק מאותו צד בלי שום
      סימן נראה למפעיל.
    sample_rationale: >
      מחברי הפאנלים והרתמה ממנהל ההתקן לפאנל הם עבודת הרכבה, ולכן קרימפ פגום
      או מחבר שאינו נעול עד הסוף הם משתנה בין יחידה ליחידה. לוגיקת הזיהוי עצמה
      היא תכונת תכן, אבל ההזרקה זולה ומצב הכשל הוא תקלת שדה אמיתית, ולכן כל
      יחידה מריצה אותה.
    safety_plan:
      - צפייה בפליטת 405 / 450 nm רק דרך הדלת הסגורה או חלון צפייה מדורג ל-UV; משקפי הגנה חוסמי UV לכל מי שליד השולחן
      - הניתוק מבוצע כשהיחידה מנותקת ממתח וממסרי ה-SSR של הלדים מאומתים ככבויים, ואז היחידה מחוברת מחדש; אין עבודה תחת מתח על יציאת מנהל ההתקן
      - כבל הביניים מנותב כך שנעילת הדלת אינה מנוטרלת (SAF-012 / SAF-017 חייבים להישאר תקפים במהלך בדיקה זו)
    equipment:
      - כבל ביניים (break-out) למחבר הפאנל (יציאת מנהל ההתקן) עם מפסק או מגען מרוחק, אחד לכל סוג מחבר פאנל
      - כבל ביניים להזנת מנהל ההתקן, אחד לכל מנהל התקן
      - מולטימטר / צבת זרם על יציאת מנהל ההתקן לאימות שהשרשרת באמת פתוחה (0 A) או שמנהל ההתקן באמת מת
      - מד עוצמת UV או כרטיס רגיש ל-UV במרכז התא, לאימות שהפאנל כבוי ושלושת האחרים מאירים
      - סטופר או חותמות זמן מיומן המכונה
    preconditions:
      - כל ארבעת הפאנלים אומתו כתקינים מיד לפני הבדיקה — בדיקת LED עצמית PASS וכל פאנל נראה מאיר
      - היחידה בטמפרטורת הסביבה, התא ריק, הדלת סגורה, אין התראות פעילות
      - ספי ההגנה בקושחה בערכי הייצור
    procedure_steps:
      - רשום את הפאנל ואת נקודת הניתוק; צלם את המחבר הפתוח / מיקום כבל הביניים
      - פתח את החיבור כשהיחידה מנותקת ממתח, חבר מחדש למתח, ואמת עם המולטימטר / צבת הזרם ששרשרת הפאנל פתוחה או שמנהל ההתקן אינו מוזן
      - התחל עבודת קיור (או את בדיקת ה-LED העצמית) כך שהלדים נדלקים; הפעל את הטיימר בפקודת ההדלקה
      - אשר שההתראה מציינת שפאנל LED אינו עובד, נוקבת בפאנל הנכון, וטקסט הפעולה שלה מנחה את המפעיל לבדוק את הלד / הפאנל
      - אשר שהעבודה לא התחילה ולא רצה עם הפאנל הכבוי
      - אשר ששלושת הפאנלים האחרים מאירים ואינם מעלים התראה
      - שחזר את החיבור, אשר את ההתראה, התחל קיור, ופתח שוב את אותו חיבור בזמן שהלדים דולקים; רשום את הזמן עד ההתראה והאם העבודה נעצרה
      - שחזר את החיבור ואמת שההתראה נמחקת רק אחרי אישור המפעיל
      - הרץ את בדיקת ה-LED העצמית ואשר שהפאנל מאיר שוב — אין נזק נלווה למנהל ההתקן ממצב העומס הפתוח
    field_notes:
      panel_confirmed_dark: התראה כשהפאנל עדיין מאיר פירושה שההזרקה נכשלה, לא שהזיהוי עובד
      time_to_alarm: נרשם אך לא נאכף — הגבול ייקבע אחרי שיוחלט אמצעי הזיהוי (CONFIRM)

  DVT-SAF-021:
    title: בורר המתח במצב ביניים — נתק, גוף החימום לא מקבל הספק
    purpose: >
      לבורר 110 / 230 V יש מצב ביניים בין שני המעצורים. שם הוא פתוח: ענף גוף
      החימום לא מקבל כלום, ולכן התא לעולם לא מתחמם. שום דבר לא ניזוק ושום
      התקן הגנה לא פועל — הכשל הוא "לא מתחמם" שקט. לאמת שהמערכת מזהה את
      היעדר ההתחממות בתוך זמן מוגבל, מעלה התראה שאומרת שגוף החימום לא מקבל
      הספק, ומנחה את הלקוח לכוון את הבורר למצב המתאים למתח הרשת של המדינה
      שבה הוא נמצא. ההוכחה שגוף החימום באמת לא קיבל הספק היא התרמוקפל
      המודבק לגוף החימום (PicoLog TC-08): הגרף שלו נשאר שטוח בזמן שפקודת
      HEAT פעילה.
    equipment:
      - מקור AC מתוכנת או ואריאק מכוון ל-220 V
      - מד True-RMS בכניסה
      - צבת זרם על ענף גוף החימום
      - רשם תרמוקפלים PicoLog TC-08
      - תרמוקפל Type-K מודבק לגוף החימום (אותה הדבקה כמו DVT-SAF-013), נרשם ב-1 Hz
    preconditions:
      - היחידה בטמפרטורת הסביבה, התא ריק, הדלת סגורה
      - בורר המתח באמצע, בין המעצורים של 110 V ו-230 V - הרנר מנחה ורושם כמכוון
      - מתח הכניסה 220 V - הרנר מנחה ורושם כמכוון
      - תרמוקפל גוף החימום מודבק ונרשם ב-TC-08 ב-1 Hz; שעון ה-TC-08 הוא בסיס הזמן לכל הריצה
      - נתיכי הכניסה וענף גוף החימום אומתו כשלמים לפני הריצה
    procedure_steps:
      - הרנר מנחה - העבר את בורר המתח לאמצע ואת מתח הכניסה ל-220 V - ורושם את שניהם כמכוונים (בלי שאלות)
      - חבר למתח ואשר שהיחידה עולה כרגיל — הבקר וממשק המשתמש מוזנים ללא תלות בבורר
      - פקוד HEAT ל-80°C והפעל את הטיימר בשעון ה-TC-08
      - רשום את זרם ענף גוף החימום כש-HEAT מפוקד — חייב להיקרא אפס
      - רשום את גרף התא וגרף גוף החימום עד ההתראה (עד 5 דקות); רשום את העלייה הכוללת של כל אחד. הכלל של המכונה (שגיאה 9007): ההיטר מופעל שתי דקות בלי שהתא עולה
      - רשום אם עלתה התראה, מתי ומה היא אומרת — היא חייבת להיות שגיאה 9007, לציין שההיטר לא מקבל הספק / לא מחמם, ולציין את שתי הסיבות לבדיקה - בורר המתח לא במקומו ונתיך ההיטר שרוף
      - רשום מה המערכת עושה אחרי ההתראה — החימום לא יישאר מפוקד ללא הגבלה בלי החלטת המפעיל
      - אשר ששום התקן הגנה לא פעל ושלא נגרם נזק
      - כוון את הבורר למעצור הנכון למתח המוזן ואמת חימום תקין
      - צרף את יומן ה-TC-08 ואת יומן המכונה של הריצה
    field_notes:
      selector_position: ביניים (בין המעצורים)
      heater_branch_current: צפוי 0 A
      heater_body_rise: העלייה הכוללת בתרמוקפל גוף החימום בזמן ש-HEAT היה מפוקד
      alarm_states_no_heating: ההודעה אומרת שגוף החימום לא מקבל הספק / התא לא מתחמם
      alarm_instructs_selector: ההנחיה אומרת ללקוח לכוון את בורר המתח למצב המתאים למתח הרשת של המדינה שלו
      alarm_names_fuse: ההתראה מציינת גם את נתיך ההיטר כסיבה לבדיקה
      error_code: צפוי 9007 (ההיטר לא מחמם)
      heat_command_timestamp: שעון TC-08

  # ---------------------------------------------------------------- NITROGEN
  DVT-GAS-002:
    title: לחץ-יתר בכניסת החנקן — אספקה מעל המקסימום המדורג, שסתום סגור ופתוח
    purpose: >
      לאמת שאספקת חנקן מעל לחץ הכניסה המקסימלי המדורג מוכלת: כשהשסתום סגור
      שום חנקן לא מגיע לתא ושום מחבר לא דולף; כשהשסתום מפוקד פתוח לחץ התא
      נשאר בגבול, הדלת והאטם מחזיקים, הזרימה נפסקת כשהשסתום נסגר, והשסתום
      עדיין אטום אחר כך. סולנואיד שמושבו נדחף לפתיחה על ידי לחץ כניסה עודף,
      או מחבר push-in שמשתחרר, ממלאים את התא (ואת החדר) בחנקן בלי שום פקודה —
      זה מה שהבדיקה מחפשת.
    sample_rationale: >
      המחברים והצנרת הם עבודת הרכבה ומושב השסתום הוא תכונה של כל חלק, ולכן
      כל יחידה נחשפת ללחץ-היתר.
    safety_plan:
      - חנקן דוחק אוויר — מד חמצן באזור הנשימה של המפעיל, התראה ב-19.5%, החדר מאוורר, לעולם לא לעבוד לבד
      - אספקה דרך ווסת עם שסתום פריקה; הלחץ מועלה בשלבים; ידיים ופנים רחוק מהמחברים כשהמערכת בלחץ
      - הצנרת והמחברים נבדקים לפני כל שלב; מחבר שמתפוצץ בפי 2 מהלחץ המדורג הוא סכנת הטלה — הגנת עיניים
    equipment:
      - אספקת חנקן מווסתת עם מד לחץ מכויל עד לפחות פי 2 מלחץ הכניסה המקסימלי המדורג
      - מד זרימה בקו בכניסת החנקן (0 עד זרימת שטיפה מלאה)
      - מנתח חמצן עם גשש בתוך התא, נרשם ב-1 Hz
      - מנומטר ללחץ התא בפתח אטום (0 עד 100 mbar)
      - תמיסת גילוי דליפות למחברים
    preconditions:
      - היחידה במנוחה, התא ריק, הדלת סגורה, מצב חנקן מופעל
      - גשש החמצן בתא קורא סביבה (20.9%), מד הזרימה בקו, המנומטר בפתח התא
      - האספקה מווסתת ל-overpressure_factor כפול max_inlet_pressure_bar, נמדדת ונרשמת
    procedure_steps:
      - רשום את לחץ הכניסה המופעל ואת המקדם
      - שסתום סגור (ללא פקודת שטיפה) — החזק 10 דקות; רשום את הזרימה בכניסה (חייבת להיות אפס), את החמצן בתא, ובדוק בבועות כל מחבר מהכניסה עד השסתום
      - פקוד שטיפה (שסתום פתוח) כשהתא סגור; רשום את הזרימה, את שיא לחץ התא, אם הדלת או האטם התרוממו, וכל התראה
      - בסוף השטיפה הקבועה מראש השסתום חייב להיסגר — רשום את הזמן עד שהזרימה מגיעה לאפס ואת החמצן בתא
      - החזר את האספקה למקסימום המדורג; שסתום סגור 10 דקות — השסתום חייב להישאר אטום (זרימה אפס, חמצן ללא שינוי)
      - הרץ שטיפה רגילה ובדוק צנרת, מחברים ושסתום לנזק או עיוות
    field_notes:
      closed_valve_flow: צפוי 0
      post_test_flow_closed: צפוי 0
      overpressure_factor: כפול max_inlet_pressure_bar

  DVT-GAS-003:
    title: אספקת חנקן נמוכה או אבודה — שומר ההפעלה, בדיקת קדם-קיור, אובדן באמצע שטיפה ובאמצע קיור
    purpose: >
      לאמת מה המערכת עושה כשהחנקן לא שם: הפעלת מצב חנקן בלי אספקה, התחלת
      תוכנית חנקן מתחת למינימום של 6 bar, אובדן האספקה במהלך השטיפה, ואובדן
      האספקה במהלך קיור תחת חנקן. יש לומר למפעיל שקו החנקן הוא הבעיה, וקיור
      לא ירוץ בשקט באוויר כאילו היה אינרטי.
    sample_rationale: >
      התגובה היא התנהגות תוכנה, זהה בכל יחידה — יחידה אחת, הייחוס של מחסנית
      התוכנה.
    case_matrix:
      - "מקרה A: הקו מנותק, ואז הפעלת מצב חנקן בהגדרות"
      - "מקרה B: אספקה ב-4 bar (מתחת למינימום של 6 bar), התחלת תוכנית חנקן"
      - "מקרה C: האספקה נסגרת 30 שניות לתוך השטיפה"
      - "מקרה D: האספקה נסגרת במהלך הקיור תחת חנקן (אחרי השטיפה)"
    equipment:
      - אספקת חנקן מווסתת עם מד לחץ מכויל
      - מד זרימה בקו בכניסת החנקן (0 עד זרימת שטיפה מלאה)
      - מנתח חמצן עם גשש בתוך התא, נרשם ב-1 Hz
    preconditions:
      - היחידה מוכנה לתוכנית חנקן; גשש החמצן בתא
      - ברז האספקה בהישג יד המפעיל למקרי אמצע-הריצה
    procedure_steps:
      - רשום את המקרה ואת מצב האספקה שהופעל
      - מקרה A — כשהקו מנותק, נסה להפעיל מצב חנקן; רשום אם זה נדחה, מה המסך מציג ללחץ N2, ואת ההודעה
      - מקרה B — ב-4 bar, התחל תוכנית עם צעד N2; רשום אם בדיקת הקדם-קיור דוחה אותה, את קוד השגיאה, ואם ההודעה נוקבת בקו החנקן
      - מקרים C ו-D — סגור את האספקה; רשום אם האובדן מזוהה, כמה זמן זה לוקח, מה העבודה עושה (ממשיכה / מבוטלת / מנחה) ואת החמצן בסוף צעד הקיור
      - פסק-דין למקרה — האם המערכת הגיבה כפי שהמקרה דורש (A דחתה את ההפעלה, B דחתה את ההתחלה, C/D זיהו את האובדן ולא המשיכו), האם נאמר למפעיל שקו החנקן הוא הבעיה, והאם קיור רץ באוויר כאילו היה אינרטי
      - צרף את יומני החמצן והזרימה
    field_notes:
      pressure_display: מה ההגדרות מציגות ללחץ N2
      detected_and_handled: התגובה שהמקרה דורש התרחשה
      operator_told_n2_line: ההודעה / ההתראה נוקבת בקו החנקן
      cure_ran_in_air: צעד קיור רץ כשהחנקן נעלם, בלי ביטול או הנחיה

  DVT-GAS-004:
    title: שסתום החנקן במצב כשל בטוח — סגור ללא מתח, נסגר באובדן מתח, בפתיחת דלת ובביטול
    purpose: >
      לאמת שחנקן זורם רק כשהתוכנה מחזיקה את השסתום פתוח: אין זרימה כשהמכונה
      כבויה והקו בלחץ במשך 24 שעות, והזרימה נפסקת תוך 2 שניות כשמתח הרשת
      מנותק במהלך שטיפה, כשהדלת נפתחת במהלך שטיפה, וכשהמפעיל מבטל. שסתום
      שנשאר פתוח ללא פקודה ממלא את התא ואת החדר.
    safety_plan:
      - מד חמצן באזור הנשימה של המפעיל, התראה ב-19.5%, החדר מאוורר
    equipment:
      - מד זרימה בקו בכניסת החנקן (0 עד זרימת שטיפה מלאה)
      - מנתח חמצן עם גשש בתוך התא, נרשם ב-1 Hz
      - מגען רשת מופעל מרחוק
      - גשש לוגי או סקופ על הזנת השסתום (GPIO13 / מוצא הדרייבר)
    preconditions:
      - אספקה בלחץ הכניסה המדורג
      - מד הזרימה בקו, גשש החמצן בתא, גשש על הזנת השסתום
    procedure_steps:
      - המכונה כבויה, הקו בלחץ — החזק 24 שעות; רשום את סך מד הזרימה ואת החמצן בתא בסוף
      - התחל שטיפה; נתק מתח רשת אחרי 30 שניות; רשום את הזמן מהניתוק עד זרימה אפס ואת רמת הזנת השסתום
      - התחל שטיפה; פתח את הדלת אחרי 30 שניות; רשום את הזמן מפתיחת הדלת עד זרימה אפס ואת קוד השגיאה
      - התחל שטיפה; בטל מהממשק אחרי 30 שניות; רשום את הזמן עד זרימה אפס
      - אחרי כל מקרה אשר שהשסתום סגור בגשש ההזנה ושהחמצן בתא מפסיק לרדת
    field_notes:
      flow_off_24h: צפוי 0

  DVT-GAS-005:
    title: אוורור אחרי קיור תחת חנקן — חמצן בטוח לפני שהעבודה מסתיימת והדלת משתחררת
    purpose: >
      לאמת שהתא ניתן לנשימה לפני שהמפעיל מוזמן לפתוח אותו: תוכנית שקיור
      החנקן שלה לא מלווה בצעד קירור (אוורור) נדחית, ואחרי האוורור החמצן בתא
      חוזר ל-19.5% או יותר לפני שהעבודה מדווחת על סיום והדלת משתחררת. דלת
      שמשתחררת על תא מלא חנקן מכניסה פנים לאטמוספרה אינרטית.
    equipment:
      - מנתח חמצן עם גשש בתוך התא, נרשם ב-1 Hz
      - מנתח חמצן בפתח הדלת, בגובה נשימה
    preconditions:
      - אספקה בלחץ הכניסה המדורג; גששי חמצן בתא ובפתח הדלת
    procedure_steps:
      - ייבא תוכנית עם שטיפת N2 וקיור אבל בלי צעד קירור; רשום אם היא נדחית ואת קוד השגיאה
      - הרץ תוכנית עם שטיפת N2, קיור ואוורור בקירור; רשום את החמצן בתא כשהעבודה מדווחת על סיום ואת הזמן מסוף הקיור עד שהחמצן מגיע ל-19.5%
      - רשום אם הדלת שוחררה (מגנט) לפני שהחמצן בתא הגיע ל-19.5%, ואת החמצן בפתח הדלת כשהמפעיל פותח אותה
      - צרף את יומני החמצן
    field_notes:
      error_code: צפוי 6003 N2_SEQUENCE_INVALID

  DVT-GAS-006:
    title: דלדול חמצן בחדר בעמדת המפעיל — שטיפות במקרה הגרוע בחדר הקטן ביותר המותר
    purpose: >
      כל ליטר חנקן שנכנס לתא יוצא ממנו אל החדר. לאמת שהמקרה הגרוע ביותר
      שהתוכנה מאפשרת — שתי שטיפות ברצף, האוורור אל החדר, בלי יניקה — שומר על
      החמצן באזור הנשימה של המפעיל מעל 19.5% בחדר הקטן ביותר שהמדריך מתיר. אם
      לא, המדריך צריך נפח חדר מינימלי או דרישת אוורור, והתכן פליטה מתועלת.
    sample_rationale: >
      תכונת תכן של נפח השטיפה והחדר, לא של היחידה.
    safety_plan:
      - שני מדי חמצן (אחד אצל המפעיל, אחד בדלת החדר), התראה ב-19.5%; הבדיקה מופסקת והחדר מאוורר בהתראה הראשונה
      - אדם שני מחוץ לחדר בקשר עין לאורך כל הבדיקה
    equipment:
      - מד חמצן בגובה הנשימה של המפעיל (1.5 מ', 0.5 מ' מהדלת), נרשם ב-1 Hz
      - מדידת נפח החדר (סרט מדידה) ורישום חילופי אוויר
    preconditions:
      - נפח החדר נמדד ונרשם; דלתות וחלונות סגורים, אוורור מאולץ כבוי, למשך הבדיקה
      - אספקה בלחץ הכניסה המדורג
    procedure_steps:
      - רשום את נפח החדר ואת מצב האוורור
      - הרץ את תוכנית החנקן הארוכה ביותר שהתוכנה מאפשרת (שני צעדי שטיפה) פעמיים ברצף, עם אוורור אל החדר; רשום חמצן במשך 60 דקות מהשטיפה הראשונה
      - רשום את החמצן 60 דקות אחרי השטיפה האחרונה

  DVT-GAS-007:
    title: טמפרטורת סליל הסולנואיד של החנקן — השטיפה הארוכה ביותר ופקודה תקועה במצב פתוח
    purpose: >
      סליל השסתום מוזן לאורך כל השטיפה, ואם התוכנה נתקעת עם השסתום פתוח
      (תחום SAF-014) — ללא הגבלה. לאמת בעזרת תרמוקפל על גוף הסליל שהסליל נשאר
      בתוך מחלקת הבידוד שלו לאורך שתי שטיפות באורך מקסימלי ברצף ולאורך 60
      דקות של הזנה רציפה, ושהשסתום עדיין פועל אחר כך.
    sample_rationale: >
      תכונה של חלק השסתום, זהה בכל יחידה.
    equipment:
      - רשם תרמוקפלים PicoLog TC-08
      - תרמוקפל Type-K מודבק לגוף סליל הסולנואיד
      - מד זרימה בקו בכניסת החנקן (0 עד זרימת שטיפה מלאה)
    preconditions:
      - התרמוקפל מודבק לסליל ונרשם ב-TC-08 ב-1 Hz; טמפרטורת הסביבה נרשמת
      - אספקה בלחץ הכניסה המדורג
    procedure_steps:
      - הרץ שתי שטיפות באורך מקסימלי ברצף; רשום את עליית טמפרטורת הסליל ואת השיא
      - החזק את השסתום מוזן במשך 60 דקות (פקודת שירות); רשום את טמפרטורת הסליל כל 10 דקות ואת הערך הסופי
      - נתק את ההזנה; אחרי התקררות הרץ שטיפה רגילה ואשר שהזרימה כמו קודם
      - צרף את יומן ה-TC-08
    field_notes:
      coil_temp_settled: הגרף שטוח לאורך 10 הדקות האחרונות

  # ---------------------------------------------------------------- PROCESS — NFC
  DVT-NFC-001:
    title: זיהוי ראש הבנייה ב-NFC — קריאת התג בהכנסה, קישור ראש הבנייה הנכון, טיפול בהיעדר תג / תג שגוי
    purpose: >
      לאמת שכאשר ראש בנייה (BH) הנושא תג NFC מוכנס לתא הקורא מזהה אותו: התג
      נקרא בתוך הזמן הנדרש, ראש הבנייה שמוצג ומקושר להדפסה הוא זה שהוכנס
      בפועל (מספר סידורי מהתג), החלפת ראשי בנייה משנה את הזיהוי, וראש בנייה
      ללא תג, תג לא רשום או קורא מנוטרל מדווחים למפעיל במקום לעבור בשקט.
      אנטנת הקורא, המרחק שלה מהתג וההושבה של ראש הבנייה הם תכונות הרכבה,
      ולכן כל יחידה נמדדת.
    case_matrix:
      - "מקרה A: ראש בנייה רשום עם התג שלו, מושב כרגיל — נקרא ומקושר"
      - "מקרה B: ראש בנייה רשום שני מחליף את הראשון — הזיהוי עוקב אחרי התג"
      - "מקרה C: ראש בנייה ללא תג (התג מוסתר בנייר כסף) — מדווח, לא מתקבל בשקט"
      - "מקרה D: תג שאינו רשום לשום ראש בנייה — מדווח כלא מוכר"
      - "מקרה E: ראש בנייה מושב 5 מ״מ לפני המעצור — נקרא או 'לא זוהה' ברור"
      - "מקרה F: NFC מנוטרל בהגדרות — אין קריאה, נאמר למפעיל שהקורא כבוי"
    equipment:
      - שני ראשי בנייה רשומים עם תגי NFC (מספרים סידוריים רשומים)
      - נייר כסף להסתרת תג (מקרה C) ותג NFC ריק / זר אחד (מקרה D)
      - שעון עצר או חותמות זמן מהמערכת
      - קליבר לקיזוז ההושבה (מקרה E)
    preconditions:
      - היחידה במנוחה, התא בטמפרטורת הסביבה, NFC מופעל בהגדרות (למעט מקרה F)
      - שני ראשי הבנייה רשומים במכונה / בארגון עם המספרים הסידוריים של התגים; המספרים נרשמים לפני הריצה
      - יומן המכונה פתוח (או מחוון ה-NFC בממשק גלוי) כדי למדוד את זמן הקריאה
    procedure_steps:
      - רשום את המקרה, את ראש הבנייה שבשימוש ואת המספר הסידורי שעל התג שלו
      - הכנס את ראש הבנייה עד המעצור (מקרה E — 5 מ״מ לפני, נמדד), סגור את הדלת והפעל את הטיימר
      - רשום אם נקרא תג, כמה זמן זה לקח, ואת המספר הסידורי שהמכונה מדווחת
      - רשום מה המפעיל רואה — מחוון, ראש הבנייה המוצג, או ההודעה על תג חסר / לא מוכר / קורא מנוטרל
      - התחל (או נסה להתחיל) צעד הדפסה ורשום אם רשומת ההדפסה מקשרת את המספר הסידורי של ראש הבנייה הזה, או אם ההתחלה נדחית עם סיבה (מקרים C, D, F)
      - הוצא את ראש הבנייה ואשר שהזיהוי מתנקה
      - צרף את יומן המכונה של הריצה
    field_notes:
      bh_serial_expected: מהתג / מהרישום; ריק ל-C, מספר זר ל-D
      operator_shown_identity: הממשק מציג איזה ראש בנייה נמצא בתא
      response_correct: "A/B/E מושב: נקרא = המספר הצפוי, מוצג, מקושר; C/D/F: מדווח למפעיל, אין קישור שקט"

  # ---------------------------------------------------------------- THERMAL
  DVT-THM-001:
    title: אפיון תרמי של התא — תגובת מדרגה, אחידות וזמן חימום
    purpose: >
      ריצת חימום מכשירה אחת מספקת את כל התמונה התרמית בנקודת יעד ומתח רשת
      נתונים: זמן חימום, חריגה מעל היעד (overshoot), זמן התייצבות, שגיאת מצב
      יציב, מחזור גבול (limit cycle) ואחידות מרחבית על פני התא. פיצול לבדיקות
      נפרדות היה מחייב להריץ את אותו חימום של 2.5 שעות כמה פעמים כדי להפיק
      מספרים שונים מנתונים זהים.
    equipment:
      - PicoLog TC-08 x2 (16 ערוצי תרמוקפל)
      - 16 תרמוקפלים מסוג K, אצווה מותאמת, על רשת תלת-ממדית קבועה
      - תרמוקפל ייחוס בסמוך לחיישן הבקרה
      - מקור AC מתוכנת או ואריאק, 100 / 110 / 230 / 240 V
      - רשם טמפרטורה ולחות של הסביבה
    preconditions:
      - התא ריק, הדלת סגורה
      - מיקומי הרשת רשומים ומצולמים, זהים לכל ריצה ולכל יחידה
      - היחידה הוחזרה לטמפרטורת הסביבה והתייצבה תרמית לפני כל ריצה — ריצה שמתחילה מתא חם אינה ברת-השוואה ויש לפסול אותה
      - בורר המתח מותאם למתח הרשת המוזן, מאומת ורשום
      - הסביבה מבוקרת ב-25 ±1°C, נרשמת ברציפות. הודק מטווח 20–25°C המקורי כי DVT-THM-003 מבוצע במקביל על הירידה של שורות 80°C, וקצב הקירור מוכתב על ידי ההפרש מהסביבה
    procedure_steps:
      - רשום את מתח הרשת המוזן בכניסה, את מצב הבורר, את טמפרטורת הסביבה ואת טמפרטורת התא ההתחלתית
      - התחל לרשום את כל 16 ערוצי הרשת, את תרמוקפל הייחוס ואת חיישן הבקרה ב-1 Hz
      - פקוד מדרגה מטמפרטורת הסביבה ישירות לנקודת היעד, בלי רמפה, והתחל את הטיימר
      - רשום את הזמן עד שחיישן הבקרה מגיע לראשונה לנקודת היעד
      - מתרמוקפל הייחוס, חלץ את טמפרטורת השיא ואת הזמן שבו התרחשה
      - חלץ את זמן ההתייצבות ואת שגיאת המצב היציב
      - המשך לרשום 30 דקות מעבר למצב היציב. על פני 20 הדקות האחרונות חלץ את תנודת חיישן הבקרה ואת המחזור שלה
      - במצב יציב, חלץ את הפיזור המרחבי על פני כל 16 ערוצי הרשת וזהה את המיקומים החם ביותר והקר ביותר
      - רשום את אותו ערך overshoot כפי שחושב מחיישן הבקרה הגולמי לפני פיצוי, להשוואה
      - אל תעצור את הרישום בסוף ההשהיה. התא צריך לחזור לטמפרטורת הסביבה לפני שהשורה הבאה יכולה להתחיל, לכן המשך לרשום לאורך הירידה. בשורות 80°C הירידה הזו היא ריצת DVT-THM-003 ומבוצעת לפי הפרוצדורה שלה. בשאר השורות היא נרשמת כנתון משלים, שנותן עקומת קצב-קירור מול הפרש-טמפרטורה בלי זמן שולחן נוסף
      - צרף את היומן הגולמי
    field_notes:
      heat_up_time: מדידת REQ-48 בשורות 80°C
      overshoot: peak_temp פחות נקודת היעד, מתרמוקפל הייחוס
      uniformity_pp: שיא-לשיא על פני 16 ערוצים במצב יציב

  DVT-THM-002:
    title: פרופיל טמפרטורת LED לאורך קיור של 30 דקות
    purpose: >
      לאמת ששום LED אינו חורג ממגבלת טמפרטורת הצד האחורי בשום נקודה במהלך
      קיור עבודה מלא, בכל פאנל ובכל יחידה, ולתעד את המקסימום שהושג. זו המדידה
      שיעד אורך החיים של 4,500 שעות נשען עליה, לא רק בדיקת בטיחות.
    equipment:
      - רשם תרמוקפלים, מינימום 8 ערוצים
      - תרמוקפלים מסוג K מודבקים לצד האחורי של ה-MCPCB, 2 מ"מ מאחורי ה-LED, לפי המוסכמה הקבועה — לא בנקודת ההלחמה
      - מצלמה תרמית לסקר הנקודות החמות החד-פעמי
    preconditions:
      - סקר נקודות חמות הושלם פעם אחת לכל תכן פאנל, וזיהה את המיקום הגרוע ביותר בכל אחד מארבעת הפאנלים; התרמוקפלים הודבקו אז במיקומים אלה בכל יחידה
      - התרמיסטורים המובנים של הפאנלים (ימין / שמאל / אחור / דלת) נרשמים במקביל לתרמוקפלים המודבקים, כך שהקורלציה בין מה שהמכונה רואה למה שה-LED באמת מגיע אליו נלכדת
      - נקודת עבודת LED של 405 nm ב-0.75 A, כל ארבעת הפאנלים פעילים
      - התא בנקודת היעד של ה-sweep ומיוצב תרמית לפני אפשור ה-UV
      - כל מאווררי הקירור בעומס הרגיל שלהם
    procedure_steps:
      - רשום את נקודת היעד של התא, טמפרטורת הסביבה והגדרת הזנת ה-LED
      - אפשר קיור ורשום את כל התרמוקפלים וכל התרמיסטורים המובנים ב-1 Hz במשך 30 דקות
      - חלץ את טמפרטורת הצד האחורי המרבית שהושגה בכל פאנל
      - רשום את הזמן שבו כל פאנל הגיע למקסימום שלו
      - רשום את קצב העלייה על פני 5 הדקות האחרונות בפאנל החם ביותר
      - רשום את ההפרש בין התרמוקפל המודבק לתרמיסטור המובנה באותו פאנל, במקסימום
      - חשב את טמפרטורת הצומת מהמדידה בצד האחורי באמצעות הסולם התרמי, ואת המרווח הנובע למקסימום המוחלט של 100°C
      - רשום אם התרחש ניתוק הגנה כלשהו במהלך הריצה. ניתוק במהלך פעולה תקינה מתחת למגבלת העבודה הוא ניתוק מטרד ומהווה בעצמו כישלון של בדיקה זו
      - צרף את היומן הגולמי ואת סקר הנקודות החמות

  DVT-THM-005:
    title: טמפרטורת ההתייצבות של הלדים מול עומס מאווררי קירור הלדים — PWM 100 / 90 / 80 / 70%, לדים במקסימום
    purpose: >
      למצוא עד כמה אפשר להפחית את זרימת האוויר לקירור הלדים. עם הלדים
      במקסימום בתנאי התא הגרוע ביותר, ארבעת מאווררי קירור הלדים מוחזקים
      ב-100, 90, 80 ו-70% PWM בזה אחר זה, וטמפרטורת הצד האחורי של כל פאנל
      מתייצבת בכל עומס. התוצאה היא טמפרטורת ההתייצבות לכל פאנל בכל עומס,
      המרווח שלה ממגבלת העבודה של 75°C, ולכן העומס הנמוך ביותר שהתכן יכול
      להרשות לעצמו — הקלט להגדרת מאוורר שקטה וארוכת-חיים יותר ולספי הקירור
      המוחלש של DVT-SAF-019.
    sample_rationale: >
      זרימת האוויר דרך פאנל תלויה בהרכבת המאוורר, התעלה והפאנל; המרווח בעומס
      מופחת הוא משתנה בין יחידה ליחידה, ולכן כל חמש היחידות נמדדות והגדרת
      הייצור נלקחת מהיחידה הגרועה ביותר.
    equipment:
      - רשם תרמוקפלים PicoLog TC-08
      - תרמוקפלי Type-K מודבקים לארבעת פאנלי הלדים ליד התרמיסטורים המובנים (ההדבקות של DVT-THM-002)
      - רשם טמפרטורה ולחות של הסביבה
      - אנמומטר בכניסות הפאנלים (אופציונלי — זרימת אוויר מול עומס)
    preconditions:
      - DVT-THM-002 הושלם על יחידה זו (ההדבקות במקום, קו בסיס תקין ב-100% ידוע)
      - התא ב-80°C ומיוצב תרמית (המקרה הגרוע ביותר ללדים); הדלת סגורה; סביבה 25 ±1°C, נרשמת
      - עומס המאוורר מפוקד דרך ה-API של המכונה (POST /api/fans/led_cooling) או דרך 'שליטה במכונה' בקונסולת ה-DVT; קריאת הטאכומטר נרשמת מהטלמטריה
      - הגנת הלדים בקושחה בערכי הייצור — ביטול על ידי ההגנה הוא תוצאה של הבדיקה, לא תקלה שלה
    procedure_steps:
      - אוטומטי — לחץ "הרץ את סריקת עומס המאוורר אוטומטית". הקונסולה מכוונת את מאווררי קירור הלדים לכל עומס בתורו, מדליקה את הלדים במקסימום, רושמת את ארבעת התרמיסטורים המובנים עד שכל פאנל התייצב או שאחד הגיע לגבול 75°C, ואז מכבה את הלדים ומחזירה את המאווררים ל-100%. היא ממלאת את השדות של כל ארבע שורות העומס של היחידה, סוגרת את השורות האחרות ומצרפת את ה-CSV ואת גרף הטמפרטורה מול הזמן. רשום את טמפרטורת הסביבה והתא שהיא קראה
      - קריאת הטאכומטר בעומס הזה (מהטלמטריה), ואם מותקן אנמומטר, זרימת האוויר בכניסת הפאנל
      - רשום את ארבעת תרמוקפלי הפאנלים ואת התרמיסטורים המובנים ב-1 Hz עד שכל פאנל התייצב — עלייה מתחת ל-0.1°C לדקה במשך 5 דקות — או עד שפאנל כלשהו מגיע למגבלת העבודה של 75°C, המוקדם מביניהם
      - רשום את טמפרטורת ההתייצבות (או השיא) של הצד האחורי של כל פאנל ואת הפאנל החם ביותר
      - רשום את המרווח של הפאנל החם ביותר ממגבלת העבודה, ואת קריאת התרמיסטור המובנה של אותו פאנל באותו רגע
      - רשום אם הקושחה העלתה התראה או הפחיתה את הלדים במהלך השורה
      - צרף את יומן ה-TC-08 של השורה
    field_notes:
      settled: עלייה מתחת ל-0.1°C לדקה במשך 5 דקות בכל פאנל
      limit_reached: פאנל הגיע ל-75°C לפני שהתייצב — השורה נעצרה
      margin_to_working_limit: 75°C פחות max_settled_temp
      thermistor_hottest_panel: מה החיישן של המכונה עצמה קרא באותו רגע
      airflow: אופציונלי

  DVT-THM-003:
    title: קירור התא — קצבים מהיר, רגיל ואיטי
    purpose: >
      לאמת את בקרת הקירור בחוג סגור בכל שלוש הגדרות הקצב: שקצב הקירור המפוקד
      מושג בפועל ונשמר על פני הטווח שהוגדר לו, שטמפרטורת הסיום מושגת ללא
      ירידה מתחת ליעד (undershoot), ושהתא אינו מפתח גרדיאנטים מופרזים במהלך
      הקירור.
    equipment:
      - PicoLog TC-08 x2, אותה רשת 16 ערוצים כמו ב-DVT-THM-001
      - תרמוקפל ייחוס בסמוך לחיישן הבקרה
      - רשם טמפרטורת סביבה, ממוקם הרחק מהפליטה
      - אנמומטר בכניסה, אופציונלי, לקורלציה של סמכות המאוורר
    preconditions:
      - הסביבה מבוקרת ב-25 ±1°C לאורך כל הריצה, נרשמת ברציפות. ריצה שבה הסביבה יוצאת מהטווח נפסלת, לא נרשמת
      - התא ריק, הדלת סגורה
      - התא ב-80°C ומיוצב תרמית — מסופק על ידי שורת DVT-THM-001 האב, שמסתיימת בדיוק במצב הזה
      - הדמפר וכל המאווררים בקונפיגורציה הרגילה שלהם
    procedure_steps:
      - רשום את טמפרטורת הסביבה, את יציבותה על פני 30 הדקות הקודמות, ואת טמפרטורת התא ההתחלתית
      - פקוד על מצב הקירור הנבדק ורשום את הקצב המפוקד
      - אשר שהדמפר נפתח ושמאוורר גוף החימום עובר ל-100% PWM בכניסה לקירור
      - רשום את כל 16 ערוצי הרשת, את חיישן הבקרה ואת PWM מאוורר הכניסה ב-1 Hz עד שהתא מגיע ל-30°C
      - חלץ את הזמן שחלף מ-80°C ל-40°C, להשוואה מול נתוני EVT
      - חלץ את הקצב שהושג בכל טווח של 10°C ואת שגיאת העקיבה מול הקצב המפוקד בכל טווח
      - רשום את טמפרטורת התא שבה PWM מאוורר הכניסה מגיע לראשונה לרוויה ב-100%, אם בכלל
      - רשום את הטמפרטורה הנמוכה ביותר שהושגה וכל ירידה מתחת לטמפרטורת הסיום היעד
      - בנקודת קצב הקירור המרבי, חלץ את הפיזור המרחבי על פני 16 הערוצים
      - השווה את הקצב שהמכונה מדווחת מול הקצב שנמדד על ידי מכשור הייחוס
      - צרף את היומן הגולמי
    field_notes:
      ambient_stability: שיא-לשיא לאורך הריצה

  # ---------------------------------------------------------------- PROCESS
  DVT-GAS-001:
    title: שטיפת חנקן — הזמן עד 95% N2 וכמה זמן התא שומר על זה
    purpose: >
      למדוד, בכל יחידה, כמה זמן לוקח לשטיפת החנקן להביא את האטמוספרה בתא ל-95%
      חנקן (חמצן 4.8% או פחות), וברגע שהשסתום נסגר — כמה זמן התא נשאר מעל 95%
      N2 לפני שאוויר חוזר לדלוף פנימה. למכונה אין חיישן חמצן: השטיפה היא זמן
      קבוע (הגדרות, משך חנקן, ברירת מחדל 120 שניות) שרץ אחרי הייבוש, אחר כך
      השסתום נסגר וקיור ה-UV רץ על מה שנשאר מהאטמוספרה. לכן זמן השטיפה
      המתוכנת חייב לכסות את הזמן הנמדד עד 95% עם מרווח בכל יחידה, וזמן
      השמירה חייב לכסות את הקיור הארוך ביותר שבא אחריו.
    case_matrix:
      - "התא בטמפרטורת הסביבה, ריק — האטמוספרה כפי שמולאה"
      - "התא ב-80°C, ריק — תנאי הקיור: התפשטות גז והאטמים בטמפרטורה"
    equipment:
      - מנתח חמצן, 0–25% O2, T90 ≤ 10 שניות, רישום ב-1 Hz, פרוב במרכז התא
      - פרוב / מנתח חמצן שני בפינה הגרועה ביותר (הנקודה הנמוכה, רחוק מכניסת ה-N2)
      - רגולטור N2 עם שעון ומד זרימה על קו האספקה
      - יומן המכונה לחותמות הזמן של פתיחת / סגירת השסתום (nitrogenActive), או שעון המנתח
    preconditions:
      - אספקת N2 מחוברת בלחץ הרגולטור ובזרימה שנקבעו (CONFIRM הערכים — רשום אותם); די גז לכל הריצה
      - מנתח החמצן אופס עם N2 (0%) וכויל באוויר הסביבה (20.9%) לפני הריצה; שני הפרובים בתוך התא, קווי הדגימה אטומים במעבר כך שהפרובים עצמם לא דולפים
      - דלת התא סגורה ונעולה, הדמפר סגור, השאיבה (BOFA) כבויה, המאווררים במצב הקיור שלהם — קונפיגורציית הקיור הרגילה
      - מצב חנקן במכונה מופעל; משך השטיפה המוגדר נקרא מההגדרות ונרשם לפני הריצה
      - למקרה החם — התא ב-80°C ומיוצב תרמית לפני פתיחת השסתום
    procedure_steps:
      - רשום את המקרה, לחץ הרגולטור וזרימת ה-N2, נפח התא, קריאות המנתח באוויר (בדיקת span) וטמפרטורת התא
      - רשום את משך שטיפת החנקן המוגדר במכונה ושמצב החנקן מופעל
      - פתח את שסתום ה-N2 — התחל את תוכנית הקיור בצעד החנקן, או POST /api/cure/nitrogen?on=1 — והתחל את הטיימר; רשום את שני פרובי ה-O2 ב-1 Hz. אשר שהדמפר נשאר סגור והשאיבה נשארת כבויה
      - רשום את הזמן שבו פרוב המרכז קורא לראשונה O2 ≤ 4.8% (95% N2), וכן לפרוב הפינה. אם אחד מהם לא מגיע לשם בתוך 15 דקות, רשום זאת — זו התוצאה
      - המשך לשטוף 60 שניות מעבר לנקודת ה-95%; רשום את ה-O2 הנמוך ביותר שהושג ואת משך השטיפה הכולל
      - סגור את השסתום (סוף צעד התוכנית, או ?on=0); אשר שהוא סגור — מד הזרימה על 0, nitrogenActive false — והתחל את טיימר השמירה
      - כשהשסתום סגור, רשום O2 עד שפרוב המרכז עולה מעל 4.8% או עד שעברו 60 דקות. רשום את זמן השמירה מעל 95% N2, את קצב עליית ה-O2 לאורך השמירה ואת ה-O2 בסוף
      - חשב את ה-N2 שנצרך בשטיפה (זרימה × משך השטיפה) ואת המרווח של זמן השטיפה המתוכנת מעל הזמן הנמדד עד 95%
      - רשום את תוכנית הקיור הארוכה ביותר שרצה אחרי שטיפה במכונה זו (סכום צעדי ה-UV אחרי צעד החנקן) ואם השמירה הנמדדת מכסה אותה
      - צרף את יומן המנתח ואת יומן המכונה
    field_notes:
      chamber_volume: CONFIRM מהתכן המכני
      o2_reading_air: בדיקת span, צפוי 20.9
      program_purge_time_s: הגדרות — משך חנקן (ברירת מחדל 120)
      time_to_95_n2: פרוב המרכז, מפתיחת השסתום עד O2 ≤ 4.8%
      hold_time_above_95: מסגירת השסתום עד O2 > 4.8% בפרוב המרכז
      purge_time_margin: program_purge_time_s / time_to_95_n2

  # ---------------------------------------------------------------- ENVIRONMENTAL
  DVT-THM-004:
    title: הזנת-יתר של גוף החימום ברשת 230 V כשהבורר על 110 V — הזמן עד כיבוי גוף החימום על תרמוקפל גוף החימום
    purpose: >
      למדוד כמה זמן גוף החימום נשאר תחת מתח כשהיחידה מוזנת ב-230 V ובורר
      המתח על 110 V — גוף החימום פועל אז הרבה מעל הדירוג שלו עד שנתיך ענף
      גוף החימום נפתח. רגע הכיבוי נקרא מהתרמוקפל המודבק לגוף החימום
      (PicoLog TC-08): בהזנת-יתר הגוף מטפס בתלילות, והרגע שבו הוא מתהפך
      מעלייה לירידה הוא פתיחת הנתיך. heater_off_time הוא הזמן מפקודת HEAT
      עד אותה התהפכות. DVT-SAF-001 מוכיחה שהתקלה נבלמת; בדיקה זו שמה מספר
      על כמה זמן גוף החימום מוזן ביתר לפני כן, עד כמה הגוף מתחמם בינתיים,
      ומה התוכנה מדווחת.
    sample_rationale: >
      מכלה את נתיך ענף גוף החימום ומזינה את גוף החימום הרבה מעל הדירוג שלו
      — הזרקת תקלה הרסנית כמו DVT-SAF-001, מבוצעת על היחידה שיועדה לבדיקות
      הרסניות. אפשר לבצע אותה באותה הפעלה של DVT-SAF-001; גרף ה-TC-08 משרת
      אז את שתי הבדיקות.
    safety_plan:
      - הבדיקה מבוצעת כשהיחידה בתוך מתחם עמיד-אש או על שולחן בלתי-דליק, מטף בהישג יד, אין אנשים ברדיוס 2 מ'
      - מתח הרשת מוזן דרך מגען המופעל מרחוק; אף אחד לא נוגע ביחידה כשהיא תחת מתח
      - מצלמה תרמית והקלטת וידאו פועלות לאורך כל הבדיקה
      - ציוד מגן אישי מדורג לקשת חשמלית למפעיל שמחבר את המתח
      - תקרת עצירה ידנית של המתח על תרמוקפל גוף החימום — CONFIRM 250°C (heater_thresholds.body_ceiling, אותה תקרה כמו ב-DVT-SAF-013). אם הגוף מגיע אליה והנתיך לא נפתח, נתק את הרשת במקור; זהו FAIL של הגנת הענף ונרשם ככזה
    equipment:
      - שנאי בידוד / מקור AC מתוכנת, 230 V, ≥3 kVA
      - רשם תרמוקפלים PicoLog TC-08
      - תרמוקפל מסוג K מודבק לגוף החימום (אותה הדבקה כמו ב-DVT-SAF-013), נרשם בקצב המהיר ביותר שמספר הערוצים מאפשר (ערוץ יחיד 5 Hz; לעולם לא פחות מ-1 Hz)
      - מצלמה תרמית
      - נתיכים חלופיים — 0BLF005.T (ענף 5 A), 0215015.MXP (כניסה 15 A)
    preconditions:
      - היחידה בטמפרטורת הסביבה, התא ריק, הדלת סגורה; גוף החימום שטוח בטמפרטורת הסביבה בגרף ה-TC-08
      - בורר המתח מכוון ל-110 V, מאומת חזותית ומצולם; מקור הרשת מכוון ל-230 V נומינלי
      - נתיכים חדשים ומאומתים מותקנים גם במחזיק הכניסה וגם בענף גוף החימום, מספרי החלק נרשמו
      - תרמוקפל גוף החימום נרשם ב-TC-08; שעון ה-TC-08 הוא בסיס הזמן של כל הריצה, וסמן (או קריאת שעון) נלקח בפקודת HEAT
    procedure_steps:
      - רשום את מספרי החלק של הנתיכים ואת מצב הבורר (צלם את שניהם) ואת טמפרטורת גוף החימום במנוחה
      - הפעל את היחידה מרחוק והנח לתוכנה לעלות בלי לפקוד על חימום; גוף החימום חייב להישאר שטוח — שום דבר לא אמור להיות מוזן לפני HEAT
      - פקוד על HEAT ל-80°C ורשום את חותמת הזמן של הפקודה ב-TC-08
      - עקוב אחרי גרף גוף החימום — הוא מטפס בתלילות כל עוד גוף החימום מוזן ביתר; הרגע שבו הוא מתהפך מעלייה לירידה הוא פתיחת הנתיך. heater_off_time הוא מפקודת HEAT עד אותה התהפכות; רשום את טמפרטורת הגוף בהתהפכות ואת השיא שלו. אם הגוף מגיע לתקרה קודם, נתק את הרשת במקור ורשום את העצירה הידנית
      - רשום מה התוכנה דיווחה בזמן שגוף החימום הוזן ביתר ואחרי פתיחת הנתיך — התראה, קוד שגיאה, והזמן מפתיחת הנתיך עד ההתראה (ריק אם לא התריעה כלל)
      - נתק מהמתח, בודד, הנח להתקרר; זהה איזה נתיך נפתח
      - החלף את הנתיך שנפתח, כוון את הבורר ל-230 V, הרץ חימום פונקציונלי לאישור שאין נזק נלווה, וצרף את יומן ה-TC-08
    field_notes:
      body_rising_before_heat: גוף החימום חייב להיות שטוח לפני שפוקדים על HEAT
      heat_command_timestamp: שעון ה-TC-08
      heater_body_drop_observed: התהפכות ברורה מעלייה לירידה נראית בגרף גוף החימום
      heater_off_time: מפקודת HEAT עד ההתהפכות מעלייה לירידה בתרמוקפל גוף החימום = פתיחת הנתיך
      manual_abort_used: הרשת נותקה במקור כי הגוף הגיע לתקרה — FAIL
      software_alarm_time: מפתיחת הנתיך עד התראת התוכנה

  DVT-ENV-001:
    title: בדיקת שינוע בכביש — יחידה מלאה, ארוזה
    purpose: >
      לאמת שיחידה ארוזה שורדת שינוע בכביש ללא שבר זכוכית, ללא נזק מכני או
      פונקציונלי, ועוברת את בדיקת הקבלה הפונקציונלית המלאה בהגעה.
    sample_rationale: >
      עמידות בשינוע היא תכונה של תכן האריזה ומבנה היחידה, שניהם זהים בכל
      היחידות. יחידה יחידה שנשלחת היא הדגימה הסטנדרטית לסימולציית שינוע.
    equipment:
      - רשם נתוני הלם ורעידות תלת-צירי בתוך הארגז
      - מחווני הלם (למשל ShockWatch) ומחווני הטיה על חוץ הארגז
      - רשם טמפרטורה ולחות בתוך הארגז
    preconditions:
      - היחידה ארוזה לפי מפרט דרישות האריזה
      - בדיקת קבלה פונקציונלית מלאה בוצעה ונרשמה לפני המשלוח
      - כל המשטחים האופטיים והזכוכית צולמו לפני האריזה
      - משקל ומידות הארגז נרשמו
    procedure_steps:
      - בצע ורשום את בדיקת הקבלה הפונקציונלית לפני המשלוח
      - התקן את רשם הנתונים והמחוונים; רשום את מיקומם
      - שלח במשאית על המסלול המוגדר
      - בהגעה, צלם את חוץ הארגז וקרא את כל המחוונים לפני הפתיחה
      - פרוק ובדוק — זכוכית, פאנלי LED, משטחים אופטיים, ברגים, מחברים, ניתוב חיווט, יישור דלת ומנעול בטיחות
      - הורד את נתוני רשם ההלם ורשום את תאוצות השיא לכל ציר
      - חזור על בדיקת הקבלה הפונקציונלית המלאה והשווה מול קו הבסיס שלפני המשלוח

  # ---------------------------------------------------------------- ELECTRICAL
  DVT-ELE-001:
    title: רציפות חיבור הארקת הגנה
    purpose: >
      לאמת שכל חלק מוליך נגיש מחובר להדק הארקת ההגנה בהתנגדות נמוכה דיה
      להולכת זרם תקלה עד שהתקן ההגנה פועל.
    equipment:
      - בודק רציפות הארקה / חיבור, המסוגל לזרם הבדיקה הנדרש
      - פרובי Kelvin 4-גידים
    preconditions:
      - היחידה מנותקת ממתח ומרשת החשמל
      - רשימת החלקים המוליכים הנגישים הוכנה מה-BOM המכני (מכסים, פאנלים, מסגרת דלת, ידיות, גוף הכניסה, מעטפת התא, תושבות)
    procedure_steps:
      - רשום את זרם הבדיקה שבשימוש ואת הדירוג של התקן ההגנה במעלה הזרם
      - מדוד מפין ה-PE של כניסת המכשיר לכל חלק מוליך נגיש ברשימה בתורו, דקה אחת לנקודה
      - רשום את ההתנגדות הגבוהה ביותר שנמדדה והיכן התרחשה
      - אמת שמוליך ה-PE אינו מופסק על ידי שום מפסק או נתיך

  DVT-ELE-002:
    title: התנגדות בידוד
    purpose: >
      לקבוע את קו הבסיס של התנגדות הבידוד לפני בדיקת החוזק הדיאלקטרי, ולחזור
      עליה אחרי שינוע ואחרי השהיית העמידות כדי לזהות התדרדרות.
    equipment:
      - בודק התנגדות בידוד, 500 Vdc
    preconditions:
      - היחידה מנותקת ממתח, רשת החשמל מנותקת, מפסק הרשת סגור
      - קבלי Y של מסנן ה-EMC וכל אלקטרוניקה שאינה מדורגת למתח הבדיקה זוהו ובודדו לפי הוראות היצרן
    procedure_steps:
      - קצר את L ו-N יחד בכניסה
      - הזן 500 Vdc בין L+N המקוצרים ל-PE במשך 60 שניות
      - רשום טמפרטורת סביבה ולחות יחסית

  DVT-ELE-003:
    title: חוזק דיאלקטרי (hipot)
    purpose: >
      לאמת שהבידוד בין מעגל הרשת לחלקים נגישים עומד במתח הבדיקה הנדרש ללא
      פריצה.
    safety_plan:
      - בדיקת מתח גבוה — אזור מגודר, מפעיל יחיד, עמדת בדיקה עם מנעול בטיחות, אף אחד לא במגע עם היחידה בזמן הזנת המתח
      - פרוק והארק את היחידה לפני שנוגעים בה אחרי כל הזנה
    equipment:
      - בודק hipot, AC ו-DC, עם זרם ניתוק מתוכנת
    preconditions:
      - חיבור PE (DVT-ELE-001) עבר
      - ניתוח קואורדינציית בידוד זמין, המגדיר מתח עבודה, סוג בידוד (בסיסי / משלים / מחוזק) ומרווח אוויר וזחילה בכל מחסום
      - קבלי Y, הגנת נחשולים וכל רכיב מגביל-מתח זוהו; נותקו או שנעשה שימוש בגרסת ה-DC של הבדיקה
      - היחידה בטמפרטורת הסביבה, יבשה, לא עברה מיזוג לחות קודם
    procedure_steps:
      - רשום את מתח הבדיקה, צורת הגל (AC או DC), קצב הרמפה, זמן השהייה והגדרת זרם הניתוק, ואת הסעיף שממנו הם נגזרים
      - הזן בין מוליכי הרשת המקוצרים ל-PE / חלקים נגישים
      - הזן על פני כל מחסום בידוד נוסף שזוהה בניתוח (רשת ל-SELV, רשת למוצא דרייבר ה-LED)
      - חזור על DVT-ELE-002 לאחר מכן והשווה

  DVT-ELE-004:
    title: זרם מגע
    purpose: >
      לאמת שהזרם הזורם דרך אדם הנוגע בחלקים נגישים נשאר בתוך המגבלות, במצב
      רגיל וכשמוליך הארקת ההגנה פתוח.
    equipment:
      - מד זרם מגע עם רשת המדידה לפי IEC 60990
      - מקור AC משתנה המסוגל להגיע ל-110% מהמתח הנקוב
    preconditions:
      - היחידה מורכבת במלואה, כל המכסים מותקנים
      - בדיקה ב-110% ממתח הרשת הנקוב הגבוה ביותר
    procedure_steps:
      - מדוד במצב רגיל, בשתי קוטביויות הרשת
      - מדוד כשמוליך ה-PE פתוח (מצב תקלה יחידה)
      - מדוד כשהמכונה במנוחה ושוב בעומס מלא (גוף החימום וכל ארבעת דרייברי ה-LED פעילים), ורשום את המקרה הגרוע

  DVT-ELE-005:
    title: זרם כניסה נקוב, הספק כניסה לפי מצב עבודה וזרם התנעה
    purpose: >
      לאמת שזרם הכניסה וההספק הנמדדים תואמים לתווית הדירוג בכל מתח רשת נקוב,
      לתעד בנפרד את הספק הכניסה האמיתי של כל מצב עבודה — גוף חימום בלבד
      (HEAT), LED-ים בלבד (CURE ללא חימום) והמכונה כולה עובדת (גוף החימום
      בהספק מלא ועוד כל ארבעת דרייברי ה-LED) — ולאמת שזרם ההתנעה (inrush)
      אינו פותח את נתיך הכניסה 15 A בעל השהיה ואינו מקפיץ מפסק אוטומטי
      טיפוסי של המתקן.
    equipment:
      - מנתח הספק עם לכידת זרם התנעה
      - מקור AC מתוכנת, 100 / 110 / 230 / 240 V
    preconditions:
      - בורר המתח מותאם למתח המוזן בכל ריצה (מצב 110 V עבור 100 ו-110 V; מצב 220 V עבור 230 ו-240 V)
      - היחידה בטמפרטורת הסביבה בתחילת כל מדידת התנעה
      - התא ריק, הדלת סגורה; נקודת עבודת LED של 405 nm ב-0.75 A למדידות ה-CURE
    procedure_steps:
      - כוון את מקור ה-AC למתח הרשת של השורה; רשום את המתח שנמדד בכניסה ואת מצב הבורר
      - הפעל והנח למכונה להתייצב במצב המתנה; רשום את הספק הכניסה במנוחה
      - חימום בלבד — פקוד HEAT ל-80°C מטמפרטורת הסביבה, וכשגוף החימום בהספק מלא רשום זרם כניסה, הספק אמיתי ומקדם הספק
      - CURE בלבד, ללא חימום — התא בטמפרטורת הסביבה וגוף החימום כבוי, כל ארבעת דרייברי ה-LED בנקודת העבודה; רשום זרם כניסה, הספק אמיתי ומקדם הספק
      - המכונה כולה עובדת — גוף החימום בהספק מלא ועוד כל ארבעת דרייברי ה-LED בנקודת העבודה, כל המאווררים פועלים; רשום את זרם הכניסה, ההספק האמיתי ומקדם ההספק במקרה הגרוע
      - זרם התנעה — מקר, הדלק לפחות שלוש פעמים בזווית הפאזה הגרועה ביותר, ולכוד שיא זרם התנעה, משכו ו-I²t; רשום את הגרוע מבין ההדלקות
      - השווה את ה-I²t מול דירוג נתיך הכניסה ומול אופיין מפסק 16 A מסוג B ומסוג C
      - השווה את הזרם וההספק של המכונה כולה מול תווית הדירוג
    field_notes:
      input_power_idle: מצב המתנה, ללא פקודה
      input_power_heat: גוף החימום בהספק מלא, LED-ים כבויים
      input_power_cure: כל ארבעת דרייברי ה-LED בנקודת העבודה, גוף החימום כבוי
      input_power_all: גוף החימום בהספק מלא ועוד כל ארבעת דרייברי ה-LED — הערך לתווית הדירוג

  DVT-OPT-001:
    title: עוצמת קרינת UV מול הספק ה-LED המפוקד — 405 nm, StarBright על ה-USB של המכונה
    purpose: >
      למדוד את עוצמת הקרינה שהתא מספק בפועל בכל הספק LED מפוקד ב-405 nm —
      מ-30 עד 100% במדרגות של 10% — כשה-Ophir StarBright מחובר ישירות למכונה,
      ולשרטט את עוצמת הקרינה הנמדדת מול הפקודה. התוכנה מתייחסת לפקודה כהספק
      מערכת מכויל; זו העקומה שאומרת אם זה נכון, בכל יחידה: מונוטונית, עד כמה
      ליניארית, ואיך ה-mW/cm2 לכל אחוז יורד לקראת 100% כשהלדים מתחממים.
    equipment:
      - מד הספק Ophir StarBright עם ראש פוטודיודה ל-UV (למשל PD300RM-8W) וכבל ה-USB שלו
      - מתקן אחיזה לראש החיישן במרכז התא, מופנה אל הלדים
    preconditions:
      - כבל ה-USB של ה-StarBright מחובר ליציאת USB פנויה של המכונה (לא של מחשב הקונסולה), המד מופעל
      - המד מכוון ל-405 nm במד עצמו (Setup ← Wavelength)
