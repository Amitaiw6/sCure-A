# DVT Test Catalog — consolidated
# Project: sCure / CureBox DVT
# Schema: SRS-DVT-SW Rev B, Appendix A
# Status: draft — items marked "CONFIRM" require a decision before baseline
#
# This file is the single source of truth for the DVT tool (DVT/dvt_tool).
# Add a test = add an entry under `tests:`; the tool derives the run set,
# the wizard order and the report from it. Do not edit pass_criteria of a
# baselined test without bumping catalog_version.

catalog_version: "0.63"   # quoted so YAML keeps it a string (0.10 would read as the float 0.1)

