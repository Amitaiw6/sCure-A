    - {name: intercept_mw_cm2, unit: mW/cm2, type: float}
    - {name: r2, type: float, range: [0, 1]}
    - {name: max_dev_pct, unit: '%', type: float, note: largest deviation from the fit, as % of the fitted value at 100 %}
    - {name: gain_30, unit: mW/cm2 per %, type: float, note: irradiance / command at 30 %}
    - {name: gain_100, unit: mW/cm2 per %, type: float, note: irradiance / command at 100 % — lower than gain_30 when the curve bends over}
    - {name: monotonic, type: bool, note: every step reads higher than the one before}
    - {name: led_max_c, unit: C, type: float, note: hottest LED thermistor at the end of the 100 % step}
    - {name: graph_attached, type: bool}
  pass_criteria: >
    meter_detected == true AND meter_wavelength_verified == true
    AND all_steps_measured == true AND monotonic == true AND graph_attached == true
  # NOTE: linearity (R², max_dev_pct) and the absolute output at 100 % are
  # recorded, not judged — their limits are CONFIRM (from the resin dose
  # requirement and the LED datasheet). The bench run of 2026-09-14 at 450 nm
  # gave 0.299 mW/cm2 per %, R² 0.993, gain falling from 0.40 to 0.33 —
  # the curve bends over as the LEDs warm; that is why the sweep is short
  # (15 s per step) and starts cold.
  repetitions: 1
  duration_est_min: 15
  dependencies: []

- test_id: DVT-OPT-003
  group: OPT
  title: UV uniformity — UV Uniformity Jig workbook
  subsystem: Optics
  requirement_ids: []          # CONFIRM: link to the UV-uniformity requirement
  method: Test
  # Catalog 0.79 (user, 2026-11-15): "a UV uniformity check in the DVT - it is its own jig, so the DVT is just an upload of
  # the final Excel it produces, with a place to fill in the date". The jig (docs/uv-uniformity-jig-*.zip: two stepper
  # axes, a 270 deg servo aiming the sensor, the Ophir StarBright) maps the irradiance over the chamber volume and writes
  # the scan workbook; the DVT never drives it. Uploading the final workbook with the test date records the run as PASS
  # (user's decision, 2026-11-15) - nothing in the workbook is judged by the DVT.
  record: upload
  purpose: >
    Record, for every unit, the UV irradiance uniformity over the chamber volume as
    measured by the UV Uniformity Jig: the final scan workbook the jig produces is
    kept with the unit's DVT record, together with the date of the scan.
  applicability:
    rule: ALL
  sample_rationale: >
    LED panel placement, driver output and reflector fit are assembly variables, so
    every unit is mapped.
  equipment:
    - name: UV Uniformity Jig (EiBotBoard Y / Z axes, 270 deg sensor servo, its own console)
    - name: Ophir StarBright with the PD300RM-8W head, as used by the jig
  preconditions:
    - The jig set up and run on the unit as its own instructions say (web console, STARTUP.md)
    - The scan complete and saved by the jig (its CSV)
  procedure_steps:
    - step: Run the UV uniformity scan on the jig - the DVT does not run it - and note the date of the scan
      capture: [test_date]
    - step: On sCure Cloud, open this test on the unit's DVT page, press Upload scan file, fill in the date and choose the
        scan file the jig saved (its CSV, or its Excel workbook); the upload records the run
      capture: [workbook_file, workbook_uploaded]
  data_fields:
    - {name: test_date, type: string, note: "the date of the scan (YYYY-MM-DD)"}
    - {name: workbook_file, type: string, note: "the uploaded scan file's name (the jig's CSV or its workbook)"}
    - {name: workbook_uploaded, type: bool, note: "the scan file is on sCure Cloud with the run"}
  pass_criteria: "workbook_uploaded == true"
  repetitions: 1
  duration_est_min: 180
  dependencies: []
