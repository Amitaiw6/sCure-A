# keyed by `id`, in the order listed - in the DVT tool's store, in the runner's results file and in sCure
# Cloud. Old -> new; never edit an applied set, append a new one instead.
#  1. the gaps closed (old SAF-006 and GAS-007 had been removed)
#  2. one running number for every test, in phase order (DVT-001 ... DVT-042)
#  3. back to the category letters, with a running number per category in the list order (user: the names as
