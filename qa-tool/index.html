      const slow = loops.filter(([, sec]) => sec > MAX_SAMPLE_SEC);
      const elapsed = Date.now() - t0;
      const result = slow.length === 0
        ? { status: 'pass', msg: `all ${loops.length} sampling loops at ≤ ${MAX_SAMPLE_SEC}s` }
        : { status: 'fail', msg: `sampling slower than ${MAX_SAMPLE_SEC}s: ${slow.map(([n, s]) => `${n}=${s}s`).join(', ')}` };
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }

    // Mirrors StatusLeds._evaluate + IOBridge.door_abort: the door opening
    // while ANY output is live starts a 10s grace countdown (UI shows it);
    // only if the door STAYS open past the grace is the process aborted and
    // every output forced off. Closing in time resumes; door open while
    // idle, or an unreadable sensor, never aborts.
    // Mirrors CureProcessPage: staleDoorAbortRef is set when doorAborted is
    // already true at run start (and the flag is acknowledged); the abort
    // effect ignores the flag while stale; the ref drops once the machine
    // reports doorAborted=false, after which a new true aborts the run.
    if (test.check === 'cp_stale_door_abort') {
      const model = (apiConnected, atStart, polls) => {
        let stale = false, acked = false, aborted = false;
        if (apiConnected && atStart) { stale = true; acked = true; }
        for (const flag of polls) {
          if (!flag) stale = false;
          if (apiConnected && flag && !stale) aborted = true;
        }
        return { acked, aborted };
      };
      const cases = [
        // [apiConnected, doorAborted at start, polls...] -> {acked, aborted}
        [true,  true,  [true, true, true],        { acked: true,  aborted: false }],  // latched from an earlier run: N2-first program keeps running
        [true,  true,  [true, false, true],       { acked: true,  aborted: true  }],  // cleared, then the door REALLY stays open -> abort
        [true,  false, [false, false, true],      { acked: false, aborted: true  }],  // normal mid-run door abort
        [true,  false, [false, false, false],     { acked: false, aborted: false }],  // nothing happens
        [false, true,  [true, true],              { acked: false, aborted: false }],  // off-Pi: flag never acted on
      ];
      const bad = cases.filter(([c, a, p, exp]) => { const r = model(c, a, p); return r.acked !== exp.acked || r.aborted !== exp.aborted; });
      const elapsed = Date.now() - t0;
      const result = bad.length === 0
        ? { status: 'pass', msg: `${cases.length} start/poll sequences: stale flag acknowledged + ignored, real mid-run abort still stops the program` }
        : { status: 'fail', msg: `wrong stale-flag decision for ${bad.length} case(s)` };
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }

    // Machine check: opening the N2 valve clears a latched door abort.
    if (test.check === 'io_n2_clears_door_abort') {
      let result;
      try {
        const post = (path) => fetch(apiUrl + path, { method: 'POST', signal: AbortSignal.timeout(5000) }).then(r => r.json());
        const state = () => fetch(apiUrl + '/api/state', { signal: AbortSignal.timeout(5000) }).then(r => r.json());
        const open = await post('/api/cure/nitrogen?on=1');
        const st = await state();
        await post('/api/cure/nitrogen?on=0');
        if (!open.ok) result = { status: 'warn', msg: `valve command refused (${open.message || open.code}) — cannot check the latch off-Pi` };
        else if (typeof st.doorAborted !== 'boolean') result = { status: 'fail', msg: 'no doorAborted in /api/state' };
        else if (st.doorAborted) result = { status: 'fail', msg: 'doorAborted still latched after the N2 valve opened' };
        else result = { status: 'pass', msg: 'N2 valve open leaves doorAborted=false (latched abort cleared like any other process start)' };
      } catch (e) {
        result = { status: 'fail', msg: `API error: ${e.message}` };
      }
      const elapsed = Date.now() - t0;
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      return;
    }

    if (test.check === 'io_door_abort') {
      const shouldAbort = (doorOpen, outputs, openSec, graceSec = 10) =>
        doorOpen === true && Object.values(outputs).some(Boolean) && openSec >= graceSec;
      const cases = [
        // [doorOpen, outputs, seconds-open] -> abort?
        [true,  { heater: true },           12, true],   // heating, past grace -> abort
        [true,  { uv: true },               10, true],   // exactly at grace -> abort
        [true,  { cooling: true },          15, true],   // cooling, past grace -> abort
        [true,  { fan: true },              11, true],   // manual fan -> abort
        [true,  { heater: true },            3, false],  // closed in time: keep running
        [true,  { uv: true },                9, false],  // still inside the grace
        [true,  {},                         60, false],  // idle: nothing to abort
        [false, { heater: true, uv: true }, 60, false],  // door closed: run on
        [null,  { heater: true },           60, false],  // unreadable: no false abort
      ];
      const bad = cases.filter(([d, o, s, expect]) => shouldAbort(d, o, s) !== expect);
      const elapsed = Date.now() - t0;
      const result = bad.length === 0
        ? { status: 'pass', msg: `${cases.length} door/output/grace combinations abort exactly when they should (10s grace, Err 6016)` }
        : { status: 'fail', msg: `wrong abort decision for ${bad.length} case(s)` };
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }

    // Mirrors StatusLeds in server/io_bridge.py: the RGB strip shows machine
    // status — fault (blink red) > door open (blink) > busy (purple comet
    // moving right-to-left while heating/cooling/UV run) > normal (solid).
    // door_open === null (unreadable sensor) is NOT "open".
    if (test.check === 'io_rgb_status') {
      const mode = (fault, doorOpen, busy, internet = true) =>
        fault ? 'fault' : (doorOpen === true ? 'door'
          : (busy ? (internet ? 'busy' : 'busy_no_net')
                  : (!internet ? 'no_net' : 'normal')));
      const frame = (m, phase, colors) =>
        m === 'fault' ? (phase ? colors.fault : 'off')
        : m === 'door' ? (phase ? colors.door : 'off')
        : m === 'busy' ? 'comet'
        : m === 'busy_no_net' ? 'blue-comet'
        : m === 'no_net' ? colors.noNet
        : colors.normal;
      const C = { normal: 'green', fault: 'red', door: 'orange', noNet: 'blue' };
      const cases = [
        // [fault, doorOpen, busy, internet] -> expected mode
        [null, false, false, true, 'normal'],       // all OK -> solid normal color
        [null, true, false, true, 'door'],          // door open -> door blink
        ['heater fan', true, true, true, 'fault'],  // fault beats door and busy
        [null, true, true, true, 'door'],           // door beats busy
        [null, false, true, true, 'busy'],          // process running -> moving purple
        [null, null, false, true, 'normal'],        // unreadable sensor stays normal
        [null, false, false, false, 'no_net'],      // idle + no internet -> solid blue
        [null, false, true, false, 'busy_no_net'],  // process offline -> BLUE comet
        ['fan', false, false, false, 'fault'],      // fault beats no-internet
      ];
      const bad = cases.filter(([f, d, bz, net, expect]) => mode(f, d, bz, net) !== expect);
      // Comet frame: head at n-1-offset moves right-to-left, tail fades behind
      const cometHead = (n, offset) => (n - 1 - offset) % n;
      const chaseOk = cometHead(21, 0) === 20 && cometHead(21, 1) === 19 && cometHead(21, 21) === 20;
      const blinkOk =
        frame('fault', true, C) === 'red' && frame('fault', false, C) === 'off' &&   // fault blinks
        frame('door', true, C) === 'orange' && frame('door', false, C) === 'off' &&  // door blinks
        frame('busy', true, C) === 'comet' && frame('busy', false, C) === 'comet' && // busy always animates
        frame('busy_no_net', true, C) === 'blue-comet' &&                            // offline process: blue comet
        frame('no_net', true, C) === 'blue' && frame('no_net', false, C) === 'blue' && // idle no-internet solid
        frame('normal', true, C) === 'green' && frame('normal', false, C) === 'green'; // normal solid
      const elapsed = Date.now() - t0;
      const result = bad.length === 0 && blinkOk && chaseOk
        ? { status: 'pass', msg: 'fault > door > busy > no-internet > normal priority; blink + right-to-left comet correct' }
        : { status: 'fail', msg: bad.length ? `wrong mode for: ${bad.map(c => `fault=${c[0]},door=${c[1]},busy=${c[2]},net=${c[3]}`).join('; ')}` : (!chaseOk ? 'comet direction wrong' : 'blink pattern wrong') };
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }

    // Mirrors CureProcessPage: during a cure/bleacher ramp only the heater
    // runs (deferUv); the UV command is sent when chamberTemp >= target-0.5.
    // A step with uvStartMode 'at-start' ("On ramp start") never defers —
    // cure_uv heats AND lights the LEDs from the start of the ramp.
    if (test.check === 'uv_after_ramp') {
      const uvAllowed = (chamberTemp, target, ramping) => !ramping || chamberTemp >= target - 0.5;
      const deferUv = (stepTemp, chamberTemp, uvStartMode) =>
        stepTemp != null && stepTemp > chamberTemp && uvStartMode !== 'at-start';
      const cases = [
        // [stepTemp, chamberTemp at start, uvStartMode] -> UV deferred?
        [45, 25, 'at-target', true],    // cold chamber: heat first, UV waits
        [45, 44.8, 'at-target', false], // already at target: UV allowed immediately
        [null, 30, 'at-target', false], // no temperature on the step: UV immediately
        [45, 25, 'at-start', false],    // On ramp start: UV lights with the ramp
        [80, 30, 'at-start', false],    // On ramp start beats any temperature gap
        [45, 25, undefined, true],      // legacy step without the field: defaults to at-target
      ];
      const bad = cases.filter(([t, c, m, expect]) => deferUv(t, c, m) !== expect);
      const gateOk = uvAllowed(44.5, 45, true) && !uvAllowed(44.4, 45, true) && uvAllowed(20, 45, false);
      const elapsed = Date.now() - t0;
      const result = bad.length === 0 && gateOk
        ? { status: 'pass', msg: 'at-target defers UV until the target temp; at-start lights the UV from ramp start' }
        : { status: 'fail', msg: `wrong UV gating for: ${bad.map(c => `step ${c[0]}°C @ ${c[1]}°C (${c[2]})`).join(', ') || 'threshold check'}` };
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }

    // Mirrors CureProcessPage telemetry + the CureHistory Download button:
    // the sampler takes one sample at t=0 and one every 5s, reading live
    // values through a ref. The buggy design kept those values in the effect
    // deps, so the 1s status poll re-created the interval every second — the
    // 5s timer never fired, runs got ZERO samples and no report. The
    // Download button shows only when a run has at least one sample.
    if (test.check === 'telemetry_report') {
      // samples(run, resetEvery, t0): resetEvery simulates the interval being
      // re-created by a dep change every N seconds (Infinity = stable ref
      // design); t0 = whether a sample is taken immediately on start.
      const samples = (runSeconds, resetEvery, t0) => {
        let n = t0 ? 1 : 0, sinceReset = 0, sinceSample = 0;
        for (let t = 1; t <= runSeconds; t++) {
          sinceReset++; sinceSample++;
          if (sinceSample >= 5) { n++; sinceSample = 0; }
          if (sinceReset >= resetEvery) { sinceSample = 0; sinceReset = 0; }
        }
        return n;
      };
      const canDownload = (n) => n > 0;                       // CureHistoryPage gate
      const buggy9s = samples(9, 1, false);                   // old design, 1s polling
      const cases = [
        // [runSeconds] -> expected samples with the fixed design
        [3, 1],    // aborted seconds in: still gets the t=0 sample -> report
        [9, 2],    // the reported "ggg" case: t=0 + t=5
        [60, 13],  // full minute: t=0 + 12 five-second samples
      ];
      const bad = cases.filter(([run, expect]) => samples(run, Infinity, true) !== expect);
      const bugReproduced = buggy9s === 0 && !canDownload(buggy9s);
      const allDownloadable = cases.every(([run]) => canDownload(samples(run, Infinity, true)));
      const elapsed = Date.now() - t0;
      const result = bad.length === 0 && bugReproduced && allDownloadable
        ? { status: 'pass', msg: 'sampler survives 1s polling; every run (even a seconds-long abort) has a downloadable report' }
        : { status: 'fail', msg: bad.length ? `wrong sample count for: ${bad.map(c => `${c[0]}s run`).join(', ')}` : (!bugReproduced ? 'buggy design not reproduced' : 'download gate wrong') };
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }

    // Mirrors AbortModal: every stop confirmation carries all four messages
    // (ends now / cannot resume, appearance, shape, hot-chamber caution); the
    // caution switches from a generic "may still be warm" to the live reading
    // at ABORT_HOT_CHAMBER_C (40°C) and above.
    if (test.check === 'abort_confirm_warnings') {
      const HOT = 40;
      const caution = (t) => t != null && t >= HOT ? `hot:${Math.round(t)}` : 'warm';
      const cases = [
        // [chamberTemp] -> caution variant
        [22, 'warm'],      // idle-cold chamber: generic note
        [39.9, 'warm'],    // just under the threshold
        [40, 'hot:40'],    // at threshold: live temperature shown
        [62.4, 'hot:62'],  // hot cure: rounded live temperature
        [null, 'warm'],    // no reading (off-Pi): generic note, never crashes
      ];
      const bad = cases.filter(([t, e]) => caution(t) !== e);
      const messages = (t) => ['ends immediately / cannot be resumed', 'appearance and surface finish', 'warp or lose its shape', caution(t)];
      const alwaysAll = [22, 62.4, null].every(t => messages(t).length === 4);
      // caution wording mirrors the machine's CAUTION label: hot surfaces inside → wear gloves, avoid contact
      const cautionText = (t) => t != null && t >= HOT ? 'Wear heat-resistant gloves and avoid contact' : 'wear gloves when handling';
      const glovesOk = /gloves/.test(cautionText(62)) && /gloves/.test(cautionText(22)) && /avoid contact/.test(cautionText(62));
      // the caution block always carries the hot-surface pictogram (HotSurfaceSign), hot or warm
      const pictogram = (t) => 'hot-surface-sign';
      const signOk = [22, 62, null].every(t => pictogram(t) === 'hot-surface-sign');
      if (!signOk) throw new Error('hot-surface pictogram missing');
      const buttonsOk = ['Keep Running', 'Yes, Stop'].length === 2 && glovesOk;   // no pause inside the abort dialog
      const elapsed = Date.now() - t0;
      const result = bad.length === 0 && alwaysAll && buttonsOk
        ? { status: 'pass', msg: 'stop confirmation lists resume/appearance/shape warnings + hot-chamber caution (live °C from 40°C)' }
        : { status: 'fail', msg: bad.length ? `wrong caution for: ${bad.map(c => `${c[0]}°C`).join(', ')}` : 'warning list incomplete' };
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }

    // Mirrors cure-report.ts status colors + CureHistoryPage/Home badges: a
    // stopped (aborted) run reads "Stopped" in orange everywhere; green is
    // reserved for completed runs (including the export ✓ feedback).
    if (test.check === 'stopped_run_colors') {
      const reportDot = (st) => st === 'completed' ? '#16A34A' : st === 'aborted' ? '#EA580C' : st === 'running' ? '#D97706' : '#DC2626';
      const reportLabel = (st) => st === 'aborted' ? 'Stopped' : st.charAt(0).toUpperCase() + st.slice(1);
      const uiTone = (st) => st === 'completed' ? 'green' : st === 'aborted' ? 'orange' : st === 'error' ? 'red' : 'primary';
      const exportCheckTone = (st) => st === 'completed' ? 'green' : 'orange';
      const GREEN = '#16A34A';
      const cases = [
        // [status, report dot, label, ui tone, export ✓ tone]
        ['completed', GREEN, 'Completed', 'green', 'green'],
        ['aborted', '#EA580C', 'Stopped', 'orange', 'orange'],
        ['error', '#DC2626', 'Error', 'red', 'orange'],
      ];
      const bad = cases.filter(([st, dot, label, tone, chk]) =>
        reportDot(st) !== dot || reportLabel(st) !== label || uiTone(st) !== tone || exportCheckTone(st) !== chk);
      const neverGreen = reportDot('aborted') !== GREEN && uiTone('aborted') !== 'green' && exportCheckTone('aborted') !== 'green';
      const elapsed = Date.now() - t0;
      const result = bad.length === 0 && neverGreen
        ? { status: 'pass', msg: 'stopped runs are "Stopped" in orange in the report, Cure History and Home; green only for completed' }
        : { status: 'fail', msg: bad.length ? `wrong color/label for: ${bad.map(c => c[0]).join(', ')}` : 'a stopped run can still show green' };
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }

    // Mirrors CureProcessPage handlePause/handleResume + the io_bridge door
    // watchdog (outputs_on = heater|cooling|uv|n2|bofa|any fan duty > 0).
    if (test.check === 'pause_resume') {
      const t0Wall = t0;
      // watchdog: abort only when the door stays open past the grace WITH a live output
      const watchdogAborts = (outputs, secondsOpen) => Object.values(outputs).some(Boolean) && secondsOpen >= 10;
      const pausedOutputs = { heater: false, cooling: false, uv: false, n2: false, bofa: false, fanDuty: false }; // stop(immediate) → no fan run-on
      const runOnOutputs = { ...pausedOutputs, fanDuty: true };                                                 // stop() without immediate keeps the heater fan
      const watchdogOk = !watchdogAborts(pausedOutputs, 120) && watchdogAborts(runOnOutputs, 12) && watchdogAborts({ heater: true }, 10);
      // clocks: every anchor shifts by the pause length → elapsed is unchanged across the pause
      const elapsedOf = (anchor, now) => Math.floor((now - anchor) / 1000);
      const a0 = 1000, pauseAt = 61000, resumeAt = 181000;           // paused 120 s, 60 s into the step
      const before = elapsedOf(a0, pauseAt);
      const after = elapsedOf(a0 + (resumeAt - pauseAt), resumeAt);
      const clocksOk = before === 60 && after === 60;
      // Continue gate: real door sensor must read closed; off-Pi (no sensor) always allowed
      const canContinue = (apiConnected, doorClosed) => !apiConnected || doorClosed === true;
      const gateOk = canContinue(true, true) && !canContinue(true, false) && !canContinue(true, null) && canContinue(false, false);
      // resume command = what the phase was doing: mid-ramp at-target → heat only (UV still deferred); hold or at-start → cure_uv; N2 → valve open
      const resumeCmd = (type, ramping, uvStart) => type === 'nitrogen' ? 'n2_valve_open'
        : (type === 'cure' || type === 'bleacher') ? ((ramping && uvStart !== 'at-start') ? 'heat' : 'cure_uv')
        : type === 'cooling' ? 'cool' : 'heat';
      const cmdOk = resumeCmd('cure', true, 'at-target') === 'heat' && resumeCmd('cure', true, 'at-start') === 'cure_uv'
        && resumeCmd('cure', false, 'at-target') === 'cure_uv' && resumeCmd('nitrogen', false) === 'n2_valve_open'
        && resumeCmd('cooling', false) === 'cool' && resumeCmd('drying', false) === 'heat';
      // while paused: tick, phase-advance, stall check and door countdown are all frozen; telemetry logs uvOn=false
      const frozen = { tick: false, advance: false, stall: false, doorCountdown: false, uvOnInTelemetry: false };
      const frozenOk = Object.values(frozen).every(v => v === false);
      const elapsedMs = Date.now() - t0Wall;
      const result = watchdogOk && clocksOk && gateOk && cmdOk && frozenOk
        ? { status: 'pass', msg: 'pause = outputs off + door released (watchdog silent), clocks frozen; Continue only with door closed, anchors shifted, heater/UV/N2 re-commanded' }
        : { status: 'fail', msg: !watchdogOk ? 'door watchdog model wrong' : !clocksOk ? 'clock anchors not shifted by the pause' : !gateOk ? 'Continue gate wrong' : !cmdOk ? 'resume command wrong' : 'something still runs while paused' };
      setTestStatus(test.id, result.status, result.msg, elapsedMs);
      log(result.status, test.name + ': ' + result.msg + ' (' + elapsedMs + 'ms)');
      await new Promise(r => setTimeout(r, 50));
      return;
    }

    // Mirrors generateCureReport routing + the export-report endpoint contract:
    // ok → written to USB; server answered with a code (9081 no USB / 9082
    // write failed) → raise the alert, NO silent browser fallback; no code
    // (dev / API unreachable) → browser download. Filename is forced to .html.
    if (test.check === 'report_usb_export') {
      const route = (ok, code) => ok ? 'usb' : code ? 'alert' : 'browser';
      const cases = [
        // [server ok, error code] -> expected action
        [true, undefined, 'usb'],      // stick present: file lands on the USB
        [false, 9081, 'alert'],        // no stick: alert 9081, nothing downloads
        [false, 9082, 'alert'],        // write failed: alert 9082
        [false, undefined, 'browser'], // dev / server down: browser download
      ];
      const bad = cases.filter(([ok, code, expect]) => route(ok, code) !== expect);
      const forceHtml = (name) => name.toLowerCase().endsWith('.html') ? name : name + '.html';
      const nameOk = forceHtml('cure-report-x-2026-08-06.html') === 'cure-report-x-2026-08-06.html'
        && forceHtml('report') === 'report.html';
      const validCodes = [9081, 9082].every(c => c >= 9080 && c <= 9099);   // storage/backend range
      const elapsed = Date.now() - t0;
      const result = bad.length === 0 && nameOk && validCodes
        ? { status: 'pass', msg: 'USB write when present; 9081/9082 alert with no silent fallback; browser download only off-machine' }
        : { status: 'fail', msg: bad.length ? `wrong routing for: ${bad.map(c => `ok=${c[0]},code=${c[1]}`).join('; ')}` : 'filename/code contract broken' };
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }

    // Mirrors the dialog portal fix: dialogs portal into the scaled #root
    // canvas, so a 550x460 dialog occupies the same PROPORTION of any screen
    // (550/800 x 460/480) instead of a fixed unscaled pixel box.
    // Mirrors PhaseCard.tsx: Pause button = white fill + border-2 in the
    // active phase's config.borderColor (the card's own border colour).
    if (test.check === 'ui_pause_button_style') {
      const borderColor = { heating: 'border-orange-500', drying: 'border-blue-500', cure: 'border-purple-500', cooling: 'border-teal-500', bleacher: 'border-cyan-400', nitrogen: 'border-white' };
      const pauseClass = (type) => `bg-white text-neutral-900 border-2 hover:bg-white/90 hover:text-neutral-900 text-xs px-4 ${borderColor[type]}`;
      const bad = Object.keys(borderColor).filter((type) => {
        const cls = pauseClass(type).split(' ');
        const cardBorder = `border-2 ${borderColor[type]}`.split(' ');
        return !cls.includes('bg-white') || !cardBorder.every((c) => cls.includes(c)) || cls.some((c) => c.startsWith('border-cyan-500'));
      });
      const elapsed = Date.now() - t0;
      const result = bad.length === 0
        ? { status: 'pass', msg: 'white Pause button, outline follows the state colour for all 6 phase types' }
        : { status: 'fail', msg: `wrong Pause styling for: ${bad.join(', ')}` };
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }

    // Mirrors HomePage.tsx: doorOpen = hw.doorClosed === false;
    // canStart = !!activeMaterialId && !doorOpen; disabled -> grey + inert.
    if (test.check === 'ui_start_door_gate') {
      const canStart = (materialId, doorClosed) => !!materialId && !(doorClosed === false);
      const buttonLook = (materialId, doorClosed) => (canStart(materialId, doorClosed) ? 'primary' : 'grey');
      const cases = [
        // [materialId, doorClosed, expectStart, expectLook]
        ['ST45', true, true, 'primary'],      // program + door closed: go
        ['ST45', false, false, 'grey'],       // door open: blocked, grey
        [null, true, false, 'grey'],          // no program: blocked, grey
        [null, false, false, 'grey'],         // neither
        ['ST45', null, true, 'primary'],      // no door reading yet: not blocked
        ['ST45', undefined, true, 'primary'],
      ];
      const bad = cases.filter(([m, d, s, l]) => canStart(m, d) !== s || buttonLook(m, d) !== l);
      let live = null;
      try { const s = await dvtrState(); live = s.doorClosed; } catch (e) { live = null; }
      const elapsed = Date.now() - t0;
      const result = bad.length === 0
        ? { status: 'pass', msg: `start allowed only with a program AND door closed (live doorClosed=${live}); grey + inert otherwise` }
        : { status: 'fail', msg: `wrong gate for: ${bad.map(c => `material=${c[0]} door=${c[1]}`).join(', ')}` };
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }

    // Mirrors HomePage.tsx: the Start Cure button = the standard shadcn
    // button (h-9 / text-sm / 16 px icon / px-5) scaled by 1.5 in every dimension.
    if (test.check === 'ui_start_button_size') {
      const STD = { h: 36, text: 14, icon: 16, px: 20 };
      const BIG = { h: 54, text: 21, icon: 24, px: 30 };        // h-[54px] text-[21px] size={24} px-[30px]
      const problems = [];
      for (const k of Object.keys(STD)) {
        const ratio = BIG[k] / STD[k];
        if (Math.abs(ratio - 1.5) > 0.01) problems.push(`${k}: ${BIG[k]}/${STD[k]} = ${ratio.toFixed(2)} (expected 1.5)`);
      }
      const BOTTOM_PAD = 80, OFFSET = 16;                        // main pb-20, fixed bottom-4
      if (BOTTOM_PAD < BIG.h + OFFSET) problems.push(`list bottom padding ${BOTTOM_PAD}px does not clear the ${BIG.h}px button at ${OFFSET}px`);
      const elapsed = Date.now() - t0;
      const result = problems.length === 0
        ? { status: 'pass', msg: `Start Cure button 1.5x: ${BIG.h}px tall, ${BIG.text}px text, ${BIG.icon}px icon, ${BIG.px}px padding; list clears it` }
        : { status: 'fail', msg: problems.join('; ') };
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }

    if (test.check === 'ui_builder_size') {
      const DIALOG = { w: 550, h: 460 }, CANVAS = { w: 800, h: 480 };
      const propW = DIALOG.w / CANVAS.w, propH = DIALOG.h / CANVAS.h;   // scale-invariant
      const screens = [[1280, 720], [1920, 1080], [800, 480]];
      // On every screen the scaled dialog keeps the design proportions
      const bad = screens.filter(([sw, sh]) => {
        const onScreenW = DIALOG.w * (sw / CANVAS.w) / sw;   // = propW for all screens
        const onScreenH = DIALOG.h * (sh / CANVAS.h) / sh;   // = propH
        return Math.abs(onScreenW - propW) > 1e-9 || Math.abs(onScreenH - propH) > 1e-9;
      });
      const propOk = propW > 0.6 && propW < 0.8 && propH > 0.9;   // design: ~69% x ~96%
      const elapsed = Date.now() - t0;
      const result = bad.length === 0 && propOk
        ? { status: 'pass', msg: `dialog holds ${Math.round(propW * 100)}% x ${Math.round(propH * 100)}% of every screen (design proportions)` }
        : { status: 'fail', msg: bad.length ? 'dialog proportion changes between screens' : `unexpected proportions ${Math.round(propW * 100)}% x ${Math.round(propH * 100)}%` };
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }

    // Mirrors fitToScreen() in main.tsx: the fixed 800x480 design canvas is
    // scaled to fill the whole viewport, on every screen of the app at once.
    if (test.check === 'ui_fill_scale') {
      const fit = (w, h) => `${w / 800} ${h / 480}`;
      const cases = [
        [1280, 720, '1.6 1.5'],    // the device's DSI panel (720x1280 rotated)
        [800, 480, '1 1'],         // native design size
        [1920, 1080, '2.4 2.25'],  // Windows desktop fullscreen
      ];
      const bad = cases.filter(([w, h, expect]) => fit(w, h) !== expect);
      const elapsed = Date.now() - t0;
      const result = bad.length === 0
        ? { status: 'pass', msg: `${cases.length} viewports stretch to full screen (no black margins)` }
        : { status: 'fail', msg: `wrong scale for: ${bad.map(c => `${c[0]}x${c[1]}`).join(', ')}` };
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }

    // Live chamber-temperature ramp: after a heat command, /api/state
    // chamberTemp must move toward the target (real thermistor on the Pi,
    // thermal simulation off-board). This is the value the Cure screen shows.
    if (test.check === 'temp_ramp_live') {
      const readState = async () => {
        const r = await fetch(apiUrl + '/api/state', { signal: AbortSignal.timeout(5000) });
        return r.json();
      };
      const before = await readState();
      const cmdRes = await fetch(apiUrl + '/api/cure/heat?target=40', { method: 'POST', signal: AbortSignal.timeout(5000) });
      const cmd = await cmdRes.json();
      if (!cmd.ok) {
        const elapsed = Date.now() - t0;
        setTestStatus(test.id, 'warn', `Heat command refused: ${cmd.message || 'unknown'}`, elapsed);
        log('warn', `${test.name}: heat command refused (${cmd.message || 'unknown'})`);
        return;
      }
      setTestStatus(test.id, 'running', 'Heating — sampling for 8s...', '');
      await new Promise(r => setTimeout(r, 8000));
      const after = await readState();
      await fetch(apiUrl + '/api/cure/stop', { method: 'POST', signal: AbortSignal.timeout(5000) }).catch(() => {});
      const elapsed = Date.now() - t0;
      const b = before.chamberTemp, a = after.chamberTemp;
      let result;
      if (typeof a !== 'number') result = { status: 'fail', msg: 'No chamberTemp in /api/state' };
      else if (a >= 39.5) result = { status: 'pass', msg: `At target: ${a}°C` };
      else if (a - b >= 0.3) result = { status: 'pass', msg: `${b}°C → ${a}°C (rising toward 40°C)` };
      else result = { status: 'fail', msg: `chamberTemp not moving toward target: ${b}°C → ${a}°C` };
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 100));
      return;
    }

    // Cooling control type: NO closed-loop rate control — each UI mode holds
    // the chamber fan at a FIXED duty for the whole mode (slow=30%,
    // medium=60%, fast=100%; io_bridge COOLING_MODE_PWMS / components.json
    // cooling.mode_pwms). Verified live via coolingFanPwm in /api/state.
    if (test.check === 'io_cool_pwm') {
      const EXPECTED = { slow: 30, medium: 60, fast: 100 };
      const problems = [];
      let checked = 0;
      for (const [mode, pwm] of Object.entries(EXPECTED)) {
        const cmd = await (await fetch(apiUrl + `/api/cure/cool?target=20&mode=${mode}`, { method: 'POST', signal: AbortSignal.timeout(5000) })).json();
        if (!cmd.ok) { problems.push(`${mode}: refused (${cmd.message || 'unknown'})`); continue; }
        await new Promise(r => setTimeout(r, 500));
        const st = await (await fetch(apiUrl + '/api/state', { signal: AbortSignal.timeout(5000) })).json();
        if (!st.isCooling && st.chamberTemp <= 21) continue;   // already at target: nothing to measure
        checked++;
        if (st.coolingFanPwm !== pwm) problems.push(`${mode}: fan ${st.coolingFanPwm}% (expected ${pwm}%)`);
      }
      await fetch(apiUrl + '/api/cure/stop', { method: 'POST', signal: AbortSignal.timeout(5000) }).catch(() => {});
      const elapsed = Date.now() - t0;
      const result = problems.length > 0
        ? { status: 'fail', msg: problems.join('; ') }
        : checked === 0
          ? { status: 'warn', msg: 'chamber already at/below 20°C — fixed duty not measurable live' }
          : { status: 'pass', msg: `fan duty fixed per mode (${checked}/3 verified): slow=30%, medium=60%, fast=100%` };
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 100));
      return;
    }

    // Cure screen ramp logic (mirrors CureProcessPage.tick with real hardware):
    // the ramp ends ONLY when the measured chamber temperature reaches
    // target - 0.5, never on a timer.
    if (test.check === 'temp_ramp_logic') {
      const rampState = (chamberTemp, targetTemp) => chamberTemp >= targetTemp - 0.5 ? 'hold' : 'ramping';
      const cases = [
        [25, 45, 'ramping'], [44.4, 45, 'ramping'], [44.5, 45, 'hold'],
        [45, 45, 'hold'], [47, 45, 'hold'], [26, 80, 'ramping'],
      ];
      const bad = cases.filter(([temp, target, expect]) => rampState(temp, target) !== expect);
      const elapsed = Date.now() - t0;
      const result = bad.length === 0
        ? { status: 'pass', msg: `${cases.length} ramp/hold transitions follow the measured temp` }
        : { status: 'fail', msg: `${bad.length} wrong transition(s): ${bad.map(c => `${c[0]}°C→${c[1]}°C`).join(', ')}` };
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }

    // Cure screen timer (mirrors CureProcessPage.tick): elapsed seconds come
    // from a performance.now() anchor, so ticks that fire late — the kiosk
    // browser under load runs setInterval(1000) at 1050-1200ms — do not
    // stretch the phase. Counting ticks (the old bug) would.
    if (test.check === 'timer_wallclock') {
      const elapsedAt = (nowMs, anchorMs) => Math.floor((nowMs - anchorMs) / 1000);
      const problems = [];
      // 10 ticks each 15% late: wall-clock 11.5s. Tick-counting would say 10.
      let now = 0; const anchor = 0;
      for (let i = 0; i < 10; i++) now += 1150;
      if (elapsedAt(now, anchor) !== 11) problems.push(`late ticks: got ${elapsedAt(now, anchor)}s, want 11s`);
      // A missed tick (browser throttling): next tick catches up to wall-clock.
      if (elapsedAt(5000 + 2000, 5000 - 3000) !== 5) problems.push('missed tick did not catch up');
      // Re-anchor carries already-elapsed seconds (ramp→hold handoff).
      const reAnchor = 90000 - 42 * 1000;
      if (elapsedAt(90000, reAnchor) !== 42) problems.push('re-anchor lost carried seconds');
      // Clamp at the phase maximum, as the page does with Math.min(maxSec, …).
      if (Math.min(120, elapsedAt(300000, 0)) !== 120) problems.push('no clamp at maxSec');
      const elapsed = Date.now() - t0;
      const result = problems.length === 0
        ? { status: 'pass', msg: 'anchored elapsed matches wall-clock under late, missed, and re-anchored ticks' }
        : { status: 'fail', msg: problems.join('; ') };
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }

    // ---------------- Developer Mode ----------------
    if (test.check === 'dev_auth_logic') {
      // Mirror of DevModeContext / TopBar logic: press counter → PIN → session-only flag
      const PASSWORD = '8176';
      const state = { presses: 0, pinOpen: false, devMode: false, store: {} };
      const press = () => { state.presses++; if (state.presses >= 10) { state.pinOpen = true; state.presses = 0; } };
      const auth = (pin) => { if (pin === PASSWORD) { state.devMode = true; state.pinOpen = false; return true; } return false; };
      const problems = [];
      for (let k = 0; k < 9; k++) press();
      if (state.pinOpen) problems.push('PIN screen opened before the 10th press');
      press();
      if (!state.pinOpen) problems.push('PIN screen did not open on the 10th press');
      if (auth('1234') || state.devMode) problems.push('wrong PIN activated Developer Mode');
      if (!auth(PASSWORD) || !state.devMode) problems.push('8176 did not activate Developer Mode');
      if (Object.keys(state.store).length) problems.push('dev-mode flag was persisted');
      const restarted = { devMode: false };           // fresh page load: in-memory flag is gone
      if (restarted.devMode) problems.push('Developer Mode survived restart');
      const elapsed = Date.now() - t0;
      const result = problems.length ? { status: 'fail', msg: problems.join('; ') }
        : { status: 'pass', msg: '10 presses → PIN, 8176 accepted, wrong PIN refused, OFF after restart' };
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      return;
    }

    if (test.check === 'dev_led_cal_persist') {
      const url = apiUrl + '/api/dev/led-calibration';
      const get = () => fetch(url, { signal: AbortSignal.timeout(5000) }).then(r => r.json());
      const post = (factors) => fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ factors }), signal: AbortSignal.timeout(5000) }).then(r => r.json()).catch(() => ({ ok: false }));
      const orig = await get().catch(() => null);
      const problems = [];
      const zones = ['back', 'door', 'left', 'right'];
      if (!orig || !orig.factors || !zones.every(z => typeof orig.factors[z] === 'number')) {
        const elapsed = Date.now() - t0;
        setTestStatus(test.id, 'fail', 'GET did not return {factors:{back,door,left,right}}', elapsed);
        log('fail', `${test.name}: bad GET response`);
        return;
      }
      const probe = { back: 1.0, door: 0.92, left: 0.97, right: 0.95 };
      const saved = await post(probe);
      const after = await get().catch(() => null);
      const persisted = after && zones.every(z => Math.abs(after.factors[z] - probe[z]) < 1e-6);
      if (!saved.ok) problems.push('POST valid factors was refused');
      if (!persisted) problems.push('factors did not read back as saved');
      const bad = await post({ back: 1.0, door: 2.5, left: 0.97, right: 0.95 });
      if (bad.ok) problems.push('out-of-range factor 2.5 was accepted');
      await post(orig.factors);                       // restore the real calibration
      const elapsed = Date.now() - t0;
      const result = problems.length ? { status: 'fail', msg: problems.join('; ') }
        : { status: 'pass', msg: 'four factors saved, re-read unchanged, out-of-range rejected, originals restored' };
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      return;
    }

    if (test.check === 'dev_led_scaling') {
      const url = apiUrl + '/api/dev/led-power';
      const drive = (power, factors) => fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ power, factors }), signal: AbortSignal.timeout(5000) }).then(r => r.json()).catch(() => null);
      const problems = [];
      const f = { back: 1.0, door: 0.92, left: 0.97, right: 0.95 };
      const r50 = await drive(50, f);
      const want = { back: 50.0, door: 46.0, left: 48.5, right: 47.5 };
      if (!r50 || !r50.outputs) problems.push('no outputs in the 50% response');
      else for (const z of Object.keys(want)) if (Math.abs(r50.outputs[z] - want[z]) > 0.01) problems.push(`${z}: ${r50.outputs[z]} != ${want[z]}`);
      const rClamp = await drive(100, { back: 1.5, door: 1.0, left: 1.0, right: 1.0 });
      if (!rClamp || !rClamp.outputs || rClamp.outputs.back > 100) problems.push('100% x 1.5 not clamped to 100%');
      const rBad = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ power: 150 }), signal: AbortSignal.timeout(5000) }).catch(() => null);
      if (!rBad || rBad.ok) problems.push('power 150% was accepted');
      const off = await drive(0);
      if (!off || !off.ok) problems.push('LEDs could not be returned to OFF');
      const elapsed = Date.now() - t0;
      const result = problems.length ? { status: 'fail', msg: problems.join('; ') }
        : { status: 'pass', msg: '50% → 50.0/46.0/48.5/47.5, clamp at 100%, >100% refused, LEDs OFF' };
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      return;
    }

    if (test.check === 'dev_picolog_status') {
      const st = await fetch(apiUrl + '/api/dev/picolog/status', { signal: AbortSignal.timeout(5000) }).then(r => r.json()).catch(() => null);
      const problems = [];
      if (!st) problems.push('endpoint unreachable');
      else {
        if (typeof st.connected !== 'boolean') problems.push('connected is not a boolean');
        if (typeof st.ch1Available !== 'boolean') problems.push('ch1Available is not a boolean');
        if (st.ch1Available && !(typeof st.temperature === 'number' && isFinite(st.temperature))) problems.push('CH1 available but temperature is not a finite number');
        if (!st.ch1Available && st.temperature !== null) problems.push('CH1 unavailable but a temperature is published');
        if (!st.ch1Available && !st.error && st.connected) problems.push('CH1 unavailable without an error reason');
      }
      const elapsed = Date.now() - t0;
      const result = problems.length ? { status: 'fail', msg: problems.join('; ') }
        : { status: 'pass', msg: st.ch1Available ? `TC-08 connected, CH1 ${st.temperature}°C` : `TC-08 ${st.connected ? 'connected' : 'not connected'}, CH1 not available (${st.error || 'no unit'}) — Start Calibration stays disabled` };
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      return;
    }

    if (test.check === 'dev_hdt_gate') {
      const post = (body) => fetch(apiUrl + '/api/dev/hdt/start', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: AbortSignal.timeout(5000) }).then(r => r.json()).catch(() => null);
      const problems = [];
      const st0 = await fetch(apiUrl + '/api/dev/hdt/status', { signal: AbortSignal.timeout(5000) }).then(r => r.json()).catch(() => null);
      if (!st0) problems.push('status endpoint unreachable');
      else {
        if (st0.running) problems.push('an HDT calibration is already running — test skipped the start gate');
        const lv = (st0.config && st0.config.powerLevels) || [];
        if (lv.join(',') !== '10,20,30,40,50,60,70,80,90') problems.push(`power levels ${lv.join(',')}`);
        const c = st0.config || {};
        if (c.stabilityBandC !== 2 || c.stabilityTimeMin !== 5 || c.maxStabilizationTimeMin !== 30 || c.hdtSafetyMarginC !== 2) problems.push('default stability/timeout/margin constants are not 2°C / 5 min / 30 min / 2°C');
        if (st0.state !== 'IDLE' && (!Array.isArray(st0.results) || st0.results.length !== 9)) problems.push('results table does not have 9 rows');
      }
      if (!st0 || !st0.running) {
        const bad = await post({ hdtC: 5 });
        if (!bad || bad.ok) { problems.push('invalid HDT 5°C was accepted'); await fetch(apiUrl + '/api/dev/hdt/abort', { method: 'POST' }).catch(() => {}); }
        const pl = await fetch(apiUrl + '/api/dev/picolog/status', { signal: AbortSignal.timeout(5000) }).then(r => r.json()).catch(() => ({}));
        if (!pl.ch1Available) {
          const noSensor = await post({ hdtC: 65 });
          if (!noSensor || noSensor.ok) { problems.push('calibration started without valid CH1 feedback'); await fetch(apiUrl + '/api/dev/hdt/abort', { method: 'POST' }).catch(() => {}); }
        }
      }
      const elapsed = Date.now() - t0;
      const result = problems.length ? { status: 'fail', msg: problems.join('; ') }
        : { status: 'pass', msg: 'IDLE, 9 levels 10-90%, defaults 2°C/5min/30min/2°C, invalid HDT + no-sensor starts refused' };
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      return;
    }

    if (test.check === 'dev_hdt_heater_fan') {
      const j = (path, body) => fetch(apiUrl + path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: AbortSignal.timeout(5000) } : { signal: AbortSignal.timeout(5000) }).then(r => r.json()).catch(() => null);
      const problems = [];
      const pl = await j('/api/dev/picolog/status');
      const st0 = await j('/api/dev/hdt/status');
      if (!pl || !st0) problems.push('dev endpoints unreachable');
      else if (st0.running) problems.push('an HDT calibration is already running');
      else if (!pl.ch1Available) {
        const elapsed = Date.now() - t0;
        setTestStatus(test.id, 'pass', 'skipped: PicoLog CH1 not available, cannot start a run (IDLE heaterFanPwm=' + st0.heaterFanPwm + ')', elapsed);
        log('pass', `${test.name}: skipped, no CH1`);
        return;
      } else {
        await j('/api/dev/hdt/reset', {});
        const start = await j('/api/dev/hdt/start', { hdtC: 150 });
        if (!start || !start.ok) problems.push('could not start a run: ' + (start && start.message));
        else {
          await new Promise(r => setTimeout(r, 1500));
          const run = await j('/api/dev/hdt/status');
          const state = await j('/api/state');
          if (!run || run.heaterFanPwm !== 100) problems.push('heaterFanPwm while running = ' + (run && run.heaterFanPwm));
          if (!state || !state.fans || state.fans.chamber_heating !== 100) problems.push('/api/state.fans.chamber_heating = ' + (state && state.fans && state.fans.chamber_heating));
          await j('/api/dev/hdt/abort', {});
          await new Promise(r => setTimeout(r, 2500));
          const done = await j('/api/dev/hdt/status');
          if (!done || done.running) problems.push('run did not stop after abort');
          if (!done || done.heaterFanPwm !== 0) problems.push('heater fan not released after abort (' + (done && done.heaterFanPwm) + ')');
        }
      }
      const elapsed = Date.now() - t0;
      const result = problems.length ? { status: 'fail', msg: problems.join('; ') }
        : { status: 'pass', msg: 'heater fan 100% while running, 0% after abort' };
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      return;
    }

    if (test.check === 'dev_hdt_rate_criterion') {
      const problems = [];
      const st = await fetch(apiUrl + '/api/dev/hdt/status', { signal: AbortSignal.timeout(5000) }).then(r => r.json()).catch(() => null);
      if (!st) problems.push('status endpoint unreachable');
      else {
        if (!st.config || st.config.stabilityMaxRateCPerMin !== 0.5) problems.push('default stabilityMaxRateCPerMin = ' + (st.config && st.config.stabilityMaxRateCPerMin));
        if (!('rateCPerMin' in st)) problems.push('status has no rateCPerMin');
      }
      // Mirror of hdt_calibration._slope_c_per_min + the combined criterion
      const slope = (w) => { const n = w.length, t0 = w[0][0]; const xs = w.map(p => (p[0] - t0) / 60), ys = w.map(p => p[1]); const mx = xs.reduce((a, b) => a + b) / n, my = ys.reduce((a, b) => a + b) / n; const den = xs.reduce((a, x) => a + (x - mx) ** 2, 0); return xs.reduce((a, x, i) => a + (x - mx) * (ys[i] - my), 0) / den; };
      const stable = (w, band, maxRate) => { const v = w.map(p => p[1]); const r = slope(w); return Math.max(...v) - Math.min(...v) <= band && (maxRate <= 0 || Math.abs(r) <= maxRate); };
      const rising = Array.from({ length: 301 }, (_, i) => [i, 30 + 1.96 * i / 300]);   // +1.96°C over 5 min = 0.39°C/min
      const flat = Array.from({ length: 301 }, (_, i) => [i, 31 + 0.1 * Math.sin(i / 7)]);
      if (Math.abs(slope(rising) - 0.392) > 0.01) problems.push('slope of the rising window = ' + slope(rising).toFixed(3));
      if (!stable(rising, 2, 0.5)) problems.push('0.39°C/min rejected at max 0.5');
      if (stable(rising, 2, 0.3)) problems.push('0.39°C/min accepted at max 0.3');
      if (!stable(flat, 2, 0.1)) problems.push('flat window rejected');
      if (!stable(rising, 2, 0)) problems.push('rate 0 did not disable the check');
      if (stable(rising, 1, 0)) problems.push('band still enforced? 1.96°C passed a 1°C band');
      const elapsed = Date.now() - t0;
      const result = problems.length ? { status: 'fail', msg: problems.join('; ') }
        : { status: 'pass', msg: 'default 0.5°C/min published; slope + band criterion behaves (0.39°C/min: pass@0.5, fail@0.3; 0 = off)' };
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      return;
    }

    if (test.check === 'dev_hdt_boost') {
      const problems = [];
      const st = await fetch(apiUrl + '/api/dev/hdt/status', { signal: AbortSignal.timeout(5000) }).then(r => r.json()).catch(() => null);
      if (!st) problems.push('status endpoint unreachable');
      else if (!('boost' in st)) problems.push('status has no boost field');
      else if (st.boost && !['power', 'startTempC', 'targetTempC', 'timeSec', 'method'].every(k => k in st.boost)) problems.push('boost object incomplete');
      // Mirror of _boost_estimate's model branch: t = tau * ln((Teq - T0) / (Teq - TL))
      const est = (teq, tau, t0, tl) => teq <= tl ? null : tau * Math.log((teq - t0) / (teq - tl));
      const t = est(70, 300, 35, 50);
      if (t == null || Math.abs(t - 167.9) > 1) problems.push('model time = ' + t);
      if (est(48, 300, 35, 50) !== null) problems.push('unreachable target produced a time');
      if (!(est(70, 300, 35, 60) > t)) problems.push('a higher target did not take longer');
      const elapsed = Date.now() - t0;
      const result = problems.length ? { status: 'fail', msg: problems.join('; ') }
        : { status: 'pass', msg: 'boost published in status; model 35→50°C @ Teq 70/tau 300 s = 168 s; unreachable → N/A' };
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      return;
    }

    if (test.check === 'dev_hdt_recommend') {
      // Mirror of HdtCalibrationController._finish: highest PASS with stableTemp <= HDT - margin
      const recommend = (results, hdt, margin) => {
        const limit = hdt - margin; let rec = null;
        for (const r of results) if (r.status === 'PASS' && r.stableTemp !== null && r.stableTemp <= limit) rec = r.power;
        return rec;
      };
      const spec = [[10, 34.2, 'PASS'], [20, 38.4, 'PASS'], [30, 43.1, 'PASS'], [40, 49.6, 'PASS'], [50, 55.3, 'PASS'], [60, 61.4, 'PASS'], [70, null, 'HDT_LIMIT'], [80, null, 'NOT_TESTED'], [90, null, 'NOT_TESTED']]
        .map(([power, stableTemp, status]) => ({ power, stableTemp, status }));
      const problems = [];
      if (recommend(spec, 65, 2) !== 60) problems.push(`spec example gave ${recommend(spec, 65, 2)} (want 60)`);
      const edge = spec.map(r => r.power === 60 ? { ...r, stableTemp: 63.5 } : r);
      if (recommend(edge, 65, 2) !== 50) problems.push('a PASS above HDT−margin was recommended');
      if (recommend(spec, 65, 0) !== 60) problems.push('margin 0 changed the spec result');
      if (spec.slice(7).some(r => r.status !== 'NOT_TESTED')) problems.push('levels after HDT LIMIT were tested');
      const nc = spec.map(r => ({ ...r, status: 'NOT_CONVERGED', stableTemp: null }));
      if (recommend(nc, 65, 2) !== null) problems.push('NOT_CONVERGED run produced a recommendation');
      // physical outputs at the recommended power go through the same calibration layer
      const f = { back: 1.0, door: 0.92, left: 0.97, right: 0.95 };
      const out = Object.fromEntries(Object.entries(f).map(([z, k]) => [z, Math.min(100, Math.max(0, 60 * k))]));
      if (Math.abs(out.door - 55.2) > 0.01 || Math.abs(out.left - 58.2) > 0.01 || Math.abs(out.right - 57) > 0.01) problems.push('physical outputs at 60% wrong');
      const elapsed = Date.now() - t0;
      const result = problems.length ? { status: 'fail', msg: problems.join('; ') }
        : { status: 'pass', msg: 'spec example → 60%; above-margin PASS excluded; no recommendation when nothing converged; 60% → 60/55.2/58.2/57' };
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      return;
    }

    // ---------------- Secure Appliance (appliance/) ----------------
    if (test.check === 'appl_serial_rules') {
      const fmt = n => 'SC' + String(n).padStart(6, '0');
      const parse = sn => { const m = /^SC(\d{6})$/.exec(sn || ''); if (!m || +m[1] < 1) throw new Error('bad'); return +m[1]; };
      const next = last => fmt(last ? parse(last) + 1 : 1);
      const problems = [];
      if (fmt(1) !== 'SC000001') problems.push('format');
      if (next(null) !== 'SC000001' || next('SC000125') !== 'SC000126') problems.push('sequence');
      for (const bad of ['SC0001', 'sc000001', 'SC000000', 'XX000001', '']) { try { parse(bad); problems.push('accepted ' + JSON.stringify(bad)); } catch {} }
      const elapsed = Date.now() - t0;
      const result = problems.length ? { status: 'fail', msg: problems.join('; ') } : { status: 'pass', msg: 'SC000001 format, next(SC000125)=SC000126, invalid formats rejected' };
      setTestStatus(test.id, result.status, result.msg, elapsed); log(result.status, `${test.name}: ${result.msg}`); return;
    }
    if (test.check === 'appl_image_policy') {
      const vkey = v => { const m = /^(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.\-]+))?$/.exec(v); return [+m[1], +m[2], +m[3], m[4] ? 0 : 1, m[4] || '']; };

      const group = (entries) => { const dev = {}, fix = []; for (const [name, tid] of entries) { const k = key(name); if (k === null) { fix.push(name); continue; } dev[k] = dev[k] || { entries: [], tests: [] }; if (!dev[k].entries.includes(name)) dev[k].entries.push(name); if (!dev[k].tests.includes(tid)) dev[k].tests.push(tid); } return { dev, fix }; };
      const problems = [];
      if (key('PicoLog TC-08 thermocouple logger') !== 'PicoLog TC-08' || key('PicoLog TC-08 x2 (16 thermocouple channels)') !== 'PicoLog TC-08') problems.push('TC-08 wordings not merged');
      if (key('DMM / current clamp on the driver output') !== 'DMM / clamp meter') problems.push('DMM must win before current probe');
      if (key('Current probe + oscilloscope, single-shot') !== 'Current probe / scope') problems.push('current probe');
      if (key('Inline break-out lead for the panel connector with a remote contactor') !== null) problems.push('break-out lead counted as a contactor');
      if (key('Impact indicators (e.g. ShockWatch)') !== null || key('Tachometer readback logged from the fan') !== null || key('Spare fuses — 0BLF005.T') !== null) problems.push('non-instrument counted as a device');
      if (key('Vernier caliper for the seating offset') !== 'Vernier caliper') problems.push('caliper');
      const g = group([['PicoLog TC-08 thermocouple logger', 'DVT-SAF-001'], ['PicoLog TC-08 x2 (16 thermocouple channels)', 'DVT-THM-001'], ['Spare fuses — 0BLF005.T', 'DVT-SAF-018'], ['PicoLog TC-08 thermocouple logger', 'DVT-SAF-002']]);
      if (Object.keys(g.dev).length !== 1 || g.dev['PicoLog TC-08'].entries.length !== 2 || g.dev['PicoLog TC-08'].tests.join() !== 'DVT-SAF-001,DVT-THM-001,DVT-SAF-002' || g.fix.length !== 1) problems.push('grouping: ' + JSON.stringify(g));
      const calBlockers = (eq) => eq.filter(e => key(e) !== null);
      if (calBlockers(['Spare fuses — 0BLF005.T', 'Isolation transformer / programmable AC source']).length !== 0 && calBlockers(['Spare fuses — 0BLF005.T']).length !== 0) problems.push('fixture raised a calibration blocker');
      const elapsed = Date.now() - t0;
      const result = problems.length ? { status: 'fail', msg: problems.join('; ') } : { status: 'pass', msg: 'non-instrument words first; one device per keyword group; every entry once; fixtures never block' };
      setTestStatus(test.id, result.status, result.msg, elapsed); log(result.status, `${test.name}: ${result.msg}`); return;
    }

    if (test.check === 'led_fan_supervision') {
      const MIN = 100;
      const fanTest = (rpms) => { const fans = Object.fromEntries(Object.entries(rpms).map(([n, r]) => [n, { rpm: r, status: r >= MIN ? 'OK' : 'FAIL' }])); const failed = Object.keys(fans).filter(n => fans[n].status === 'FAIL'); return { rpm: Math.min(...Object.values(rpms)), status: failed.length ? 'FAIL' : 'OK', message: failed.length ? failed.map(n => n + ': ' + rpms[n] + ' RPM').join(', ') + ' — not spinning' : null }; };
      const worst = (rpms) => Math.min(...Object.values(rpms));
      const preflight = (rpms) => { const stopped = Object.entries(rpms).filter(([, r]) => r < MIN).map(([n, r]) => n + ' (' + r + ' RPM)'); return stopped.length ? { ok: false, why: '[9003] LED cooling fan not spinning: ' + stopped.join(', ') + ' - job start refused' } : { ok: true }; };
      const tripAfter = (rpm, expected) => rpm <= 0.05 * expected ? 5 : 60;
      const problems = [];
      const healthy = { FAN_LEFT: 3540, FAN_RIGHT: 3600, FAN_BACK: 3520, FAN_DOOR: 3600 }, oneDead = { ...healthy, FAN_RIGHT: 0 };
      if (fanTest(healthy).status !== 'OK') problems.push('healthy group failed');
      const ft = fanTest(oneDead);
      if (ft.status !== 'FAIL' || !ft.message.includes('FAN_RIGHT') || ft.rpm !== 0) problems.push('dead right fan not reported: ' + JSON.stringify(ft));
      if (worst(oneDead) !== 0 || worst(healthy) !== 3520) problems.push('fanRpm must be the worst fan');
      if (preflight(healthy).ok !== true) problems.push('preflight refused healthy fans');
      const pf = preflight(oneDead);
      if (pf.ok || !pf.why.startsWith('[9003]') || !pf.why.includes('FAN_RIGHT')) problems.push('preflight must refuse with 9003 naming the fan');
      if (tripAfter(0, 3560) !== 5 || tripAfter(2700, 3560) !== 60) problems.push('stopped fan trips in 5 s, slow fan waits 60 s');
      const elapsed = Date.now() - t0;
      const result = problems.length ? { status: 'fail', msg: problems.join('; ') } : { status: 'pass', msg: 'every fan tested and named; worst-of RPM; 9003 pre-flight refusal; stopped fan trips in 5 s' };
      setTestStatus(test.id, result.status, result.msg, elapsed); log(result.status, `${test.name}: ${result.msg}`); return;
    }

    if (test.check === 'dvt_rollup_logic') {
      const rollup = (runs) => { const rs = runs.filter(r => r.status !== 'REJECTED'); if (!rs.length || rs.some(r => !r.verdict)) return null; for (const v of ['FAIL', 'BLOCKED', 'WAIVED', 'PASS']) if (rs.some(r => r.verdict === v)) return v; return null; };
      const P = { status: 'DONE', verdict: 'PASS' }, F = { status: 'DONE', verdict: 'FAIL' }, W = { status: 'DONE', verdict: 'WAIVED' }, R = { status: 'REJECTED', verdict: null }, N = { status: 'NOT_STARTED', verdict: null };
      const problems = [];
      if (rollup([P, P, P]) !== 'PASS') problems.push('all pass != PASS');
      if (rollup([P, F, P]) !== 'FAIL') problems.push('one fail != FAIL');
      if (rollup([P, W]) !== 'WAIVED') problems.push('waived not distinct from PASS');
      if (rollup([P, R, P]) !== 'PASS') problems.push('rejected row counted');
      if (rollup([P, N]) !== null) problems.push('pending run produced a verdict');
      const elapsed = Date.now() - t0;
      const result = problems.length ? { status: 'fail', msg: problems.join('; ') } : { status: 'pass', msg: 'PASS only when every row passes; FAIL > BLOCKED > WAIVED > PASS; rejected excluded; pending = no verdict' };
      setTestStatus(test.id, result.status, result.msg, elapsed); log(result.status, `${test.name}: ${result.msg}`); return;
    }


    // =========================================================================
    // DVT Readiness (category dvt_ready) — each block maps to a DVT catalog
    // test ID and checks the part of it the machine SOFTWARE has to satisfy.
    // Operator-assisted blocks start a mode, wait for the physical fault to be
    // injected, measure the response time, and always stop the outputs.
    // =========================================================================

    // DVT-THM/SAF: every field the procedures read is published in /api/state.
    if (test.check === 'dvtr_telemetry') {
      const s = await dvtrState();
      const top = ['chamberTemp', 'targetTemp', 'atTemp', 'heaterPwm', 'isHeating', 'isCooling', 'coolingRate', 'coolingFanPwm', 'damperOpen', 'ventOn', 'doorClosed', 'doorAborted', 'fans', 'fanRpm', 'ledTemps', 'faults'];
      const missing = top.filter(k => !(k in s));
      const sub = { fanRpm: ['chamber_heating', 'chamber_intake', 'led_cooling'], ledTemps: ['left', 'right', 'back', 'door'], faults: ['heater', 'cooling', 'led'] };
      for (const [k, keys] of Object.entries(sub)) {
        if (s[k] && typeof s[k] === 'object') keys.filter(x => !(x in s[k])).forEach(x => missing.push(`${k}.${x}`));
      }
      const sim = s.hwSource !== 'io_controller';
      dvtrDone(test, t0, missing.length
        ? { status: sim ? 'warn' : 'fail', msg: `${sim ? 'simulation' : 'machine'} state lacks: ${missing.join(', ')}` }
        : { status: 'pass', msg: `all ${top.length} fields + sub-keys present (${s.hwSource})` });
      return;
    }

    // DVT-THM-002: a telemetry sample with per-panel LED temps round-trips
    // through the run store and is readable back from Cure History.
    if (test.check === 'dvtr_run_telemetry') {
      const base = document.getElementById('apiUrl').value;
      const id = 'qa-dvt-' + Date.now();
      const json = (path, body) => fetch(base + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: AbortSignal.timeout(6000) }).then(r => r.json());
      await json(`/api/cure-runs/${id}/start`, { materialName: 'QA DVT probe', steps: 1, phases: ['Cure'], targetTemp: 40, serialNumber: 'qa' });
      const sample = { t: 0, chamberTemp: 31.5, uvOn: true, uvType: '405nm', ledTemps: { right: 41.1, left: 42.2, back: 43.3, door: 44.4 } };
      const rec = await json(`/api/cure-runs/${id}/telemetry`, sample);
      await json(`/api/cure-runs/${id}/finish`, { status: 'aborted', stepsCompleted: 0 });
      const hist = await fetch(base + '/api/cure-history', { signal: AbortSignal.timeout(6000) }).then(r => r.json()).catch(() => []);
      const run = Array.isArray(hist) ? hist.find(r => r.id === id || r.extId === id || r.ext_id === id) : null;
      let result;
      if (!rec.ok) result = { status: 'fail', msg: 'telemetry POST was not accepted' };
      else if (!run) result = { status: 'fail', msg: 'run not found in /api/cure-history after finish' };
      else if (!Array.isArray(run.telemetry)) result = { status: 'warn', msg: 'history list carries no telemetry array — per-panel data only reachable through the report' };
      else {
        const t = run.telemetry[0] || {};
        const lt = t.ledTemps || {};
        const bad = ['right', 'left', 'back', 'door'].filter(k => typeof lt[k] !== 'number');
        result = (typeof t.chamberTemp === 'number' && bad.length === 0)
          ? { status: 'pass', msg: `sample stored with chamberTemp + ledTemps ${Object.keys(lt).join('/')}` }
          : { status: 'fail', msg: `stored sample lacks ${bad.length ? 'ledTemps.' + bad.join(', ledTemps.') : 'chamberTemp'}` };
      }
      dvtrDone(test, t0, result);
      return;
    }

    // DVT-SAF-020: the central registry must have a distinct, actionable
    // code for every fault the DVT injects.
    if (test.check === 'dvtr_errors_registry') {
      const r = await fetch(test.url, { signal: AbortSignal.timeout(5000) });
      const d = await r.json();
      const errs = Array.isArray(d.errors) ? d.errors : [];
      const problems = [];
      const codes = errs.map(e => e.code);
      const dup = codes.filter((c, i) => codes.indexOf(c) !== i);
      if (dup.length) problems.push(`duplicate codes ${[...new Set(dup)].join(', ')}`);
      errs.filter(e => e.category === 'safety').forEach(e => {
        if (!e.message) problems.push(`${e.code} has no message`);
        if (!Array.isArray(e.troubleshooting) || !e.troubleshooting.length) problems.push(`${e.code} has no recovery (troubleshooting) steps`);
      });
      const text = (e) => `${e.key || ''} ${e.message || ''} ${e.description || ''}`.toLowerCase();
      const families = [
        ['DVT-SAF-001 heater fan failure', /(heater|circulation) fan[^.]{0,40}(fail|stall|not spinning|rpm|stopped)|(fail|stall)[^.]{0,20}(heater|circulation) fan/],
        ['DVT-SAF-002 chamber sensor open', /(chamber|heater).*(thermistor|sensor).*(open|disconnect|invalid|missing)|thermistor.*disconnect/],
        ['DVT-SAF-003 sensor short / implausible reading', /short|implausib|plausib|runaway/],
        ['DVT-SAF-004 LED thermistor fault', /led.*(thermistor|temperature sensor|sensor)/],
        ['DVT-SAF-005/019 LED cooling fan failure', /led[^.]{0,20}fan[^.]{0,40}(fail|stall|not spinning|rpm|stopped|degrad)/],
        ['DVT-GAS-002 nitrogen supply low / lost', /(nitrogen|n₂|n2)[^.]{0,60}(pressure|supply|line|not pressuri)|(pressure|supply|line)[^.]{0,40}(nitrogen|n₂|n2)/],
        ['DVT-SAF-016 LED panel not emitting / disconnected', /led[^.]{0,20}(panel|source|string|driver)[^.]{0,40}(not (working|emitting|lit)|disconnect|open|dark|no output|fail)/],
        ['DVT-SAF-006 chamber cooling/intake fan failure', /(intake|cooling|chamber) fan[^.]{0,40}(fail|stall|not spinning|rpm|stopped)/],
        ['DVT-SAF-009 thermal cutout tripped', /cutout|cut-out|thermal fuse|thermostat/],
        ['DVT-SAF-010 watchdog / heartbeat loss', /watchdog|heartbeat/],
        ['DVT-SAF-011 run aborted by power loss', /power (loss|cut|fail)|mains (loss|interrupt)|unexpected (shutdown|restart)/],
      ];
      const missing = families.filter(([, re]) => !errs.some(e => re.test(text(e)))).map(([n]) => n);
      if (missing.length) problems.push(`no error code for: ${missing.join('; ')}`);
      dvtrDone(test, t0, problems.length
        ? { status: 'fail', msg: `${errs.length} codes — ${problems.join(' | ')}` }
        : { status: 'pass', msg: `${errs.length} unique codes, safety entries actionable, all DVT fault families covered` });
      return;
    }

    // DVT-SAF-007: heating-rate watchdog mirror (CureProcessPage stall rule).
    if (test.check === 'dvtr_stall_watchdog') {
      const CHECK_MIN = 5, MAX_RETRIES = 5, MIN_RISE = 1.0;
      const alarmAfterMin = CHECK_MIN * MAX_RETRIES;
      const stalls = (samples) => { let miss = 0; for (let i = 1; i < samples.length; i++) { miss = samples[i] - samples[i - 1] >= MIN_RISE ? 0 : miss + 1; if (miss >= MAX_RETRIES) return i * CHECK_MIN; } return null; };
      const healthy = [22, 30, 38, 46, 54, 62, 70, 78, 80, 80];          // 27-33 min to 80 C: never trips
      const stalled = [22, 22.5, 22.9, 23.2, 23.4, 23.5, 23.6, 23.6, 23.6];        // under-power plateau: never gains 1 C per check
      const problems = [];
      if (alarmAfterMin > 30) problems.push(`alarm after ${alarmAfterMin} min > 30 min limit`);
      if (stalls(healthy) !== null) problems.push('healthy heat-up false-trips');
      const q = stalls(stalled);
      if (q === null || q > 30) problems.push(`stalled ramp not alarmed within 30 min (${q} min)`);
      dvtrDone(test, t0, problems.length
        ? { status: 'fail', msg: problems.join('; ') }
        : { status: 'warn', msg: `rate-based, alarms at ${alarmAfterMin} min, no false trip on a healthy ramp — but it lives in the UI only (Err 7004); the server has no watchdog, so a closed/crashed UI leaves the ramp unwatched` });
      return;
    }

    // DVT-SAF-011: runs interrupted by a power cut must not stay "running".
    if (test.check === 'dvtr_orphan_runs') {
      const base = document.getElementById('apiUrl').value;
      const [hist, ver, s] = await Promise.all([
        fetch(base + '/api/cure-history', { signal: AbortSignal.timeout(6000) }).then(r => r.json()).catch(() => []),
        fetch(base + '/api/system/version', { signal: AbortSignal.timeout(6000) }).then(r => r.json()).catch(() => ({})),
        dvtrState().catch(() => ({})),
      ]);
      const boot = ver.lastBoot ? new Date(ver.lastBoot.replace(' ', 'T')) : null;
      const running = (Array.isArray(hist) ? hist : []).filter(r => r.status === 'running');
      const stale = running.filter(r => {
        const started = r.startedAt ? new Date(r.startedAt) : null;
        if (!started) return true;
        if (boot && started < boot) return true;
        return Date.now() - started.getTime() > 24 * 3600 * 1000;
      });
      const live = !!(s.isHeating || s.isCooling || s.uvOn);
      let result;
      if (stale.length) result = { status: 'fail', msg: `${stale.length} run(s) still "running" from before the last boot${boot ? ' (' + ver.lastBoot + ')' : ''} — startup must reconcile them to aborted/error (e.g. ${stale[0].id})` };
      else if (running.length && !live) result = { status: 'warn', msg: `${running.length} run(s) "running" while no output is live` };
      else result = { status: 'pass', msg: `no orphaned runs (${running.length} running, ${(hist || []).length} total)` };
      dvtrDone(test, t0, result);
      return;
    }

    // DVT-SAF-005/019: a tach per LED side.
    if (test.check === 'dvtr_fan_tach_coverage') {
      const s = await dvtrState();
      const rpm = s.fanRpm || {};
      const sides = ['left', 'right', 'back', 'door'];
      const perSide = sides.filter(k => typeof rpm[`led_${k}`] === 'number' || (rpm.led_cooling && typeof rpm.led_cooling === 'object' && typeof rpm.led_cooling[k] === 'number'));
      dvtrDone(test, t0, perSide.length === 4
        ? { status: 'pass', msg: 'fanRpm reports all four LED-cooling fans' }
        : { status: 'fail', msg: `fanRpm reports ${perSide.length}/4 LED fans (keys: ${Object.keys(rpm).join(', ') || 'none'}) — only the first fan of the led_cooling group is read; the alarm cannot name a failed R/Back/Door fan and DVT-SAF-015 case B has no tach` });
      return;
    }

    // DVT-SAF-016: the machine must be able to say WHICH LED panel is not emitting.
    if (test.check === 'dvtr_n2_purge_feedback') {
      const s = await dvtrState();
      if (!('nitrogenActive' in s)) { dvtrDone(test, t0, { status: 'fail', msg: 'nitrogenActive missing from /api/state — the DVT-GAS-007 valve open/close timestamps cannot be read from the machine' }); return; }
      const o2 = ['o2Percent', 'n2Percent', 'oxygen', 'oxygenPercent', 'nitrogenPercent'].find(k => k in s && s[k] != null);
      if (o2) { dvtrDone(test, t0, { status: 'pass', msg: `nitrogenActive=${s.nitrogenActive}; oxygen feedback present (${o2}=${s[o2]}) — the purge can close the loop on the measured atmosphere` }); return; }
      dvtrDone(test, t0, { status: 'warn', msg: `nitrogenActive=${s.nitrogenActive}; no oxygen / nitrogen reading in /api/state — the purge is time-based only (Settings → nitrogen duration, default 120 s). DVT-GAS-007 result decides the setting: worst unit's time to 95 % N2 x 1.2, and the hold must cover the longest cure after the purge` });
      return;
    }
    if (test.check === 'dvtr_led_panel_feedback') {
      const s = await dvtrState();
      const sides = ['left', 'right', 'back', 'door'];
      const perPanel = (o) => o && typeof o === 'object' && sides.every(k => k in o);
      const src = ['ledOutput', 'ledPanels', 'ledCurrent', 'ledEmitting'].find(k => perPanel(s[k]));
      const faultsLed = s.faults && s.faults.led;
      if (src || perPanel(faultsLed)) {
        dvtrDone(test, t0, { status: 'pass', msg: `per-panel LED output feedback present in ${src || 'faults.led'} (${sides.join('/')})` });
        return;
      }
      const have = Object.keys(s).filter(k => /^led/i.test(k)).join(', ') || 'none';
      dvtrDone(test, t0, { status: 'fail', msg: `no per-panel LED output feedback in /api/state (faults.led = ${JSON.stringify(faultsLed ?? null)}; led* keys: ${have}) — the DVT-SAF-016 alarm cannot name a dark panel. ledTemps are temperatures, not output feedback. Options: thermistor rise-rate rule at switch-on, light-sensor one-panel-at-a-time sequence, or per-panel current sense on the spare ADS1115 inputs` });
      return;
    }

    // DVT-SAF-017: the no-heating alarm must tell the customer about the voltage selector.
    if (test.check === 'dvtr_selector_open_guidance') {
      const r = await fetch(test.url, { signal: AbortSignal.timeout(5000) });
      const d = await r.json();
      const errs = Array.isArray(d.errors) ? d.errors : [];
      const stall = errs.find(e => e.code === 7004) || errs.find(e => /stall|not heating|no heating/i.test(`${e.key} ${e.message} ${e.description}`));
      if (!stall) { dvtrDone(test, t0, { status: 'fail', msg: 'no heating-stall / no-heating error code in errors.json' }); return; }
      const guidance = (stall.troubleshooting || []).join(' | ');
      const namesSelector = /voltage selector|selector switch|110 ?V.*230 ?V|115 ?V.*230 ?V/i.test(guidance);
      const namesCountry = /country|mains/i.test(guidance);
      dvtrDone(test, t0, namesSelector && namesCountry
        ? { status: 'pass', msg: `Err ${stall.code} guidance names the voltage selector and the country mains — ${guidance.slice(0, 160)}` }
        : { status: 'fail', msg: `Err ${stall.code} guidance does not tell the customer to set the voltage selector for their country's mains (selector:${namesSelector} country:${namesCountry}) — ${guidance.slice(0, 160)}` });
      return;
    }

    // DVT-GAS-002: the nitrogen guards need a line-pressure reading.
    if (test.check === 'dvtr_n2_line_pressure') {
      const s = await dvtrState();
      const p = s.n2LinePressure;
      if (typeof p === 'number' && isFinite(p)) {
        dvtrDone(test, t0, { status: 'pass', msg: `n2LinePressure = ${p} bar (enable guard min 6 bar${p < 6 ? ' — currently BELOW the minimum' : ''}); nitrogenMode=${s.nitrogenMode}` });
        return;
      }
      dvtrDone(test, t0, { status: 'fail', msg: `n2LinePressure = ${JSON.stringify(p ?? null)} — no line-pressure sensor: the 6 bar enable guard and the pre-cure N₂ check cannot work, and the Settings toggle stays disabled (null < 6). nitrogenMode=${s.nitrogenMode}` });
      return;
    }

    // DVT-NFC-001: what did the NFC reader read?
    if (test.check === 'dvtr_nfc_tag_state') {
      const s = await dvtrState();
      const key = ['nfcTag', 'nfcSerial', 'nfcUid', 'buildHeadId', 'buildHead', 'buildHeadSerial'].find(k => k in s);
      if (key) { dvtrDone(test, t0, { status: 'pass', msg: `${key} = ${JSON.stringify(s[key])} (nfcEnabled=${s.nfcEnabled})` }); return; }
      dvtrDone(test, t0, { status: 'fail', msg: `no NFC tag / build-head field in /api/state (nfcEnabled=${JSON.stringify(s.nfcEnabled ?? null)}) — the read is invisible to the operator and to the print record; DVT-NFC-001 cases C/D/F have nothing to judge` });
      return;
    }

    // DVT-THM-004: the LED-cooling fan duty can be commanded and is reported back.
    if (test.check === 'dvtr_led_fan_duty') {
      const s0 = await dvtrState();
      if (s0.uvOn) { dvtrDone(test, t0, { status: 'skip', msg: 'UV is on — the LED fans are owned by the LED protection; run this while idle' }); return; }
      const r = await dvtrPost('/api/fans/led_cooling?speed=70').catch(e => ({ ok: false, message: e.message }));
      await dvtrSleep(800);
      const s1 = await dvtrState(); const read = s1.fans && s1.fans.led_cooling;
      await dvtrPost('/api/fans/led_cooling?speed=100').catch(() => null);
      dvtrDone(test, t0, (r && r.ok !== false && read === 70)
        ? { status: 'pass', msg: 'led_cooling accepted 70 % and /api/state.fans.led_cooling read 70; restored to 100' }
        : { status: 'fail', msg: `command ${JSON.stringify(r)}; /api/state.fans.led_cooling = ${JSON.stringify(read ?? null)} (expected 70) — DVT-THM-004 cannot hold a reduced duty` });
      return;
    }

    // DVT-SAF-001/008/009: healthy baseline rpm per fan group.
    if (test.check === 'dvtr_fan_baseline') {
      const out = [];
      for (const fan of ['chamber_heating', 'chamber_intake', 'led_cooling']) {
        const r = await dvtrPost(`/api/diagnostics/fan-test?fan=${fan}`).catch(e => ({ status: 'ERR', message: e.message }));
        out.push({ fan, rpm: r.rpm, status: r.status || (r.ok ? 'OK' : 'FAIL') });
        await dvtrSleep(300);
      }
      // since 0.9.93 the diagnostic also answers WARN: the fan turns but is worn (>= warn_below_pct
      // below its nominal RPM). That is a baseline worth recording, not a failed test.
      const bad = out.filter(o => (o.status !== 'OK' && o.status !== 'WARN') || !(o.rpm > 0));
      const worn = out.filter(o => o.status === 'WARN');
      dvtrDone(test, t0, bad.length
        ? { status: 'fail', msg: bad.map(o => `${o.fan}: ${o.status} rpm=${o.rpm}`).join('; ') }
        : worn.length
          ? { status: 'warn', msg: `worn: ${worn.map(o => `${o.fan} ${o.rpm} rpm`).join(', ')} (all fans turning)` }
          : { status: 'pass', msg: out.map(o => `${o.fan} ${o.rpm} rpm`).join(', ') });
      return;
    }

    // DVT-SAF-008 / 017: door open (or sensor unplugged) inhibits every
    // heat/UV start with Err 6015.
    if (test.check === 'dvtr_door_start_inhibit') {
      const s = await dvtrState();
      if (s.hwSource !== 'io_controller') { dvtrDone(test, t0, { status: 'skip', msg: 'simulation has no door interlock — run on the machine' }); return; }
      if (s.doorClosed === true) { dvtrDone(test, t0, { status: 'skip', msg: 'door reads closed — open it (DVT-SAF-008) or unplug the sensor (DVT-SAF-013) and re-run' }); return; }
