<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sCure QA Tool</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0a0a0a; color: #e0e0e0; min-height: 100vh; }

  .header { background: #111; border-bottom: 2px solid #f44336; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
  .header h1 { font-size: 18px; color: #f44336; }
  .header .version { font-size: 11px; color: #666; margin-top: 2px; }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; }
  .status-dot.connected { background: #4caf50; box-shadow: 0 0 6px #4caf50; }
  .status-dot.disconnected { background: #f44336; }
  .status-label { font-size: 11px; color: #888; }

  .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

  .config-bar { background: #151515; border: 1px solid #222; border-radius: 10px; padding: 14px 18px; margin-bottom: 20px; display: flex; align-items: center; gap: 14px; }
  .config-bar label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
  .config-bar input { background: #0a0a0a; border: 1px solid #333; border-radius: 6px; padding: 6px 10px; color: #fff; font-size: 13px; width: 250px; }
  .config-bar input:focus { outline: none; border-color: #f44336; }

  .btn { padding: 8px 18px; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; transition: all 0.2s; }
  .btn:active { transform: scale(0.97); }
  .btn-run { background: #f44336; color: #fff; }
  .btn-run:hover { background: #e53935; }
  .btn-run:disabled { background: #333; color: #666; cursor: not-allowed; }
  .btn-stop { background: #ff9800; color: #000; }
  .btn-outline { background: transparent; border: 1px solid #444; color: #ccc; }
  .btn-outline:hover { border-color: #888; color: #fff; }
  .btn-small { padding: 5px 12px; font-size: 11px; border-radius: 6px; }

  .summary { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 20px; }
  .summary-card { background: #151515; border: 1px solid #222; border-radius: 10px; padding: 14px; text-align: center; }
  .summary-card .num { font-size: 28px; font-weight: 700; line-height: 1; }
  .summary-card .label { font-size: 10px; color: #888; text-transform: uppercase; margin-top: 4px; letter-spacing: 0.5px; }
  .num.pass { color: #4caf50; }
  .num.fail { color: #f44336; }
  .num.warn { color: #ff9800; }
  .num.skip { color: #666; }
  .num.total { color: #fff; }

  .progress-bar { width: 100%; height: 6px; background: #1a1a1a; border-radius: 4px; margin-bottom: 20px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 4px; transition: width 0.3s; background: linear-gradient(90deg, #f44336, #ff9800, #4caf50); }

  .category { margin-bottom: 16px; }
  .category-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: #151515; border: 1px solid #222; border-radius: 10px 10px 0 0; cursor: pointer; user-select: none; }
  .category-header:hover { background: #1a1a1a; }
  .category-header h3 { font-size: 14px; color: #fff; display: flex; align-items: center; gap: 8px; }
  .category-header .cat-icon { font-size: 16px; }
  .category-header .cat-stats { font-size: 11px; color: #666; }
  .category-header .expand { color: #555; transition: transform 0.2s; }
  .category.open .expand { transform: rotate(180deg); }

  .test-list { border: 1px solid #222; border-top: none; border-radius: 0 0 10px 10px; overflow: hidden; }
  .category:not(.open) .test-list { display: none; }

  .test-row { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-bottom: 1px solid #1a1a1a; transition: background 0.15s; }
  .test-row:last-child { border-bottom: none; }
  .test-row:hover { background: #131313; }
  .test-row.running { background: rgba(244, 67, 54, 0.05); }

  .test-status { width: 24px; height: 24px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; shrink: 0; }
  .test-status.pending { background: #1a1a1a; color: #444; }
  .test-status.running { background: #f44336; color: #fff; animation: pulse 1s infinite; }
  .test-status.pass { background: #1b5e20; color: #4caf50; }
  .test-status.fail { background: #b71c1c; color: #f44336; }
  .test-status.warn { background: #e65100; color: #ff9800; }
  .test-status.skip { background: #1a1a1a; color: #555; }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

  .test-info { flex: 1; }
  .test-name { font-size: 12px; color: #ddd; }
  .test-desc { font-size: 10px; color: #555; margin-top: 1px; }

  .test-result { font-size: 11px; font-family: monospace; color: #888; max-width: 300px; text-align: right; }
  .test-result.pass { color: #4caf50; }
  .test-result.fail { color: #f44336; }
  .test-result.warn { color: #ff9800; }

  .test-time { font-size: 10px; color: #444; font-family: monospace; width: 50px; text-align: right; }

  .log-section { margin-top: 20px; }
  .log-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .log-header h3 { font-size: 13px; color: #888; }
  .log-box { background: #0d0d0d; border: 1px solid #222; border-radius: 10px; padding: 12px; max-height: 200px; overflow-y: auto; font-family: monospace; font-size: 11px; line-height: 1.6; }
  .log-line { color: #555; }
  .log-line.info { color: #888; }
  .log-line.pass { color: #4caf50; }
  .log-line.fail { color: #f44336; }
  .log-line.warn { color: #ff9800; }
  .log-line .ts { color: #333; margin-right: 8px; }

  .report-modal { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; }
  .report-modal.open { display: flex; }
  .report-content { background: #151515; border: 1px solid #333; border-radius: 14px; padding: 24px; width: 600px; max-height: 80vh; overflow-y: auto; }
  .report-content h2 { color: #fff; margin-bottom: 16px; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>sCure QA Tool</h1>
    <div class="version">v1.0.0 - Hardware & Software Quality Assurance</div>
  </div>
  <div class="header-right">
    <div class="status-dot disconnected" id="statusDot"></div>
    <span class="status-label" id="statusLabel">Disconnected</span>
    <button class="btn btn-outline btn-small" onclick="exportReport()">Export Report</button>
  </div>
</div>

<div class="container">
  <!-- Config -->
  <div class="config-bar">
    <label>API URL:</label>
    <input type="text" id="apiUrl" value="http://localhost:3001" onchange="checkConnection()">
    <button class="btn btn-outline btn-small" onclick="checkConnection()">Connect</button>
    <div style="flex:1"></div>
    <button class="btn btn-run" id="runAllBtn" onclick="runAllTests()" disabled>Run All Tests</button>
    <button class="btn btn-stop btn-small" id="stopBtn" onclick="stopTests()" style="display:none">Stop</button>
  </div>

  <!-- Summary -->
  <div class="summary">
    <div class="summary-card"><div class="num total" id="sumTotal">0</div><div class="label">Total</div></div>
    <div class="summary-card"><div class="num pass" id="sumPass">0</div><div class="label">Passed</div></div>
    <div class="summary-card"><div class="num fail" id="sumFail">0</div><div class="label">Failed</div></div>
    <div class="summary-card"><div class="num warn" id="sumWarn">0</div><div class="label">Warnings</div></div>
    <div class="summary-card"><div class="num skip" id="sumSkip">0</div><div class="label">Skipped</div></div>
  </div>

  <!-- Progress -->
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

  <!-- Test Categories -->
  <div id="testCategories"></div>

  <!-- Log -->
  <div class="log-section">
    <div class="log-header">
      <h3>Test Log</h3>
      <button class="btn btn-outline btn-small" onclick="clearLog()">Clear</button>
    </div>
    <div class="log-box" id="logBox"></div>
  </div>
</div>

<!-- Report Modal -->
<div class="report-modal" id="reportModal">
  <div class="report-content" id="reportContent"></div>
</div>

<script>
// ============================================================
// Test Definitions
// ============================================================
const TEST_CATEGORIES = [
  {
    id: 'api',
    name: 'API Connectivity',
    icon: '🌐',
    tests: [
      { id: 'api_state', name: 'GET /api/state', desc: 'Verify hardware state endpoint responds', endpoint: '/api/state', method: 'GET', expect: 'chamberTemp' },
      { id: 'api_network', name: 'GET /api/network/status', desc: 'Verify network status endpoint', endpoint: '/api/network/status', method: 'GET', expect: 'connected' },
      { id: 'net_wireguard_ip', name: 'WireGuard IP on the Network page', desc: 'The Network page "WireGuard IP" row shows the NetBird / WireGuard tunnel address: /api/network/status.wireguardIp (sCureBox 1.0.19+) or, on a backend without the field, the UP wt0/wg0 interface. Warn when the unit is not enrolled in NetBird', check: 'net_wireguard_ip' },
      { id: 'net_auto_watch', name: 'Auto Internet Watch Live', desc: 'The background internet watch publishes its verdict: /api/state.internetOk and /api/network/status.internet are booleans (LAN "connected" and real internet reachability are reported separately)', check: 'net_auto_watch' },
      { id: 'net_strip_logic', name: 'No-Internet Strip Logic', desc: 'StatusLeds: idle+offline → solid blue; process+offline → the comet runs in blue (both facts visible); fault and door-open always win; online → normal colors', check: 'net_strip_logic' },
      { id: 'counters_live', name: 'Component Counters Live + Persisted', desc: 'Real ON-hour counters (led405/led450/coolingFan/heater/heaterFan) are published in /api/state.counters, never decrease between samples, and a running component makes its counter advance (server persists them to disk across reboots)', check: 'counters_live' },
      { id: 'phase_timings', name: 'Phase Timings Collected', desc: 'Real per-phase durations accumulate in server/data/phase_timings.json: GET /api/phase-timings returns the records, and the per-run POST validates its payload (process + seconds required) so garbage never pollutes the timing data', check: 'phase_timings' },
      { id: 'api_materials', name: 'GET /api/materials/user', desc: 'Verify user materials endpoint', endpoint: '/api/materials/user', method: 'GET', expectArray: true },
      { id: 'api_history', name: 'GET /api/print-history', desc: 'Verify print history endpoint', endpoint: '/api/print-history', method: 'GET', expectArray: true },
      { id: 'history_durable', name: 'Histories Durable Without DB', desc: 'Print history AND cure history are served from a durable store (Postgres or the server/data files) — both GET endpoints return arrays, never 503, so recorded prints and cure sessions survive a power-off', check: 'history_durable' },
      { id: 'cloud_sync', name: 'Cloud Sync Agent Status', desc: '/api/state.cloudSync reports the portal sync agent: enabled + a recent successful sync when server/data/cloud.json is configured; cleanly disabled (no error) when not. Data-only by design — the portal can never actuate hardware', check: 'cloud_sync' },
      { id: 'ui_served', name: 'UI Served At /', desc: 'GET / returns the built UI page — the fullscreen app (Pi kiosk / Windows desktop window) opens this URL', check: 'ui_served' },
      { id: 'ui_spa_fallback', name: 'SPA Fallback Route', desc: 'GET /settings (a client route, not a file) still returns the UI page, so a refresh inside the kiosk never shows a 404', check: 'ui_spa_fallback' },
      { id: 'ui_fill_scale', name: 'UI Fills Any Screen', desc: 'fitToScreen logic (main.tsx): the 800x480 canvas is stretched to the full viewport — 1280x720 DSI panel, desktop windows, no black margins', check: 'ui_fill_scale' },
      { id: 'ui_builder_size', name: 'Dialogs Scale With The Screen', desc: 'Dialog/Select/OnScreenKeyboard portals render inside the scaled #root canvas, so the 550x460 Build Cure Program dialog shows at ~69% x ~96% of any screen and keyboard lettering scales up with the panel', check: 'ui_builder_size' },
      { id: 'ui_pause_button_style', name: 'Pause Button: White + State-Color Outline', desc: 'PhaseCard: the Pause button on the active phase card is white (bg-white, dark text) with a 2 px outline in the current state colour — the same border colour as the card: heating orange-500, drying blue-500, cure purple-500, cooling teal-500, bleaching cyan-400, N₂ white', check: 'ui_pause_button_style' },
      { id: 'ui_start_door_gate', name: 'Start Cure Blocked While Door Open', desc: 'Home: canStart = program selected AND door not open (doorClosed !== false). With the door open the Start Cure button is grey (neutral-600) and inert (no extra lettering), instead of starting a run that the door watchdog aborts a second later; a missing door reading does not block', check: 'ui_start_door_gate' },
      { id: 'ui_start_button_size', name: 'Start Cure Button: 1.5x Size', desc: 'Home: the Start Cure button is the standard button scaled by 1.5 — 54 px tall (was h-9 = 36), 21 px text (was 14), 24 px play icon (was 16), 30 px side padding (was 20); still a plain tap, fixed bottom-right, disabled until a program is selected', check: 'ui_start_button_size' },
    ]
  },
  {
    id: 'temperature',
    name: 'Temperature System',
    icon: '🌡',
    tests: [
      { id: 'temp_read', name: 'Temperature Sensor Read', desc: 'Read current chamber temperature', endpoint: '/api/state', method: 'GET', check: 'temp_range' },
      { id: 'temp_set', name: 'Set Target Temperature', desc: 'Set target to 40°C and verify', endpoint: '/api/chamber/temperature?target=40', method: 'POST', check: 'temp_set' },
      { id: 'temp_stop', name: 'Stop Heating', desc: 'Stop heating and verify', endpoint: '/api/chamber/stop', method: 'POST', expect: 'ok' },
      { id: 'temp_ramp_live', name: 'Chamber Temp Reaches Target', desc: 'Command heat to 40°C, then verify /api/state chamberTemp actually rises toward the target — the Cure screen displays and follows this measured value', check: 'temp_ramp_live' },
      { id: 'temp_ramp_logic', name: 'Ramp Ends At Measured Temp', desc: 'Cure screen logic: the ramp keeps going while the measured chamber temp is below target−0.5°C, and the hold timer starts only when it reaches the target', check: 'temp_ramp_logic' },
      { id: 'timer_wallclock', name: 'Phase Timer Tracks Wall-Clock', desc: 'Cure screen logic: elapsed time is computed from a performance.now() anchor, not by counting setInterval ticks — late/missed ticks (kiosk browser under load) must not stretch the phase duration', check: 'timer_wallclock' },
      { id: 'uv_after_ramp', name: 'UV Start Mode Gating', desc: 'Cure screen logic: with UV Start = "At temperature" a ramping Cure/Bleacher step heats FIRST with the UV off until the measured chamber temp reaches the target; with "On ramp start" the LEDs light from the very start of the ramp', check: 'uv_after_ramp' },
      { id: 'telemetry_report', name: 'Report Telemetry Sampling', desc: 'Cure screen logic: telemetry samples at t=0 and then every 5s, immune to the 1s status polling — so every run (even one aborted seconds in) has at least one sample and its report is downloadable from Cure History', check: 'telemetry_report' },
      { id: 'abort_confirm_warnings', name: 'Stop Mid-Process Confirmation', desc: 'Cure screen: Abort on the active phase opens a confirmation that says the cycle ends immediately and cannot be resumed, warns that the model\'s appearance/surface finish may be affected and that a partially cured model may warp or lose its shape, and shows a hot-surfaces caution marked with the ISO 7010 W017 hot-surface pictogram (yellow triangle, heat waves) and worded like the CAUTION label (wear heat-resistant gloves, avoid contact) — with the live temperature when the chamber is ≥ 40°C, a generic "may still be warm — wear gloves" note below that; Abort is FINAL only — buttons Keep Running / Yes, Stop (the temporary stop is the separate Pause button)', check: 'abort_confirm_warnings' },
      { id: 'stopped_run_colors', name: 'Stopped Run Is Orange', desc: 'A run stopped mid-process (status aborted) is labeled "Stopped" and shown in ORANGE — never green — in the process report (status pill + Status card), in Cure History (icon, badge, export ✓ feedback) and on Home; completed stays green, error red', check: 'stopped_run_colors' },
      { id: 'cp_stale_door_abort', name: 'Stale Door Abort Ignored At Run Start', desc: 'Cure screen: a doorAborted flag that is already TRUE when the run starts belongs to an earlier run — the screen acknowledges it (POST /api/door-abort/ack) and ignores it until the machine reports it clear; only a flag that goes false → true DURING the run stops the program (Err 6016). Off-Pi the flag is never acted on', check: 'cp_stale_door_abort' },
      { id: 'pause_resume', name: 'Pause & Open Door / Continue', desc: 'Cure screen: the separate Pause (⏸) button on the active step (next to Abort) opens "Pause the Process?" — with a note that pausing interrupts the cure and may affect the quality of the models (surface finish, shape, dimensional accuracy) plus the hot-surfaces caution; confirming with Pause & Open Door turns EVERY output off immediately (no fan run-on, so the server door watchdog sees nothing live and does not abort while the door is open), releases the door and freezes all clocks; Continue is allowed only with the door closed and shifts the ramp/hold/N2 anchors by the pause length and re-sends the phase command (heater + UV back, N2 valve re-opened) so the step continues where it stopped', check: 'pause_resume' },
      { id: 'report_usb_export', name: 'Report Export To USB', desc: 'Cure History download button: on the machine the report HTML is written straight to the USB drive (POST /api/system/export-report); a machine-side failure (9081 no USB / 9082 write failed) raises the alert instead of silently downloading; only dev/API-unreachable falls back to a browser download', check: 'report_usb_export' },
    ]
  },
  {
    id: 'fans',
    name: 'Fan System',
    icon: '💨',
    tests: [
      { id: 'fan_led', name: 'LED Cooling Fan', desc: 'Set LED cooling fan to 50% and verify', endpoint: '/api/fans/led_cooling?speed=50', method: 'POST', expect: 'ok' },
      { id: 'fan_intake', name: 'Chamber Intake Fan', desc: 'Set chamber intake fan to 50%', endpoint: '/api/fans/chamber_intake?speed=50', method: 'POST', expect: 'ok' },
      { id: 'fan_heating', name: 'Chamber Heating Fan', desc: 'Set heating fan to 50%', endpoint: '/api/fans/chamber_heating?speed=50', method: 'POST', expect: 'ok' },
      { id: 'fan_test', name: 'Fan Diagnostic Test', desc: 'Run fan RPM test', endpoint: '/api/diagnostics/fan-test', method: 'POST', check: 'fan_rpm' },
      { id: 'fan_stop', name: 'Stop All Fans', desc: 'Set all fans to 0%', endpoint: '/api/fans/led_cooling?speed=0', method: 'POST', expect: 'ok' },
    ]
  },
  {
    id: 'leds',
    name: 'UV LED System',
    icon: '💡',
    tests: [
      { id: 'led_test', name: 'LED Diagnostic', desc: 'Run full LED diagnostic test', endpoint: '/api/diagnostics/led-test', method: 'POST', check: 'led_results' },
    ]
  },
  {
    id: 'mechanical',
    name: 'Mechanical Systems',
    icon: '⚙',
    tests: [
      { id: 'door_open', name: 'Door Open', desc: 'Open the door', endpoint: '/api/door/open', method: 'POST', expect: 'ok' },
      { id: 'rgb_override_release', name: 'RGB Strip Override Release', desc: 'POST /api/rgb?on=0 hands the strip back to the automatic status colors (was HTTP 500: IOBridge had no set_rgb)', endpoint: '/api/rgb?on=0', method: 'POST', expect: 'ok' },
      { id: 'damper_open', name: 'Damper Open', desc: 'Open the damper', endpoint: '/api/damper/open', method: 'POST', expect: 'ok' },
      { id: 'damper_close', name: 'Damper Close', desc: 'Close the damper', endpoint: '/api/damper/close', method: 'POST', expect: 'ok' },
    ]
  },
  {
    id: 'config',
    name: 'Configuration Files',
    icon: '📁',
    tests: [
      { id: 'cfg_presets', name: 'Presets (API)', desc: 'GET /api/materials/presets returns the seeded preset programs (Postgres)', endpoint: '/api/materials/presets', method: 'GET', expectArray: true },
      { id: 'cfg_errors', name: 'Errors JSON', desc: 'Validate errors.json structure', url: '/config/errors.json', check: 'errors' },
      { id: 'cfg_system', name: 'System JSON', desc: 'Validate system.json config', url: '/config/system.json', check: 'system' },
    ]
  },
  {
    id: 'network',
    name: 'Network Diagnostics',
    icon: '📡',
    tests: [
      { id: 'net_ping', name: 'Ping Test (8.8.8.8)', desc: 'Ping Google DNS', endpoint: '/api/network/diagnostics', method: 'POST', body: { tool: 'ping', address: '8.8.8.8' }, expect: 'ok' },
      { id: 'net_dns', name: 'DNS Lookup', desc: 'Resolve google.com', endpoint: '/api/network/diagnostics', method: 'POST', body: { tool: 'nslookup', address: 'google.com' }, expect: 'ok' },
    ]
  },
  {
    id: 'system',
    name: 'System Functions',
    icon: '🖥',
    tests: [
      { id: 'sys_logs', name: 'Export Logs', desc: 'Test log export function', endpoint: '/api/system/export-logs', method: 'POST', expect: 'ok' },
      { id: 'sys_export_csv', name: 'Export CSV to USB', desc: 'CSV export endpoint writes to the connected USB (or reports no-USB)', endpoint: '/api/system/export-csv', method: 'POST', body: { filename: 'qa-test.csv', content: 'Step,Process,Temperature,UVIntensity,CoolingMode\n1,Heating,40,,' }, expect: 'message' },
      { id: 'sys_version', name: 'Version Info', desc: '/api/system/version reports the VERSION-file app version (x.y.z) + live build/OS/boot info', check: 'sys_version' },
    ]
  },
  {
    id: 'data_persistence',
    name: 'Data Persistence (PostgreSQL / disk)',
    icon: '🗄',
    tests: [
      { id: 'data_materials_get', name: 'Get User Materials', desc: 'GET /api/materials/user returns user programs (DB view or JSON fallback)', endpoint: '/api/materials/user', method: 'GET', expectArray: true },
      { id: 'data_materials_persist', name: 'Programs Survive Power-Off', desc: 'Save a program, re-read it (durable JSON store on the SSD) — the user list is preserved unchanged', check: 'data_persist_roundtrip' },
      { id: 'data_print_history_get', name: 'Get Print History', desc: 'GET /api/print-history returns print records (§6.4)', endpoint: '/api/print-history', method: 'GET', expectArray: true },
      { id: 'data_cure_history_get', name: 'Get Cure History', desc: 'GET /api/cure-history returns cure runs (§8) — empty [] without a DB', endpoint: '/api/cure-history', method: 'GET', expectArray: true },
      { id: 'data_cure_start', name: 'Start Cure Run (DB)', desc: 'POST /api/cure-runs/qa-test-run/start records a run — needs DATABASE_URL (503 otherwise)', endpoint: '/api/cure-runs/qa-test-run/start', method: 'POST', body: { materialName: 'QA Material', steps: 2, phases: ['Heating', 'Cooling'], targetTemp: 60, serialNumber: 'QA-BOX-001' }, expect: 'ok' },
      { id: 'data_telemetry', name: 'Record Telemetry (DB)', desc: 'POST /api/cure-runs/qa-test-run/telemetry appends a sample to cure_run_telemetry', endpoint: '/api/cure-runs/qa-test-run/telemetry', method: 'POST', body: { t: 5, chamberTemp: 42.5, uvOn: false }, expect: 'ok' },
      { id: 'data_cure_finish', name: 'Finish Cure Run (DB)', desc: 'POST /api/cure-runs/qa-test-run/finish closes the run', endpoint: '/api/cure-runs/qa-test-run/finish', method: 'POST', body: { status: 'completed', stepsCompleted: 2 }, expect: 'ok' },
      { id: 'data_report_save', name: 'Save Cure Report (DB)', desc: 'POST /api/cure-runs/qa-test-run/report persists the report to cure_reports', endpoint: '/api/cure-runs/qa-test-run/report', method: 'POST', body: { content: '<html>QA report</html>', summary: { materialName: 'QA Material', status: 'completed' }, format: 'html' }, expect: 'ok' },
      { id: 'data_report_get', name: 'Fetch Cure Report (DB)', desc: 'GET /api/cure-runs/qa-test-run/report returns the saved report', endpoint: '/api/cure-runs/qa-test-run/report', method: 'GET', expect: 'ok' },
    ]
  },
  {
    id: 'cure_ops',
    name: 'Cure Operation Functions',

      { id: 'io_state_sensors', name: 'Temperature-Sensor Supervision In State', desc: 'GET /api/state carries sensors {chamber,left,right,back,door: {sensor, ok, openSec, critical}} and alerts [] (active registry codes). chamber/left/right must be flagged critical, back/door not; any open sensor reports its seconds open', endpoint: '/api/state', method: 'GET', check: 'io_state_sensors' },
      { id: 'io_state_fan_health', name: 'Fan Health Supervision In State', desc: 'GET /api/state carries fanHealth {FAN_HEATER, FAN_COOLING, FAN_LEFT, FAN_RIGHT, FAN_BACK, FAN_DOOR: {duty, rpm, expected, deficitPct, status, since}} plus alertDetails {}. status must be one of idle / ok / warn / critical / warn-pending / critical-pending; a running fan (duty >= 30 %) must show measured and expected RPM', endpoint: '/api/state', method: 'GET', check: 'io_state_fan_health' },
      { id: 'hwc_dvt_remote_gate', name: 'DVT From The Site: Nothing Runs Without Start At The Machine', desc: 'Mirrors DVT/runner/dvt-runner.cjs + sCureBox RemoteConfirm (user, 2026-10-12): a test requested from the portal is run by the CureBox\'s DVT runner only after someone presses Start on the machine\'s screen; Decline, no answer within the timeout, or a cancel from the site mean the engine is never started; a machine busy with a process, or a test with no automatic script, is refused before any dialog; the confirmation endpoint answers loopback callers only', check: 'hwc_dvt_remote_gate' },
      { id: 'hwc_dvt_cloud_contract', name: 'DVT → Cloud Upload Contract', desc: 'Mirrors DVT/web/dvt-tool.html cloudRunBody / cloudSendRun and cloud/google/Code.gs: a recorded DVT run is posted as kind "dvt_run" (unit, testId, variant, rep, runId, verdict, operator, startedAt, note, values) with the DVT key - never a machine key - and every raw measurement follows as kind "dvt_file" with fileKind + contentBase64, so the portal\'s DVT tab shows the campaign. A refused upload keeps the run queued; the results folder stays the record', check: 'hwc_dvt_cloud_contract' },
      { id: 'hwc_fan_test_criterion', name: 'Fan Test Criterion (nominal RPM, not "is it turning")', desc: 'Mirrors io_bridge._fan_verdict / CureController.Judge (v0.9.93): the Settings "Test" button judges every reading against the fan\'s nominal RPM at the duty it was measured at — FAIL below critical_below_pct (or under min_fan_rpm), WARN below warn_below_pct, OK otherwise — the same thresholds the wear supervision raises 9002 / 9051 on. Until 0.9.93 anything above 100 RPM said OK, so a heater fan at a third of its nominal speed still passed; a fan a loop already drives is judged at ITS duty (a 30 % cooldown run-on against the 30 % nominal, not the 100 % one)', check: 'hwc_fan_test_criterion' },
      { id: 'hwc_fan_test_gate', name: 'Fan Test Gate: Only FAIL Holds A Start', desc: 'Mirrors CureProcessPage fan pre-flight, HomeViewModel.FailedFans and BootSelfTest.FanTest: a WARN fan (worn, 9051 territory) is reported in amber but still runs the process; only FAIL (not turning, or past the stop threshold) holds the start and opens the fan-failure dialog', check: 'hwc_fan_test_gate' },
      { id: 'hwc_fan_policy', name: 'Fan Wear Policy Mirror (9051 at -10 %, 9002 at -20 %, heater fan -11.8 %, 60 s)', desc: 'Mirrors io_bridge fan supervision + components.json fan_health: >= 10 % below nominal for a full minute -> 9051 warning (replace fan); >= critical_below_pct below for a full minute -> 9002 critical (all outputs off, process start refused, fan named) - 20 % for every fan except the heater fan, which stops at 11.8 % (5,227 RPM at 100 %, the user\'s limit of 2026-10-08). Evaluated at >= 30 % duty after a 5 s spin-up; nominal table re-measured after the airflow fix (heater 5925/5227/3669/2363 @100/80/50/30, cooling 4790/2690/1235 @100/60/30, LED 3560 @100), with nominal_rpm_damper_open (cooling 4075 @100 / 2470 @60) used while the damper is open; linear interpolation between duty points', check: 'hwc_fan_policy' },
      { id: 'hist_fan_rpm', name: 'Cure History Telemetry Carries Fan RPM', desc: 'GET /api/cure-history: telemetry samples of runs recorded on v0.8.42+ carry fanRpm {FAN_HEATER, FAN_COOLING, FAN_LEFT, FAN_RIGHT, FAN_BACK, FAN_DOOR: rpm|null} - the data behind the report\'s Fan speeds chart. Older runs without it are tolerated; where present the keys must be fan names and the values numbers or null', endpoint: '/api/cure-history', method: 'GET', check: 'hist_fan_rpm' },
      { id: 'hist_sensor_issues', name: 'Cure History Carries Sensor Issues', desc: 'GET /api/cure-history: runs finished on v0.8.39+ carry sensorIssues [{sensor, critical}] (empty = every temperature sensor read for the whole run). Sensor keys must be chamber/left/right/back/door; chamber/left/right entries must be flagged critical. Older runs without the field are tolerated', endpoint: '/api/cure-history', method: 'GET', check: 'hist_sensor_issues' },
      { id: 'hwc_sensor_policy', name: 'Sensor Disconnect Policy Mirror (9001 / 9050, 60 s)', desc: 'Mirrors io_bridge SENSOR_OPEN_ALERT_SEC / CRITICAL_TEMP_SENSORS / WARNING_TEMP_SENSORS: chamber + Left + Right open >= 60 s -> 9001 critical and process start refused (checked at start-up, every second, and re-read every 0.5 s for 10 s before each start - one valid read passes); Back + Door open >= 60 s -> 9050 warning, processes allowed. Both codes must exist in errors.json with those severities', check: 'hwc_sensor_policy' },
      { id: 'sensor_glitch_filter', name: 'Temperature Sensor Noise Filter (10 s continuous before a fault)', desc: 'Mirror of io_controller _thermistor_state (heater.thermistor_glitch_sec) + io_bridge SENSOR_GLITCH_SEC (v0.9.6): a thermistor counts as failed only after it reads open / out of range CONTINUOUSLY for 10 s. A shorter dropout (I2C / connector noise, test unit 2026-09-15) holds the last good temperature, does not switch the heater or cooling off, raises no immediate 9001, is not written to the cure-history sensorIssues and does not refuse a process start; a sensor that stays open is still caught 10 s after it went open', check: 'sensor_glitch_filter' },
      { id: 'io_state_led_health', name: 'LED Connection Supervision In State', desc: 'GET /api/state carries ledHealth {LED_LEFT, LED_RIGHT: {lit, intensity, baseline, rise, litSec, status}} for the supervised panels (Left / Right via their regular thermistors TEMP_LEFT / TEMP_RIGHT; Back / Door are not supervised by default). status must be one of off / low / warming / ok / fail / drop / no-sensor; a lit panel at >= 30 % must show a numeric baseline and rise; 9004 / 9005 in alerts must come with an alertDetails text naming the panel', endpoint: '/api/state', method: 'GET', check: 'io_state_led_health' },
      { id: 'hwc_led_heating_policy', name: 'LED Not Heating Policy Mirror (9004, +1.0 C in 90 s at >= 30 %, Left/Right regular thermistors)', desc: 'Mirrors io_bridge _led_heat_tick + components.json led_heating: the Left / Right panels (regular thermistors TEMP_LEFT / TEMP_RIGHT, not ORIGIN) lit at >= 30 % system power must warm by >= 1.0 C within 90 s of accumulated light (baseline = temperature when the light started; a re-light within 120 s keeps the baseline) else 9004 critical "check the LED connection" naming the panel; the process is not aborted; latch clears when the panel heats again. Mid-process drop: once a panel proved it heats, a fall >= 1.0 C below its peak at the current power (chamber cooling taken off) for 30 s -> 9005 critical panel fault; power change settles 120 s, a re-light re-judges the panel; clears within 0.5 C of the peak. Bench 2026-09-14 @30 % 405 nm: TEMP_LEFT +1.8, TEMP_RIGHT +1.7 C after 90 s', check: 'hwc_led_heating_policy' },

      { id: 'io_cool_on', name: 'Cooling Mode ON', desc: 'POST /api/cure/cool — damper opens, chamber fan runs at the mode\'s fixed duty', endpoint: '/api/cure/cool?target=25&mode=medium', method: 'POST', expect: 'ok' },
      { id: 'io_cool_pwm', name: 'Cooling Fixed Fan Duty', desc: 'Each cooling mode holds the chamber fan at its FIXED duty (no PI rate control): slow=30%, medium=60%, fast=100% — verified live via coolingFanPwm in /api/state', check: 'io_cool_pwm' },

      { id: 'heater_sensor_guard', name: 'Heater Never On Without Its Temperature Sensor (Err 9001)', desc: 'Mirror of io_controller enable_heater / heater_health_check + io_bridge sensor supervision: a heating start with the chamber NTC (the heater thermistor) open / out of range is refused with 9001 and the screen pops the heater fault (Retry / Stop, no continue-anyway); the sensor staying open for 10 s mid-step (noise filter, v0.9.6) switches the heater off and raises 9001 right away with the heater detail (the cure pauses); a sensor open at boot with no heating waits the usual 60 s. Also checks /api/state carries alertDetails and errors.json 9001 documents the heater rule', url: '/config/errors.json', check: 'heater_sensor_guard' },
      { id: 'io_rgb_status', name: 'RGB Status Strip Logic', desc: 'StatusLeds (io_bridge): fault → BLINKING red; door open → BLINKING door color; process → PURPLE comet (BLUE comet when internet is unreachable); idle without internet → solid blue; all OK → solid normal; unreadable door sensor is not treated as open', check: 'io_rgb_status' },
      { id: 'rgb_alerts_follow', name: 'Strip Follows The Notifications (red / yellow / green)', desc: 'POST /api/rgb/alerts?critical=1&warning=0 -> /api/state.stripMode "fault" (pulsing red); critical=0&warning=2 -> "warn" (pulsing yellow); 0/0 -> back to "normal" (solid green, or the busy / no-internet colors when those apply). The counts the screen reported before the test are restored afterwards. Machine faults and an open door mask the test (warn)', check: 'rgb_alerts_follow' },
      { id: 'led_status_loop', name: 'LED Status Loop Every 1s', desc: 'StatusLeds watchdog re-classifies the machine state every status_sec=1s (animation keeps its own faster ticks) — any state change reaches the strip within 1 second', check: 'led_status_loop' },
      { id: 'sampling_1s', name: 'Sampling Time ≤ 1s (HSI)', desc: 'HSI sampling-time rule: every reading is sampled at most every 1s — heating loop sample_sec=1s, cooling loop sample_sec=1s, status/door watchdog status_sec=1s, dashboard SENSOR_REFRESH_SEC=1s, UI /api/state poll=1s', check: 'sampling_1s' },
      { id: 'io_door_abort', name: 'Door-Open Safety Abort', desc: 'Watchdog: door opened while ANY output is live → 10s countdown warning on screen; if it STAYS open → process aborted + ALL outputs off + strip turns red (Err 6016). Closing in time resumes; idle/unreadable sensor never aborts', check: 'io_door_abort' },
      { id: 'io_n2_clears_door_abort', name: 'N₂ Start Clears Latched Door Abort', desc: 'A door abort (Err 6016) that was never acknowledged stayed latched on the machine and killed any program whose FIRST step is the N₂ purge the instant it started (heating/cure/cooling clear the latch, the valve command did not). POST /api/cure/nitrogen?on=1 must now clear doorAborted like every other process start; valve closed again afterwards', check: 'io_n2_clears_door_abort' },
      { id: 'io_door_ack', name: 'Door Abort Acknowledge', desc: 'POST /api/door-abort/ack — the strip stays RED after a door abort until the user confirms the Err 6016 alert (or starts a new process); acknowledging clears doorAborted and returns the strip to normal', endpoint: '/api/door-abort/ack', method: 'POST', expect: 'ok' },
      { id: 'io_damper_logic', name: 'Damper Open/Close Logic', desc: 'Damper (MG90S on GPIO8): opens ONLY when a drying step reaches its target temp or when cooling starts; closed during drying ramp, heating, cure, bleach, idle and after stop', check: 'io_damper_logic' },

// ---- DVT Readiness helpers (category dvt_ready) -----------------------------
const dvtrSleep = (ms) => new Promise(r => setTimeout(r, ms));
async function dvtrState() {
  const base = document.getElementById('apiUrl').value;
  const r = await fetch(base + '/api/state', { signal: AbortSignal.timeout(4000) });
  return r.json();
}
async function dvtrPost(path) {
  const base = document.getElementById('apiUrl').value;
  const r = await fetch(base + path, { method: 'POST', signal: AbortSignal.timeout(8000) });
  return r.json().catch(() => ({ ok: false, message: `HTTP ${r.status}` }));
}
const dvtrStop = () => dvtrPost('/api/cure/stop').catch(() => {});
function dvtrDone(test, t0, result) {
  const elapsed = Date.now() - t0;
  setTestStatus(test.id, result.status, result.msg, elapsed);
  log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
}

// ============================================================
// State
// ============================================================
let isConnected = false;
let isRunning = false;
let shouldStop = false;
let testResults = {};
let logLines = [];
let startTime = null;

// ============================================================
// Init
// ============================================================
function init() {
  renderCategories();
  checkConnection();
}

// ============================================================
// Connection
// ============================================================
async function checkConnection() {
  const url = document.getElementById('apiUrl').value;
  const dot = document.getElementById('statusDot');
  const label = document.getElementById('statusLabel');
  const btn = document.getElementById('runAllBtn');

  try {
    const res = await fetch(url + '/api/state', { signal: AbortSignal.timeout(3000) });
    if (res.ok) {
      isConnected = true;
      dot.className = 'status-dot connected';
      label.textContent = 'Connected';
      btn.disabled = false;
      log('info', 'Connected to API at ' + url);
    } else {
      throw new Error('Bad response');
    }
  } catch (e) {
    isConnected = false;
    dot.className = 'status-dot disconnected';
    label.textContent = 'Disconnected';
    btn.disabled = true;
    log('fail', 'Cannot connect to API at ' + url);
  }
}

  const container = document.getElementById('testCategories');
  let totalTests = 0;

  container.innerHTML = TEST_CATEGORIES.map(cat => {
    totalTests += cat.tests.length;
    return `
    <div class="category open" id="cat-${cat.id}">
      <div class="category-header" onclick="toggleCategory('${cat.id}')">
        <h3><span class="cat-icon">${cat.icon}</span> ${cat.name}</h3>
        <div style="display:flex;align-items:center;gap:12px">
          <span class="cat-stats" id="cat-stats-${cat.id}">${cat.tests.length} tests</span>
          <button class="btn btn-outline btn-small" onclick="event.stopPropagation();runCategory('${cat.id}')">Run</button>
          <span class="expand">&#9660;</span>
        </div>
      </div>
      <div class="test-list">
        ${cat.tests.map(t => `
          <div class="test-row" id="row-${t.id}">
            <div class="test-status pending" id="status-${t.id}">-</div>
            <div class="test-info">
              <div class="test-name">${t.name}</div>
              <div class="test-desc">${t.desc}</div>
            </div>
            <div class="test-result" id="result-${t.id}"></div>
            <div class="test-time" id="time-${t.id}"></div>
          </div>
        `).join('')}
      </div>
    </div>`;
  }).join('');

  document.getElementById('sumTotal').textContent = totalTests;
}

function toggleCategory(id) {
  document.getElementById('cat-' + id).classList.toggle('open');
}

function updateSummary() {
  const values = Object.values(testResults);
  const pass = values.filter(r => r === 'pass').length;
  const fail = values.filter(r => r === 'fail').length;
  const warn = values.filter(r => r === 'warn').length;
  const skip = values.filter(r => r === 'skip').length;
  const total = TEST_CATEGORIES.reduce((s, c) => s + c.tests.length, 0);

  document.getElementById('sumPass').textContent = pass;
  document.getElementById('sumFail').textContent = fail;
  document.getElementById('sumWarn').textContent = warn;
  document.getElementById('sumSkip').textContent = skip;

  const done = pass + fail + warn + skip;
  document.getElementById('progressFill').style.width = Math.round((done / total) * 100) + '%';

  // Update category stats
  TEST_CATEGORIES.forEach(cat => {
    const catResults = cat.tests.map(t => testResults[t.id]).filter(Boolean);
    const catPass = catResults.filter(r => r === 'pass').length;
    const catFail = catResults.filter(r => r === 'fail').length;
    const el = document.getElementById('cat-stats-' + cat.id);
    if (catResults.length === 0) {
      el.textContent = cat.tests.length + ' tests';
    } else {
      el.innerHTML = `<span style="color:#4caf50">${catPass}P</span> / <span style="color:#f44336">${catFail}F</span> / ${cat.tests.length}`;
    }
  });
}

function setTestStatus(testId, status, result, time) {
  testResults[testId] = status;

  const statusEl = document.getElementById('status-' + testId);
  const resultEl = document.getElementById('result-' + testId);
  const timeEl = document.getElementById('time-' + testId);
  const rowEl = document.getElementById('row-' + testId);

  const icons = { pending: '-', running: '...', pass: '✓', fail: '✗', warn: '!', skip: '—' };
  statusEl.className = 'test-status ' + status;
  statusEl.textContent = icons[status] || '-';
  resultEl.textContent = result || '';
  resultEl.className = 'test-result ' + status;
  timeEl.textContent = time ? time + 'ms' : '';
  rowEl.className = 'test-row' + (status === 'running' ? ' running' : '');

  updateSummary();
}

// ============================================================
// Test Runner
// ============================================================
async function runAllTests() {
  if (isRunning) return;
  isRunning = true;
  shouldStop = false;
  startTime = Date.now();

  document.getElementById('runAllBtn').disabled = true;
  document.getElementById('stopBtn').style.display = '';

  // Reset all
  testResults = {};
  TEST_CATEGORIES.forEach(cat => cat.tests.forEach(t => setTestStatus(t.id, 'pending', '', '')));
  updateSummary();

  log('info', '=== QA Test Run Started ===');

  for (const cat of TEST_CATEGORIES) {
    if (shouldStop) break;
    log('info', `--- ${cat.name} ---`);
    for (const test of cat.tests) {
      if (shouldStop) { setTestStatus(test.id, 'skip', 'Stopped', ''); continue; }
      await runSingleTest(test);
    }
  }

  const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
  const vals = Object.values(testResults);
  const pass = vals.filter(r => r === 'pass').length;
  const fail = vals.filter(r => r === 'fail').length;
  log(fail > 0 ? 'fail' : 'pass', `=== QA Complete: ${pass} passed, ${fail} failed in ${elapsed}s ===`);

  isRunning = false;
  document.getElementById('runAllBtn').disabled = false;
  document.getElementById('stopBtn').style.display = 'none';
}

async function runCategory(catId) {
  const cat = TEST_CATEGORIES.find(c => c.id === catId);
  if (!cat || isRunning) return;
  isRunning = true;
  shouldStop = false;

  log('info', `--- Running: ${cat.name} ---`);
  for (const test of cat.tests) {
    if (shouldStop) break;
    await runSingleTest(test);
  }
  isRunning = false;
}

function stopTests() {
  shouldStop = true;
  log('warn', 'Test run stopped by user');
}

async function runSingleTest(test) {
  setTestStatus(test.id, 'running', 'Running...', '');
  const t0 = Date.now();
  const apiUrl = document.getElementById('apiUrl').value;

  try {
    // Local validation tests (no API needed)
    if (test.check && test.check.startsWith('csv_')) {
      const result = runCsvImportCheck(test.check);
      const elapsed = Date.now() - t0;
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }
    if (test.check && test.check.startsWith('fmt_')) {
      const result = runCsvFormatCheck(test.check);
      const elapsed = Date.now() - t0;
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }
    if (test.check && test.check.startsWith('pv_')) {
      const result = runProgramValidationCheck(test.check);
      const elapsed = Date.now() - t0;
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }
    if (test.check && test.check.startsWith('dup_')) {
      const result = runDuplicateCheck(test.check);
      const elapsed = Date.now() - t0;
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }
    if (test.check && test.check.startsWith('nav_')) {
      const result = runNavCheck(test.check);
      const elapsed = Date.now() - t0;
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }
    if (test.check && test.check.startsWith('n2_')) {
      const result = runN2IconCheck(test.check);
      const elapsed = Date.now() - t0;
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }
    if (test.check && test.check.startsWith('fav_')) {
      const result = runFavoriteCheck(test.check);
      const elapsed = Date.now() - t0;
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }
    if (test.check && test.check.startsWith('gv_')) {
      const result = runGaugeValueCheck(test.check);
      const elapsed = Date.now() - t0;
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }
    if (test.check && test.check.startsWith('fant_')) {
      const result = runFanTestCheck(test.check);
      const elapsed = Date.now() - t0;
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }
    if (test.check && test.check.startsWith('srs_')) {
      const result = runSrsVersionCheck(test.check);
      const elapsed = Date.now() - t0;
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }
    if (test.check && test.check.startsWith('boot_')) {
      const result = runBootCheck(test.check);
      const elapsed = Date.now() - t0;
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }
    if (test.check && test.check.startsWith('wake_')) {
      const result = runWakeScreenCheck(test.check);
      const elapsed = Date.now() - t0;
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }
    if (test.check && test.check.startsWith('cra_')) {
      const result = await runComplianceCheck(test.check);
      const elapsed = Date.now() - t0;
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }

    // Local UX↔hardware compatibility logic mirrors (no API needed)
    if (test.check && test.check.startsWith('hwc_csv_') || test.check === 'hwc_cool_done_band' || test.check === 'hwc_onoff_heat' || test.check === 'hwc_timer_start') {
      const result = runHwCompatCheck(test.check);
      const elapsed = Date.now() - t0;
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }

    // FAST cooling engages the four LED-cooling fans, and stop releases them.
    if (test.check === 'hwc_fastcool_ledfans') {
      const readFans = async () => {
        const r = await fetch(apiUrl + '/api/state', { signal: AbortSignal.timeout(5000) });
        return (await r.json()).fans || {};
      };
      const cool = await (await fetch(apiUrl + '/api/cure/cool?target=30&mode=fast', { method: 'POST', signal: AbortSignal.timeout(8000) })).json();
      let result;
      if (!cool.ok) {
        result = { status: 'warn', msg: `Cool command refused: ${cool.message || 'unknown'}` };
      } else {
        await new Promise(r => setTimeout(r, 500));
        const during = await readFans();
        await fetch(apiUrl + '/api/cure/stop', { method: 'POST', signal: AbortSignal.timeout(8000) }).catch(() => {});
        await new Promise(r => setTimeout(r, 500));
        const after = await readFans();
        if (!(during.led_cooling > 0)) {
          result = { status: 'fail', msg: `LED fans NOT engaged in fast cool (led_cooling=${during.led_cooling})` };
        } else if (after.led_cooling !== 0) {
          result = { status: 'fail', msg: `LED fans not released after stop (led_cooling=${after.led_cooling})` };
        } else {
          result = { status: 'pass', msg: `LED fans at ${during.led_cooling}% during fast cool, 0% after stop` };
        }
      }
      const elapsed = Date.now() - t0;
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }

    // Negative API test: the endpoint must REJECT the request (ok:false),
    // optionally with a specific registry error code.

    // Process-start timeout budget (v0.9.4): the UI waits 20 s for heat / cure / uv-only / cool / dry -
    // longer than the machine's own pre-flights that run before the command is answered.
    if (test.check === 'hwc_start_timeout_budget') {
      const UI_DEFAULT_MS = 5000, PROCESS_START_TIMEOUT_MS = 20000;
      const machine = { sensorPreflight: 500, heaterSpinUp: 2000, heaterRpmRead: 1000, ledFanSpinUp: 1500, ledFanRpmReads: 4 * 500 };
      const worst = Object.values(machine).reduce((a, b) => a + b, 0);
      const problems = [];
      if (worst <= UI_DEFAULT_MS) problems.push(`machine pre-flights (${worst} ms) fit the old ${UI_DEFAULT_MS} ms default - the budget would not be needed`);
      if (PROCESS_START_TIMEOUT_MS < 2 * worst) problems.push(`${PROCESS_START_TIMEOUT_MS} ms budget is under twice the ${worst} ms pre-flights`);
      if (PROCESS_START_TIMEOUT_MS > 30000) problems.push('a budget over 30 s would hide a hung command from the operator');
      const result = problems.length ? { status: 'fail', msg: problems.join('; ') }
        : { status: 'pass', msg: `machine pre-flights ${worst} ms > old ${UI_DEFAULT_MS} ms default; UI budget ${PROCESS_START_TIMEOUT_MS} ms` };
      const elapsed = Date.now() - t0;
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }

    // Live: a real heated cure start must be answered inside the 20 s budget (the machine runs its pre-flights first).
    if (test.check === 'hwc_start_roundtrip') {
      const stopNow = () => fetch(apiUrl + '/api/cure/stop?immediate=1', { method: 'POST', signal: AbortSignal.timeout(8000) }).catch(() => {});
      const t1 = Date.now();
      let result;
      try {
        const r = await (await fetch(apiUrl + '/api/cure/cure-405?target=35&intensity=10', { method: 'POST', signal: AbortSignal.timeout(20000) })).json();
        const ms = Date.now() - t1;
        await stopNow();
        if (!r.ok) result = { status: 'warn', msg: `cure start refused after ${ms} ms: ${r.message || 'unknown'}` };
        else result = { status: 'pass', msg: `cure-405 answered in ${ms} ms (${ms > 5000 ? 'over the old 5 s default, ' : ''}within the 20 s budget), stopped at once` };
      } catch (e) {
        await stopNow();
        result = { status: 'fail', msg: `no answer within 20 s (${(e && e.name) || e})` };
      }
      const elapsed = Date.now() - t0;
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }

    if (test.check === 'hw_reject') {
      const opts = { method: test.method || 'POST', signal: AbortSignal.timeout(8000) };
      if (test.body) { opts.headers = { 'Content-Type': 'application/json' }; opts.body = JSON.stringify(test.body); }
      const r = await fetch(apiUrl + test.endpoint, opts);
      const d = await r.json();
      const elapsed = Date.now() - t0;
      let result;
      if (d.ok === false && (!test.code || d.code === test.code)) {
        result = { status: 'pass', msg: `Rejected${d.code ? ' with code ' + d.code : ''}: ${(d.message || '').slice(0, 40)}` };
      } else if (d.ok === false) {
        result = { status: 'warn', msg: `Rejected but code=${d.code ?? 'none'} (expected ${test.code})` };
      } else {
        result = { status: 'fail', msg: 'Request was ACCEPTED but must be rejected' };
      }
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r2 => setTimeout(r2, 50));
      return;
    }

    // Automatic internet watch: both endpoints must publish the background
    // check's verdict so the UI / QA can observe it (io_bridge._net_watch).
    // Versioning: the app version must come from the repo-root VERSION file
    // (semver) and the endpoint must publish live machine info alongside it.
    if (test.check === 'nfc_enable_guard' || test.check === 'nfc_disable_always') {
      let result;
      try {
        const before = await (await fetch(apiUrl + '/api/nfc', { signal: AbortSignal.timeout(5000) })).json();
        const wasOn = !!before.enabled;
        const on = test.check === 'nfc_enable_guard' ? 1 : 0;
        const r = await (await fetch(apiUrl + '/api/nfc?on=' + on, { method: 'POST', signal: AbortSignal.timeout(5000) })).json();
        const after = await (await fetch(apiUrl + '/api/nfc', { signal: AbortSignal.timeout(5000) })).json();
        if (on === 0) {
          result = (r.ok === true && after.enabled === false)
            ? { status: 'pass', msg: `OFF accepted (reader ${after.reader?.detected ? 'present' : 'absent'}), enabled=false` }
            : { status: 'fail', msg: `OFF refused or still enabled: ${JSON.stringify(r).slice(0, 120)}` };
        } else if (before.reader && before.reader.detected) {
          result = (r.ok === true && after.enabled === true)
            ? { status: 'pass', msg: `reader detected (${before.reader.model || '?'} on ${before.reader.port || 'usb'}) -> ON accepted` }
            : { status: 'fail', msg: `reader detected but ON refused: ${JSON.stringify(r).slice(0, 120)}` };
        } else {
          result = (r.ok === false && r.code === 9052 && after.enabled === false)
            ? { status: 'pass', msg: 'no reader -> ON refused with Err 9052, setting stays off' }
            : { status: 'fail', msg: `no reader but guard did not hold: ${JSON.stringify(r).slice(0, 120)}, enabled=${after.enabled}` };
        }
        // restore the operator's setting (ON is only restorable while a reader is present)
        await fetch(apiUrl + '/api/nfc?on=' + (wasOn ? 1 : 0), { method: 'POST', signal: AbortSignal.timeout(5000) });
      } catch (e) {
        result = { status: 'fail', msg: `fetch failed: ${e.message}` };
      }
      const elapsed = Date.now() - t0;
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }

    // The screen's undismissed notification counts drive the RGB strip (io_bridge StatusLeds._evaluate):
    // critical -> 'fault' (pulsing red), warning -> 'warn' (pulsing yellow), none -> 'normal' (solid green).
    if (test.check === 'rgb_alerts_follow') {
      let result;
      try {
        const F = (u, m) => fetch(apiUrl + u, { method: m || 'GET', signal: AbortSignal.timeout(5000) }).then(r => r.json());
        const st0 = await F('/api/state');
        const prev = st0.uiAlerts || { critical: 0, warning: 0 };
        if (st0.stripMode === null || st0.stripMode === undefined) {
          result = { status: 'warn', msg: 'stripMode not published (RGB thread off / simulation) - cannot observe the strip' };
        } else if (['door'].includes(st0.stripMode) || (st0.stripMode === 'fault' && !(prev.critical > 0))) {
          result = { status: 'warn', msg: `machine-level ${st0.stripMode} state masks the notification colors right now` };
        } else {
          const lower = ['normal', 'busy', 'busy_no_net', 'no_net', 'manual_heat'];
          const seen = [];
          for (const [c, w, want] of [[1, 0, 'fault'], [0, 2, 'warn'], [0, 0, 'normal']]) {
            const r = await F(`/api/rgb/alerts?critical=${c}&warning=${w}`, 'POST');
            if (!r.ok) throw new Error('POST /api/rgb/alerts refused: ' + JSON.stringify(r).slice(0, 100));
            await new Promise(res => setTimeout(res, 1500));
            const got = (await F('/api/state')).stripMode;
            seen.push({ c, w, want, got, ok: want === 'normal' ? lower.includes(got) : got === want });
          }
          await F(`/api/rgb/alerts?critical=${prev.critical || 0}&warning=${prev.warning || 0}`, 'POST');
          const bad = seen.filter(s => !s.ok);
          result = bad.length
            ? { status: 'fail', msg: bad.map(s => `critical=${s.c} warning=${s.w}: strip "${s.got}", expected "${s.want}"`).join('; ') }
            : { status: 'pass', msg: `critical -> fault (red), warning -> warn (yellow), cleared -> ${seen[2].got}; screen counts restored (${prev.critical || 0}/${prev.warning || 0})` };
        }
      } catch (e) {
        result = { status: 'fail', msg: `fetch failed: ${e.message}` };
      }
      const elapsed = Date.now() - t0;
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }

    if (test.check === 'sys_version') {
      let result;
      try {
        const v = await (await fetch(apiUrl + '/api/system/version', { signal: AbortSignal.timeout(5000) })).json();
        if (!/^\d+\.\d+\.\d+/.test(v.appVersion || '')) {
          result = { status: 'fail', msg: `appVersion "${v.appVersion}" is not semver (VERSION file missing?)` };
        } else {
          const extras = ['gitCommit', 'lastBoot', 'os', 'kernel', 'python'].filter(k => v[k]);
          result = { status: 'pass', msg: `v${v.appVersion} (${extras.length}/5 live fields: ${extras.join(', ')})` };
        }
      } catch (e) {
        result = { status: 'fail', msg: `fetch failed: ${e.message}` };
      }
      const elapsed = Date.now() - t0;
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }

    if (test.check === 'net_wireguard_ip') {
      let result;
      try {
        const net = await (await fetch(apiUrl + '/api/network/status', { signal: AbortSignal.timeout(5000) })).json();
        // same rule as NetworkPage.tsx: the API field first, else the UP wt0/wg0 interface
        const pick = (d) => d.wireguardIp
          || (Array.isArray(d.interfaces) ? d.interfaces.find(i => /^(wt|wg)\d+$/.test(i.name) && i.status === 'UP' && i.ip)?.ip : '')
          || '—';
        const cases = [
          [{ wireguardIp: '100.106.134.100', interfaces: [] }, '100.106.134.100'],
          [{ wireguardIp: '', interfaces: [{ name: 'eth0', status: 'UP', ip: '192.168.1.5' }, { name: 'wt0', status: 'UP', ip: '100.64.0.2' }] }, '100.64.0.2'],
          [{ interfaces: [{ name: 'wg0', status: 'DOWN', ip: '10.8.0.2' }] }, '—'],
          [{ interfaces: [{ name: 'eth0', status: 'UP', ip: '192.168.1.5' }] }, '—'],
        ];
        const bad = cases.filter(([d, want]) => pick(d) !== want);
        const shown = pick(net);
        if (bad.length) result = { status: 'fail', msg: `display rule wrong for ${bad.length} case(s)` };
        else if ('wireguardIp' in net && typeof net.wireguardIp !== 'string') result = { status: 'fail', msg: 'wireguardIp is not a string' };
        else if (shown === '—') result = { status: 'warn', msg: 'unit not enrolled in NetBird (no wt0/wg0 address) - row shows —' };
        else if (!/^100\.|^10\.|^172\.|^192\.168\./.test(shown)) result = { status: 'warn', msg: `unexpected tunnel address ${shown}` };
        else result = { status: 'pass', msg: `WireGuard IP ${shown}${'wireguardIp' in net ? '' : ' (from interfaces)'}` };
      } catch (e) {
        result = { status: 'fail', msg: `fetch failed: ${e.message}` };
      }
      const elapsed = Date.now() - t0;
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }

    if (test.check === 'net_auto_watch') {
      let result;
      try {
        const st = await (await fetch(apiUrl + '/api/state', { signal: AbortSignal.timeout(5000) })).json();
        const net = await (await fetch(apiUrl + '/api/network/status', { signal: AbortSignal.timeout(5000) })).json();
        const stOk = typeof st.internetOk === 'boolean' || st.internetOk === null;
        const netOk = typeof net.internet === 'boolean';
        const lanOk = typeof net.connected === 'boolean';
        if (!stOk) result = { status: 'fail', msg: '/api/state.internetOk missing or wrong type' };
        else if (!netOk) result = { status: 'fail', msg: '/api/network/status.internet missing' };
        else if (!lanOk) result = { status: 'fail', msg: '/api/network/status.connected missing (NetworkPage LAN dot)' };
        else if (st.internetOk === null) result = { status: 'warn', msg: 'watch not running (simulation / RGB thread off); fields present' };
        else result = { status: 'pass', msg: `internetOk=${st.internetOk}, network.internet=${net.internet} — auto watch publishing` };
      } catch (e) {
        result = { status: 'fail', msg: `fetch failed: ${e.message}` };
      }
      const elapsed = Date.now() - t0;
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }

    // Cloud portal sync agent: /api/state must always publish its status.
    // Configured -> enabled with a recent successful sync (or a visible
    // error); not configured -> cleanly disabled with no error.
    if (test.check === 'cloud_sync') {
      let result;
      try {
        const st = await (await fetch(apiUrl + '/api/state', { signal: AbortSignal.timeout(5000) })).json();
        const cs = st.cloudSync;
        if (!cs || typeof cs.enabled !== 'boolean')
          result = { status: 'fail', msg: '/api/state.cloudSync missing' };
        else if (!cs.enabled)
          result = cs.error
            ? { status: 'fail', msg: `agent off with error: ${cs.error}` }
            : { status: 'warn', msg: 'not configured (no server/data/cloud.json) — fields present' };
        else if (cs.error)
          result = { status: 'warn', msg: `enabled but failing: ${cs.error}` };
        else if (!cs.lastSyncOk || (Date.now() / 1000 - cs.lastSyncOk) > 120)
          result = { status: 'fail', msg: 'enabled but no successful sync in the last 2 min' };
        else
          result = { status: 'pass', msg: `synced ${Math.round(Date.now() / 1000 - cs.lastSyncOk)}s ago` };
      } catch (e) {
        result = { status: 'fail', msg: `fetch failed: ${e.message}` };
      }
      const elapsed = Date.now() - t0;
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }

    // Histories must come from a durable store: with Postgres configured the
    // DB serves them; without it the server/data JSON files do. Either way
    // the endpoints answer 200 with arrays — a 503 means recorded history
    // lives only in browser memory and dies on power-off.
    if (test.check === 'history_durable') {
      let result;
      try {
        const rP = await fetch(apiUrl + '/api/print-history', { signal: AbortSignal.timeout(5000) });
        const rC = await fetch(apiUrl + '/api/cure-history', { signal: AbortSignal.timeout(5000) });
        if (rP.status === 503 || rC.status === 503)
          result = { status: 'fail', msg: `503 from ${rP.status === 503 ? 'print' : 'cure'}-history — no durable fallback` };
        else if (!rP.ok || !rC.ok)
          result = { status: 'fail', msg: `HTTP ${rP.status}/${rC.status}` };
        else {
          const prints = await rP.json();
          const cures = await rC.json();
          if (!Array.isArray(prints) || !Array.isArray(cures))
            result = { status: 'fail', msg: 'endpoints did not return arrays' };
          else
            result = { status: 'pass', msg: `durable store answering — ${prints.length} prints, ${cures.length} cure runs on record` };
        }
      } catch (e) {
        result = { status: 'fail', msg: `fetch failed: ${e.message}` };
      }
      const elapsed = Date.now() - t0;
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }

    // Phase-timing analytics: the collection endpoint must exist, serve an
    // array, and reject invalid records (missing process/seconds -> 400).
    if (test.check === 'phase_timings') {
      let result;
      try {
        const rG = await fetch(apiUrl + '/api/phase-timings', { signal: AbortSignal.timeout(5000) });
        const rows = rG.ok ? await rG.json() : null;
        if (!rG.ok) result = { status: 'fail', msg: `GET /api/phase-timings HTTP ${rG.status}` };
        else if (!Array.isArray(rows)) result = { status: 'fail', msg: 'did not return an array' };
        else {
          const rBad = await fetch(apiUrl + '/api/cure-runs/qa-validation-probe/phase', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({}), signal: AbortSignal.timeout(5000) });
          if (rBad.status !== 400)
            result = { status: 'fail', msg: `invalid record accepted (HTTP ${rBad.status}, expected 400)` };
          else
            result = { status: 'pass', msg: `${rows.length} phase timings on record; invalid records rejected` };
        }
      } catch (e) {
        result = { status: 'fail', msg: `fetch failed: ${e.message}` };
      }
      const elapsed = Date.now() - t0;
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }

    // Component runtime counters: /api/state.counters must expose the five
    // wear counters, be monotonic (never lose hours between samples), and
    // actually advance for a component that is currently running.
    if (test.check === 'counters_live') {
      let result;
      try {
        const KEYS = ['led405', 'led450', 'coolingFan', 'heater', 'heaterFan'];
        const s1 = await (await fetch(apiUrl + '/api/state', { signal: AbortSignal.timeout(5000) })).json();
        const c1 = s1.counters;
        const bad = !c1 ? KEYS : KEYS.filter(k => typeof c1[k] !== 'number' || c1[k] < 0);
        if (!c1) result = { status: 'fail', msg: '/api/state.counters missing' };
        else if (bad.length) result = { status: 'fail', msg: `non-numeric counters: ${bad.join(', ')}` };
        else {
          // second sample after > one server tick (2s): monotonicity + advance
          await new Promise(r => setTimeout(r, 2600));
          const s2 = await (await fetch(apiUrl + '/api/state', { signal: AbortSignal.timeout(5000) })).json();
          const c2 = s2.counters || {};
          const shrunk = KEYS.filter(k => (c2[k] ?? 0) < c1[k]);
          const running = [
            s2.uvOn && s2.uvWavelength === 405 && 'led405',
            s2.uvOn && s2.uvWavelength === 450 && 'led450',
            ((s2.fanRpm || {}).chamber_intake > 0 || (s2.fans || {}).chamber_intake > 0) && 'coolingFan',
            (s2.heaterPwm > 0 || (s2.heaterPwm == null && s2.isHeating)) && 'heater',
            ((s2.fanRpm || {}).chamber_heating > 0 || (s2.fans || {}).chamber_heating > 0) && 'heaterFan',
          ].filter(Boolean);
          if (shrunk.length) result = { status: 'fail', msg: `counters went BACKWARDS: ${shrunk.join(', ')}` };
          else if (running.length === 0)
            result = { status: 'pass', msg: `all five counters published (everything idle now; totals: ${KEYS.map(k => `${k}=${c1[k]}h`).join(', ')})` };
          else {
            // counters have 0.1h display resolution, so a 2.6s advance may not
            // show yet — treat "same value" as pass, only regression fails.
            const moved = running.filter(k => (c2[k] ?? 0) > c1[k]);
            result = { status: 'pass', msg: `running: ${running.join(', ')}${moved.length ? ` — advanced: ${moved.join(', ')}` : ' (within display resolution)'}` };
          }
        }
      } catch (e) {
        result = { status: 'fail', msg: `fetch failed: ${e.message}` };
      }
      const elapsed = Date.now() - t0;
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }

    // Mirrors StatusLeds._mode() no-internet handling: offline shows blue
    // (solid when idle, comet color when busy); fault/door keep priority.
    if (test.check === 'net_strip_logic') {
      const mode = (fault, doorOpen, busy, internet) =>
        fault ? 'fault'
        : doorOpen === true ? 'door'
        : busy ? (internet ? 'busy' : 'busy_no_net')
        : internet ? 'normal' : 'no_net';
      const cases = [
        // [fault, doorOpen, busy, internetOk] -> expected strip mode
        [null, false, false, true,  'normal'],       // online + idle
        [null, false, false, false, 'no_net'],       // offline + idle -> solid blue
        [null, false, true,  true,  'busy'],         // online + process -> yellow comet
        [null, false, true,  false, 'busy_no_net'],  // offline + process -> blue comet
        ['thermistor', false, true, false, 'fault'], // fault beats no-internet
        [null, true,  false, false, 'door'],         // door beats no-internet
      ];
      const bad = cases.filter(([f, d, b, n, expect]) => mode(f, d, b, n) !== expect);
      const elapsed = Date.now() - t0;
      const result = bad.length === 0
        ? { status: 'pass', msg: `${cases.length} online/offline combinations map to the right strip colors` }
        : { status: 'fail', msg: `wrong mode for ${bad.length} case(s)` };
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }

    // Fullscreen launch prerequisite: the API server must serve the built
    // UI at / (and at any client route) — the Pi kiosk and the Windows
    // desktop window (server/desktop.py) both open http://localhost:3001.
    if (test.check === 'ui_served' || test.check === 'ui_spa_fallback') {
      const path = test.check === 'ui_served' ? '/' : '/settings';
      let result;
      try {
        const r = await fetch(apiUrl + path, { signal: AbortSignal.timeout(5000) });
        const body = await r.text();
        if (!r.ok) result = { status: 'fail', msg: `GET ${path} returned HTTP ${r.status}` };
        else if (!body.includes('id="root"')) result = { status: 'fail', msg: `GET ${path} did not return the UI page (no root element)` };
        else result = { status: 'pass', msg: `GET ${path} serves the UI page` };
      } catch (e) {
        result = { status: 'fail', msg: `GET ${path} failed: ${e.message}` };
      }
      const elapsed = Date.now() - t0;
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }

    // Damper servo pulse generator. Mirrors io_controller.Servo.pulse_us
    // (500..2400 us over 0..180 deg, logical angle flipped by SERVO_INVERTED)
    // and requires the hardware-timed PIO driver on real hardware.
    if (test.check === 'io_servo_pio') {
      const pulseUs = (angle) => {                 // == Servo.pulse_us(angle)
        const a = 180 - Math.max(0, Math.min(180, angle));   // SERVO_INVERTED
        return Math.round(500 + (a / 180) * (2400 - 500));
      };
      const problems = [];
      const closedUs = pulseUs(90), openUs = pulseUs(0);
      if (closedUs !== 1450) problems.push(`closed 90° → ${closedUs} µs (expected 1450)`);
      if (openUs !== 2400) problems.push(`open 0° → ${openUs} µs (expected 2400)`);
      // PIO word for the helper: x = pulse-1 (active), y = period-pulse-4 (idle); period = x+1 + y+1 + 3
      const period = (p) => ((p - 1) + 1) + ((20000 - p - 4) + 1) + 3;
      if (period(closedUs) !== 20000 || period(openUs) !== 20000) problems.push('PIO period math ≠ 20 ms');
      const settle = 1.5;                          // components.json servo.settle_sec
      if (!(settle >= 1.0)) problems.push(`settle ${settle}s too short for the travel`);
      let s = null;
      try { s = await dvtrState(); } catch (e) { s = null; }
      const elapsed = Date.now() - t0;
      let result;
      if (problems.length) {
        result = { status: 'fail', msg: problems.join('; ') };
      } else if (!s || s.hwSource !== 'io_controller') {
        result = { status: 'skip', msg: `pulse map OK (closed ${closedUs} µs / open ${openUs} µs); driver check needs the real IO board (hwSource=${s && s.hwSource})` };
      } else if (s.damperDriver === 'pio') {
        result = { status: 'pass', msg: `damperDriver=pio — RP1 PIO hardware-timed pulses; closed ${closedUs} µs / open ${openUs} µs, hold ${settle}s` };
      } else if (s.damperDriver === 'lgpio') {
        result = { status: 'fail', msg: 'damperDriver=lgpio — software PWM fallback in use (jitter): build server/hardware/pio_servo with build-pio-servo.sh and restart' };
      } else {
        result = { status: 'warn', msg: `damperDriver=${s.damperDriver} — servo not initialised (helper failed?) — check the server log` };
      }
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }

    // Mirrors the damper rules in server/io_bridge.py: the vent damper
    // (MG90S servo, GPIO8) opens ONLY when (a) a DRYING step reaches its
    // target temperature (_damper_watch one-shot) or (b) cooling mode runs
    // (CoolingController owns it); every other state keeps it closed.
    if (test.check === 'io_damper_logic') {
      const damperOpen = (phase, atTemp) =>
        phase === 'cooling' || (phase === 'drying' && atTemp === true);
      const cases = [
        // [phase, atTemp] -> expected damper state
        ['drying', false, false],   // drying ramp: closed
        ['drying', true, true],     // drying reached target: OPEN (vent moisture)
        ['heating', true, false],   // heating: closed even at temp
        ['cure', true, false],      // cure: closed
        ['bleacher', true, false],  // bleaching: closed
        ['cooling', false, true],   // cooling: OPEN from the start
        ['idle', false, false],     // idle / after stop: closed
      ];
      const bad = cases.filter(([p, a, expect]) => damperOpen(p, a) !== expect);
      const elapsed = Date.now() - t0;
      const result = bad.length === 0
        ? { status: 'pass', msg: 'damper opens only at drying-at-temp and during cooling; closed everywhere else' }
        : { status: 'fail', msg: `wrong damper state for: ${bad.map(c => `${c[0]}${c[1] ? '@temp' : ''}`).join(', ')}` };
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }

    // Mirrors StatusLeds._evaluate cadence: the machine state is re-classified
    // every status_sec (1s), so any change (including a door-open abort)
    // reaches the strip within one evaluation.
    if (test.check === 'led_status_loop') {
      const STATUS_SEC = 1;
      // worst case: the state flips right after an evaluation -> seen on the next one
      const worstReaction = STATUS_SEC;
      const nextEval = (lastEval, now) => now - lastEval >= STATUS_SEC;
      const cadenceOk = nextEval(0, 1) && nextEval(0, 2.5) && !nextEval(0, 0.9);
      const elapsed = Date.now() - t0;
      const result = cadenceOk && worstReaction <= 1
        ? { status: 'pass', msg: `state re-classified every ${STATUS_SEC}s — changes reach the strip within ${worstReaction}s` }
        : { status: 'fail', msg: 'status evaluation cadence wrong' };
      setTestStatus(test.id, result.status, result.msg, elapsed);
      log(result.status, `${test.name}: ${result.msg} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 50));
      return;
    }

    // HSI sampling-time rule: every reading is sampled at most every 1 second.
    // Mirrors the configured intervals of every sampling loop in the system.
    if (test.check === 'sampling_1s') {
      const MAX_SAMPLE_SEC = 1;
      const loops = [
        // [loop, interval_sec] — mirrors components.json / code constants
        ['heating sample_sec (temperature_control.py)', 1.0],
        ['cooling sample_sec (cooling_mode.py)', 1.0],
        ['status_sec watchdog (io_bridge StatusLeds)', 1.0],
        ['dashboard SENSOR_REFRESH_SEC', 1.0],
        ['UI /api/state poll (HardwareContext)', 1.0],
      ];
