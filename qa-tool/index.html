      const chain = s.doorClosed === null ? 'sensor unreadable (DVT-SAF-013 open chain)' : 'door open (DVT-SAF-008)';
      const cmds = ['/api/cure/heat?target=40', '/api/cure/cure-405?target=40&intensity=30', '/api/cure/uv-only?wavelength=405&intensity=30&vent=0'];
      const problems = [];
      for (const c of cmds) {
        const r = await dvtrPost(c);
        if (r.ok) { problems.push(`${c.split('?')[0]} STARTED`); await dvtrStop(); }
        else if (r.code !== 6015) problems.push(`${c.split('?')[0]} refused with code ${r.code} (expected 6015)`);
      }
      await dvtrStop();
      dvtrDone(test, t0, problems.length
        ? { status: 'fail', msg: `${chain}: ${problems.join('; ')}` }
        : { status: 'pass', msg: `${chain}: heat, cure-405 and uv-only all refused with Err 6015` });
      return;
    }

    // DVT-SAF-008: UV removed within 1 s of the door opening mid-cure.
    if (test.check === 'dvtr_door_uv_off') {
      const s0 = await dvtrState();
      if (s0.hwSource !== 'io_controller') { dvtrDone(test, t0, { status: 'skip', msg: 'simulation has no door interlock — run on the machine' }); return; }
      if (s0.doorClosed !== true) { dvtrDone(test, t0, { status: 'skip', msg: 'close the door first' }); return; }
      const start = await dvtrPost('/api/cure/uv-only?wavelength=405&intensity=30&vent=0');
      if (!start.ok) { dvtrDone(test, t0, { status: 'warn', msg: `UV start refused: ${start.message || start.code}` }); return; }
      log('info', `${test.name}: UV is ON — OPEN THE DOOR now (waiting up to 45 s)`);
      let opened = null, s = s0;
      const deadline = Date.now() + 45000;
      while (Date.now() < deadline) { s = await dvtrState(); if (s.doorClosed !== true) { opened = Date.now(); break; } await dvtrSleep(250); }
      if (!opened) { await dvtrStop(); dvtrDone(test, t0, { status: 'skip', msg: 'door was not opened within 45 s' }); return; }
      let offAt = null;
      const d2 = opened + 20000;
      while (Date.now() < d2) { s = await dvtrState(); if (s.uvOn === false) { offAt = Date.now(); break; } await dvtrSleep(150); }
      const offSec = offAt ? ((offAt - opened) / 1000).toFixed(2) : null;
      await dvtrSleep(500);
      s = await dvtrState();
      const latched = s.doorAborted === true;
      const ack = latched ? await dvtrPost('/api/door-abort/ack') : { ok: false };
      const cleared = latched ? (await dvtrState()).doorAborted === false : false;
      await dvtrStop();
      const problems = [];
      if (offSec === null) problems.push('UV still ON 20 s after the door opened');
      else if (offSec > 1) problems.push(`UV off after ${offSec} s (limit 1 s — the 10 s watchdog grace does not meet DVT-SAF-008)`);
      if (!latched) problems.push('doorAborted did not latch (no operator acknowledgment required)');
      else if (!ack.ok || !cleared) problems.push('door-abort ack did not clear doorAborted');
      dvtrDone(test, t0, problems.length
        ? { status: 'fail', msg: problems.join('; ') }
        : { status: 'pass', msg: `UV off ${offSec} s after the door opened, doorAborted latched until ack` });
      return;
    }

    // Generic operator-assisted fault injection (DVT-SAF-001/004/005/008/009):
    // start a mode, wait for the physical fault (trigger predicate), measure
    // the time to the safe state, check the fault + restart inhibit, stop.
    if (test.check === 'dvtr_inject') {
      const s0 = await dvtrState();
      if (s0.hwSource !== 'io_controller') { dvtrDone(test, t0, { status: 'skip', msg: 'simulation has no fault model — run on the machine' }); return; }
      if (s0.doorClosed !== true) { dvtrDone(test, t0, { status: 'skip', msg: 'close the door first' }); return; }
      if (test.needsWarm && !(s0.chamberTemp > test.needsWarm)) { dvtrDone(test, t0, { status: 'skip', msg: `chamber must be above ${test.needsWarm}°C (now ${s0.chamberTemp?.toFixed?.(1)})` }); return; }
      const start = await dvtrPost(test.start);
      if (!start.ok) { dvtrDone(test, t0, { status: 'warn', msg: `start refused: ${start.message || start.code}` }); return; }
      log('info', `${test.name}: running — NOW ${test.instruction} (waiting up to ${test.waitSec} s)`);
      let s = s0, prev = s0, trig = null, maxTemp = -Infinity;
      const deadline = Date.now() + test.waitSec * 1000;
      while (Date.now() < deadline) {
        s = await dvtrState();
        if (typeof s.chamberTemp === 'number') maxTemp = Math.max(maxTemp, s.chamberTemp);
        if (test.trigger(s, prev)) { trig = Date.now(); break; }
        prev = s;
        await dvtrSleep(250);
      }
      if (!trig) { await dvtrStop(); dvtrDone(test, t0, { status: 'skip', msg: `fault not injected within ${test.waitSec} s (${test.instruction})` }); return; }
      let safeAt = null;
      const watchMs = Math.max(20000, (test.limitSec + 5) * 1000);   // DVT-SAF-003 allows the firmware 3 min to notice a frozen reading
      const d2 = trig + watchMs;
      while (Date.now() < d2) {
        s = await dvtrState();
        if (typeof s.chamberTemp === 'number') maxTemp = Math.max(maxTemp, s.chamberTemp);
        if (test.safe(s)) { safeAt = Date.now(); break; }
        await dvtrSleep(150);
      }
      const respSec = safeAt ? (safeAt - trig) / 1000 : null;
      const fault = s.faults ? s.faults[test.faultKey] : null;
      let inhibited = null;
      if (test.restart) { const r = await dvtrPost(test.start); inhibited = !r.ok; if (r.ok) await dvtrStop(); }
      await dvtrStop();
      const problems = [];
      if (respSec === null) problems.push(`outputs still live ${Math.round(watchMs / 1000)} s after the fault (limit ${test.limitSec} s)`);
      else if (respSec > test.limitSec) problems.push(`safe state after ${respSec.toFixed(2)} s (limit ${test.limitSec} s)`);
      if (!fault) problems.push(`faults.${test.faultKey} not raised — no alarm names the component`);
      if (inhibited === false) problems.push('restart was accepted while the fault is present');
      if (test.maxTemp && maxTemp > test.maxTemp) problems.push(`chamber reached ${maxTemp.toFixed(1)}°C (ceiling ${test.maxTemp})`);
      dvtrDone(test, t0, problems.length
        ? { status: 'fail', msg: problems.join('; ') + (fault ? ` [fault: ${fault}]` : '') }
        : { status: 'pass', msg: `safe in ${respSec.toFixed(2)} s, fault "${fault}"${inhibited ? ', restart refused' : ''}` });
      return;
    }

    // DVT-SAF-004: an LED thermistor reading null must inhibit a cure.
    if (test.check === 'dvtr_led_thermistor_open') {
      const s = await dvtrState();
      if (s.hwSource !== 'io_controller') { dvtrDone(test, t0, { status: 'skip', msg: 'simulation fabricates LED temps — run on the machine' }); return; }
      const open = Object.entries(s.ledTemps || {}).filter(([, v]) => v == null).map(([k]) => k);
      if (!open.length) { dvtrDone(test, t0, { status: 'skip', msg: 'all four LED thermistors read — disconnect one and re-run' }); return; }
      if (s.doorClosed !== true) { dvtrDone(test, t0, { status: 'skip', msg: 'close the door first' }); return; }
      const r = await dvtrPost('/api/cure/uv-only?wavelength=405&intensity=30&vent=0');
      if (r.ok) await dvtrStop();
      const names = (r.message || '').toLowerCase();
      const named = open.some(p => names.includes(p));
      dvtrDone(test, t0, r.ok
        ? { status: 'fail', msg: `cure STARTED with the ${open.join('/')} LED thermistor open — start must be inhibited (DVT-SAF-004)` }
        : named ? { status: 'pass', msg: `refused and names the ${open.join('/')} sensor: ${r.message}` }
                : { status: 'fail', msg: `refused (${r.code || 'no code'}: ${r.message}) but the message does not name the ${open.join('/')} sensor` });
      return;
    }

    // old DVT-SAF-006 (removed from the catalog 2026-10-01): every panel thermistor must warm while its LEDs are on.
    if (test.check === 'dvtr_led_coupling') {
      const s0 = await dvtrState();
      if (s0.hwSource !== 'io_controller') { dvtrDone(test, t0, { status: 'skip', msg: 'simulation fabricates LED temps — run on the machine' }); return; }
      if (s0.doorClosed !== true) { dvtrDone(test, t0, { status: 'skip', msg: 'close the door first' }); return; }
      const before = { ...(s0.ledTemps || {}) };
      const start = await dvtrPost('/api/cure/uv-only?wavelength=405&intensity=30&vent=0');
      if (!start.ok) { dvtrDone(test, t0, { status: 'warn', msg: `UV start refused: ${start.message || start.code}` }); return; }
      let s = s0;
      const deadline = Date.now() + 60000;
      while (Date.now() < deadline) { s = await dvtrState(); if (s.uvOn === false || s.doorAborted) break; await dvtrSleep(2000); }
      await dvtrStop();
      if (s.uvOn === false && Date.now() < deadline - 1000) { dvtrDone(test, t0, { status: 'warn', msg: `UV stopped early (fault: ${s.faults && s.faults.led})` }); return; }
      const after = s.ledTemps || {};
      const rise = Object.keys(before).map(k => [k, (typeof after[k] === 'number' && typeof before[k] === 'number') ? after[k] - before[k] : null]);
      const flat = rise.filter(([, d]) => d === null || d < 0.5).map(([k, d]) => `${k} ${d === null ? 'n/a' : '+' + d.toFixed(1) + '°C'}`);
      const ledFault = s.faults && s.faults.led;
      let result;
      if (rise.every(([, d]) => d === null || d < 0.5)) result = { status: 'warn', msg: 'no panel warmed in 60 s — LEDs really on? (' + rise.map(([k, d]) => k + ' ' + (d === null ? 'n/a' : d.toFixed(1))).join(', ') + ')' };
      else if (flat.length && !ledFault) result = { status: 'fail', msg: `${flat.join(', ')} did not rise while the others did — decoupled sensor NOT detected (old SAF-006 needs a plausibility rule)` };
      else result = { status: 'pass', msg: rise.map(([k, d]) => `${k} +${(d ?? 0).toFixed(1)}`).join(', ') + (ledFault ? ` (faults.led: ${ledFault})` : '') };
      dvtrDone(test, t0, result);
      return;
    }

    // DVT-THM-001: at-temperature flag and overshoot on a small step.
    if (test.check === 'dvtr_thm_overshoot') {
      const s0 = await dvtrState();
      if (s0.doorClosed === false) { dvtrDone(test, t0, { status: 'skip', msg: 'close the door first' }); return; }
      const target = Math.min(80, Math.max(30, Math.ceil((s0.chamberTemp || 25) + 3)));
      const start = await dvtrPost(`/api/cure/heat?target=${target}`);
      if (!start.ok) { dvtrDone(test, t0, { status: 'warn', msg: `heat refused: ${start.message || start.code}` }); return; }
      log('info', `${test.name}: heating to ${target}°C from ${(s0.chamberTemp || 0).toFixed(1)} — up to 6 min`);
      let s = s0, reached = null;
      const deadline = Date.now() + 6 * 60000;
      while (Date.now() < deadline) {
        s = await dvtrState();
        const at = ('atTemp' in s) ? s.atTemp === true : Math.abs((s.chamberTemp || 0) - target) <= 0.5;
        if (at) { reached = Date.now(); break; }
        if (s.isHeating === false) break;
        await dvtrSleep(1000);
      }
      if (!reached) { await dvtrStop(); dvtrDone(test, t0, { status: s.isHeating === false ? 'fail' : 'warn', msg: s.isHeating === false ? `heating stopped by itself at ${(s.chamberTemp || 0).toFixed(1)}°C (fault: ${s.faults && s.faults.heater})` : `${target}°C not reached in 6 min (now ${(s.chamberTemp || 0).toFixed(1)})` }); return; }
      let peak = -Infinity;
      const d2 = reached + 90000;
      while (Date.now() < d2) { s = await dvtrState(); if (typeof s.chamberTemp === 'number') peak = Math.max(peak, s.chamberTemp); await dvtrSleep(1000); }
      await dvtrStop();
      const over = peak - target;
      dvtrDone(test, t0, over <= 3
        ? { status: 'pass', msg: `atTemp in ${Math.round((reached - t0) / 1000)} s, peak ${peak.toFixed(1)}°C = +${over.toFixed(1)} over ${target} (limit 3)` }
        : { status: 'fail', msg: `overshoot +${over.toFixed(1)}°C over ${target} (limit 3)` });
      return;
    }

    // DVT-THM-003: cooling entry sequence and rate telemetry.
    if (test.check === 'dvtr_thm_cool_entry') {
      const s0 = await dvtrState();
      if (!(s0.chamberTemp > 27)) { dvtrDone(test, t0, { status: 'skip', msg: `chamber must be above 27°C (now ${(s0.chamberTemp || 0).toFixed(1)}) — run after a heat test` }); return; }
      const start = await dvtrPost('/api/cure/cool?target=25&mode=medium');
      if (!start.ok) { dvtrDone(test, t0, { status: 'warn', msg: `cool refused: ${start.message || start.code}` }); return; }
      await dvtrSleep(3000);
      let s = await dvtrState();
      const problems = [];
      if (s.isCooling !== true) problems.push('isCooling false');
      if (s.damperOpen !== true) problems.push('damper not open');
      if (!(s.fans && s.fans.chamber_heating === 100)) problems.push(`heater fan ${s.fans && s.fans.chamber_heating}% (expected 100)`);
      if (!('coolingFanPwm' in s) || s.coolingFanPwm !== 60) problems.push(`intake duty ${s.coolingFanPwm} (expected 60 for medium)`);
      const deadline = Date.now() + 20000;
      while (typeof s.coolingRate !== 'number' && Date.now() < deadline) { await dvtrSleep(1000); s = await dvtrState(); }
      const sim = s.hwSource !== 'io_controller';
      if (typeof s.coolingRate !== 'number') problems.push('coolingRate never reported');
      await dvtrStop();
      dvtrDone(test, t0, problems.length
        ? { status: sim ? 'warn' : 'fail', msg: problems.join('; ') }
        : { status: 'pass', msg: `damper open, heater fan 100 %, intake 60 %, rate ${s.coolingRate.toFixed(2)}°C/min` });
      return;
    }

    // Durable-store round-trip: save a program, read it back, confirm it
    // persisted — then restore the original list so the user's data is intact.
    if (test.check === 'data_persist_roundtrip') {
      const url = apiUrl + '/api/materials/user';
      const orig = await fetch(url, { signal: AbortSignal.timeout(5000) }).then(r => r.json()).catch(() => null);
      if (!Array.isArray(orig)) {
        const elapsed = Date.now() - t0;
        setTestStatus(test.id, 'fail', 'GET did not return an array (503/no store?)', elapsed);
        log('fail', `${test.name}: user-materials GET is not an array`);
        return;
      }
      const marker = { id: 'qa-persist-probe', name: 'QA Persistence Probe', steps: [{ step: 1, process: 'Heating', temperature: 45, time: 10 }], totalDuration: 10, isPreset: false };
      const post = (body) => fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: AbortSignal.timeout(5000) });
      await post([...orig.filter(m => !m.isPreset), marker]);
      const after = await fetch(url, { signal: AbortSignal.timeout(5000) }).then(r => r.json()).catch(() => []);
      const saved = Array.isArray(after) && after.some(m => m.id === marker.id && m.name === marker.name);
      await post(orig.filter(m => !m.isPreset));   // restore the user's real list
      const elapsed = Date.now() - t0;
      if (saved) {
        setTestStatus(test.id, 'pass', 'Program saved & re-read from the durable store', elapsed);
        log('pass', `${test.name}: persisted and restored (${elapsed}ms)`);
      } else {
        setTestStatus(test.id, 'fail', 'Saved program was not read back — not persisting', elapsed);
        log('fail', `${test.name}: program did not persist`);
      }
      await new Promise(r => setTimeout(r, 100));
      return;
    }

    // Performance tests with special logic
    if (test.check === 'perf_latency') {
      const times = [];
      for (let i = 0; i < (test.iterations || 10); i++) {
        const s = Date.now();
        await fetch(apiUrl + test.endpoint, { signal: AbortSignal.timeout(5000) });
        times.push(Date.now() - s);
        setTestStatus(test.id, 'running', `${i + 1}/${test.iterations}...`, '');
      }
      const avg = Math.round(times.reduce((a, b) => a + b, 0) / times.length);
      const max = Math.max(...times);
      const min = Math.min(...times);
      const elapsed = Date.now() - t0;
      const status = avg < 100 ? 'pass' : avg < 300 ? 'warn' : 'fail';
      setTestStatus(test.id, status, `avg ${avg}ms (min ${min}, max ${max})`, elapsed);
      log(status, `${test.name}: avg=${avg}ms min=${min}ms max=${max}ms (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 100));
      return;
    }

    if (test.check === 'perf_burst') {
      const n = test.iterations || 20;
      const s = Date.now();
      const promises = Array.from({ length: n }, () =>
        fetch(apiUrl + test.endpoint, { signal: AbortSignal.timeout(10000) }).then(r => r.ok)
      );
      const results = await Promise.all(promises);
      const elapsed = Date.now() - s;
      const ok = results.filter(Boolean).length;
      const status = ok === n ? 'pass' : ok > n * 0.8 ? 'warn' : 'fail';
      setTestStatus(test.id, status, `${ok}/${n} OK in ${elapsed}ms`, elapsed);
      log(status, `${test.name}: ${ok}/${n} succeeded in ${elapsed}ms`);
      await new Promise(r => setTimeout(r, 100));
      return;
    }

    if (test.check === 'perf_multi_load') {
      const s = Date.now();
      const [presetsRes, userRes] = await Promise.all([
        fetch(apiUrl + '/api/materials/presets', { signal: AbortSignal.timeout(5000) }).then(r => r.json()).catch(() => []),
        fetch(apiUrl + '/api/materials/user', { signal: AbortSignal.timeout(5000) }).then(r => r.json()).catch(() => []),
      ]);
      const elapsed = Date.now() - s;
      const total = presetsRes.length + userRes.length;
      const status = elapsed < 500 ? 'pass' : elapsed < 1500 ? 'warn' : 'fail';
      setTestStatus(test.id, status, `${total} materials in ${elapsed}ms`, elapsed);
      log(status, `${test.name}: ${presetsRes.length} presets + ${userRes.length} user = ${total} (${elapsed}ms)`);
      await new Promise(r => setTimeout(r, 100));
      return;
    }

    if (test.check === 'perf_simple') {
      const opts = { method: test.method, signal: AbortSignal.timeout(5000) };
      const res = await fetch(apiUrl + test.endpoint, opts);
      const data = await res.json();
      const elapsed = Date.now() - t0;
      const status = data.ok ? (elapsed < 200 ? 'pass' : elapsed < 500 ? 'warn' : 'fail') : 'fail';
      setTestStatus(test.id, status, `${elapsed}ms response`, elapsed);
      log(status, `${test.name}: ${elapsed}ms (${data.ok ? 'OK' : 'FAIL'})`);
      await new Promise(r => setTimeout(r, 100));
      return;
    }

    // Standard tests
    let res, data;

    if (test.url) {
      res = await fetch(test.url, { signal: AbortSignal.timeout(5000) });
      data = await res.json();
    } else {
      const opts = { method: test.method, signal: AbortSignal.timeout(10000) };
      if (test.body) {
        opts.headers = { 'Content-Type': 'application/json' };
        opts.body = JSON.stringify(test.body);
      }
      res = await fetch(apiUrl + test.endpoint, opts);
      data = await res.json();
    }

    const elapsed = Date.now() - t0;

    // Check result
    if (test.expect === 'ok' && data.ok) {
      setTestStatus(test.id, 'pass', data.message || 'OK', elapsed);
      log('pass', `${test.name}: OK (${elapsed}ms)`);
    } else if (test.expect && data[test.expect] !== undefined) {
      setTestStatus(test.id, 'pass', JSON.stringify(data[test.expect]).slice(0, 50), elapsed);
      log('pass', `${test.name}: ${test.expect} = ${JSON.stringify(data[test.expect]).slice(0, 40)} (${elapsed}ms)`);
    } else if (test.expectArray && Array.isArray(data)) {
      setTestStatus(test.id, 'pass', `${data.length} items`, elapsed);
      log('pass', `${test.name}: ${data.length} items (${elapsed}ms)`);
    } else if (test.check) {
      const checkResult = runCheck(test.check, data);
      setTestStatus(test.id, checkResult.status, checkResult.msg, elapsed);
      log(checkResult.status, `${test.name}: ${checkResult.msg} (${elapsed}ms)`);
    } else {
      setTestStatus(test.id, 'warn', 'Unexpected response', elapsed);
      log('warn', `${test.name}: Unexpected response`);
    }
  } catch (e) {
    const elapsed = Date.now() - t0;
    setTestStatus(test.id, 'fail', e.message, elapsed);
    log('fail', `${test.name}: ${e.message} (${elapsed}ms)`);
  }

  // Small delay between tests
  await new Promise(r => setTimeout(r, 100));
}

function runCheck(check, data) {
  switch (check) {
    case 'nfc_state_fields': {
      if (typeof data.nfcEnabled !== 'boolean') return { status: 'fail', msg: 'nfcEnabled missing / not boolean in /api/state' };
      const r = data.nfcReader;
      if (!r || typeof r !== 'object') return { status: 'fail', msg: 'nfcReader object missing from /api/state' };
      if (typeof r.detected !== 'boolean') return { status: 'fail', msg: 'nfcReader.detected is not boolean' };
      const missing = ['port', 'model', 'serial'].filter(k => !(k in r));
      if (missing.length) return { status: 'fail', msg: `nfcReader missing: ${missing.join(', ')}` };
      if (r.detected && !r.port && !r.model) return { status: 'fail', msg: 'reader detected but neither port nor model reported' };
      return { status: r.detected ? 'pass' : 'warn', msg: r.detected ? `reader ${r.model || '?'} ${r.serial ? 'S/N ' + r.serial : ''} on ${r.port || 'usb'}, nfcEnabled=${data.nfcEnabled}` : `no reader detected (nfcEnabled=${data.nfcEnabled}) - plug the Pepper C2 in to test the ON path` };
    }
    case 'nfc_unplugged_alert': {
      const alerts = Array.isArray(data.alerts) ? data.alerts : [];
      const has = alerts.includes(9052);
      const r = data.nfcReader || {};
      if (!('seenSinceBoot' in r)) return { status: 'fail', msg: 'nfcReader.seenSinceBoot missing from /api/state' };
      const should = data.nfcEnabled === true && r.detected === false && r.seenSinceBoot === true;
      if (has !== should) return { status: 'fail', msg: `9052 ${has ? 'active' : 'absent'} while nfcEnabled=${data.nfcEnabled}, detected=${r.detected}, seenSinceBoot=${r.seenSinceBoot}` };
      if (should && !(data.alertDetails && data.alertDetails['9052'])) return { status: 'fail', msg: '9052 active without alertDetails text' };
      if (should) return { status: 'pass', msg: '9052 active: NFC on, reader was connected since boot and disappeared (as designed)' };
      if (data.nfcEnabled === true && r.detected === false) return { status: 'pass', msg: 'no 9052: NFC on but the reader was never connected since boot (no warning at boot, as designed)' };
      return { status: 'pass', msg: `consistent: nfcEnabled=${data.nfcEnabled}, detected=${r.detected}, seenSinceBoot=${r.seenSinceBoot}, no 9052` };
    }
    case 'heater_sensor_guard': {
      const e = (data.errors || []).find(x => x.code === 9001);
      if (!e) return { status: 'fail', msg: 'errors.json has no code 9001' };
      if (e.severity !== 'critical') return { status: 'fail', msg: `9001 severity ${e.severity}, expected critical` };
      if (!/heater is never switched on/i.test(e.description || '')) return { status: 'fail', msg: '9001 description does not state the heater rule' };
      if (!/10 seconds/i.test(e.description || '')) return { status: 'fail', msg: '9001 description does not state the 10 s noise filter' };
      // logic mirror: (sensorOk, heatingWanted, openSec) -> [heaterOn, alertNow]; open < 10 s = noise, ignored
      const GLITCH = 10;
      const rule = (sensorOk, heatingWanted, openSec) => {
        if (sensorOk || openSec < GLITCH) return { heaterOn: heatingWanted, alertNow: false };
        return { heaterOn: false, alertNow: heatingWanted || openSec >= 60 };
      };
      const cases = [
        [true, true, 0, true, false],     // sensor reads, heating -> heater on, no alert
        [false, true, 9, true, false],    // 9 s dropout while heating -> noise, heater stays on, no alert
        [false, true, 10, false, true],   // open 10 s, heating wanted -> heater off, 9001 right away
        [false, false, 10, false, false], // open at boot, idle -> no heater, alert not yet (60 s rule)
        [false, false, 60, false, true],  // open a full minute, idle -> 9001
      ];
      const bad = cases.filter(([ok, want, sec, on, alert]) => { const r = rule(ok, want, sec); return r.heaterOn !== on || r.alertNow !== alert; });
      if (bad.length) return { status: 'fail', msg: `${bad.length} heater-sensor cases wrong` };
      // the screen: a 9001 refusal / alert naming the heater sensor -> pop-up, never continue-anyway
      const popup = (code, msg) => ((code === 9001 || code === 9010) && /TEMP_CHAMBER|chamber|heater/i.test(msg)) || /thermistor/i.test(msg);
      if (!popup(9001, 'Heater temperature sensor (chamber NTC TEMP_CHAMBER) is not reading - the heater is off')) return { status: 'fail', msg: 'heater detail does not trigger the pop-up' };
      if (!popup(6015, 'thermistor TEMP_CHAMBER disconnected / invalid reading')) return { status: 'fail', msg: 'heater-safety reason does not trigger the pop-up' };
      if (popup(9001, 'Temperature sensor disconnected: TEMP_LEFT_UV (left)')) return { status: 'fail', msg: 'an LED thermistor must not pop the heater fault' };
      return { status: 'pass', msg: `${cases.length} heater-sensor cases + pop-up rule hold; 9001 documents the heater rule` };
    }
    case 'per_component_codes': {
      // mirror of src/lib/error-codes.ts (and sCureBox-CS ErrorCodes.Family)
      const family = c => c >= 9010 && c <= 9012 ? 9001 : c >= 9013 && c <= 9014 ? 9050 : c >= 9020 && c <= 9025 ? 9002
        : c >= 9030 && c <= 9034 ? 9003 : (c >= 9040 && c <= 9041) || (c >= 9044 && c <= 9045) ? 9004 : c >= 9042 && c <= 9043 ? 9005
        : c >= 9060 && c <= 9065 ? 9051 : c;
      const ledCode = k => ({ left: 9040, right: 9041, back: 9044, door: 9045 })[k] ?? 9004;
      const parts = { 9010: /chamber/i, 9011: /left/i, 9012: /right/i, 9013: /back/i, 9014: /door/i, 9020: /heater/i, 9021: /cooling/i,
        9022: /left/i, 9023: /right/i, 9024: /back/i, 9025: /door/i, 9030: /left/i, 9031: /right/i, 9032: /back/i, 9033: /door/i, 9034: /cooling/i,
        9040: /left/i, 9041: /right/i, 9042: /left/i, 9043: /right/i, 9044: /back/i, 9045: /door/i,
        9060: /heater/i, 9061: /cooling/i, 9062: /left/i, 9063: /right/i, 9064: /back/i, 9065: /door/i };
      const errs = data.errors || [];
      const by = Object.fromEntries(errs.map(e => [e.code, e]));
      const bad = [];
      for (const [code, re] of Object.entries(parts)) {
        const e = by[code], fam = by[family(Number(code))];
        if (!e) { bad.push(`${code} missing`); continue; }
        if (family(Number(code)) === Number(code)) bad.push(`${code} has no family`);
        if (!re.test(e.message || '')) bad.push(`${code} title does not name its part`);
        if (fam && e.severity !== fam.severity) bad.push(`${code} severity ${e.severity} != family ${fam.severity}`);
        if (!(e.troubleshooting || []).length) bad.push(`${code} no troubleshooting`);
        if (typeof e.videoUrl !== 'string' || (e.videoUrl && !/^https:\/\//.test(e.videoUrl))) bad.push(`${code} videoUrl must be "" or https`);
      }
      for (const g of [9001, 9002, 9003, 9004, 9005, 9050, 9051])
        if (!by[g] || !/^Grouped code/.test(by[g].description || '')) bad.push(`${g} not kept as a grouped (legacy) entry`);
      if (errs.some(e => !('videoUrl' in e))) bad.push('an error without the videoUrl field');
      if (new Set(errs.map(e => e.code)).size !== errs.length) bad.push('codes not unique');
      // the cure screen compares families: a per-component code and the old grouped one both trigger the same rule
      const heaterPopup = (code, msg) => family(code) === 9001 && /TEMP_CHAMBER|chamber|heater/i.test(msg);
      if (!heaterPopup(9010, 'Heater temperature sensor (chamber NTC TEMP_CHAMBER) is not reading') || !heaterPopup(9001, 'heater sensor open')) bad.push('heater pop-up must accept 9010 and 9001');
      if (heaterPopup(9013, 'Temperature sensor disconnected: Back LED panel')) bad.push('a back-panel sensor must not pop the heater fault');
      const fanAlerts = [9022, 9034, 9061, 9003].filter(c => family(c) === 9002 || family(c) === 9003);
      if (fanAlerts.join() !== '9022,9034,9003') bad.push(`fan-stop rule picks ${fanAlerts.join()}`);
      if (ledCode('back') !== 9044 || ledCode('left') !== 9040 || ledCode('x') !== 9004) bad.push('LED panel code mapping');
      const n = Object.keys(parts).length;
      return bad.length ? { status: 'fail', msg: bad.slice(0, 6).join('; ') } : { status: 'pass', msg: `${n} per-component codes, each titled, with family severity + videoUrl; 7 grouped codes kept for old reports; ${errs.filter(e => e.videoUrl).length} with a video` };
    }
    case 'nfc_registry_9052': {
      const e = (data.errors || []).find(x => x.code === 9052);
      if (!e) return { status: 'fail', msg: 'errors.json has no code 9052' };
      const bad = [];
      if (e.key !== 'NFC_READER_NOT_DETECTED') bad.push(`key=${e.key}`);
      if (e.severity !== 'warning') bad.push(`severity=${e.severity}`);
      if (!/nfc/i.test(e.message || '')) bad.push('message does not mention NFC');
      const ts = (e.troubleshooting || []).join(' ').toLowerCase();
      if (!/connect/.test(ts) || !/cable/.test(ts)) bad.push('troubleshooting lacks connect-the-reader / cable guidance');
      if ((data.errors || []).filter(x => x.code === 9052).length !== 1) bad.push('code 9052 not unique');
      return bad.length ? { status: 'fail', msg: bad.join('; ') } : { status: 'pass', msg: `9052 ${e.key} (${e.severity}/${e.category}/${e.layer}), ${e.troubleshooting.length} troubleshooting steps` };
    }
    case 'nfc_ui_guard_logic': {
      // Mirrors SettingsPage: disabled = !enabled && apiConnected && reader != null && !reader.detected
      // and TopBar: icon = enabled && (reader?.detected ?? true)
      const switchDisabled = (enabled, api, reader) => !enabled && api && reader != null && !reader.detected;
      const icon = (enabled, reader) => enabled && ((reader && typeof reader.detected === 'boolean') ? reader.detected : true);
      const cases = [
        ['off, api, no reader -> disabled', switchDisabled(false, true, { detected: false }), true],
        ['off, api, reader -> enabled', switchDisabled(false, true, { detected: true }), false],
        ['on, api, no reader -> can still switch off', switchDisabled(true, true, { detected: false }), false],
        ['off, before first state -> not disabled', switchDisabled(false, true, null), false],
        ['off, api down -> not disabled (dev fallback)', switchDisabled(false, false, { detected: false }), false],
        ['icon: on + reader -> shown', icon(true, { detected: true }), true],
        ['icon: on + reader unplugged -> hidden', icon(true, { detected: false }), false],
        ['icon: off -> hidden', icon(false, { detected: true }), false],
        ['icon: on, no state yet -> shown', icon(true, null), true],
      ];
      const failed = cases.filter(([, got, want]) => got !== want).map(([n]) => n);
      return failed.length ? { status: 'fail', msg: `wrong: ${failed.join('; ')}` } : { status: 'pass', msg: `${cases.length} switch/icon cases OK` };
    }
    case 'hwc_n2_state': {
      if (typeof data.nitrogenActive !== 'boolean') return { status: 'fail', msg: 'No nitrogenActive in /api/state' };
      return data.nitrogenActive
        ? { status: 'pass', msg: 'nitrogenActive = true after valve open' }
        : { status: 'warn', msg: 'nitrogenActive is false (valve command may have been refused off-Pi)' };
    }
    case 'hwc_led_second_sensors': {
      const led = data.ledTemps;
      if (!led || typeof led !== 'object') return { status: 'fail', msg: 'ledTemps missing from /api/state' };
      const keys = ['left', 'right', 'back', 'door', 'left2', 'right2'];
      const missing = keys.filter(k => !(k in led));
      if (missing.length > 0) return { status: 'fail', msg: `ledTemps missing: ${missing.join(', ')}` };
      const bad = keys.filter(k => led[k] !== null && typeof led[k] !== 'number');
      if (bad.length > 0) return { status: 'fail', msg: `ledTemps not number/null: ${bad.join(', ')}` };
      const open = keys.filter(k => led[k] === null);
      const fmt = keys.map(k => `${k}=${led[k] === null ? 'open' : led[k]}`).join(' ');
      if (open.length > 0) return { status: 'warn', msg: `open sensor(s): ${open.join(', ')} - ${fmt}` };
      return { status: 'pass', msg: fmt };
    }
    case 'hwc_n2_pressure': {
      if (data.n2Pressure === undefined) return { status: 'fail', msg: 'no n2Pressure key in /api/state' };
      if (data.n2Pressure === null) return { status: 'warn', msg: 'n2Pressure = null: U7 AIN3 read failed' };
      const p = data.n2Pressure;
      if (typeof p.volts !== 'number' || typeof p.on !== 'boolean' || typeof p.saturated !== 'boolean' || typeof p.mode !== 'string') return { status: 'fail', msg: 'n2Pressure lacks volts/on/saturated/mode' };
      if (p.saturated && p.mpa !== null) return { status: 'fail', msg: 'saturated reading must report mpa = null' };
      if (p.mpa !== null && data.n2LinePressure !== p.bar) return { status: 'fail', msg: `n2LinePressure ${data.n2LinePressure} ≠ n2Pressure.bar ${p.bar}` };
      if (p.mpa === null && data.n2LinePressure !== null && data.hwSource !== 'simulation') return { status: 'fail', msg: 'n2LinePressure must be null while the analog reading is unusable' };
      if (p.setPointMPa != null && (p.setPointMPa < -0.105 || p.setPointMPa > 1.05)) return { status: 'fail', msg: `setPointMPa ${p.setPointMPa} outside the ISE20 set range` };
      const val = p.mpa === null ? (p.saturated ? 'ADC clamped (above ~0.5 MPa without a divider)' : 'no value (switch mode)') : `${p.mpa} MPa = ${p.bar} bar`;
      return { status: p.saturated ? 'warn' : 'pass', msg: `${p.volts} V → ${val}; line ${p.on ? 'OK' : 'LOW'} vs ${p.setPointMPa} MPa [${p.mode}, ${data.hwSource}]` };
    }
    case 'ise20_analog_map': {
      const conv = (v, c = {}) => {
        const k = Object.assign({ mode: 'analog_voltage', v_min: 1, v_max: 5, i_min_ma: 4, i_max_ma: 20, shunt_ohms: 120, p_min_mpa: -0.1, p_max_mpa: 1.0, divider: 1, adc_saturation_volts: 3.2, on_above_volts: 2.0, set_point_mpa: 0.6 }, c);
        const sat = v >= k.adc_saturation_volts, vs = v * k.divider;
        let mpa = null;
        if (k.mode === 'analog_voltage' && !sat) mpa = k.p_min_mpa + (vs - k.v_min) * (k.p_max_mpa - k.p_min_mpa) / (k.v_max - k.v_min);
        else if (k.mode === 'analog_current' && !sat) { const i = vs / k.shunt_ohms * 1000; mpa = k.p_min_mpa + (i - k.i_min_ma) * (k.p_max_mpa - k.p_min_mpa) / (k.i_max_ma - k.i_min_ma); }
        const on = k.mode === 'switch' ? v >= k.on_above_volts : (mpa !== null ? mpa >= k.set_point_mpa : sat);
        return { mpa, on, sat };
      };
      const near = (a, b, t = 1e-3) => a !== null && Math.abs(a - b) <= t;
      const checks = [
        near(conv(1.0).mpa, -0.1), near(conv(5.0, { adc_saturation_volts: 9 }).mpa, 1.0), near(conv(1.364).mpa, 0.0, 2e-3),
        near(conv(3.545, { adc_saturation_volts: 9 }).mpa, 0.6, 2e-3), conv(3.545, { adc_saturation_volts: 9 }).on === true, conv(1.364).on === false,
        conv(3.545).sat === true && conv(3.545).mpa === null && conv(3.545).on === true,          // clamped without a divider
        near(conv(3.545 / 2, { divider: 2 }).mpa, 0.6, 2e-3),                                        // 2:1 divider restores the range
        near(conv(0.48, { mode: 'analog_current' }).mpa, -0.1, 2e-3), near(conv(2.4, { mode: 'analog_current' }).mpa, 1.0, 2e-3),
        conv(0.52, { mode: 'switch' }).on === false && conv(3.3, { mode: 'switch' }).on === true && conv(0.52, { mode: 'switch' }).mpa === null,
      ];
      const bad = checks.filter(c => !c).length;
      return bad === 0 ? { status: 'pass', msg: 'volts→MPa matches the ISE20 datasheet (1–5 V / 4–20 mA over −0.1..1.0 MPa), divider, saturation and switch mode behave' }
        : { status: 'fail', msg: `${bad} conversion check(s) wrong` };
    }
    case 'hwc_state_extras': {
      const missing = ['ledTemps', 'fanRpm', 'nitrogenActive', 'faults'].filter(k => data[k] === undefined);
      if (missing.length > 0) return { status: 'fail', msg: `Missing state fields: ${missing.join(', ')}` };
      return { status: 'pass', msg: `hwSource=${data.hwSource}: ledTemps/fanRpm/nitrogenActive/faults all present` };
    }
    case 'temp_range': {
      const temp = data.chamberTemp;
      if (typeof temp !== 'number') return { status: 'fail', msg: 'No temperature data' };
      if (temp < -10 || temp > 120) return { status: 'fail', msg: `Out of range: ${temp}°C` };
      if (temp < 15 || temp > 85) return { status: 'warn', msg: `Unusual: ${temp}°C` };
      return { status: 'pass', msg: `${temp}°C` };
    }
    case 'temp_set':
      return data.ok ? { status: 'pass', msg: 'Target set to 40°C' } : { status: 'fail', msg: 'Failed to set target' };
    case 'fan_rpm': {
      const rpm = data.rpm;
      if (!rpm) return { status: 'fail', msg: 'No RPM data' };
      if (rpm < 1000) return { status: 'fail', msg: `Low RPM: ${rpm}` };
      if (rpm < 2000) return { status: 'warn', msg: `${rpm} RPM (low)` };
      return { status: 'pass', msg: `${rpm} RPM` };
    }
    case 'led_results': {
      const results = data.results;
      if (!results || !Array.isArray(results)) return { status: 'fail', msg: 'No LED data' };
      const failed = results.filter(r => r.status !== 'OK');
      if (failed.length > 0) return { status: 'fail', msg: `${failed.length} LED(s) failed` };
      return { status: 'pass', msg: `${results.length} LEDs OK` };
    }
    case 'presets': {
      if (!Array.isArray(data)) return { status: 'fail', msg: 'Not an array' };
      if (data.length === 0) return { status: 'warn', msg: 'No presets found' };
      const valid = data.every(m => m.name && Array.isArray(m.steps) && m.steps.length > 0);
      if (!valid) return { status: 'fail', msg: 'Invalid preset structure' };
      return { status: 'pass', msg: `${data.length} presets loaded` };
    }
    case 'errors': {
      if (!data.errors || !Array.isArray(data.errors)) return { status: 'fail', msg: 'No errors array' };
      const critical = data.errors.filter(e => e.severity === 'critical').length;
      const warnings = data.errors.filter(e => e.severity === 'warning').length;
      return { status: 'pass', msg: `${critical} errors, ${warnings} warnings` };
    }
    case 'system': {
      if (!data.serialNumber) return { status: 'fail', msg: 'No serial number' };
      return { status: 'pass', msg: `S/N: ${data.serialNumber}` };
    }
    // --- IO Board Integration (io_controller bridge) ---
    case 'io_hw_source': {
      if (data.hwSource === 'io_controller') return { status: 'pass', msg: 'Real IO board (io_controller)' };
      return { status: 'warn', msg: `Simulation mode (hwSource: ${data.hwSource || 'none'})` };
    }
    case 'io_door': {
      if (typeof data.doorClosed !== 'boolean') return { status: 'fail', msg: 'No doorClosed in state' };
      return { status: 'pass', msg: data.doorClosed ? 'Door CLOSED' : 'Door OPEN' };
    }
    case 'io_heating_on': {
      if (data.hwSource !== 'io_controller') return { status: 'warn', msg: 'Simulation — not read from hardware' };
      if (data.isHeating) return { status: 'pass', msg: `Heating, target ${data.targetTemp}°C` };
      return { status: 'fail', msg: (data.faults && data.faults.heater) || 'isHeating = false' };
    }
    case 'io_uv_on': {
      if (data.hwSource !== 'io_controller') return { status: 'warn', msg: 'Simulation — not read from hardware' };
      if (data.uvOn && data.uvWavelength === 405) return { status: 'pass', msg: `UV 405nm ON @ ${data.uvIntensity}%` };
      return { status: 'fail', msg: (data.faults && data.faults.led) || 'UV not on' };
    }
    case 'io_all_off': {
      if (data.uvOn || data.isCooling) return { status: 'fail', msg: 'Outputs still on after stop' };
      return { status: 'pass', msg: 'All outputs off' };
    }
    default: {
      // Program Validation checks (pv_*)
      if (check.startsWith('pv_')) return runProgramValidationCheck(check);
      return { status: 'warn', msg: 'Unknown check' };
    }
  }
}

// ============================================================
// Program Validation Logic (mirrors CsvBuilderModal)
// ============================================================
function validateProgram(name, steps) {
  const hasNitrogen = steps.some(s => s.process === 'Nitrogen');
  const hasCooling = steps.some(s => s.process === 'Cooling');
  const hasCureOrHeating = steps.some(s => s.process === 'Cure' || s.process === 'Bleacher' || s.process === 'Heating');

  // Each N₂ purge must be followed by Cure/Bleaching, then Cooling: N₂ → (Cure|Bleach) → Cooling
  const n2BlockError = (() => {
    for (let i = 0; i < steps.length; i++) {
      if (steps[i].process !== 'Nitrogen') continue;
      const next = steps[i + 1];
      const after = steps[i + 2];
      if (!next || (next.process !== 'Cure' && next.process !== 'Bleacher')) {
        return 'After an N₂ purge, add a Cure or Bleaching step';
      }
      if (!after || after.process !== 'Cooling') {
        return 'Add a Cooling step after the Cure/Bleaching step that follows the N₂ purge';
      }
    }
    return null;
  })();

  if (!name.trim()) return 'Enter a program name';
  if (steps.length === 0) return 'Add at least one step';
  if (!hasCureOrHeating) return 'Program must include a Cure or Heating step';
  if (hasNitrogen && n2BlockError) return n2BlockError;
  return null;
}

// ============================================================
// Compliance Logic (mirrors src/lib/compliance.ts)
// ============================================================
async function sha256HexQA(bytes) {
  const digest = await crypto.subtle.digest('SHA-256', new Uint8Array(bytes));
  return [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, '0')).join('');
}
function normalizeSha256QA(value) {
  if (typeof value !== 'string') return null;
  const v = value.trim().toLowerCase().replace(/^sha-?256[:=]\s*/, '');
  return /^[0-9a-f]{64}$/.test(v) ? v : null;
}
async function verifyUpdatePackageQA(bytes, expected) {
  const e = normalizeSha256QA(expected);
  if (!e) return { ok: false, reason: 'Missing or malformed checksum' };
  const a = await sha256HexQA(bytes);
  return a === e ? { ok: true, reason: 'Integrity verified' } : { ok: false, reason: 'Checksum mismatch' };
}
// Mirror of REQ-CRA IDs defined in src/lib/compliance.ts
const QA_CRA_REQUIREMENTS = ['REQ-CRA-01','REQ-CRA-02','REQ-CRA-03','REQ-CRA-04','REQ-CRA-05','REQ-CRA-06','REQ-CRA-07','REQ-CRA-08'];

async function runComplianceCheck(check) {
  const enc = new TextEncoder();
  const pkg = enc.encode('scure-update:1.0.1');
  const goodHash = await sha256HexQA(pkg);

  switch (check) {
    case 'cra_verify_pass': {
      const r = await verifyUpdatePackageQA(pkg, goodHash);
      return r.ok ? { status: 'pass', msg: 'Valid package verified' } : { status: 'fail', msg: 'Valid package was rejected: ' + r.reason };
    }
    case 'cra_verify_tamper': {
      const tampered = enc.encode('scure-update:1.0.1-EVIL');
      const r = await verifyUpdatePackageQA(tampered, goodHash);
      return !r.ok ? { status: 'pass', msg: 'Blocked: ' + r.reason } : { status: 'fail', msg: 'Tampered package was NOT blocked' };
    }
    case 'cra_verify_missing_hash': {
      const r = await verifyUpdatePackageQA(pkg, '');
      return !r.ok ? { status: 'pass', msg: 'Blocked: ' + r.reason } : { status: 'fail', msg: 'Missing checksum was NOT blocked' };
    }
    case 'cra_verify_bad_hex': {
      const r = await verifyUpdatePackageQA(pkg, 'zz' + goodHash.slice(2, 40));
      return !r.ok ? { status: 'pass', msg: 'Blocked: ' + r.reason } : { status: 'fail', msg: 'Malformed checksum was NOT blocked' };
    }
    case 'cra_verify_prefix_upper': {
      const r = await verifyUpdatePackageQA(pkg, 'SHA256:' + goodHash.toUpperCase());
      return r.ok ? { status: 'pass', msg: 'Normalized & verified' } : { status: 'fail', msg: 'Prefixed/uppercase digest not accepted' };
    }
    case 'cra_requirements_defined': {
      return QA_CRA_REQUIREMENTS.length === 8
        ? { status: 'pass', msg: '8 REQ-CRA requirements defined' }
        : { status: 'fail', msg: `Expected 8, got ${QA_CRA_REQUIREMENTS.length}` };
    }
    default:
      return { status: 'warn', msg: 'Unknown compliance check' };
  }
}

function runProgramValidationCheck(check) {
  const s = (process, temp, time) => ({ process, temperature: temp ?? null, time: time ?? 10 });

  switch (check) {
    case 'pv_empty_name': {
      const err = validateProgram('', [s('Heating', 40)]);
      return err ? { status: 'pass', msg: 'Blocked: ' + err } : { status: 'fail', msg: 'Should block empty name' };
    }
    case 'pv_no_steps': {
      const err = validateProgram('Test', []);
      return err ? { status: 'pass', msg: 'Blocked: ' + err } : { status: 'fail', msg: 'Should block empty steps' };
    }
    case 'pv_valid_simple': {
      const err = validateProgram('Test', [s('Heating', 40), s('Cooling', 25)]);
      return !err ? { status: 'pass', msg: 'Valid program accepted' } : { status: 'fail', msg: 'Rejected valid program: ' + err };
    }
    case 'pv_n2_no_process': {
      const err = validateProgram('Test', [s('Heating', 40), s('Nitrogen'), s('Cooling', 25)]);
      return err ? { status: 'pass', msg: 'Blocked: ' + err } : { status: 'fail', msg: 'Should block N₂ without process after' };
    }
    case 'pv_n2_with_heating': {
      // New rule: Heating directly after N₂ is NOT allowed — only Cure/Bleaching
      const steps = [s('Heating', 40), s('Nitrogen'), s('Heating', 60), s('Cooling', 25)];
      const err = validateProgram('Test', steps);
      return err ? { status: 'pass', msg: 'Blocked: ' + err } : { status: 'fail', msg: 'Should block Heating after N₂' };
    }
    case 'pv_n2_with_cure': {
      const steps = [s('Heating', 40), s('Nitrogen'), s('Cure', 40), s('Cooling', 25)];
      const err = validateProgram('Test', steps);
      return !err ? { status: 'pass', msg: 'N₂ + Cure accepted' } : { status: 'fail', msg: 'Rejected: ' + err };
    }
    case 'pv_n2_with_bleacher': {
      const steps = [s('Heating', 40), s('Nitrogen'), s('Bleacher', 40), s('Cooling', 25)];
      const err = validateProgram('Test', steps);
      return !err ? { status: 'pass', msg: 'N₂ + Bleaching accepted' } : { status: 'fail', msg: 'Rejected: ' + err };
    }
    case 'pv_n2_no_cooling': {
      // N₂ → Cure with no Cooling after → blocked (must be vented)
      const steps = [s('Heating', 40), s('Nitrogen'), s('Cure', 60)];
      const err = validateProgram('Test', steps);
      return err ? { status: 'pass', msg: 'Blocked: ' + err } : { status: 'fail', msg: 'Should block N₂ without Cooling' };
    }
    case 'pv_n2_with_cooling': {
      const steps = [s('Heating', 40), s('Nitrogen'), s('Cure', 60), s('Cooling', 25)];
      const err = validateProgram('Test', steps);
      return !err ? { status: 'pass', msg: 'Full N₂ flow accepted' } : { status: 'fail', msg: 'Rejected: ' + err };
    }
    case 'pv_n2_cure_cooling': {
      const steps = [s('Heating', 40), s('Nitrogen'), s('Cure', 40), s('Cooling', 25)];
      const err = validateProgram('Test', steps);
      return !err ? { status: 'pass', msg: 'N₂ → Cure → Cooling accepted' } : { status: 'fail', msg: 'Rejected: ' + err };
    }
    case 'pv_only_cooling': {
      const err = validateProgram('Test', [s('Cooling', 25)]);
      return err ? { status: 'pass', msg: 'Blocked: ' + err } : { status: 'fail', msg: 'Should block program without Cure/Heating' };
    }
    case 'pv_n2_drying_after': {
      // Drying directly after N₂ is not allowed
      const steps = [s('Heating', 40), s('Nitrogen'), s('Drying', 50), s('Cure', 60), s('Cooling', 25)];
      const err = validateProgram('Test', steps);
      return err ? { status: 'pass', msg: 'Blocked: ' + err } : { status: 'fail', msg: 'Should block Drying after N₂' };
    }
    case 'pv_n2_cooling_direct': {
      // Cooling directly after N₂ with no Cure/Bleach in between is blocked
      const steps = [s('Cure', 40), s('Nitrogen'), s('Cooling', 25)];
      const err = validateProgram('Test', steps);
      return err ? { status: 'pass', msg: 'Blocked: ' + err } : { status: 'fail', msg: 'Should block Cooling directly after N₂' };
    }
    case 'pv_n2_cure_then_heating': {
      // N₂ → Cure → Heating: the step after the cure must be Cooling, not Heating
      const steps = [s('Heating', 40), s('Nitrogen'), s('Cure', 60), s('Heating', 70), s('Cooling', 25)];
      const err = validateProgram('Test', steps);
      return err ? { status: 'pass', msg: 'Blocked: ' + err } : { status: 'fail', msg: 'Should force Cooling after the N₂ cure' };
    }
    default:
      return { status: 'warn', msg: 'Unknown validation check' };
  }
}

// ============================================================
// Material Duplication Logic (mirrors MaterialContext.duplicateMaterial)
// ============================================================
// Returns the unique "<name> Copy" name given the names already in the list.
function makeCopyName(baseName, existingNames) {
  let copyName = `${baseName} Copy`;
  let n = 2;
  while (existingNames.includes(copyName)) {
    copyName = `${baseName} Copy ${n}`;
    n++;
  }
  return copyName;
}

// Simulates duplicating a material from a list; returns the new material + new list.
function duplicateMaterialSim(list, id) {
  const mat = list.find(m => m.id === id);
  if (!mat) return null;
  const copy = {
    id: 'copy-' + id,
    name: makeCopyName(mat.name, list.map(m => m.name)),
    steps: mat.steps.map(s => ({ ...s })),
    totalDuration: mat.totalDuration,
    isPreset: false,
  };
  const next = [...list, copy];
  return { copy, next };
}

function runDuplicateCheck(check) {
  const baseList = [
    { id: 'a', name: 'ST45', steps: [{ process: 'Heating', temperature: 45, time: 10 }], totalDuration: 10, isPreset: true },
    { id: 'b', name: 'Carbon Fiber', steps: [{ process: 'Heating', temperature: 60, time: 20 }, { process: 'Cooling', temperature: 25, time: 0 }], totalDuration: 20, isPreset: false },
  ];

  switch (check) {
    case 'dup_copy_name': {
      const { copy } = duplicateMaterialSim(baseList, 'a');
      return copy.name === 'ST45 Copy'
        ? { status: 'pass', msg: 'Copy named "ST45 Copy"' }
        : { status: 'fail', msg: `Expected "ST45 Copy", got "${copy.name}"` };
    }
    case 'dup_is_editable': {
      // Duplicating a locked preset must produce an editable (non-preset) material
      const { copy } = duplicateMaterialSim(baseList, 'a');
      return copy.isPreset === false
        ? { status: 'pass', msg: 'Preset copy is editable (isPreset=false)' }
        : { status: 'fail', msg: 'Copy should not be a preset' };
    }
    case 'dup_steps_cloned': {
      const { copy } = duplicateMaterialSim(baseList, 'b');
      const sameContent = JSON.stringify(copy.steps) === JSON.stringify(baseList[1].steps);
      const notSameRef = copy.steps !== baseList[1].steps && copy.steps[0] !== baseList[1].steps[0];
      return sameContent && notSameRef
        ? { status: 'pass', msg: 'Steps deep-copied (content equal, refs distinct)' }
        : { status: 'fail', msg: 'Steps not properly cloned' };
    }
    case 'dup_inserted_after': {
      const { next } = duplicateMaterialSim(baseList, 'a');
      // Copy is appended to the end, alongside new user materials
      return next.length === baseList.length + 1 && next[next.length - 1].name === 'ST45 Copy'
        ? { status: 'pass', msg: 'Copy appended to end of list' }
        : { status: 'fail', msg: 'Copy not appended to end' };
    }
    case 'dup_unique_name': {
      // Duplicating twice must not collide: Copy, then Copy 2
      const first = duplicateMaterialSim(baseList, 'a');
      const second = duplicateMaterialSim(first.next, 'a');
      return first.copy.name === 'ST45 Copy' && second.copy.name === 'ST45 Copy 2'
        ? { status: 'pass', msg: 'Second copy named "ST45 Copy 2"' }
        : { status: 'fail', msg: `Got "${first.copy.name}" then "${second.copy.name}"` };
    }
    case 'dup_invalid_id': {
      const result = duplicateMaterialSim(baseList, 'does-not-exist');
      return result === null
        ? { status: 'pass', msg: 'Unknown id returns null (no copy)' }
        : { status: 'fail', msg: 'Should return null for unknown id' };
    }
    default:
      return { status: 'warn', msg: 'Unknown duplication check' };
  }
}

// ============================================================
// TopBar Active Nav Logic (mirrors TopBar.tsx active highlight)
// ============================================================
// Returns the id of the nav icon that should be lit for a given route,
// or null if no nav icon is active (e.g. Home).
function activeNavFor(pathname) {
  if (pathname === '/cure-history') return 'history';
  if (pathname === '/alerts') return 'alerts';
  if (pathname === '/settings') return 'settings';
  if (pathname === '/network') return 'network';
  return null;
}

// Mirrors the Globe icon className resolution in TopBar.tsx.
// Returns null when the icon should inherit the parent's color (text-primary when active).
function globeIconColor(isCuring, connected, pathname) {
  if (isCuring) return 'opacity-30';
  if (!connected) return 'text-destructive';
  if (pathname === '/network') return null; // active → inherit primary (blue)
  return 'text-white';
}

function runNavCheck(check) {
  switch (check) {
    case 'nav_settings': {
      return activeNavFor('/settings') === 'settings'
        ? { status: 'pass', msg: 'Settings icon lit on /settings' }
        : { status: 'fail', msg: 'Settings icon not active on /settings' };
    }
    case 'nav_network': {
      return activeNavFor('/network') === 'network'
        ? { status: 'pass', msg: 'Network icon lit on /network' }
        : { status: 'fail', msg: 'Network icon not active on /network' };
    }
    case 'nav_alerts': {
      return activeNavFor('/alerts') === 'alerts'
        ? { status: 'pass', msg: 'Alerts icon lit on /alerts' }
        : { status: 'fail', msg: 'Alerts icon not active on /alerts' };
    }
    case 'nav_history': {
      return activeNavFor('/cure-history') === 'history'
        ? { status: 'pass', msg: 'History icon lit on /cure-history' }
        : { status: 'fail', msg: 'History icon not active on /cure-history' };
    }
    case 'nav_home_none': {
      return activeNavFor('/') === null
        ? { status: 'pass', msg: 'No nav icon lit on Home' }
        : { status: 'fail', msg: 'Home should not light any nav icon' };
    }
    case 'nav_single_active': {
      // Exactly one icon may be active for any given settings-area route
      const routes = ['/settings', '/network', '/alerts', '/cure-history'];
      const ok = routes.every(r => {
        const active = activeNavFor(r);
        return active !== null && routes.filter(x => activeNavFor(x) === active).length === 1;
      });
      return ok
        ? { status: 'pass', msg: 'Exactly one icon active per route' }
        : { status: 'fail', msg: 'Multiple or zero icons active for a route' };
    }
    case 'nav_globe_active_blue': {
      // null = no explicit color → inherits the parent's text-primary (blue) when active
      const c = globeIconColor(false, true, '/network');
      return c === null
        ? { status: 'pass', msg: 'Active globe inherits primary (blue)' }
        : { status: 'fail', msg: `Active globe forced to ${c} instead of inheriting blue` };
    }
    case 'nav_globe_inactive_white': {
      const c = globeIconColor(false, true, '/settings');
      return c === 'text-white'
        ? { status: 'pass', msg: 'Inactive connected globe is white' }
        : { status: 'fail', msg: `Expected white, got ${c}` };
    }
    case 'nav_globe_disconnected_red': {
      const c = globeIconColor(false, false, '/network');
      return c === 'text-destructive'
        ? { status: 'pass', msg: 'Disconnected globe stays red even when active' }
        : { status: 'fail', msg: `Expected red, got ${c}` };
    }
    default:
      return { status: 'warn', msg: 'Unknown nav check' };
  }
}

// ============================================================
// Wake Screen blackout (mirrors WakeScreen showHint + tap-to-wake)
// ============================================================
// Sleep mode (blank=true) stays fully black until first touch; screensaver always shows the hint.
function wakeScreenView(blank, tapCount) {
  const showHint = !blank || tapCount > 0;
  return { black: !showHint, woke: tapCount >= 2 };
}

function runWakeScreenCheck(check) {
  switch (check) {
    case 'wake_sleep_black': {
      const v = wakeScreenView(true, 0); // sleep, untouched
      return v.black
        ? { status: 'pass', msg: 'Sleep screen is fully black (screen protected)' }
        : { status: 'fail', msg: 'Sleep screen should be black' };
    }
    case 'wake_sleep_hint_after_touch': {
      const v = wakeScreenView(true, 1); // sleep, first touch
      return !v.black
        ? { status: 'pass', msg: 'Wake hint appears after first touch' }
        : { status: 'fail', msg: 'Hint should show after touch' };
    }
    case 'wake_two_taps_wakes': {
      const v = wakeScreenView(true, 2);
      return v.woke
        ? { status: 'pass', msg: 'Two taps wake the system' }
        : { status: 'fail', msg: 'Two taps should wake' };
    }
    case 'wake_screensaver_black': {
      const v = wakeScreenView(true, 0); // screensaver, untouched — now blank like sleep
      return v.black
        ? { status: 'pass', msg: 'Screensaver is fully black (screen protected)' }
        : { status: 'fail', msg: 'Screensaver should be black until touched' };
    }
    case 'wake_screensaver_hint_after_touch': {
      const v = wakeScreenView(true, 1); // screensaver, first touch
      return !v.black
        ? { status: 'pass', msg: 'Wake hint appears after first touch' }
        : { status: 'fail', msg: 'Hint should show after touch' };
    }
    default:
      return { status: 'warn', msg: 'Unknown wake-screen check' };
  }
}

// ============================================================
// Boot vs Sleep-Resume (mirrors App.tsx asleep/booting init)
// ============================================================
// The boot/diagnostics screen shows only on a real power-up, not when resuming from sleep.
// shutdownFlag is the value of sessionStorage 'scure-shutdown' present at mount.
function bootDecision(shutdownFlag) {
  return {
    asleep: shutdownFlag === 'true',
    booting: shutdownFlag !== 'true',
  };
}

// ============================================================
// SRS Document Version History (mirrors docs/sCure_SRS.html setVersions/getVersions)
// Snapshots are archived as JSON inside a <script type="application/json"> tag, so any
// "</" must be escaped to "<\/" or an embedded closing script tag would truncate the file.
// ============================================================
function srsEncodeVersions(arr) {
  return JSON.stringify(arr).replace(/<\//g, '<\\/'); // exact logic from setVersions()
}
function srsDecodeVersions(text) {
  try { return JSON.parse(text || '[]') || []; } catch (e) { return null; } // getVersions()
}
function deepEqual(a, b) { return JSON.stringify(a) === JSON.stringify(b); }

function runSrsVersionCheck(check) {
  const CLOSE = '</' + 'script>'; // avoid a literal closing tag in this file too
  switch (check) {
    case 'srs_roundtrip_plain': {
      const arr = [{ n: 'Baseline', date: '2026-06-30', author: '—', change: 'pristine', html: '<!DOCTYPE html>\n<html><body><p>v1</p></body></html>' }];
      const back = srsDecodeVersions(srsEncodeVersions(arr));
      return deepEqual(arr, back)
        ? { status: 'pass', msg: 'Plain version round-trips unchanged' }
        : { status: 'fail', msg: 'Round-trip altered the version data' };
    }
    case 'srs_roundtrip_scripttag': {
      const html = '<html><body><script>var x="' + CLOSE + '";' + CLOSE + '<p>old</p></body></html>';
      const arr = [{ n: '3', date: '2026-06-30', author: 'Amitai', change: 'edit', html }];
      const back = srsDecodeVersions(srsEncodeVersions(arr));
      return back && back[0] && back[0].html === html && back[0].html.includes(CLOSE)
        ? { status: 'pass', msg: 'Embedded closing script tag survives the round-trip' }
        : { status: 'fail', msg: 'Closing script tag was lost or corrupted' };
    }
    case 'srs_no_raw_close': {
      const arr = [{ n: '1', html: 'before' + CLOSE + 'after' }];
      const encoded = srsEncodeVersions(arr);
      return !encoded.includes(CLOSE)
        ? { status: 'pass', msg: 'Encoded archive has no raw closing script tag' }
        : { status: 'fail', msg: 'Raw closing script tag present — file would truncate' };
    }
    case 'srs_unicode': {
      const arr = [{ n: '2', author: 'אמיתי', change: 'שינוי', html: '<p>גרסה ישנה של המסמך</p>' }];
      const back = srsDecodeVersions(srsEncodeVersions(arr));
      return back && deepEqual(arr, back) && back[0].html.includes('גרסה ישנה')
        ? { status: 'pass', msg: 'Hebrew/Unicode content preserved' }
        : { status: 'fail', msg: 'Unicode content not preserved' };
    }
    case 'srs_empty_archive': {
      const back = srsDecodeVersions('[]');
      return Array.isArray(back) && back.length === 0
        ? { status: 'pass', msg: 'Empty archive parses to an empty list' }
        : { status: 'fail', msg: 'Empty archive did not parse to []' };
    }
    default:
      return { status: 'warn', msg: 'Unknown SRS version check' };
  }
}

function runBootCheck(check) {
  switch (check) {
    case 'boot_cold_shows_diag': {
      const d = bootDecision(null); // no shutdown flag = cold power-up
      return d.booting && !d.asleep
        ? { status: 'pass', msg: 'Cold start shows boot/diagnostics' }
        : { status: 'fail', msg: 'Cold start should boot' };
    }
    case 'boot_sleep_no_diag': {
      const d = bootDecision('true'); // resuming from sleep
      return !d.booting
        ? { status: 'pass', msg: 'No diagnostics screen when resuming from sleep' }
        : { status: 'fail', msg: 'Sleep resume must skip boot screen' };
    }
    case 'boot_sleep_shows_wake': {
      const d = bootDecision('true');
      return d.asleep
        ? { status: 'pass', msg: 'Sleep resume shows wake screen' }
        : { status: 'fail', msg: 'Sleep resume should be asleep' };
    }
    case 'boot_cold_not_asleep': {
      const d = bootDecision(null);
      return !d.asleep
        ? { status: 'pass', msg: 'Cold start is not asleep' }
        : { status: 'fail', msg: 'Cold start should not be asleep' };
    }
    default:
      return { status: 'warn', msg: 'Unknown boot check' };
  }
}

// ============================================================
// Per-Fan Diagnostic (mirrors SettingsPage handleFanTest / FanRow)
// ============================================================
const FAN_RPM_SIM = { led_cooling: 2850, chamber_intake: 3050, chamber_heating: 2780 };
const FAN_IDS = ['led_cooling', 'chamber_intake', 'chamber_heating'];

// Simulates running a fan's diagnostic; rpm null = unknown fan.
function fanTestResultSim(id) {
  const rpm = FAN_RPM_SIM[id] ?? null;
  return { rpm, ok: rpm != null && rpm >= 2000 }; // healthy fans spin well above 2000 RPM
}

// ============================================================
// UX ↔ Hardware compatibility mirrors — same rules as MaterialContext.parseCsv,
// CureProcessPage cooling completion and io_controller ON/OFF heating.
// ============================================================
function runHwCompatCheck(check) {
  // Mirror of the CSV import range rules (hardware-authoritative)
  const csvTempOk = (proc, t) => proc === 'Cooling' ? (t >= 30 && t <= 75) : (t >= 30 && t <= 80);
  const csvUvOk = (v) => v >= 10 && v <= 100;
  switch (check) {
    case 'hwc_csv_heat_min': {
      // 30°C floor applies to BOTH heating (driver minimum) and cooling (cannot
      // cool below ambient ~30°C): a Cooling target of 25 is now rejected.
      const cases = [['Heating', 25, false], ['Heating', 30, true], ['Drying', 29, false], ['Cure', 30, true],
                     ['Cooling', 25, false], ['Cooling', 30, true], ['Cooling', 75, true], ['Cooling', 76, false]];
      const bad = cases.filter(([p, t, exp]) => csvTempOk(p, t) !== exp);
      return bad.length === 0
        ? { status: 'pass', msg: `${cases.length} cases match the 30°C floor (heating + cooling)` }
        : { status: 'fail', msg: `${bad.length} wrong: ${bad.map(c => `${c[0]}@${c[1]}`).join(', ')}` };
    }
    case 'hwc_csv_uv_min': {
      const cases = [[5, false], [9, false], [10, true], [100, true], [101, false]];
      const bad = cases.filter(([v, exp]) => csvUvOk(v) !== exp);
      return bad.length === 0
        ? { status: 'pass', msg: 'UV floor matches led_power.min_intensity (10%)' }
        : { status: 'fail', msg: `${bad.length} wrong UV bounds` };
    }
    case 'hwc_led_routing': {
      // Mirror of io_controller/components.json led_power.modes (bench 2026-09-07):
      // the voltage-routing line GPIO17 stays LOW in both modes - HIGH killed the
      // door driver's 12 V DIM rail, which is why Bleaching never dimmed the door.
      // led_switch = LED_SWITCH relay (TCA6424A P05 -> Q28 -> K4): 1 = Cure/405nm,
      // 0 = Bleaching/450nm and at rest.
      const modes = { '450nm': { ssr_450nm: 1, ssr_405nm: 0, routing: 0, led_switch: 0 },
                      '405nm': { ssr_450nm: 1, ssr_405nm: 1, routing: 0, led_switch: 1 } };
      const bad = [];
      if (modes['450nm'].routing !== 0) bad.push('450nm routing must be 0 (GPIO17 HIGH cuts the door DIM)');
      if (modes['405nm'].routing !== 0) bad.push('405nm routing must be 0');
      if (!(modes['450nm'].ssr_450nm === 1 && modes['450nm'].ssr_405nm === 0)) bad.push('450nm must enable GPIO16 only');
      if (!(modes['405nm'].ssr_450nm === 1 && modes['405nm'].ssr_405nm === 1)) bad.push('405nm must enable GPIO16 + GPIO20');
      if (modes['405nm'].led_switch !== 1) bad.push('Cure/405nm must set the LED_SWITCH relay to 1');
      if (modes['450nm'].led_switch !== 0) bad.push('Bleaching/450nm must set the LED_SWITCH relay to 0');
      return bad.length === 0
        ? { status: 'pass', msg: 'GPIO17 LOW in both modes; SSRs 450: GPIO16, 405: GPIO16+GPIO20; LED_SWITCH relay 1 for Cure, 0 for Bleaching' }
        : { status: 'fail', msg: bad.join('; ') };
    }
    case 'hwc_startup_switch': {
      // Mirror of io_controller startup_safe() + components.json led_power:
      // default_mode 405nm, its routing value is what GPIO17 is parked at.
      const lp = { default_mode: '405nm',
                   modes: { '450nm': { routing: 0 }, '405nm': { routing: 0 } } };
      const parked = lp.modes[lp.default_mode].routing;
      const firmware = 'gpio=16,17,20=op,dl';            // scripts/pi-setup.sh step 2b
      // LED_SWITCH relay: TCA6424A P05 (port 0, bit 5) -> Q28 -> K4. Rest = 0 on
      // every safe path (all_safe, startup_safe, shutdown) and in io-safe-boot.sh
      // (port-0 output 0x02 = only NFC_RESET high; config 0xDD = P01 + P05 outputs).
      const ledSwitch = { port: 0, bit: 5, rest: 0, bootOut: 0x02, bootCfg: 0xDD };
      const bad = [];
      if (lp.default_mode !== '405nm') bad.push(`default_mode is ${lp.default_mode}, expected 405nm`);
      if (parked !== 0) bad.push(`startup parks GPIO17 at ${parked}, expected 0 (LOW = 405 position)`);
      if (!/^gpio=16,17,20=op,dl$/.test(firmware)) bad.push('firmware default line malformed');
      if (ledSwitch.rest !== 0) bad.push('LED_SWITCH rest state must be 0');
      if ((ledSwitch.bootOut >> ledSwitch.bit) & 1) bad.push('io-safe-boot.sh drives P05 high');
      if ((ledSwitch.bootCfg >> ledSwitch.bit) & 1) bad.push('io-safe-boot.sh leaves P05 as input');
      return bad.length === 0
        ? { status: 'pass', msg: 'startup parks the switch LOW (405 table) + LED_SWITCH relay 0; firmware/early-boot unit cover the power-on window' }
        : { status: 'fail', msg: bad.join('; ') };
    }
    case 'hwc_led_turn_on_order': {
      // Mirror of apply_led_power() + set_led(): the order is fixed in code.
      const order = ['led_switch_relay', 'settle', 'ssr_gpios', 'routing_readback', 'dim_pwm'];
      const settleSec = 0.1;                            // components.json led_power.switch_settle_sec
      const bad = [];
      if (order.indexOf('led_switch_relay') !== 0) bad.push('relay must be first');
      if (order.indexOf('settle') !== 1) bad.push('settle must follow the relay');
      if (order.indexOf('ssr_gpios') < order.indexOf('settle')) bad.push('SSRs must wait for the settle');
      if (order.indexOf('dim_pwm') !== order.length - 1) bad.push('DIM PWM must be last');
      if (!(settleSec > 0 && settleSec <= 1)) bad.push(`switch_settle_sec ${settleSec} out of the sane 0-1 s range`);
      return bad.length === 0
        ? { status: 'pass', msg: `order: ${order.join(' -> ')} (settle ${settleSec * 1000} ms)` }
        : { status: 'fail', msg: bad.join('; ') };
    }
    case 'hwc_program_estimate': {
      // Mirror of src/lib/program-estimate.ts (keep the numbers in sync).
      const bands = [[45, 13], [75, 50], [Infinity, 80]];
