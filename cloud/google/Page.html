/** NetBird's view of the CureBox (read from the NetBird API by the portal): on the mesh or not, and since when.
 *  Synced here but off NetBird = the machine runs, remote access (SSH, screen) is down; off both = no power or no network. */
function netbirdPill(m) {
  const nb = m.netbird;
  if (!nb) return '';
  if (nb.error) return `<span class="pill" title="${String(nb.error).replace(/"/g, '&quot;')}">NetBird ?</span>`;
  if (nb.missing) return `<span class="pill off" title="no NetBird peer named ${nb.peer}">NetBird: not enrolled</span>`;
  const why = nb.connected ? `NetBird ${nb.ip}` + (nb.stale ? ` · ${nb.stale} stale registration(s) of ${nb.peer} in the dashboard` : '')
    : m.online ? 'the CureBox runs and syncs, but its NetBird client is down - remote access (SSH, screen) is unavailable'
               : 'off NetBird and not syncing - no power or no network';
  return `<span class="pill ${nb.connected ? 'on' : 'off'}" title="${why}">NetBird ${nb.connected ? 'connected' : 'offline · seen ' + fmtWhen(nb.lastSeen)}</span>`;
}

// An NFC tag UID however it is typed ("e007c0e1...", "E0 07 C0 ...", "E0:07:...") in the form the machine shows:
// E0:07:C0:E1:93:93:18:6D. Null when it is not a UID (the machine applies the same rule - NfcUid in the firmware).
function nfcTagOf(text) {
  const hex = String(text || '').replace(/[:\-\s]/g, '').toUpperCase();
  if (!/^[0-9A-F]+$/.test(hex) || hex.length < 4 || hex.length > 32 || hex.length % 2) return null;
  return hex.match(/../g).join(':');
}

// Every program the machine offers: the user's own first, then the built-in catalog (firmware 1.0.145+ sends it as
// m.presets; an older machine sends none and the list is the user's programs only, as before).
function programOptions(m) {
  const opt = p => `<option>${escH(p.name||'')}</option>`;
  const user = (m.programs||[]), cat = (m.presets||[]);
  if (!cat.length) return user.map(opt).join('');
  return (user.length ? `<optgroup label="My programs">${user.map(opt).join('')}</optgroup>` : '')
       + `<optgroup label="Catalog">${cat.map(opt).join('')}</optgroup>`;
}

function machineCard(m, i) {
  const st = m.state || {};
  const c = st.counters || {};
  const q = SEARCH.trim().toLowerCase();
  const progRows = (m.programs||[])
    .filter(p => !q || (p.name||'').toLowerCase().includes(q))
    .map(p => `
    <tr><td>${p.name}</td><td data-l="Steps">${(p.steps||[]).length} steps</td>
        <td data-l="Duration">${p.totalDuration ?? '–'} min</td>
        <td class="act"><button data-edit="${i}:${p.id}">Edit</button>
            <button class="danger" data-del="${i}:${p.id}">Delete</button></td></tr>`).join('');
  const printRows = (m.prints||[])
    .filter(p => !q || [p.printName, p.materialName, p.printerName, p.status]
                       .some(v => (v||'').toLowerCase().includes(q)))
    .slice(0,5).map(p => `
    <tr><td>${escH(p.printName||'')}${p.nfcTag ? `<div class="mut">tag ${escH(p.nfcTag)}</div>` : ''}</td>
        <td data-l="Material">${escH(p.materialName||'')}</td>
        <td data-l="Printer">${escH(p.printerName||'')}</td><td data-l="Status">${escH(p.status||'')}</td>
        <td class="act"><button class="danger" data-delprint="${i}:${escH(p.id||'')}">Delete</button></td></tr>`).join('');
  // the programs that come with the machine (firmware 1.0.145+ reports them): read-only, they cannot be edited or deleted
  const catRows = (m.presets||[])
    .filter(p => !q || (p.name||'').toLowerCase().includes(q))
    .map(p => `
    <tr><td>${escH(p.name||'')}</td><td data-l="Steps">${(p.steps||[]).length} steps</td>
        <td data-l="Duration">${p.totalDuration ?? '–'} min</td></tr>`).join('');
  return `<div class="card">
    <div class="row" style="justify-content:space-between">
      <h2 style="margin:0">${m.name}
        <span class="pill ${m.online?'on':'off'}">${m.online?'online':'offline'}</span>
        <span class="mut" style="font-weight:400;text-transform:none">last sync ${fmtAgo(m.lastSeen)}${m.pending?` · ${m.pending} pending`:''}</span>
        ${netbirdPill(m)}
      </h2>
      <div>
        <span class="stat"><b>${st.chamberTemp != null ? (+st.chamberTemp).toFixed(1) : '–'}°C</b><span>chamber</span></span>
        <span class="stat"><b>${c.led405 ?? '–'}h</b><span>LED 405</span></span>
        <span class="stat"><b>${c.heater ?? '–'}h</b><span>heater</span></span>
      </div>
    </div>

    <h2>Work Programs</h2>
    <table class="cards"><tr><th>Name</th><th>Steps</th><th>Duration</th><th></th></tr>${progRows||'<tr><td colspan=4 class="mut">none</td></tr>'}</table>
    <p><button class="primary" data-new="${i}">+ New Program</button></p>
    <div id="editor-${i}"></div>

    <h2>Machine Catalog <span class="mut" style="font-weight:400;text-transform:none">built in · ${(m.presets||[]).length} programs</span></h2>
    <table class="cards"><tr><th>Name</th><th>Steps</th><th>Duration</th></tr>${catRows||`<tr><td colspan=3 class="mut">${(m.presets||[]).length ? 'no match' : 'not reported - the machine needs firmware 1.0.145 or newer'}</td></tr>`}</table>

    <h2>Send Simulated Print</h2>
    <div class="row sendrow">
      <input id="job-${i}" placeholder="Job name (e.g. Job 2 - Penrose)" style="flex:2">
      <input id="printer-${i}" placeholder="Printer (e.g. TZ)" style="flex:1">
      <input id="nfc-${i}" placeholder="NFC tag (optional, e.g. E0:07:C0:E1:93:93:18:6D)" style="flex:1.4" autocomplete="off" spellcheck="false">
      <select id="mat-${i}">${programOptions(m)}</select>
      <button class="primary" data-send="${i}">Send to machine</button>
    </div>
    <p class="msg" id="msg-${i}"></p>

    <h2>Recent Prints On Machine</h2>
    <table class="cards"><tr><th>Job</th><th>Material</th><th>Printer</th><th>Status</th><th></th></tr>${printRows||'<tr><td colspan=5 class="mut">none</td></tr>'}</table>

    <h2>Cure Runs &amp; Reports</h2>
    <table class="cards"><tr><th>Program</th><th>Started</th><th>Duration</th><th>Status</th><th>Report</th></tr>${cureRows(m)||'<tr><td colspan=5 class="mut">none</td></tr>'}</table>
    ${removeMachineBlock(m, i)}
  </div>`;
}

// A machine whose name no key maps to any more (renamed or retired) cannot sync again: an admin may take its card off
// the portal, with the portal password (user, 2026-11-11). A machine that still has a key never shows this.
function removeMachineBlock(m, i) {
  if (!m.retired || !ME || !ME.canAdmin) return '';
  return `<h2>Remove this machine</h2>
    <p class="mut">${escH(m.name)} has no machine key any more, so it will not sync again. Removing it deletes its card, its cure reports and its alert history from sCure Cloud. DVT results are kept.</p>
    <div class="row sendrow">
      <input id="rmpw-${i}" type="password" placeholder="Portal password" autocomplete="current-password" style="flex:1">
      <button class="danger" data-rmmachine="${i}">Remove ${escH(m.name)}</button>
    </div>
    <p class="msg" id="rmmsg-${i}"></p>`;
}

// Cure runs the machine reported (last 10). A report can be opened / downloaded once the machine has uploaded it
// (sCure Cloud on Google keeps them; window.scureReportHref is defined by its page shim).
function cureRows(m) {
  const q = SEARCH.trim().toLowerCase();
  const have = new Set(m.reports || []);
  const dur = s => s == null ? '–' : `${Math.floor(s/60)}m ${Math.round(s%60)}s`;
  return (m.cures||[])
    .filter(c => !q || [c.materialName, c.status].some(v => (v||'').toLowerCase().includes(q)))
    .map(c => {
      const can = have.has(c.id) && typeof window.scureReportHref === 'function';
      const rep = can
        ? `<a href="${window.scureReportHref(m, c.id, false)}" target="_blank" rel="noopener">View</a>
           &nbsp;<a href="${window.scureReportHref(m, c.id, true)}" target="_blank" rel="noopener">Download</a>`
        : `<span class="mut">${c.status === 'running' ? 'after the run' : 'not uploaded yet'}</span>`;
      return `<tr><td>${c.materialName||''}</td><td data-l="Started">${(c.startedAt||'').replace('T',' ')}</td>
        <td data-l="Duration">${dur(c.duration)}</td><td data-l="Status">${c.status||''}</td><td class="act">${rep}</td></tr>`;
    }).join('');
}

// Per-process field rules — mirror the machine UI's step editor (StepModal):
//   Drying/Heating   temp 30-80°C, time 1-120 min
//   Cure/Bleacher    temp 30-80°C, time 1-120 (Bleaching 1-720), UV 10-100%,
//                    timer start + UV start modes
//   Cooling          target temp 30-75°C, cooling mode; no time
//   Nitrogen         no fields (auto purge)
const PROCESSES = ['Drying','Heating','Cure','Bleacher','Cooling','Nitrogen'];
const PROC_LABEL = {Cure:'Cure (405nm)', Bleacher:'Bleaching (450nm)'};
function stepRow(s, j) {
  const p = s.process;
  const uvish = p === 'Cure' || p === 'Bleacher';
  // a Cure / Bleaching step without a temperature is UV only: the heater stays off (the machine's "Heating" switch of the step)
  const uvOnly = uvish && (s.heat === false || (s.heat === undefined && s.temperature === null));
  const heatSel = uvish ? `<select class="sh" title="Heating"><option value="on" ${uvOnly ? '' : 'selected'}>Heating on</option><option value="off" ${uvOnly ? 'selected' : ''}>No heating (UV only)</option></select>` : '';
  const temp = p === 'Nitrogen' ? '<span class="mut">–</span>'
    : uvOnly ? heatSel
    : heatSel + `<input class="st" type="number" min="30" max="${p==='Cooling'?75:80}"
         value="${s.temperature ?? (p==='Cooling'?30:40)}" placeholder="°C">`;
  const time = (p === 'Cooling' || p === 'Nitrogen') ? '<span class="mut">–</span>'
    : `<input class="sm" type="number" min="1" max="${p==='Bleacher'?720:120}"
         value="${s.time ?? 10}" placeholder="min">`;
  const uv = uvish
    ? `<input class="su" type="number" min="10" max="100" value="${s.uvIntensity ?? 30}" placeholder="%">`
    : '<span class="mut">–</span>';
  const opts = p === 'Cooling'
    ? `<select class="sc">${['fast','medium','slow'].map(m =>
        `<option value="${m}" ${m===(s.coolingMode||'medium')?'selected':''}>${m[0].toUpperCase()+m.slice(1)} cooling</option>`).join('')}</select>`
    : uvOnly
    ? `<select class="sv" title="Ventilation">
         <option value="off" ${s.ventilation ? '' : 'selected'}>Ventilation: off</option>
         <option value="on" ${s.ventilation ? 'selected' : ''}>Ventilation: on (fresh air)</option>
       </select>`
    : uvish
    ? `<select class="stm" title="Timer start">
         <option value="on-target" ${((s.timerMode||'on-target')==='on-target')?'selected':''}>Timer: at temperature</option>
         <option value="on-ramp" ${s.timerMode==='on-ramp'?'selected':''}>Timer: on ramp start</option>
       </select>
       <select class="ssm" title="UV start" style="margin-top:.25rem">
         <option value="at-target" ${((s.uvStartMode||'at-target')==='at-target')?'selected':''}>UV: at temperature</option>
         <option value="at-start" ${s.uvStartMode==='at-start'?'selected':''}>UV: on ramp start</option>
       </select>`
    : p === 'Nitrogen' ? '<span class="mut">auto purge</span>'
    : '<span class="mut">–</span>';
  return `<tr>
    <td>${j+1}</td>
    <td><select class="sp">${PROCESSES.map(q =>
      `<option value="${q}" ${q===p?'selected':''}>${PROC_LABEL[q]||q}</option>`).join('')}</select></td>
    <td data-l="Temp °C">${temp}</td><td data-l="Time min">${time}</td><td data-l="UV %">${uv}</td><td data-l="Options">${opts}</td>
    <td class="act"><button class="danger sx">✕ Remove step</button></td></tr>`;
}

// Read a step row back into a step object (no validation — see stepErrors).
// Field lookups are null-safe: on a process switch the row still holds the
// PREVIOUS process's inputs, so the new process's fields may not exist yet.
function readRow(r, j) {
  const num = c => { const el = r.querySelector(c);
                     return el && el.value !== '' ? +el.value : null; };
  const sel = (c, d) => { const el = r.querySelector(c); return el ? el.value : d; };
  const p = r.querySelector('.sp').value;
  const st = { step: j+1, process: p, temperature: null, intensity: null, time: 0 };
  const uvOnly = (p === 'Cure' || p === 'Bleacher') && sel('.sh', 'on') === 'off';
  if (p !== 'Nitrogen' && !uvOnly) st.temperature = num('.st');          // UV only: no temperature at all, not a default one
  if (p !== 'Cooling' && p !== 'Nitrogen') st.time = num('.sm');
  if (p === 'Cooling') st.coolingMode = sel('.sc', 'medium');
  if (p === 'Cure' || p === 'Bleacher') {
    st.uvIntensity = num('.su');
    st.timerMode = sel('.stm', 'on-target');
    st.uvStartMode = sel('.ssm', 'at-target');
    st.heat = !uvOnly;                       // only for the editor (a row that was just switched); removed before saving
    if (uvOnly) st.ventilation = sel('.sv', 'off') === 'on';
  }
  return st;
}

// Same limits + sequence rules the machine UI enforces (MaterialContext).
function stepErrors(steps) {
  const errs = [];
  let n2 = 0, needsVent = false, lastTemp = null;
  steps.forEach((s, i) => {
    const n = i + 1, prev = i > 0 ? steps[i-1] : null;
    if (s.process !== 'Nitrogen') {
      const [tMin, tMax] = s.process === 'Cooling' ? [30, 75] : [30, 80];
      const uvOnlyStep = (s.process === 'Cure' || s.process === 'Bleacher') && s.temperature == null;      // UV only
      if (!uvOnlyStep && (s.temperature == null || s.temperature < tMin || s.temperature > tMax))
        errs.push(`Step ${n}: temperature must be ${tMin}-${tMax}°C`);
    }
    if (s.process !== 'Cooling' && s.process !== 'Nitrogen') {
      const tMax = s.process === 'Bleacher' ? 720 : 120;
      if (!s.time || s.time < 1 || s.time > tMax)
        errs.push(`Step ${n}: time must be 1-${tMax} min`);
    }
    if (s.process === 'Cure' || s.process === 'Bleacher') {
      if (s.uvIntensity == null || s.uvIntensity < 10 || s.uvIntensity > 100)
        errs.push(`Step ${n}: UV intensity must be 10-100% (LEDs stay dark below 10%)`);
    }
    if (s.process === 'Nitrogen' && ++n2 > 2)
      errs.push(`Step ${n}: a maximum of 2 nitrogen purge steps is allowed`);
    if (prev && prev.process === 'Nitrogen' &&
        s.process !== 'Cure' && s.process !== 'Bleacher')
      errs.push(`Step ${n}: after nitrogen, only Cure or Bleaching is allowed`);
    if (prev && (prev.process === 'Cure' || prev.process === 'Bleacher') &&
        i > 1 && steps[i-2].process === 'Nitrogen' && s.process !== 'Cooling')
      errs.push(`Step ${n}: only Cooling is allowed after the Cure/Bleaching step that follows the N₂ purge`);
    if (s.process === 'Nitrogen') needsVent = true;
    if (needsVent && s.process === 'Cooling') needsVent = false;
    if (s.process !== 'Cooling' && s.process !== 'Nitrogen' && s.temperature != null) {
      if (lastTemp !== null && s.temperature < lastTemp)
        errs.push(`Step ${n}: temperature (${s.temperature}°C) cannot be lower than the previous step (${lastTemp}°C) without a Cooling step`);
      lastTemp = s.temperature;
    }
    if (s.process === 'Cooling') {
      if (lastTemp !== null && s.temperature != null && s.temperature > lastTemp - 5)
        errs.push(`Step ${n}: cooling target (${s.temperature}°C) must be at least 5°C below the previous step (${lastTemp}°C)`);
      lastTemp = null;
    }
  });
  if (needsVent) errs.push('Nitrogen must be vented — add a Cooling step after the N₂ purge');
  if (steps.some(s => s.process === 'Nitrogen')) {
    let after = false, ok = false;
    for (const s of steps) {
      if (s.process === 'Nitrogen') after = true;
      if (after && (s.process === 'Cure' || s.process === 'Bleacher')) { ok = true; break; }
    }
    if (!ok) errs.push('Add a Cure or Bleaching step after the N₂ purge');
  }
  return errs;
}

function openEditor(i, prog) {
  editing = true;
  const el = $('#editor-' + i);
  const steps = prog ? JSON.parse(JSON.stringify(prog.steps||[])) : [{process:'Drying',temperature:45,time:10}];
  el.dataset.progId = prog ? prog.id : '';
  el.innerHTML = `<div class="card" style="background:var(--inset)">
    <div class="row"><input id="pname-${i}" placeholder="Program name" value="${prog?prog.name:''}" style="flex:1"></div>
    <table class="steps cards" id="ptable-${i}" style="margin:.6rem 0">
      <tr><th>#</th><th>Process</th><th>Temp °C</th><th>Time min</th><th>UV %</th><th>Options</th><th></th></tr>
      ${steps.map(stepRow).join('')}
    </table>
    <div class="row">
      <button id="padd-${i}">+ Step</button>
      <button class="primary" id="psave-${i}">Save to machine</button>
      <button id="pcancel-${i}">Cancel</button>
      <span class="msg" id="pmsg-${i}"></span>
    </div></div>`;
  $('#padd-'+i).onclick = () => {
    $('#ptable-'+i).insertAdjacentHTML('beforeend',
      stepRow({process:'Cure'}, $('#ptable-'+i).rows.length-1));
    wireStepRows(i);
  };
  $('#pcancel-'+i).onclick = () => { el.innerHTML=''; editing = false; };
  $('#psave-'+i).onclick = () => saveProgram(i, prog);
  wireStepRows(i);
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  $('#pname-'+i).focus();
}
function wireStepRows(i) {
  const rows = [...document.querySelectorAll(`#ptable-${i} tr`)].slice(1);
  rows.forEach(r => {
    r.querySelector('.sx').onclick = () => {
      r.remove();
      renumberSteps(i);
    };
    // Switching the process swaps the row to that process's field set,
    // carrying the temperature over like the machine UI does.
    const sh = r.querySelector('.sh');
    if (sh) sh.onchange = () => {
      const j = r.rowIndex - 1;
      const cur = readRow(r, j);
      cur.heat = sh.value === 'on';
      if (cur.heat && cur.temperature == null) cur.temperature = 40;
      r.outerHTML = stepRow(cur, j);
      wireStepRows(i);
    };
    r.querySelector('.sp').onchange = e => {
      const j = r.rowIndex - 1;   // header row is 0
      const cur = readRow(r, j);
      cur.process = e.target.value;
      if (cur.process !== 'Cooling' && cur.process !== 'Nitrogen' && !cur.time) cur.time = 10;
      r.outerHTML = stepRow(cur, j);
      wireStepRows(i);
    };
  });
}
function renumberSteps(i) {
  [...document.querySelectorAll(`#ptable-${i} tr`)].slice(1)
    .forEach((r, j) => { r.cells[0].textContent = j + 1; });
}

async function saveProgram(i, prog) {
  const name = $('#pname-'+i).value.trim();
  if (!name) { $('#pmsg-'+i).textContent = 'Name required'; return; }
  const rows = [...document.querySelectorAll(`#ptable-${i} tr`)].slice(1);
  if (!rows.length) { $('#pmsg-'+i).textContent = 'Add at least one step'; return; }
  const steps = rows.map(readRow).map(s => { delete s.heat; return s; });
  const errs = stepErrors(steps);
  const msg = $('#pmsg-'+i);
  if (errs.length) {
    msg.classList.add('err');
    msg.innerHTML = errs.slice(0, 4).join('<br>') +
      (errs.length > 4 ? `<br>…and ${errs.length - 4} more` : '');
    return;
  }
  msg.classList.remove('err');
  const total = steps.reduce((a, s) => a + (s.time||0), 0);
  const payload = { id: prog ? prog.id : 'cloud-' + Date.now(), name, steps,
                    totalDuration: total, createdAt: new Date().toISOString(), isPreset: false };
  await api(`/api/machines/${MACHINES[i].name}/commands`,
            {method:'POST', body: JSON.stringify({type:'upsert_program', payload})});
  $('#pmsg-'+i).textContent = 'Saved — the machine applies it on its next sync (≤10 s)';
  setTimeout(() => { const el = $('#editor-'+i); if (el) el.innerHTML = '';
                     editing = false; load(true); }, 1600);
}

function wireCard(m, i) {
  [...document.querySelectorAll(`[data-edit^="${i}:"]`)].forEach(b => b.onclick = () => {
    const id = b.dataset.edit.split(':').slice(1).join(':');
    openEditor(i, (m.programs||[]).find(p => String(p.id) === id));
  });
  [...document.querySelectorAll(`[data-del^="${i}:"]`)].forEach(b => b.onclick = async () => {
    const id = b.dataset.del.split(':').slice(1).join(':');
    await api(`/api/machines/${m.name}/commands`,
              {method:'POST', body: JSON.stringify({type:'delete_program', payload:{id}})});
    load();
  });
  // a print in Recent Prints, removed on the machine at its next sync (firmware 1.0.147+); its cure runs stay
  [...document.querySelectorAll(`[data-delprint^="${i}:"]`)].forEach(b => b.onclick = async () => {
    const id = b.dataset.delprint.split(':').slice(1).join(':');
    const p = (m.prints||[]).find(x => String(x.id) === id);
    if (!confirm(`Delete print "${(p && p.printName) || id}" from ${m.name}?`)) return;
    await api(`/api/machines/${m.name}/commands`,
              {method:'POST', body: JSON.stringify({type:'delete_print', payload:{id}})});
    load();
  });
  const rm = document.querySelector(`[data-rmmachine="${i}"]`);
  if (rm) rm.onclick = async () => {
    const pw = $('#rmpw-'+i).value;
    if (!pw) { $('#rmmsg-'+i).textContent = 'Type the portal password first'; return; }
    if (!confirm(`Remove ${m.name} from sCure Cloud? Its card, cure reports and alert history are deleted and cannot be brought back.`)) return;
    rm.disabled = true;
    $('#rmmsg-'+i).textContent = 'Removing…';
    let r;
    try { r = await api('/api/machines/remove', { method: 'POST', body: JSON.stringify({ name: m.name, password: pw }) }); }
    catch (e) { r = { ok: false, message: (e && e.message) || 'Not removed' }; }
    if (r && r.ok) { load(true); return; }
    rm.disabled = false;
    $('#rmpw-'+i).value = '';
    $('#rmmsg-'+i).textContent = (r && r.message) || 'Not removed';
  };
  const nb = document.querySelector(`[data-new="${i}"]`);
  if (nb) nb.onclick = () => openEditor(i, null);
  const sb = document.querySelector(`[data-send="${i}"]`);
  if (sb) sb.onclick = async () => {
    // an NFC tag makes the machine ask "Start this job?" when that tag is presented to its reader (firmware 1.0.146+)
    const tagText = $('#nfc-'+i).value.trim();
    const tag = nfcTagOf(tagText);
    if (tagText && !tag) { $('#msg-'+i).textContent = 'That is not an NFC tag number - use hex digits, e.g. E0:07:C0:E1:93:93:18:6D'; return; }
    const payload = {
      printName: $('#job-'+i).value || 'Job',
      printerName: $('#printer-'+i).value || 'CLOUD',
      materialName: $('#mat-'+i).value,
    };
    if (tag) payload.nfcTag = tag;
    await api(`/api/machines/${m.name}/commands`,
              {method:'POST', body: JSON.stringify({type:'send_print', payload})});
    $('#job-'+i).value = '';
    $('#printer-'+i).value = '';
    $('#nfc-'+i).value = '';
    $('#msg-'+i).textContent = tag ? `Print sent — present tag ${tag} to the machine to start it`
                                   : 'Print sent — it appears on the machine within ~10 s';
  };
}

// While the DVT tab is open the page holds a request to the server that answers the moment anything on the tab changed (a
// runner update, a queued request, a new result): the change shows within a second or two, not at the next timer tick.
let DVT_VER = '';
let LONGPOLL_ON = false;
async function dvtLongPoll() {
  if (LONGPOLL_ON) return;
  LONGPOLL_ON = true;
  try {
    while (VIEW === 'dvt') {
      try {
        const r = await api('/api/dvt/wait?since=' + encodeURIComponent(DVT_VER) + '&wait=15');
        if (VIEW !== 'dvt') break;
        if (String(r.ver) !== DVT_VER) { DVT_VER = String(r.ver); await loadDvt(); }
      } catch { await new Promise(res => setTimeout(res, 3000)); }   // not signed in / offline: try again shortly
    }
  } finally { LONGPOLL_ON = false; }
}

// How often the page looks again: 10 s normally; on the DVT tab 4 s, and 2 s while a requested test is queued / waiting /
// running (the machine's runner then polls every 1.5 s too, so Run, Cancel and answers go through in a couple of seconds).
let LAST_FULL = Date.now();
const dvtActive = () => !!(DVT && (DVT.requests || []).some(r => DVT_ACTIVE_ST.includes(r.status)));
async function refreshLoop() {
  try {
    if (VIEW === 'dvt' && Date.now() - LAST_FULL < 9000) await loadDvt();   // the DVT data alone; everything else every 10 s
    else { LAST_FULL = Date.now(); await load(); }
  } catch { /* the next round tries again */ }
  setTimeout(refreshLoop, VIEW === 'dvt' ? 8000 : 10000);   // on the DVT tab the long poll does the quick work; this is the safety net
}
load();
setTimeout(refreshLoop, 4000);
if (VIEW === 'dvt') dvtLongPoll();
</script></body></html>
