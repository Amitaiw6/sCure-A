<!DOCTYPE html>
<html lang="en"><head>
<script>
/* Apps Script shim: the page's three server calls -> google.script.run (see Code.gs). */
(function () {
  var KEY = 'scure-cloud-token', mem = '';
  function tok() { try { return sessionStorage.getItem(KEY) || mem; } catch (e) { return mem; } }
  function setTok(t) { mem = t; try { sessionStorage.setItem(KEY, t); } catch (e) {} }
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (res, rej) {
      var r = google.script.run.withSuccessHandler(res).withFailureHandler(rej);
      r[fn].apply(r, args);
    });
  }
  // report links: GET <web app>?report=<run id>&m=<machine>&t=<session>[&dl=1] (served by doGet in Code.gs)
  window.scureReportHref = function (m, runId, download) {
    if (!m.reportUrl) return '#';
    return m.reportUrl + '?report=' + encodeURIComponent(runId) + '&m=' + encodeURIComponent(m.name) +
           '&t=' + encodeURIComponent(tok()) + (download ? '&dl=1' : '');
  };
  // raw DVT measurement files: GET <web app>?dvtfile=<Drive id>&t=<session> (served by doGet in Code.gs)
  window.scureDvtFileHref = function (fileUrl, id) {
    if (!fileUrl) return '#';
    return fileUrl + '?dvtfile=' + encodeURIComponent(id) + '&t=' + encodeURIComponent(tok());
  };
  function reply(status, obj) {
    /* signed in, but the role does not allow it (Code.gs need_) */
    if (obj && obj.denied) status = 403;
    return { status: status, ok: status < 400, json: function () { return Promise.resolve(obj); } };
  }
  window.fetch = async function (path, opts) {
    opts = opts || {};
    var body = {};
    try { body = opts.body ? JSON.parse(opts.body) : {}; } catch (e) { body = {}; }
    if (path === '/login') {
      var r = await call('portalLogin', body.password || '');
      if (r && r.ok) { setTok(r.token); return reply(200, { ok: true }); }
      return reply(401, { ok: false, message: (r && r.message) || 'Wrong password' });
    }
    // Google sign-in: mode -> start (a link to Google + a state) -> poll(state) until Google sent the person back
    if (path === '/login/mode') {
      try { return reply(200, await call('portalLoginMode')); } catch (e) { return reply(200, { google: false }); }
    }
    if (path === '/login/google') return reply(200, await call('portalLoginStart'));
    if (path === '/login/poll') {
      var lp = await call('portalLoginPoll', body.state || '');
      if (lp && lp.ok && lp.token) { setTok(lp.token); return reply(200, { ok: true }); }
      return reply(200, lp || { ok: false });
    }
    if (path === '/logout') {
      try { await call('portalLogout', tok()); } catch (e) {}
      setTok('');
      return reply(200, { ok: true });
    }
    if (path === '/api/me') {
      var me = await call('portalMe', tok());
      return me === null ? reply(401, { ok: false }) : reply(200, me);
    }
    if (path === '/api/users' || path === '/api/users/save' || path === '/api/users/remove' || path === '/api/audit') {
      var uo2 = path === '/api/users' ? await call('portalUsers', tok())
              : path === '/api/users/save' ? await call('portalUserSave', tok(), body.email || '', body.role || '', body.name || '')
              : path === '/api/users/remove' ? await call('portalUserRemove', tok(), body.email || '')
              : await call('portalAudit', tok(), 100);
      return uo2 === null ? reply(401, { ok: false }) : reply(uo2.ok ? 200 : 400, uo2);
    }
    if (path === '/api/machines/remove') {
      var mr = await call('portalMachineRemove', tok(), body.name || '', body.password || '');
      return mr === null ? reply(401, { ok: false }) : reply(mr.ok ? 200 : 400, mr);
    }
    if (path === '/api/machines') {
      var list = await call('portalMachines', tok());
      return list === null ? reply(401, { ok: false }) : reply(200, list);
    }
    var a = /^\/api\/alerts(?:\?since=(\d+))?$/.exec(path);
    if (a) {
      var errs = await call('portalAlerts', tok(), Number(a[1] || 0));
      return errs === null ? reply(401, { ok: false }) : reply(200, errs);
    }
    if (path === '/api/dvt') {
      var dvt = await call('portalDvt', tok());
      return dvt === null ? reply(401, { ok: false }) : reply(200, dvt);
    }
    var w = /^\/api\/dvt\/wait\?since=([^&]*)&wait=(\d+)$/.exec(path);
    if (w) {
      var ch = await call('portalDvtWait', tok(), decodeURIComponent(w[1]), Number(w[2]));
      return ch === null ? reply(401, { ok: false }) : reply(200, ch);
    }
    if (path === '/api/dvt/detail') {
      var det = await call('portalDvtDetail', tok());
      return det === null ? reply(401, { ok: false }) : reply(200, det);
    }
    if (path === '/api/dvt/race') {
      var ro = await call('portalRaceSet', tok(), body);
      return ro === null ? reply(401, { ok: false }) : reply(ro.ok ? 200 : 400, ro);
    }
    if (path === '/api/dvt/files') {
      var fo = await call('portalDvtFiles', tok(), body.ids || []);
      return fo === null ? reply(401, { ok: false }) : reply(fo.ok ? 200 : 400, fo);
    }
    if (path === '/api/dvt/unit') {
      var uo = await call('portalDvtUnitSave', tok(), body.unit, body.fields || {});
      return uo === null ? reply(401, { ok: false }) : reply(uo.ok ? 200 : 400, uo);
    }
    if (path === '/api/dvt/approve') {
      var ap = await call('portalDvtApprove', tok(), body.unit, body.testId, body.runIds || [], body.who || '', body.approve !== false);
      return ap === null ? reply(401, { ok: false }) : reply(ap.ok ? 200 : 400, ap);
    }
    // DVT runs requested from the site (confirmed at the CureBox before anything runs)
    if (path === '/api/dvt/request' || path === '/api/dvt/cancel' || path === '/api/dvt/answer' || path === '/api/dvt/acted') {
      var out = path === '/api/dvt/request' ? await call('portalDvtRequest', tok(), body.machine, body.unit, body.testIds || [])
              : path === '/api/dvt/cancel' ? await call('portalDvtCancel', tok(), body.ids || body.id, body.force === true)
              : path === '/api/dvt/acted' ? await call('portalDvtActed', tok(), body.id)
              : await call('portalDvtAnswer', tok(), body.id, body.value === undefined ? null : body.value);
      return out === null ? reply(401, { ok: false }) : reply(out.ok ? 200 : 400, out);
    }
    var m = /^\/api\/machines\/([^/]+)\/commands$/.exec(path);
    if (m) {
      var c = await call('portalCommand', tok(), decodeURIComponent(m[1]), body);
      return c === null ? reply(401, { ok: false }) : reply(c.ok ? 200 : 400, c);
    }
    return reply(404, { ok: false, message: 'not found' });
  };
})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sCure Cloud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Calm and neutral, so the status colours (green / red / amber) stand out; one cobalt accent for "do this" and for progress.
     Change the look here first: a literal colour in a rule is a smell. (skill: .claude/skills/scure-cloud-ux) */
  :root { --bg:#f5f6f8; --panel:#ffffff; --line:#e3e6eb; --line2:#cfd4dc; --text:#14181f;
          --mut:#5b6472; --acc:#2457d6; --on-acc:#ffffff; --acc2:#2457d6; --ok:#15803d; --err:#c62828; --warn:#b45309;
          --field:#ffffff; --inset:#f0f2f5; color-scheme:light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e1116; --panel:#171b22; --line:#262d37; --line2:#38414d; --text:#e8ecf1;
            --mut:#9aa5b4; --acc:#7da2ff; --on-acc:#0b1220; --acc2:#7da2ff; --ok:#4ade80; --err:#f87171; --warn:#fbbf24;
            --field:#11151b; --inset:#1b2129; color-scheme:dark; }
    header .logo { filter:invert(1) hue-rotate(180deg); }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.5 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; -webkit-font-smoothing:antialiased; }
  header { display:flex; align-items:center; gap:.8rem; padding:.8rem 1.4rem; background:var(--panel);
           border-bottom:1px solid var(--line); }
  header h1 { font-size:1.1rem; margin:0; font-weight:650; }
  header .logo { height:42px; display:block; }
  main { max-width:1060px; margin:0 auto; padding:1.2rem 1.4rem 3rem; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px;
          padding:1.1rem 1.3rem; margin-bottom:1rem; box-shadow:0 1px 2px rgba(16,24,40,.04); }
  h2 { font-size:1.1rem; font-weight:650; color:var(--text); margin:0 0 .8rem; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th, td { text-align:left; padding:.45rem .6rem; border-bottom:1px solid var(--line); }
  th { color:var(--mut); font-weight:600; font-size:.82rem; }
  input, select, button, textarea { background:var(--field); color:var(--text);
    border:1px solid var(--line2); border-radius:8px; padding:.45rem .75rem; font:inherit; }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--acc); }
  button { cursor:pointer; }
  button.primary { background:var(--acc); border-color:var(--acc); color:var(--on-acc); font-weight:600; }
  button.danger { color:var(--err); }
  /* sign-in, who is signed in, People (2026-10-30) */
  a.btn { display:inline-flex; align-items:center; justify-content:center; min-height:46px; padding:.45rem 1.2rem; border-radius:8px;
          text-decoration:none; font-weight:600; border:1px solid var(--acc); }
  a.btn.primary { background:var(--acc); color:var(--on-acc); }
  .login-g { max-width:30rem; margin:2rem auto; }
  #who { display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; justify-content:flex-end; }
  #who .who-name { max-width:14rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text); }
  #who .who-role { background:var(--inset); color:var(--mut); }
  #who button { min-height:44px; }
  .people-help { margin:.2rem 0 .9rem; padding-left:1.2rem; }
  .people-add { gap:.5rem; flex-wrap:wrap; }
  #flash { position:fixed; left:50%; bottom:1.2rem; transform:translateX(-50%); max-width:min(34rem, calc(100% - 2rem)); z-index:50;
           background:var(--text); color:var(--bg); padding:.7rem 1rem; border-radius:10px; opacity:0; pointer-events:none; transition:opacity .2s; }
  #flash.on { opacity:1; }
  @media (max-width: 640px) { #flash { bottom:5.5rem; } #who .who-name { max-width:8rem; } }
  .row { display:flex; gap:.6rem; flex-wrap:wrap; align-items:center; }
  /* the Machine | DVT tabs under the CureBox chips */
  .subtab { border:none; border-bottom:2px solid transparent; border-radius:0; background:none; padding:.55rem 1rem; color:var(--mut); }
  .subtab.active { border-bottom-color:var(--acc); color:var(--text); font-weight:600; }
  /* DVT catalog view: counters, progress, phases with their tests (same layout as the DVT tool) */
  .dvt-sum { display:grid; grid-template-columns:repeat(5, 1fr); gap:.6rem; margin:.4rem 0 .6rem; }
  #app select { max-width:100%; }   /* a long option (a test title) must not widen the page on a phone */
  #app label.mut { max-width:100%; }
  .race-card { display:flex; gap:.9rem; align-items:center; border:1px solid var(--line); border-radius:10px; padding:.7rem .9rem; margin-bottom:.6rem; cursor:pointer; }
  .race-card.champ { border-color:#d4a017; box-shadow:0 0 0 2px rgba(212,160,23,.25); }
  .race-rank { font-size:1.7rem; width:2.2rem; text-align:center; flex:none; }
  .race-main { flex:1 1 auto; min-width:0; }
  .race-time { flex:none; text-align:right; }
  .race-clock { font-size:1.15rem; font-weight:700; font-variant-numeric:tabular-nums; }
  .race-win { padding:.8rem 1rem; margin-bottom:.8rem; border-radius:10px; background:rgba(212,160,23,.14); border:1px solid #d4a017; font-size:1.05rem; }
  .race-lead { padding:.5rem .8rem; margin-bottom:.8rem; border-radius:8px; background:var(--inset); }
  /* sections: a bar that stays in reach; on a phone it moves to the bottom, where the thumb is */
  .sections { position:sticky; top:0; z-index:10; background:var(--bg); }
  .subtab .ic { margin-right:.4rem; display:inline-flex; }
  .subtab .ic svg { width:18px; height:18px; }
  .subtab .lb { white-space:nowrap; }
  :focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
  button:hover:not(:disabled) { border-color:var(--line2); background:var(--inset); }
  button.primary:hover:not(:disabled) { background:var(--acc); filter:brightness(1.08); border-color:var(--acc); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  /* "what now": the one thing the person should know / do on the Overview */
  .now { display:flex; gap:.8rem 1rem; align-items:center; flex-wrap:wrap; padding:.9rem 1.1rem; border-radius:12px; margin-bottom:1rem; border:1px solid var(--line); background:var(--panel); }
  .now .t { flex:1 1 16rem; font-size:1.05rem; font-weight:600; }
  .now .s { display:block; font-weight:400; font-size:.88rem; color:var(--mut); margin-top:.1rem; }
  .now.bad { border-color:var(--err); background:color-mix(in srgb, var(--err) 8%, var(--panel)); }
  .now.warn { border-color:var(--warn); background:color-mix(in srgb, var(--warn) 9%, var(--panel)); }
  .now.good { border-color:var(--ok); background:color-mix(in srgb, var(--ok) 8%, var(--panel)); }
  details.more > summary::before { content:'▸'; margin-right:.5rem; }
  details.more[open] > summary::before { content:'▾'; }
  details.more > summary { cursor:pointer; color:var(--mut); padding:.4rem 0; min-height:44px; display:flex; align-items:center; }
  .dvt-tile { border:1px solid var(--line); border-radius:10px; padding:.7rem; text-align:center; }
  .dvt-tile .num { font-size:1.7rem; font-weight:700; }
  .dvt-bar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-bottom:1rem; }
  .dvt-bar > div { height:100%; background:var(--ok); }
  .dvt-phase { border:1px solid var(--line); border-radius:10px; margin-bottom:.7rem; overflow:hidden; }
  .dvt-ph-head { display:flex; align-items:center; gap:.8rem; padding:.75rem 1rem; cursor:pointer; background:var(--inset); flex-wrap:wrap; }
  .dvt-ph-head .ph-id { width:1.2rem; }
  .dvt-test { display:flex; align-items:center; gap:.6rem; padding:.55rem 1rem; border-top:1px solid var(--line); cursor:pointer; flex-wrap:wrap; }
  .dvt-test .tid { font-family:ui-monospace,Consolas,monospace; font-size:.85rem; }
  .dvt-ic { width:1.5rem; height:1.5rem; border-radius:50%; border:1px solid var(--line); display:inline-flex; align-items:center; justify-content:center; font-size:.8rem; color:var(--mut); }
  .dvt-ic.on { color:var(--ok); border-color:var(--ok); } .dvt-ic.off { color:var(--err); border-color:var(--err); } .dvt-ic.warn { color:#d97706; border-color:#d97706; }
  .dvt-runs { padding:.2rem 1rem .8rem 3.1rem; border-top:1px solid var(--line); }
  .badge { font-size:.72rem; padding:.05rem .45rem; border-radius:999px; border:1px solid var(--line); color:var(--mut); }
  .badge.safety { color:var(--err); border-color:rgba(220,38,38,.4); }
  .ok-t { color:var(--ok); } .err-t { color:var(--err); } .warn-t { color:#d97706; }
  .pill.warn { background:rgba(217,119,6,.12); color:#d97706; }
  .dvt-runpanel { border:1px solid var(--line); border-radius:10px; padding:.8rem 1rem; margin-bottom:1rem; }
  .dvt-prompt { margin-top:.4rem; padding:.5rem .7rem; border-left:3px solid #d97706; background:rgba(217,119,6,.06); color:var(--text); }
  .run-btn { padding:.15rem .6rem; font-size:.8rem; }
  /* what a test is for, what it needs and the steps - laid out like the DVT tool */
  .dvt-detail { padding:.4rem 0 .6rem; }
  .dvt-detail h4 { margin:.9rem 0 .35rem; font-size:.78rem; letter-spacing:.06em; text-transform:uppercase; color:var(--mut); }
  .dvt-detail p { margin:.2rem 0; line-height:1.5; }
  .dvt-detail ul { margin:.2rem 0; padding-left:1.2rem; } .dvt-detail li { margin:.15rem 0; line-height:1.45; }
  .dvt-cols { display:grid; grid-template-columns:1fr 1fr; gap:0 1.5rem; } @media (max-width:760px) { .dvt-cols { grid-template-columns:1fr; } }
  .dvt-safety { border-left:3px solid var(--err); background:rgba(220,38,38,.05); padding:.3rem .8rem .4rem; border-radius:0 8px 8px 0; margin-top:.6rem; }
  .dvt-steps { list-style:none; margin:.4rem 0; padding:0; counter-reset:dvtstep; }
  .dvt-steps li { position:relative; margin:.4rem 0; padding:.55rem .8rem .55rem 2.3rem; border:1px solid var(--line); border-radius:8px; line-height:1.5; counter-increment:dvtstep; }
  .dvt-steps li::before { content:counter(dvtstep) '.'; position:absolute; left:.8rem; font-weight:700; color:#dc2626; }
  .dvt-auto { border:1px solid rgba(37,99,235,.35); border-radius:10px; padding:.7rem .9rem; margin:.4rem 0 .6rem; background:rgba(37,99,235,.04); }
  .dvt-auto .note { color:#2563eb; font-size:.9rem; line-height:1.5; margin:0 0 .5rem; }
  .dvt-chk { display:flex; align-items:baseline; gap:.6rem; padding:.18rem 0; font-size:.92rem; flex-wrap:wrap; }
  .dvt-chk .dot { width:.8rem; height:.8rem; border-radius:50%; background:#9ca3af; flex:none; align-self:center; }
  .dvt-chk.ok .dot { background:#16a34a; } .dvt-chk.bad .dot { background:#dc2626; } .dvt-chk.warn .dot { background:#d97706; }
  /* the guide window that opens on Run: how the test goes, then Queue / Cancel */
  .dvt-modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; z-index:50; padding:1rem; }
  .dvt-modal { background:var(--panel); color:var(--text); border-radius:12px; width:min(760px, 100%); max-height:90vh; display:flex; flex-direction:column; box-shadow:0 10px 40px rgba(0,0,0,.3); }
  .dvt-modal-head { padding:1rem 1.2rem .6rem; border-bottom:1px solid var(--line); }
  .dvt-modal-head h3 { margin:0; font-size:1.1rem; } .dvt-modal-head .tid { font-family:ui-monospace,Consolas,monospace; margin-right:.5rem; }
  .dvt-modal-body { padding:0 1.2rem; overflow-y:auto; }
  .dvt-modal-run { padding:.7rem 1.2rem; border-bottom:1px solid var(--line); background:var(--inset); display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; }
  .dvt-modal-run:empty { display:none; }
  .dvt-modal-run { flex-direction:column; flex-wrap:nowrap; align-items:stretch; max-height:45vh; overflow-y:auto; flex:none; }
  .dvt-now { border-left:4px solid #2563eb; background:#fff; border-radius:0 8px 8px 0; padding:.5rem .8rem; line-height:1.5; }
  .dvt-now b.lbl { display:block; font-size:.74rem; letter-spacing:.06em; text-transform:uppercase; color:var(--mut); }
  /* the step the person has to do now: it has to be readable across the bench, not a grey line */
  .dvt-now.act { border-left-color:#f59e0b; background:#fffbeb; }
  .dvt-act { display:flex; gap:.7rem; align-items:baseline; flex-wrap:wrap; margin:.1rem 0 .2rem; }
  .dvt-act .txt { font-size:1.45rem; font-weight:800; line-height:1.25; color:#92400e; }
  .dvt-act .sec { font-family:ui-monospace,Consolas,monospace; font-size:1.05rem; font-weight:700; color:#b45309;
                  border:1px solid #fcd34d; border-radius:999px; padding:.05rem .55rem; white-space:nowrap; }
  .dvt-act .stage { font-size:.8rem; color:var(--mut); }
  .dvt-steps { margin:.35rem 0 0; padding-left:1.1rem; font-size:.86rem; color:var(--mut); }
  .dvt-steps li.now { color:var(--ink); font-weight:700; }
  .dvt-steps li.done { text-decoration:line-through; }
  .dvt-did { background:#b45309; color:#fff; border:0; border-radius:10px; font-size:1rem; font-weight:800;
             padding:.7rem 1.4rem; min-height:48px; cursor:pointer; }
  .dvt-did:disabled { opacity:.6; cursor:default; }
  .dvt-sys { display:flex; gap:.4rem; flex-wrap:wrap; align-items:center; font-size:.86rem; }
  .dvt-sys .lbl { font-size:.74rem; letter-spacing:.06em; text-transform:uppercase; color:var(--mut); margin-right:.2rem; }
  .dvt-log { margin:0; padding:0; list-style:none; font-size:.84rem; }
  .dvt-log li { display:flex; gap:.6rem; padding:.15rem 0; border-top:1px dashed var(--line); }
  .dvt-log .t { color:var(--mut); font-family:ui-monospace,Consolas,monospace; white-space:nowrap; }
  .dvt-modal-foot { padding:.8rem 1.2rem; border-top:1px solid var(--line); display:flex; gap:.6rem; justify-content:flex-end; align-items:center; flex-wrap:wrap; }
  .dvt-sim { border:1px dashed #a855f7; border-radius:10px; padding:.6rem .9rem .8rem; margin:1rem 0; background:rgba(168,85,247,.04); }
  .dvt-sim h4 { color:#7e22ce !important; margin-top:.2rem !important; }
  .dvt-sim table { width:100%; border-collapse:collapse; font-size:.88rem; margin-top:.5rem; }
  .dvt-sim td, .dvt-sim th { padding:.3rem .4rem; border-top:1px solid var(--line); text-align:left; vertical-align:top; }
  .dvt-sim code { font-size:.82rem; } .dvt-sim .ok { color:#16a34a; font-weight:700; } .dvt-sim .bad { color:#dc2626; font-weight:700; }
  .dvt-sim-verdict { margin-top:.6rem; padding:.5rem .8rem; border-radius:8px; font-weight:700; }
  .dvt-sim-verdict.ok { background:rgba(22,163,74,.1); color:#15803d; } .dvt-sim-verdict.bad { background:rgba(220,38,38,.08); color:#b91c1c; }
  .dvt-steps li.sim-on { border-color:#a855f7; background:rgba(168,85,247,.08); }
  .dvt-steps li.sim-done::after { content:'✓'; position:absolute; right:.8rem; color:#16a34a; font-weight:700; }
  .dvt-chk .lab { min-width:21rem; } .dvt-chk .val { color:var(--mut); } .dvt-chk.bad .val { color:#dc2626; } .dvt-chk.ok .val { color:var(--text); }
  @media (max-width:760px) { .dvt-chk .lab { min-width:0; flex:1 1 100%; } }
  .dvt-crit { border:1px solid var(--line); border-radius:8px; padding:.5rem .8rem .7rem; margin:.7rem 0; }
  .dvt-crit h4 { margin-top:.2rem; } .dvt-crit code { display:block; overflow-wrap:anywhere; background:var(--inset); padding:.4rem .6rem; border-radius:6px; font-size:.85rem; }
  .dep { font-family:ui-monospace,Consolas,monospace; font-size:.85rem; margin-right:.9rem; } .dep.ok { color:var(--ok); } .dep.open { color:var(--mut); }
  a.vid { margin-left:.4rem; font-size:.78rem; font-weight:600; color:#2563eb; text-decoration:none; white-space:nowrap; }
  .pill { display:inline-block; padding:.1rem .55rem; border-radius:999px; font-size:.78rem; }
  .pill.on { background:rgba(22,163,74,.12); color:var(--ok); }
  .pill.bad { background:rgba(220,38,38,.12); color:var(--err); }
  .dvt-runpanel .lbl { font-size:.74rem; letter-spacing:.06em; text-transform:uppercase; color:var(--mut); margin-right:.2rem; }
  .pill.off { background:rgba(220,38,38,.10); color:var(--err); }
  .stat { display:inline-flex; flex-direction:column; margin-right:1.6rem; }
  .stat b { font-size:1.25rem; }
  .stat span { color:var(--mut); font-size:.78rem; }
  #login { max-width:340px; margin:16vh auto; }
  .steps th, .steps td { padding:.3rem .4rem; }
  .steps input, .steps select { width:100%; padding:.3rem .4rem; }
  .msg { color:var(--ok); font-size:.85rem; }
  .msg.err { color:var(--err); }
  .mut { color:var(--mut); }
  /* ---- phone layout (user, 2026-10-23: "add a phone version"): one thumb-friendly column, the sections scroll sideways in one line,
     the numbers sit three to a row, the unit table becomes one card per unit and the first column of a comparison stays in view ---- */
  @media (max-width:640px) {
    /* the sections become a bottom bar: icon over a short label, six equal thumb targets */
    .sections { position:fixed; top:auto; bottom:0; left:0; right:0; z-index:20; margin:0 !important; background:var(--panel);
                border-top:1px solid var(--line); border-bottom:none !important; padding-bottom:env(safe-area-inset-bottom, 0px); }
    .sections { box-shadow:0 -6px 16px rgba(16,24,40,.08); padding-bottom:max(env(safe-area-inset-bottom, 0px), 10px); }
    .sections .subtab { flex:1 1 0; min-width:0; min-height:56px; padding:.3rem .1rem .25rem; display:flex; flex-direction:column; align-items:center; justify-content:center;
                        gap:.1rem; font-size:.75rem; line-height:1.1; border:none; color:var(--mut); }
    .sections .subtab.active { color:var(--acc); }
    .subtab .ic { margin:0; padding:.15rem .75rem; border-radius:999px; }
    .subtab .ic svg { width:22px; height:22px; stroke-width:2; }
    .sections .subtab.active .ic { background:color-mix(in srgb, var(--acc) 15%, transparent); }   /* the section you are in: a pill behind its icon */
    main { padding-bottom:5.5rem; }
    html { scroll-padding-bottom:6rem; }   /* a field scrolled into view stays clear of the bottom bar */
    .now { padding:.8rem .9rem; }
    .now button { width:100%; min-height:48px; }
    header { padding:.5rem .9rem; gap:.6rem; }
    header .logo { height:30px; }
    header h1 { font-size:.95rem; }
    main { padding:.7rem .6rem 2.5rem; }
    .card { padding:.75rem .8rem; border-radius:9px; margin-bottom:.7rem; }
    h2 { font-size:.82rem; line-height:1.35; }
    input, select, button { min-height:44px; font-size:16px; }   /* 16 px: a phone browser does not zoom into the field */
    .sections { flex-wrap:nowrap !important; }
    .dvt-tiles { grid-template-columns:repeat(3, 1fr) !important; gap:.4rem !important; }
    .dvt-tiles.ov-main { grid-template-columns:repeat(2, 1fr) !important; }   /* the four figures that matter, two by two */
    .dvt-tile { padding:.4rem .2rem; }
    .dvt-tile .num { font-size:1.3rem; }
    .dvt-tile .mut { font-size:.68rem; line-height:1.2; }
    table.ov-units tr:first-child { display:none; }
    table.ov-units, .ov-units tbody, .ov-units tr, .ov-units td { display:block; width:100%; }
    .ov-units tr { border:1px solid var(--line); border-radius:9px; padding:.45rem .7rem; margin-bottom:.6rem; }
    .ov-units td { border:0; padding:.25rem 0; display:flex; justify-content:space-between; align-items:center; gap:.6rem; text-align:right; }
    .ov-units td[data-l]::before { content:attr(data-l); color:var(--mut); font-size:.72rem; text-transform:uppercase; letter-spacing:.04em; text-align:left; flex:0 0 auto; }
    .ov-units td:first-child { font-size:1.05rem; }
    .ov-units td input { flex:1 1 auto; width:100% !important; max-width:62%; }
    .ov-units td .dvt-bar { width:100%; }
    /* two fields in one line (revisions, plan): the label on its own line, the fields share the width below it */
    .ov-units td[data-l="Revisions"], .ov-units td[data-l="Plan"] { flex-wrap:wrap; justify-content:flex-start; }
    .ov-units td[data-l="Revisions"]::before, .ov-units td[data-l="Plan"]::before { flex:1 1 100%; }
    .ov-units td[data-l="Revisions"] br, .ov-units td[data-l="Plan"] br { display:none; }
    .ov-units td[data-l="Revisions"] input, .ov-units td[data-l="Plan"] input { flex:1 1 40%; min-width:0; max-width:none; width:auto !important; }
    .cmp-controls { display:grid !important; grid-template-columns:1fr 1fr; gap:.6rem !important; }
    .cmp-controls > label:first-child { grid-column:1 / -1; }
    .cmp-controls select, .cmp-controls input { width:100%; }
    .cmp-table th:first-child, .cmp-table td:first-child { position:sticky; left:0; z-index:1; background:var(--panel); max-width:8.5rem; word-break:break-word; }
    .cmp-table th, .cmp-table td { padding:.4rem .45rem; font-size:.85rem; }
    /* any other table (programs, prints, errors, runs) scrolls inside its card instead of widening the page */
    .dvt-picker { display:none; }   /* the chips above already choose the CureBox */
    table.rq-table tr:first-child { display:none; }
    table.rq-table, .rq-table tbody, .rq-table tr, .rq-table td { display:block; width:100%; }
    .rq-table tr { border:1px solid var(--line); border-radius:9px; padding:.5rem .7rem; margin-bottom:.5rem; }
    .rq-table td { border:0; padding:.15rem 0; }
    .rq-table td:first-child { font-size:1.02rem; }
    .rq-table button { width:100%; min-height:46px; margin-top:.3rem; }
    /* every list table on the phone is a list of cards: the first cell is the title of the card, the others carry their label */
    table.cards tr:first-child { display:none; }
    table.cards, .cards tbody, .cards tr, .cards td { display:block; width:100%; }
    .cards tr { border:1px solid var(--line); border-radius:9px; padding:.45rem .7rem; margin-bottom:.55rem; }
    .cards td { border:0; padding:.2rem 0; display:flex; justify-content:space-between; align-items:center; gap:.6rem; text-align:right; }
    .cards td[data-l]::before { content:attr(data-l); color:var(--mut); font-size:.72rem; text-transform:uppercase; letter-spacing:.04em; text-align:left; flex:0 0 auto; }
    .cards td:first-child { font-weight:700; font-size:1.02rem; justify-content:flex-start; text-align:left; }
    .cards td.wide, .cards td[colspan] { display:block; text-align:left; }
    .cards td.act { display:flex; gap:.5rem; justify-content:stretch; }
    .cards td.act button, .cards td.act a { flex:1 1 0; min-height:46px; display:inline-flex; align-items:center; justify-content:center; border:1px solid #d4d4d4; border-radius:7px; text-decoration:none; color:var(--text); padding:.4rem .6rem; background:var(--field); }
    .cards td.act button.danger { color:var(--err); }
    table.steps tr:first-child { display:none; }
    .steps td:first-child::before { content:'Step '; }
    .steps td.act { justify-content:flex-end; }
    .steps td input, .steps td select { width:auto; max-width:64%; flex:1 1 auto; }
    .steps td[data-l="Options"] { flex-direction:column; align-items:stretch; text-align:left; }
    .steps td[data-l="Options"] select { max-width:100%; width:100%; margin-top:.3rem; }
    .steps td[data-l]:has(> .mut:only-child) { display:none; }   /* a field this process does not have */
    .race-card { flex-wrap:wrap; padding:.6rem .7rem; gap:.5rem .7rem; }
    .race-time { flex:1 1 100%; text-align:left; padding-left:2.9rem; }
    .race-clock { font-size:1.3rem; }
    .sendrow > * { flex:1 1 100% !important; width:100%; }
    #app .row button.primary { min-height:46px; }
    #app table:not(.ov-units):not(.cmp-table):not(.rq-table):not(.cards) { display:block; max-width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; }
    /* running a test from the phone: the Run button is a full-width thumb target, the guide is a full-screen sheet with its buttons pinned
       to the bottom, the questions the machine asks have big answer buttons */
    .dvt-ph-head, .dvt-test { min-height:48px; }
    .dvt-test { gap:.4rem .6rem; padding:.65rem .7rem; }
    .dvt-test .run-btn { flex:1 1 100%; min-height:46px; font-size:1rem; padding:.5rem .8rem; }
    [data-dvt-run-all] { width:100%; }
    .dvt-runpanel { padding:.7rem .75rem; overflow-x:auto; }
    .dvt-modal-bg { padding:0; align-items:stretch; }
    .dvt-modal { width:100%; height:100%; max-height:100%; border-radius:0; }
    .dvt-modal-head { padding:.7rem .9rem .5rem; }
    .dvt-modal-body { padding:0 .9rem; }
    .dvt-modal-run { padding:.6rem .9rem; max-height:50vh; }
    .dvt-modal-foot { flex-direction:column-reverse; align-items:stretch; padding:.7rem .9rem calc(.7rem + env(safe-area-inset-bottom, 0px)); background:var(--panel); }
    .dvt-modal-foot button { width:100%; min-height:48px; }
    .dvt-modal-foot .mut { margin:.2rem 0 0 !important; text-align:center; }
    .dvt-prompt .row { flex-wrap:wrap; gap:.5rem; }
    .dvt-prompt button, .dvt-prompt select { flex:1 1 40%; min-height:48px; }
    .dvt-prompt input { flex:1 1 100%; width:100% !important; }
  }
</style></head><body>

QhOAJAAAAgCIETwAAAAAUIXgCAAAAoAjBEwAAAABFCJ4AAAAAKELwBAAAAEARgicAAAAAihA8AQAAAFCE4AkAAACAIgRPAAAAABQheAIAAACgCMETAAAAAEUIngAAAAAoQvAEAAAAQBGCJwAAAACKEDwBAAAAUITgCQAAAIAiBE8AAAAAFCF4AgAAAKAIwRMAAAAARQieAAAAAChC8AQAAABAEYInAAAAAIoQPAEAAABQhOAJAAAAgCIETwAAAAD0b7PZ/P/vjEYML7y0DwAAAABJRU5ErkJggg==" alt="Stratasys"><h1>sCure Cloud</h1>
  <span id="who" class="mut" style="margin-left:auto"></span></header>
<main id="app"></main>
<script>
const $ = s => document.querySelector(s);
let MACHINES = [];
let editing = false;   // an editor is open: auto-refresh must not wipe it

// True while the user is interacting with any form on the page — the
// periodic refresh skips re-rendering so it never eats typed input.
function userBusy() {
  if (editing) return true;
  const a = document.activeElement;
  if (a && ['INPUT', 'SELECT', 'TEXTAREA'].includes(a.tagName)) return true;
  // half-filled send-print form counts as busy too
  return [...document.querySelectorAll('[id^="job-"], [id^="printer-"]')]
    .some(el => el.value && el.value.trim() !== '');
}

async function api(path, opts) {
  const r = await fetch(path, Object.assign({headers:{'Content-Type':'application/json'}}, opts));
  if (r.status === 401) { ME = null; renderLogin(); throw new Error('auth'); }
  if (r.status === 403) { const d = await r.json(); flash(d.message || 'Your access does not allow this.'); throw new Error('denied'); }
  return r.json();
}

// A short message at the bottom of the screen (a refused action, a saved change); it goes by itself.
function flash(text) {
  let el = $('#flash');
  if (!el) { el = document.createElement('div'); el.id = 'flash'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.textContent = text;
  el.classList.add('on');
  clearTimeout(flash.t);
  flash.t = setTimeout(() => el.classList.remove('on'), 6000);
}

// ---- Sign-in (user, 2026-10-30): with a Google account on the people list, or - until Google sign-in is set up - the
// shared password. The Google link opens in a new window; this page asks the server every 1.5 s whether it is done.
/* ME: {email, name, role, roleLabel, owner, via, canService, canAdmin} of the signed-in person; LOGIN: {state, url, waiting} of the Google sign-in on screen */
let ME = null;
let LOGIN = null;
async function renderLogin(msg) {
  /* already on screen: the 10 s refresh must not restart a sign-in */
  if (!msg && $('#login')) return;
  ME = null; renderWho();
  let mode = { google: false };
  try { mode = await (await fetch('/login/mode')).json(); } catch (e) { /* password */ }
  if (!mode.google) {
    $('#app').innerHTML = `<div class="card" id="login"><h2>Sign in</h2>
      <div class="row"><input id="pw" type="password" placeholder="Portal password" style="flex:1">
      <button class="primary" id="go">Sign in</button></div>
      <p class="msg err">${msg||''}</p></div>`;
    $('#go').onclick = doLogin;
    $('#pw').onkeydown = e => { if (e.key === 'Enter') doLogin(); };
    return;
  }
  LOGIN = null;
  try { const s = await (await fetch('/login/google', { method: 'POST' })).json(); if (s.ok) LOGIN = { state: s.state, url: s.url, waiting: false }; } catch (e) {}
  $('#app').innerHTML = `<div class="card login-g" id="login"><h2>Sign in to sCure Cloud</h2>
    <p class="mut">Use the Google account an admin added to sCure Cloud.</p>
    ${LOGIN ? `<a class="btn primary" id="g-go" href="${LOGIN.url}" target="_blank" rel="noopener">Sign in with Google</a>`
            : `<p class="msg err">Google sign-in is not reachable right now - reload the page in a moment.</p>`}
    <p class="mut" id="g-wait" hidden>Finish signing in in the Google window that opened. This page continues by itself.</p>
    <p class="msg err" id="g-err">${msg ? escH(msg) : ''}</p></div>`;
  const go = $('#g-go');
  if (go) go.onclick = () => { if (!LOGIN.waiting) { LOGIN.waiting = true; $('#g-wait').hidden = false; $('#g-err').textContent = ''; googleWait(LOGIN); } };
}
async function googleWait(l) {
  const until = Date.now() + 10 * 60 * 1000;
  while (LOGIN === l && Date.now() < until) {
    await new Promise(res => setTimeout(res, 1500));
    let r = null;
    try { r = await (await fetch('/login/poll', { method: 'POST', body: JSON.stringify({ state: l.state }) })).json(); } catch (e) { continue; }
    if (LOGIN !== l) return;
    if (r && r.pending) continue;
    LOGIN = null;
    if (r && r.ok) { load(true); return; }
    renderLogin((r && r.message) || 'Sign-in failed - press Sign in again.');
    return;
  }
}
async function doLogin() {
  const r = await fetch('/login', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({password: $('#pw').value})});
  if (r.ok) load(true); else renderLogin((await r.json()).message || 'Wrong password');   // forced: the focused password field counts as "busy"
}
async function signOut() {
  await fetch('/logout', { method: 'POST' });
  ME = null;
  renderLogin();
}

// Header: who is signed in and with what access; People for admins; Sign out.
function renderWho() {
  const w = $('#who');
  if (!w) return;
  if (!ME) { w.innerHTML = ''; return; }
  const who = ME.via === 'password' ? 'Shared password' : (ME.name || ME.email);
  w.innerHTML = `<span class="who-name" title="${escH(ME.email || '')}">${escH(who)}</span>
    <span class="pill who-role">${escH(ME.roleLabel)}</span>
    ${ME.canAdmin ? `<button id="who-people" class="${VIEW === 'people' ? 'primary' : ''}">People</button>` : ''}
    <button id="who-out">Sign out</button>`;
  $('#who-out').onclick = signOut;
  const p = $('#who-people');
  if (p) p.onclick = () => { VIEW = 'people'; render(); loadPeople(); };
}

// ---- People (admins): who may open sCure Cloud and what each may do; recent activity under a fold ----
/* PEOPLE: {users, google, redirectUri, audit} */
let PEOPLE = null;
const ROLE_HELP = { view: 'Viewer - sees everything, changes nothing',
                    service: 'Service - also requests DVT tests, sends programs, edits units and the race',
                    admin: 'Admin - also approves safety runs and manages people' };
async function loadPeople() {
  try {
    const u = await api('/api/users');
    let audit = [];
    try { audit = (await api('/api/audit')).rows || []; } catch (e) { audit = []; }
    PEOPLE = Object.assign({}, u, { audit });
  } catch (e) { return; }
  if (VIEW === 'people' && !userBusy()) render();
}
function peopleCard() {
  if (!ME || !ME.canAdmin) return `<div class="card"><h2>People</h2><p class="mut">Only an admin can see the people list.</p></div>`;
  if (!PEOPLE) return `<div class="card"><h2>People</h2><p class="mut">Loading…</p></div>`;
  const opt = r => ['view', 'service', 'admin'].map(x => `<option value="${x}"${x === r ? ' selected' : ''}>${{ view: 'Viewer', service: 'Service', admin: 'Admin' }[x]}</option>`).join('');

function peopleWire() {
  const add = $('#pp-add');
  if (add) add.onclick = async () => {
    const email = $('#pp-email').value.trim();
    if (!email) { $('#pp-msg').textContent = 'Write the person\'s Google account email.'; return; }
    try {
      const r = await api('/api/users/save', { method: 'POST', body: JSON.stringify({ email, name: $('#pp-name').value, role: $('#pp-role').value }) });
      if (!r.ok) { $('#pp-msg').textContent = r.message || 'Not saved'; return; }
    } catch (e) { return; }
    flash(email + ' can now sign in.');
    $('#pp-email').value = ''; $('#pp-name').value = '';
    await loadPeople(); render();
  };
  [...document.querySelectorAll('[data-person-role]')].forEach(s => s.onchange = async () => {
    try {
      const r = await api('/api/users/save', { method: 'POST', body: JSON.stringify({ email: s.dataset.personRole, role: s.value }) });
      if (!r.ok) { flash(r.message || 'Not saved'); return; }
      flash('Saved: ' + s.dataset.personRole + ' is now ' + s.options[s.selectedIndex].text + '.');
    } catch (e) { return; }
    s.blur(); await loadPeople(); render();
  });
  [...document.querySelectorAll('[data-person-remove]')].forEach(b => b.onclick = async () => {
    const email = b.dataset.personRemove;
    if (!confirm('Remove ' + email + '? They are signed out at once and can no longer open sCure Cloud.')) return;
    try {
      const r = await api('/api/users/remove', { method: 'POST', body: JSON.stringify({ email }) });
      if (!r.ok) { flash(r.message || 'Not removed'); return; }
    } catch (e) { return; }
    flash(email + ' was removed.');
    await loadPeople(); render();
  });
}

function fmtAgo(t) {
  if (!t) return 'never';
  const s = Math.round(Date.now()/1000 - t);
  return s < 60 ? s + 's ago' : s < 3600 ? Math.round(s/60) + 'm ago' : Math.round(s/3600) + 'h ago';
}

async function load(force) {
  if (!force && userBusy()) return;   // never re-render under the user's hands
  try { MACHINES = await api('/api/machines'); } catch { return; }
  /* who is signed in: asked once per sign-in, without holding up the page */
  if (!ME && !load.me) { load.me = true; api('/api/me').then(m => { ME = m; renderWho(); }).catch(() => {}).finally(() => { load.me = false; }); }
  if (!force && userBusy()) return;
  render();
  if (VIEW === 'errors') loadErrors();
  if (VIEW === 'dvt' || VIEW === 'overview' || VIEW === 'compare' || VIEW === 'race') loadDvt();
}

// Which CureBox is shown: 'all' or a machine name (kept across visits).
let SELECTED = localStorage.getItem('scure-curebox') || 'all';
// Live filter for work programs + recent prints (name/material/printer/status).
let SEARCH = '';
// 'machines' (the machine cards), 'errors' (every alert raised today) or 'dvt' (the DVT campaign).
let VIEW = 'overview';
let ERRORS = null;            // alerts from the portal's log: {machine, code, raised, cleared, message}
// DVT: every run DVT/web/dvt-tool.html recorded, with its values and its raw measurement files.
const PORTAL_BUILD = '0.9.149';   // must equal Code.gs PORTAL_BUILD - a mismatch means this tab predates a deploy
let DVT_DETAIL = null;        // {testId: {purpose, steps, equipment, preconditions, criteria, bench, note ...}} - fetched once per catalog
let DVT_DETAIL_AT = -1;       // the catalog.updated the detail belongs to
let DVT_DETAIL_BUSY = false;
let DVT = null;               // {runs: [{unit, testId, variant, rep, runId, verdict, operator, startedAt, recordedAt, note, values, files}], fileUrl}
let DVT_UNIT = localStorage.getItem('scure-dvt-unit') || 'all';
const DVT_NONE = '__unassigned';  // the CureBox list's "not assigned" entry: runs uploaded before their unit had a CureBox
const dvtMachines = () => [...new Set(((DVT && DVT.runs) || []).map(r => r.machine).filter(Boolean))];
let DVT_MANUAL = {};         // the hand-made tests on screen (test id -> row), for the Approve button
const DVT_OPEN = new Set();   // run ids whose values + files are expanded
const CODE_TITLES = {
  6016: 'Door opened during a process', 7004: 'Temperature stall',
  9001: 'Temperature sensor disconnected', 9002: 'Fan failure - system stopped', 9003: 'Fan not spinning - job not started',
  9004: 'LED panel not heating', 9005: 'LED panel temperature dropped', 9006: 'Temperature reading frozen',
  9007: 'Heater not heating', 9050: 'LED temperature sensor disconnected', 9051: 'Fan speed low - replace fan',
  9052: 'NFC reader not detected'};
// the registry title (errors.json, sent by portalAlerts) wins; CODE_TITLES covers a server older than the per-component codes
const errTitle = e => e.title || CODE_TITLES[e.code] || 'Error ' + e.code;
const fmtTime = t => new Date(t * 1000).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
const fmtDur = s => s < 60 ? `${Math.round(s)} s` : s < 3600 ? `${Math.floor(s/60)} min ${Math.round(s%60)} s` : `${Math.floor(s/3600)} h ${Math.round((s%3600)/60)} min`;
async function loadErrors() {
  const midnight = new Date(); midnight.setHours(0, 0, 0, 0);
  try { ERRORS = await api(`/api/alerts?since=${Math.floor(midnight.getTime()/1000)}`); } catch { return; }
  if (VIEW === 'errors' && !userBusy()) render();
}
function errorsCard() {
  if (ERRORS === null) return `<div class="card"><h2>Errors today</h2><p class="mut">Loading…</p></div>`;
  const now = Date.now() / 1000;
  const list = ERRORS.filter(e => SELECTED === 'all' || e.machine === SELECTED)
    .filter(e => { const q = SEARCH.trim().toLowerCase();
      return !q || [e.machine, String(e.code), errTitle(e), e.message].some(v => (v||'').toLowerCase().includes(q)); });
  const rows = list.map(e => {
    const active = e.cleared == null;
    const status = active ? `<span class="pill off">active · ${fmtDur(now - e.raised)}</span>`
                          : `<span class="mut">cleared ${fmtTime(e.cleared)} · lasted ${fmtDur(e.cleared - e.raised)}</span>`;
    return `<tr><td>${fmtTime(e.raised)}</td><td data-l="Machine">${e.machine}</td><td data-l="Code"><b>${e.code}</b></td>
      <td class="wide"><b>${escH(errTitle(e))}</b>${/^https?:\/{2}/i.test(e.videoUrl || '') ? ` <a class="vid" href="${escH(e.videoUrl)}" target="_blank" rel="noopener">&#9654; Video</a>` : ''}<br><span class="mut">${(e.message||'').replace(/</g,'&lt;')}</span></td>
      <td data-l="Status">${status}</td></tr>`;
  }).join('');
  const active = list.filter(e => e.cleared == null).length;
  return `<div class="card"><h2>Errors today
      <span class="mut" style="font-weight:400;text-transform:none">${list.length} raised${active ? ` · ${active} still active` : ''}</span></h2>
    <table class="cards"><tr><th>Time</th><th>Machine</th><th>Code</th><th>Error</th><th>Status</th></tr>
      ${rows || '<tr><td colspan=5 class="mut">No errors today</td></tr>'}</table></div>`;
}

async function loadDvt() {
  try { DVT = await api('/api/dvt'); } catch { return; }
  if (DVT && DVT.catalog && DVT.catalog.tests) Object.entries(DVT.catalog.tests).forEach(([tid, t]) => {   // electrical safety: done by hand, once, on UUT-01; the engineer approves it
    if (t.group === 'ELE') { t.auto = false; t.manual = true; if ((t.units || []).includes('UUT-01')) t.units = ['UUT-01']; }
  });
  if (DVT && DVT.catalog && Array.isArray(DVT.catalog.phases))   // tests listed in ascending order inside each phase (user, 2026-10-25)
    DVT.catalog.phases.forEach(p => { if (Array.isArray(p.tests)) p.tests = p.tests.slice().sort((a, b) => a.localeCompare(b, 'en', { numeric: true })); });
  if (DVT && DVT.now) DVT.skew = DVT.now - Date.now() / 1000;      // the server's clock, so a phone with a wrong time does not skew the race
  if ((VIEW === 'dvt' || VIEW === 'overview' || VIEW === 'compare' || VIEW === 'race') && !userBusy()) render();
  if (VIEW === 'dvt' && DVT && DVT.catalog && DVT.catalog.updated !== DVT_DETAIL_AT) loadDvtDetail();
}

/** The "why and how" of every test (purpose, equipment, steps, criteria): about 100 KB, fetched when the catalog changes. */
async function loadDvtDetail() {

    const d = await api('/api/dvt/detail');

const fmtBytes = n => n < 1024 ? `${n} B` : n < 1048576 ? `${Math.round(n / 1024)} KB` : `${(n / 1048576).toFixed(1)} MB`;
// when the run was RECORDED in the DVT tool (startedAt); recordedAt is only when it reached the portal
const dvtWhen = r => (Date.parse(r.startedAt) / 1000) || r.recordedAt;
const fmtWhen = t => !t ? '—' : Date.now() / 1000 - t < 86400 ? fmtAgo(t)
  : new Date(t * 1000).toLocaleString([], { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
const dvtClass = v => /^pass$/i.test(v) ? 'on' : /^fail$/i.test(v) ? 'off' : /^(blocked|invalid)$/i.test(v) ? 'warn' : '';

// ---- the catalog view: every phase and test of the DVT catalog for one unit, the way the DVT tool lays it out,
//      with what this CureBox recorded against each owed run ----
const DVT_PHASE_OPEN = new Set(), DVT_TEST_OPEN = new Set();
let DVT_PHASES_TOUCHED = false;          // until a phase is folded by hand, every phase shows its tests
const DVT_ICON = { PASS: ['on', '✓'], FAIL: ['off', '✗'], BLOCKED: ['warn', '!'], INVALID: ['warn', '?'], WAIVED: ['', 'W'], progress: ['', '…'], open: ['', '–'] };
const escH = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

/** A test's verdict from its owed runs - the DVT tool's rule: any FAIL, then BLOCKED, WAIVED, PASS once all are in. */
function dvtTestVerdict(owed, byId) {
  const vs = owed.map(id => (byId[id] || {}).verdict || '');
  if (vs.every(v => !v)) return 'open';
  if (vs.some(v => !v)) return 'progress';
  for (const v of ['FAIL', 'INVALID', 'BLOCKED', 'WAIVED', 'PASS']) if (vs.includes(v)) return v;
  return 'progress';
}

/** The values, files and note of one recorded run (shown when the run is opened). */
function dvtRunDetail(r, colspan) {
  const vals = Object.entries(r.values || {});
  return `<tr><td colspan=${colspan} style="background:var(--inset)">
      ${vals.length ? `<table>${vals.map(([k, v]) => `<tr><td class="mut">${escH(k)}</td><td><b>${escH(v)}</b></td></tr>`).join('')}</table>`
                    : '<span class="mut">No values recorded</span>'}
      ${(r.files || []).length ? `<p style="margin:.5rem 0 0">${r.files.map(f =>
          `<a href="${window.scureDvtFileHref ? window.scureDvtFileHref(DVT.fileUrl, f.id) : '#'}" target="_blank">${escH(f.name)}</a>
           <span class="mut">(${escH(f.kind || 'file')}, ${fmtBytes(f.size)})</span>`).join(' &middot; ')}</p>` : ''}
      ${r.note ? `<p class="mut" style="margin:.5rem 0 0">${escH(r.note)}</p>` : ''}
    </td></tr>`;
}

// ---- DVT runs requested from the site: the CureBox's runner picks them up, asks for Start on the machine's screen,
//      runs the same scripts as the DVT tool and reports back. Nothing runs until someone at the machine presses Start. ----
const DVT_ACTIVE_ST = ['queued', 'waiting', 'running', 'cancel_requested'];
const DVT_REQ_LABEL = { queued: 'queued', waiting: 'waiting at the machine', running: 'running', cancel_requested: 'stopping',
                        done: 'done', failed: 'failed', cancelled: 'cancelled', blocked: 'not started' };
const reqClass = st => st === 'done' ? 'on' : st === 'failed' ? 'off' : st === 'cancelled' ? '' : 'warn';
let DVT_MSG = '';                          // the last answer of a Run / Cancel / Answer click

async function dvtSend(path, body) {
  try {
    const r = await api(path, { method: 'POST', body: JSON.stringify(body) });
    DVT_MSG = r && r.ok === false ? (r.message || 'refused') : '';
    return r;
  } catch (e) { DVT_MSG = String(e.message || e); return null; }
  finally { await loadDvt(); render(); }
}

/** The answer controls for the step the runner waits on (a physical act, a yes / no, an instrument reading). */
function dvtPromptControls(r) {
  const p = r.prompt;
  if (!p) return '';
  const b = (v, label, cls) => `<button class="${cls || ''}" data-dvt-answer="${r.id}" data-v='${JSON.stringify(v)}'>${label}</button>`;
  let ctl;
  if (p.kind === 'yesno') ctl = b(true, 'Yes', 'primary') + b(false, 'No') + b(null, 'Skip');
  else if (p.kind === 'value') {
    const input = Array.isArray(p.values) && p.values.length
      ? `<select id="dvt-in-${r.id}">${p.values.map(v => `<option>${escH(v)}</option>`).join('')}</select>`
      : `<input id="dvt-in-${r.id}" placeholder="${escH(p.unit || 'value')}" style="width:9rem">`;
    ctl = input + `<button class="primary" data-dvt-answer-input="${r.id}">OK</button>` + b(null, 'Skip');
  } else ctl = b(true, 'Done', 'primary') + b(null, 'Skip');
  return `<div class="dvt-prompt"><b>The test asks:</b> ${escH(p.text)}<div class="row" style="margin-top:.4rem">${ctl}</div></div>`;
}

/** Runner state, Run all, and the queue for one CureBox + unit. */
const DVT_KIND = { auto: 'fully automatic', guided: 'automatic, with prompts', instrumented: 'automatic, instrument readings asked for' };
const DVT_CHECKS = [['machine', 'Machine connected'], ['svc', 'DVT bench service on the machine (port 3002)'], ['tc08', 'Thermocouple on CH1 (at the cutout)'],
                    ['chamber', 'Heater thermistor (TEMP_CHAMBER) reading'], ['idle', 'Machine idle']];

/** The live checks of a bench test, as the DVT runner on the selected CureBox reported them (fresh within 45 s). */
function dvtBenchCard(tid, d, x, runner, verdictOf) {
  const rd = runner && runner.online && runner.readiness ? runner.readiness[tid] : null;
  const canAsk = SELECTED !== 'all' && SELECTED !== DVT_NONE;
  const why = !canAsk ? 'Choose a CureBox above to see its live checks.'
            : !runner || !runner.online ? `The DVT runner on ${SELECTED} is not online - no live checks.`
            : !rd ? `Waiting for the first report from ${SELECTED}…` : '';
  const rows = DVT_CHECKS.map(([key, label]) => {
    const r = rd && rd.rows ? rd.rows[key] : null;
    const cls = !r ? '' : r.ok === true ? 'ok' : r.ok === 'warn' ? 'warn' : r.ok === false ? 'bad' : '';
    return `<div class="dvt-chk ${cls}"><span class="dot"></span><span class="lab">${escH(label)}</span><span class="val">${r ? escH(r.text) : ''}</span></div>`;
  }).join('');
  const active = (DVT.requests || []).some(q => q.machine === SELECTED && q.testId === tid && DVT_ACTIVE_ST.includes(q.status));
  const ready = !!(rd && rd.ready);
  const line = active ? 'queued - it starts when someone presses Start on the machine screen'
             : ready ? 'everything is ready - press Run, then Start on the machine screen' : (why || 'Run is enabled when all checks are green');
  return `<div class="dvt-auto"><p class="note">${escH(d.note || '')}</p>${rows}
    <div class="row" style="margin-top:.5rem;gap:.7rem;align-items:center">
      <button class="primary run-btn" data-dvt-run-card="${escH(tid)}" ${ready && canAsk && !active ? '' : 'disabled'}>▶ Run</button>
      <span class="mut" style="font-size:.9rem">${escH(line)}</span></div></div>`;
}

/** One test opened: purpose, safety plan, equipment and preconditions, dependencies, the numbered procedure, the pass criteria. */
function dvtDetailHtml(tid, x, runner, verdictOf) {
  if (!DVT_DETAIL) return '<p class="mut">Loading the test description…</p>';
  const d = DVT_DETAIL[tid];
  if (!d) return `<p class="mut" style="margin:.5rem 0">The description of this test is not in the portal yet - it arrives when the DVT runner on the CureBox starts, or when the DVT tool presses <b>Sync all</b>.</p>`;
  const ul = items => `<ul>${items.map(i => `<li>${escH(i)}</li>`).join('')}</ul>`;
  const bits = [];
  bits.push(`<h4>Purpose</h4><p>${escH(d.purpose)}</p>`);
  if (d.rationale) bits.push(`<h4>Sample rationale</h4><p>${escH(d.rationale)}</p>`);
  if (d.safetyPlan && d.safetyPlan.length) bits.push(`<div class="dvt-safety"><h4>Safety plan</h4>${ul(d.safetyPlan)}</div>`);
  if ((d.equipment && d.equipment.length) || (d.preconditions && d.preconditions.length)) {
    bits.push(`<div class="dvt-cols"><div>${d.equipment && d.equipment.length ? `<h4>Equipment</h4>${ul(d.equipment)}` : ''}</div>
      <div>${d.preconditions && d.preconditions.length ? `<h4>Preconditions</h4>${ul(d.preconditions)}` : ''}</div></div>`);
  }
  if (d.dependencies && d.dependencies.length) {
    bits.push(`<h4>Dependencies</h4><p>${d.dependencies.map(dep => {
      const ok = ['PASS', 'WAIVED'].includes(verdictOf[dep]);
      return `<span class="dep ${ok ? 'ok' : 'open'}">${escH(dep)} ${ok ? '✓' : '…'}</span>`;
    }).join('')}</p>`);
  }
  bits.push('<h4>Procedure</h4>');
  if (d.bench) bits.push(dvtBenchCard(tid, d, x, runner, verdictOf));
  else if (d.note) bits.push(`<div class="dvt-auto"><p class="note" style="margin:0"><b>${escH(DVT_KIND[d.kind] || 'automatic')}${x.t.minutes ? ` · about ${x.t.minutes} min` : ''}.</b> ${escH(d.note)}</p></div>`);
  bits.push(`<ol class="dvt-steps">${(d.steps || []).map(s => `<li>${escH(s)}</li>`).join('')}</ol>`);
  bits.push(`<div class="dvt-crit"><h4>Pass criteria</h4><code>${escH(d.criteria)}</code></div>`);
  return `<div class="dvt-detail">${bits.join('')}</div>`;
}

let GUIDE = null;               // the open guide window: {bg, tid, machine, unit, sinceId, sent}
/** Run pressed on one test: show how it goes (purpose, safety, equipment, preconditions, steps, criteria) before queuing it.
    Queue keeps the window open and follows the run there (status, the machine's questions, Stop). */
function dvtGuide(tid, title) {
  if (!DVT_DETAIL) loadDvtDetail();
  const d = DVT_DETAIL && DVT_DETAIL[tid];
  const ul = items => `<ul>${items.map(i => `<li>${escH(i)}</li>`).join('')}</ul>`;
  const bits = [];
  if (!d) bits.push(`<p class="mut" style="margin:1rem 0">The guide for this test is not in the portal yet - it arrives when the DVT runner on the CureBox starts, or when the DVT tool presses <b>Sync all</b>.</p>`);
  else {
    bits.push(`<h4>Purpose</h4><p>${escH(d.purpose)}</p>`);
    if (d.safetyPlan && d.safetyPlan.length) bits.push(`<div class="dvt-safety"><h4>Safety plan</h4>${ul(d.safetyPlan)}</div>`);
    if (d.equipment && d.equipment.length) bits.push(`<h4>Equipment</h4>${ul(d.equipment)}`);
    if (d.preconditions && d.preconditions.length) bits.push(`<h4>Before you start</h4>${ul(d.preconditions)}`);
    if (d.note) bits.push(`<div class="dvt-auto"><p class="note" style="margin:0">${escH(d.note)}</p></div>`);
    bits.push(`<h4>Procedure</h4><ol class="dvt-steps">${(d.steps || []).map(s => `<li>${escH(s)}</li>`).join('')}</ol>`);
    if (d.criteria) bits.push(`<div class="dvt-crit"><h4>Pass criteria</h4><code>${escH(d.criteria)}</code></div>`);
    bits.push(`<div class="dvt-sim"><h4>Simulation</h4>
      <p class="mut" style="margin:.2rem 0 .5rem;font-size:.88rem">A dry run in this window only: the steps play through, it asks you the same questions as a real run, and the pass criteria are checked against made-up readings (your answers replace them). Nothing is sent to the CureBox and nothing is recorded.</p>
      <div class="row"><button data-sim="pass">▶ Simulate a passing run</button><button data-sim="fail">▶ Simulate a failing run</button></div>
      <div data-sim-out></div></div>`);
  }
  const bg = document.createElement('div');
  bg.className = 'dvt-modal-bg';
  bg.innerHTML = `<div class="dvt-modal" role="dialog" aria-modal="true">
