  const chip = r => !r ? '' : `<span class="pill ${r.ok === true ? 'on' : r.ok === false ? 'bad' : ''}">${escH(r.text)}</span>`;
  const missing = ['tc08', 'tc08ch1', 'ophir'].filter(k => ins[k] && ins[k].ok === false);
  return `<div class="row" style="gap:.4rem;flex-wrap:wrap;align-items:center;margin-top:.45rem"><span class="lbl">Instruments</span>
      ${['tc08', 'tc08ch1', 'tc08ch2', 'ophir'].map(k => chip(ins[k])).join('')}</div>
    ${missing.length ? `<p class="err-t" style="margin:.3rem 0 0">Not connected: ${missing.map(k => escH(ins[k].text)).join(' · ')}</p>` : ''}`;
}

function dvtRunPanel(u, runnable) {
  if (SELECTED === 'all' || SELECTED === DVT_NONE) return `<p class="mut" style="margin:.2rem 0 .8rem">Choose a CureBox above to run tests on it.</p>`;
  const runner = (DVT.runners || []).find(x => x.machine === SELECTED);
  const reqs = (DVT.requests || []).filter(r => r.machine === SELECTED && r.unit === u);
  const active = reqs.filter(r => DVT_ACTIVE_ST.includes(r.status));
  const recent = reqs.filter(r => !DVT_ACTIVE_ST.includes(r.status)).slice(0, 8);
  const state = runner && runner.online
    ? `<span class="pill on">DVT runner online</span> <span class="mut">v${escH(runner.version)} · unit ${escH(runner.unit)}</span>`
    : `<span class="pill off">DVT runner ${runner ? 'offline · seen ' + fmtWhen(runner.lastSeen) : 'not installed'}</span>
       <span class="mut">requests wait in the queue until it is online</span>`;
  const row = r => `<tr><td><b>${escH(r.testId)}</b></td>
      <td><span class="pill ${reqClass(r.status)}">${DVT_REQ_LABEL[r.status] || escH(r.status)}</span>${r.verdict ? ` <span class="pill ${dvtClass(r.verdict)}">${escH(r.verdict)}</span>` : ''}</td>
      <td class="mut">${escH(r.line)}${dvtPromptControls(r)}</td>
      <td style="white-space:nowrap">${r.status === 'cancel_requested' ? `<button class="danger" data-dvt-force="${r.id}" title="Close it now - for a run the machine no longer answers for">Force stop</button>`
        : DVT_ACTIVE_ST.includes(r.status) ? `<button data-dvt-cancel="${r.id}">Cancel</button>` : `<span class="mut">${fmtWhen(r.finished || r.requested)}</span>`}</td></tr>`;
  return `<div class="dvt-runpanel">
      <div class="row" style="gap:.6rem;align-items:center">${state}
        <button class="primary" style="margin-left:auto" data-dvt-run-all="${escH(u)}" ${runnable.length ? '' : 'disabled'}>▶ Run all open tests (${runnable.length})</button>
        ${active.length ? `<button class="danger" data-dvt-stop-all="${active.map(r => r.id).join(',')}">■ Stop all (${active.length})</button>` : ''}</div>
      ${dvtInstruments(runner)}
      <p class="mut" style="margin:.4rem 0 0;font-size:.85rem">Nothing turns on until someone at ${escH(SELECTED)} presses <b>Start</b> on its screen. Steps that need a person are asked here.</p>
      ${DVT_MSG ? `<p class="err-t" style="margin:.4rem 0 0">${escH(DVT_MSG)}</p>` : ''}
      ${active.length || recent.length ? `<table class="rq-table" style="margin-top:.6rem"><tr><th>Test</th><th>Status</th><th>On the machine</th><th></th></tr>
        ${active.map(row).join('')}${recent.map(row).join('')}</table>` : ''}
    </div>`;
}

function dvtCatalogCard(all, picker, where) {
  const cat = DVT.catalog;
  const stale = DVT.build && DVT.build !== PORTAL_BUILD
    ? `<div class="dvt-prompt" style="margin-bottom:.8rem"><b>This page is out of date</b> - the portal was updated since it was opened.
       <button class="primary" onclick="location.reload()" style="margin-left:.6rem">Reload</button></div>` : '';
  const catUnits = [...new Set(Object.values(cat.tests).flatMap(t => t.units || []))].sort();
  const withRuns = [...new Set(all.map(r => r.unit))].sort();
  // only the units that really belong here (user, 2026-10-12: "there is only one machine"): the unit the CureBox's runner
  // is set to and the units it has runs of. The catalog's other UUTs are the campaign plan, not machines - they are offered
  // only in "All CureBoxes", or when a CureBox has neither a runner nor a run yet (then its first unit).
  const runnerUnit = ((DVT.runners || []).find(x => x.machine === SELECTED) || {}).unit;
  const own = [...new Set([...(runnerUnit ? [runnerUnit] : []), ...withRuns])].filter(x => catUnits.includes(x));
  const anyBox = SELECTED === 'all' || SELECTED === DVT_NONE;
  const units = own.length ? own : anyBox ? catUnits : catUnits.slice(0, 1);
  if (!units.includes(DVT_UNIT)) DVT_UNIT = units[0];
  const u = DVT_UNIT;
  const byId = {};
  all.filter(r => r.unit === u).forEach(r => { byId[r.runId] = r; });
  const q = SEARCH.trim().toLowerCase();
  const owedIds = new Set();
  const phases = cat.phases.map(p => {
    const tests = (p.tests || []).filter(tid => cat.tests[tid] && (cat.tests[tid].units || []).includes(u)).map(tid => {
      const t = cat.tests[tid];
      const owed = (t.runs && t.runs.length ? t.runs : ['|1']).map(k => `${tid}|${u}|${k}`);
      owed.forEach(id => owedIds.add(id));
      return { tid, t, owed, verdict: dvtTestVerdict(owed, byId), done: owed.filter(id => (byId[id] || {}).verdict).length };
    });
    const pc = { PASS: 0, FAIL: 0, BLOCKED: 0 }, owedN = tests.reduce((n, x) => n + x.owed.length, 0);
    tests.forEach(x => x.owed.forEach(id => { const v = (byId[id] || {}).verdict; if (v in pc) pc[v]++; }));
    const shown = tests.filter(x => !q || [x.tid, x.t.title].some(v => (v || '').toLowerCase().includes(q)));
    return { p, tests: shown, owedN, pc };
  });
  // the counters cover every run the catalog owes on this unit, like the DVT tool's
  const n = { owed: owedIds.size, PASS: 0, FAIL: 0, BLOCKED: 0, WAIVED: 0, INVALID: 0 };
  owedIds.forEach(id => { const v = (byId[id] || {}).verdict; if (v in n) n[v]++; });
  const closed = n.PASS + n.FAIL + n.BLOCKED + n.WAIVED;
  const open = n.owed - closed;
  const pct = n.owed ? Math.round(closed / n.owed * 100) : 0;
  const extra = Object.values(byId).filter(r => !owedIds.has(r.runId)).sort((a, b) => dvtWhen(b) - dvtWhen(a));
  const tile = (num, label, cls) => `<div class="dvt-tile"><div class="num ${cls || ''}">${num}</div><div class="mut">${label}</div></div>`;
  const runRow = id => {
    const r = byId[id];
    const [, , variant, rep] = id.split('|');
    if (!r) return `<tr><td>${escH(variant) || '—'}</td><td data-l="Rep">r${rep}</td><td colspan=3 class="mut">not run yet</td></tr>`;
    const o = DVT_OPEN.has(id);
    return `<tr data-dvt-run="${escH(id)}" style="cursor:pointer"><td>${o ? '▾' : '▸'} ${escH(variant) || '—'}</td><td data-l="Rep">r${rep}</td>
        <td data-l="Verdict"><span class="pill ${dvtClass(r.verdict)}">${escH(r.verdict) || 'open'}</span></td><td data-l="Operator">${escH(r.operator) || '—'}</td>
        <td class="mut" data-l="Recorded">${fmtWhen(dvtWhen(r))}</td></tr>${o ? dvtRunDetail(r, 5) : ''}`;
  };
  const canRequest = SELECTED !== 'all' && SELECTED !== DVT_NONE;
  const verdictOf = {};
  DVT_MANUAL = {};
  phases.forEach(({ tests }) => tests.forEach(x => { verdictOf[x.tid] = x.verdict; if (x.t.manual) DVT_MANUAL[x.tid] = x; }));
  const runnerNow = (DVT.runners || []).find(r => r.machine === SELECTED) || null;
  const activeReq = {};
  (DVT.requests || []).filter(r => r.machine === SELECTED && r.unit === u && DVT_ACTIVE_ST.includes(r.status)).forEach(r => { activeReq[r.testId] = r; });
  const runnable = [];
  // a test that runs last (after_all) waits until every other test on the unit has a result (user, 2026-10-25)
  const DONE_V = ['PASS', 'FAIL', 'BLOCKED', 'WAIVED'];
  const openOthers = tid => { let n = 0; phases.forEach(({ tests }) => tests.forEach(y => { if (y.tid !== tid && !DONE_V.includes(y.verdict)) n++; })); return n; };
  phases.forEach(({ tests }) => tests.forEach(x => { x.waitLast = x.t.afterAll ? openOthers(x.tid) : 0; }));
  phases.forEach(({ tests }) => tests.forEach(x => { if (x.t.auto && !x.waitLast && !DONE_V.includes(x.verdict) && !activeReq[x.tid]) runnable.push(x.tid); }));
  const phaseHtml = phases.map(({ p, tests, owedN, pc }) => {
    const isOpen = DVT_PHASES_TOUCHED ? DVT_PHASE_OPEN.has(p.id) : true;
    const head = `<div class="dvt-ph-head" data-dvt-phase="${p.id}">
        <b class="ph-id">${p.id}</b><b>${escH(p.name)}</b>${p.gate ? `<span class="mut">Gate: ${escH(p.gate)}</span>` : ''}
        <span style="margin-left:auto">${owedN ? `<span class="ok-t">${pc.PASS}P</span> / <span class="err-t">${pc.FAIL}F</span> / <span class="warn-t">${pc.BLOCKED}B</span> / ${owedN}` : '—'}</span>
        <span class="mut">${isOpen ? '▾' : '▸'}</span></div>`;
    if (!isOpen) return `<div class="dvt-phase">${head}</div>`;
    const rows = tests.map(x => {
      const [cls, ic] = DVT_ICON[x.verdict] || DVT_ICON.open;
      const to = DVT_TEST_OPEN.has(x.tid);
      return `<div class="dvt-test" data-dvt-test="${x.tid}">
          <span class="dvt-ic ${cls}">${ic}</span><b class="tid">${x.tid}</b><span>${escH(x.t.title)}</span>
          ${x.t.safety ? '<span class="badge safety">safety-critical</span>' : ''}${x.t.auto ? '<span class="badge auto">auto</span>' : ''}
          <span class="mut" style="margin-left:auto;white-space:nowrap">${x.done}/${x.owed.length} ${new Set((x.t.runs || []).map(k => String(k).split('|')[0])).size > 1 ? 'cases' : 'runs'}${x.t.minutes ? ` · ~${x.t.minutes} min` : ''} ${to ? '▾' : '▸'}</span>
          ${!canRequest ? '' : activeReq[x.tid] ? `<span class="pill ${reqClass(activeReq[x.tid].status)}">${DVT_REQ_LABEL[activeReq[x.tid].status]}</span>`
            : x.waitLast ? `<span class="mut" style="font-size:.78rem" title="This review runs last">runs last - ${x.waitLast} test(s) still open</span>`
            : x.t.auto ? `<button class="run-btn" data-dvt-run-test="${x.tid}" title="Queue this test on ${escH(SELECTED)} - one click runs ${x.owed.length > 1 ? 'all ' + x.owed.length + (new Set((x.t.runs || []).map(k => String(k).split('|')[0])).size > 1 ? ' cases' : ' runs') + ' one after another' : 'it'}; it starts when someone there presses Start">▶ Run</button>`
            : ''}${x.t.manual ? (x.verdict === 'PASS'
              ? `<span class="mut" style="font-size:.78rem">approved by ${escH(((byId[x.owed[0]] || {}).operator) || '')}</span><button class="run-btn" data-dvt-approve="${x.tid}" data-v="0" title="Take the approval back">Withdraw</button>`
              : `<button class="run-btn primary" data-dvt-approve="${x.tid}" data-v="1" title="The engineer did this test by hand: record it as passed">✓ Approve</button>`) : ''}</div>
        ${to ? `<div class="dvt-runs">${dvtDetailHtml(x.tid, x, runnerNow, verdictOf)}<table class="cards"><tr><th>Variant</th><th>Rep</th><th>Verdict</th><th>Operator</th><th>Recorded</th></tr>${x.owed.map(runRow).join('')}</table></div>` : ''}`;
    }).join('');
    return `<div class="dvt-phase">${head}${rows || `<p class="mut" style="padding:.6rem 1rem">${q ? 'Nothing matches the search' : 'No tests on this unit'}</p>`}</div>`;
  }).join('');
  const chips = units.length < 2 ? '' : `<div class="row" style="margin:.2rem 0 .8rem">
      <span class="mut" style="font-size:.85rem">Unit:</span>
      ${units.map(x => `<button class="${u === x ? 'primary' : ''}" data-dvt-unit="${x}">${x}${withRuns.includes(x) ? '' : ' <span class="mut">·</span>'}</button>`).join('')}
    </div>`;
  return `<div class="card"><h2>DVT campaign${where}
      <span class="mut" style="font-weight:400;text-transform:none">catalog ${escH(cat.version)} · ${u}</span></h2>
    ${stale}<div class="row" style="margin-bottom:.6rem">${picker}</div>
    ${chips}
    <div class="dvt-sum">${tile(n.owed, 'Runs owed')}${tile(n.PASS, 'Pass', 'ok-t')}${tile(n.FAIL, 'Fail', 'err-t')}${tile(n.BLOCKED, 'Blocked', 'warn-t')}${tile(open, 'Open')}</div>
    <div class="dvt-bar" title="${pct}% of the owed runs recorded"><div style="width:${pct}%"></div></div>
    ${dvtRunPanel(u, runnable)}
    ${phaseHtml}
    ${extra.length ? `<div class="dvt-phase"><div class="dvt-ph-head"><b>Other uploaded runs</b>
        <span class="mut">${extra.length} run(s) the catalog ${escH(cat.version)} no longer owes on ${u} (older catalog, other repetitions)</span></div>
        <div class="dvt-runs"><table><tr><th>Test</th><th>Variant / rep</th><th>Verdict</th><th>Operator</th><th>Recorded</th></tr>
        ${extra.map(r => `<tr><td><b>${escH(r.testId)}</b></td><td>${escH(r.variant) || '—'} r${r.rep}</td><td><span class="pill ${dvtClass(r.verdict)}">${escH(r.verdict) || 'open'}</span></td>
          <td>${escH(r.operator) || '—'}</td><td class="mut">${fmtWhen(dvtWhen(r))}</td></tr>`).join('')}</table></div></div>` : ''}
  </div>`;
}

function dvtCard() {
  if (DVT === null) return `<div class="card"><h2>DVT</h2><p class="mut">Loading…</p></div>`;
  // the CureBox list: every machine of the portal plus any CureBox a DVT unit was assigned to, and the unassigned runs
  const boxes = [...new Set([...MACHINES.map(m => m.name), ...dvtMachines()])].sort();
  const picker = `<label class="mut dvt-picker" style="font-size:.85rem">CureBox
      <select id="dvt-machine" style="margin-left:.4rem">
        <option value="all"${SELECTED === 'all' ? ' selected' : ''}>All CureBoxes</option>
        ${boxes.map(b => `<option value="${b}"${SELECTED === b ? ' selected' : ''}>${b}</option>`).join('')}
        <option value="${DVT_NONE}"${SELECTED === DVT_NONE ? ' selected' : ''}>Not assigned to a CureBox</option>
      </select></label>`;
  const all = (DVT.runs || []).filter(r => SELECTED === 'all' || (SELECTED === DVT_NONE ? !r.machine : r.machine === SELECTED));
  const where = SELECTED === 'all' ? '' : SELECTED === DVT_NONE ? ' not assigned to a CureBox' : ` on ${SELECTED}`;
  if (!all.length && !(DVT.catalog && DVT.catalog.phases)) return `<div class="card"><h2>DVT${where}</h2><div class="row" style="margin-bottom:.8rem">${picker}</div>
    <p class="mut">${(DVT.runs || []).length ? `No DVT run${where} yet - choose another CureBox above.`
      : `No DVT result has been uploaded yet. In the DVT tool (DVT/web/dvt-tool.html) open the <b>Cloud</b> box,
         paste this portal's web-app URL and the DVT key, choose the unit's <b>CureBox</b>, and press <b>Sync all</b>.`}</p></div>`;
  if (DVT.catalog && DVT.catalog.phases) return dvtCatalogCard(all, picker, where);
  const units = [...new Set(all.map(r => r.unit))].sort();
  if (DVT_UNIT !== 'all' && !units.includes(DVT_UNIT)) DVT_UNIT = 'all';
  const q = SEARCH.trim().toLowerCase();
  const runs = all
    .filter(r => DVT_UNIT === 'all' || r.unit === DVT_UNIT)
    .filter(r => !q || [r.unit, r.testId, r.variant, r.verdict, r.operator, r.note].some(v => (v || '').toLowerCase().includes(q)))
    .sort((a, b) => dvtWhen(b) - dvtWhen(a));
  const count = (list, v) => list.filter(r => (r.verdict || '').toLowerCase() === v).length;
  const summary = units.map(u => {
    const mine = all.filter(r => r.unit === u);
    const tests = new Set(mine.map(r => r.testId)).size;
    const last = Math.max(...mine.map(dvtWhen));
    return `<tr><td><b>${u}</b></td><td>${tests}</td><td>${mine.length}</td>
      <td><span class="pill on">${count(mine, 'pass')} pass</span></td>
      <td><span class="pill ${count(mine, 'fail') ? 'off' : ''}">${count(mine, 'fail')} fail</span></td>
      <td class="mut">${fmtWhen(last)}</td></tr>`;
  }).join('');
  const chips = `<div class="row" style="margin:.4rem 0 .8rem">
      <span class="mut" style="font-size:.85rem">Unit:</span>
      <button class="${DVT_UNIT === 'all' ? 'primary' : ''}" data-dvt-unit="all">All</button>
      ${units.map(u => `<button class="${DVT_UNIT === u ? 'primary' : ''}" data-dvt-unit="${u}">${u}</button>`).join('')}
    </div>`;
  const rows = runs.map(r => {
    const open = DVT_OPEN.has(r.runId);
    const vals = Object.entries(r.values || {});
    const detail = !open ? '' : `<tr><td colspan=8 style="background:var(--inset)">
        ${vals.length ? `<table>${vals.map(([k, v]) => `<tr><td class="mut">${k}</td><td><b>${String(v).replace(/</g, '&lt;')}</b></td></tr>`).join('')}</table>`
                      : '<span class="mut">No values recorded</span>'}
        ${(r.files || []).length ? `<p style="margin:.5rem 0 0">${r.files.map(f =>
            `<a href="${window.scureDvtFileHref ? window.scureDvtFileHref(DVT.fileUrl, f.id) : '#'}" target="_blank">${f.name}</a>
             <span class="mut">(${f.kind || 'file'}, ${fmtBytes(f.size)})</span>`).join(' &middot; ')}</p>` : ''}
        ${r.note ? `<p class="mut" style="margin:.5rem 0 0">${r.note.replace(/</g, '&lt;')}</p>` : ''}
      </td></tr>`;
    return `<tr data-dvt-run="${r.runId}" style="cursor:pointer">
        <td>${open ? '▾' : '▸'} <b>${r.testId}</b></td><td>${r.variant || '—'}</td><td>r${r.rep}</td>
        <td>${r.unit}</td><td>${r.machine || '<span class="mut">—</span>'}</td><td><span class="pill ${dvtClass(r.verdict)}">${r.verdict || '—'}</span></td>
        <td>${r.operator || '—'}</td><td class="mut">${fmtWhen(dvtWhen(r))}</td></tr>${detail}`;
  }).join('');
  return `<div class="card"><h2>DVT campaign${where}
      <span class="mut" style="font-weight:400;text-transform:none">${all.length} runs uploaded</span></h2>
    <div class="row" style="margin-bottom:.8rem">${picker}</div>
    <table><tr><th>Unit</th><th>Tests</th><th>Runs</th><th>Pass</th><th>Fail</th><th>Last</th></tr>${summary}</table>
    ${chips}
    <table><tr><th>Test</th><th>Variant</th><th>Rep</th><th>Unit</th><th>CureBox</th><th>Verdict</th><th>Operator</th><th>Recorded</th></tr>
      ${rows || '<tr><td colspan=8 class="mut">Nothing matches the search</td></tr>'}</table></div>`;
}

// ---- Overview: the whole DVT campaign at a glance - KPIs, the machines with their integrators, and the Gantt chart ----
// (the DVT spec, user 2026-10-22). Completion = valid finished runs / runs the catalog owes; the pass rate counts only
// finished runs; INVALID (a run without a usable result) is neither finished nor passed.
const GANTT_OPEN = new Set();
const OV_COL = { PASS: '#16a34a', FAIL: '#dc2626', BLOCKED: '#d97706', WAIVED: '#6b7280', INVALID: '#9333ea', RUNNING: '#2563eb', open: '#d4d4d8' };
const OV_DEFAULT_MIN = 10;     // a test without a duration estimate is drawn as this many minutes
const ovHours = min => min >= 60 ? `${(min / 60).toFixed(min >= 600 ? 0 : 1)} h` : `${Math.round(min)} min`;
const ovToday = () => new Date().toISOString().slice(0, 10);

/** Everything the Overview shows about one unit: its tests in catalog order, the run counters, status, remaining time. */
function dvtUnitModel(u, cat, runs, reg, requests) {
  const byId = {};
  runs.filter(r => r.unit === u).forEach(r => { byId[r.runId] = r; });
  const activeTests = new Set((requests || []).filter(q => q.unit === u && DVT_ACTIVE_ST.includes(q.status)).map(q => q.testId));
  const tests = [];
  (cat.phases || []).forEach(p => (p.tests || []).forEach(tid => {
    const t = cat.tests[tid];
    if (!t || !(t.units || []).includes(u)) return;
    const owed = (t.runs && t.runs.length ? t.runs : ['|1']).map(k => `${tid}|${u}|${k}`);
    const minutes = Number(t.minutes) > 0 ? Number(t.minutes) : OV_DEFAULT_MIN;
    tests.push({ tid, title: t.title, phase: p.name, safety: !!t.safety, owed, minutes, per: minutes / owed.length,
                 verdict: dvtTestVerdict(owed, byId), running: activeTests.has(tid) });
  }));
  const c = { total: 0, PASS: 0, FAIL: 0, BLOCKED: 0, WAIVED: 0, INVALID: 0, open: 0, doneMin: 0, totalMin: 0, safetyFails: 0 };
  tests.forEach(x => x.owed.forEach(id => {
    const v = String((byId[id] || {}).verdict || '').toUpperCase();
    c.total++; c.totalMin += x.per;
    if (v in c) c[v]++; else c.open++;
    if (['PASS', 'FAIL', 'WAIVED'].includes(v)) c.doneMin += x.per;
    if (v === 'FAIL' && x.safety) c.safetyFails++;
  }));
  const finished = c.PASS + c.FAIL + c.WAIVED;
  const complete = c.total > 0 && finished === c.total;
  let status = 'Not started';
  if (complete) status = 'Complete';
  else if (c.FAIL) status = 'Failures';
  else if (c.BLOCKED || c.INVALID) status = 'Blocked';
  else if (activeTests.size || finished) status = 'In progress';
  const late = !complete && !!(reg.planEnd && ovToday() > reg.planEnd);
  const ranBy = runs.filter(r => r.unit === u && r.machine).sort((a, b) => dvtWhen(b) - dvtWhen(a))[0];
  const runnerOf = ((DVT && DVT.runners) || []).find(x => x.unit === u);
  const machine = reg.machine || (ranBy && ranBy.machine) || (runnerOf && runnerOf.machine) || '';
  return { u, reg, tests, c, finished, complete, status, late, machine, active: activeTests.size > 0,
           remainingMin: Math.max(0, c.totalMin - c.doneMin),
           completion: c.total ? finished / c.total * 100 : 0,
           passRate: c.PASS + c.FAIL ? c.PASS / (c.PASS + c.FAIL) * 100 : null,
           weighted: c.totalMin ? c.doneMin / c.totalMin * 100 : 0 };
}

const OV_STATUS_CLASS = { 'Complete': 'on', 'In progress': '', 'Failures': 'off', 'Blocked': 'warn', 'Not started': '' };

/** The Gantt: a row per unit (its tests laid end to end by their estimated minutes), click a row for its tests. */
function ganttSvg(models) {
  const W = 1000, L = 96, R = 16, TOP = 24, ROW = 26, SUB = 15;
  const maxMin = Math.max(60, ...models.map(m => m.tests.reduce((n, x) => n + x.minutes, 0)));
  const scale = (W - L - R) / maxMin;
  let y = TOP, body = '';
  models.forEach(m => {
    const open = GANTT_OPEN.has(m.u);
    let x = L;
    body += `<g class="gantt-row" data-gantt="${escH(m.u)}" style="cursor:pointer"><text x="6" y="${y + 17}" font-size="12" font-weight="700" fill="currentColor">${open ? '▾' : '▸'} ${escH(m.u)}</text>`;
    m.tests.forEach(t => {
      const w = Math.max(1.5, t.minutes * scale);
      const col = t.running ? OV_COL.RUNNING : OV_COL[t.verdict] || OV_COL.open;
      const part = t.verdict === 'progress' ? 0.5 : 1;
      body += `<rect x="${x.toFixed(1)}" y="${y + 3}" width="${w.toFixed(1)}" height="${ROW - 8}" fill="${col}" opacity="${t.verdict === 'open' && !t.running ? 0.55 : 1}" stroke="var(--panel)" stroke-width="0.6"><title>${escH(t.tid)} ${escH(t.title)} - ${ovHours(t.minutes)} - ${t.running ? 'running' : escH(t.verdict)}</title></rect>`;
      if (part < 1) body += `<rect x="${x.toFixed(1)}" y="${y + ROW - 7}" width="${(w * part).toFixed(1)}" height="2" fill="${OV_COL.RUNNING}"/>`;
      x += t.minutes * scale;
    });
    body += '</g>';
    y += ROW;
    if (open) m.tests.forEach(t => {
      body += `<text x="14" y="${y + 11}" font-size="10" fill="currentColor" opacity="0.8">${escH(t.tid)}</text>`;
      const off = m.tests.slice(0, m.tests.indexOf(t)).reduce((n, q) => n + q.minutes, 0);
      const col = t.running ? OV_COL.RUNNING : OV_COL[t.verdict] || OV_COL.open;
      body += `<rect x="${(L + off * scale).toFixed(1)}" y="${y + 2}" width="${Math.max(1.5, t.minutes * scale).toFixed(1)}" height="${SUB - 5}" fill="${col}" opacity="${t.verdict === 'open' && !t.running ? 0.55 : 1}"><title>${escH(t.tid)} ${escH(t.title)} - ${ovHours(t.minutes)}</title></rect>`;
      y += SUB;
    });
  });
  // the time axis: whole hours (or minutes on a short chart), the width being the longest unit
  const step = maxMin > 1200 ? 240 : maxMin > 480 ? 120 : maxMin > 120 ? 60 : 30;
  let axis = '';
  for (let mn = 0; mn <= maxMin; mn += step) {
    const gx = L + mn * scale;
    axis += `<line x1="${gx.toFixed(1)}" y1="${TOP - 6}" x2="${gx.toFixed(1)}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${gx.toFixed(1)}" y="12" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.7">${mn >= 60 ? mn / 60 + ' h' : mn + ' min'}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${y + 8}" style="width:100%;height:auto;color:var(--text)" role="img" aria-label="DVT Gantt chart">${axis}${body}</svg>`;
}

/** The one sentence the Overview opens with, and the one button that goes with it. */
function overviewNow(models, n) {
  const runner = (DVT.runners || []).slice().sort((a, b) => (b.online - a.online) || (b.lastSeen - a.lastSeen))[0] || null;
  const box = runner ? runner.machine : (MACHINES[0] || {}).name || '';
  const mine = runner ? models.find(m => m.u === runner.unit) : null;
  const ready = mine ? mine.tests.filter(t => (DVT.catalog.tests[t.tid] || {}).auto && (t.verdict === 'open' || t.verdict === 'progress') && !t.running).length : 0;
  const running = models.some(m => m.active);
  const go = (label) => box ? `<button class="primary" data-now-go="${escH(box)}">${label}</button>` : '';
  const card = (tone, title, sub, btn) => `<div class="now ${tone}"><div class="t">${title}${sub ? `<span class="s">${sub}</span>` : ''}</div>${btn || ''}</div>`;
  if (models.length && models.every(m => m.complete)) return card('good', 'The whole DVT is finished', 'Every unit has all its runs.', '');
  if (n.failed) return card('bad', `${n.failed} test run${n.failed > 1 ? 's' : ''} failed`, 'Open the DVT list to see which, and run them again after the fix.', go('See the tests'));
  if (n.blocked) return card('warn', `${n.blocked} run${n.blocked > 1 ? 's are' : ' is'} blocked or invalid`, 'They need a look before the unit can finish.', go('See the tests'));
  if (running) return card('', 'A test is running', 'It follows live in the DVT list.', go('Follow it'));
  if (runner && !runner.online) return card('warn', `The DVT runner on ${escH(box)} is offline`, 'Tests cannot be started from here until it is back.', '');
  if (ready) return card('', `${ready} test${ready > 1 ? 's are' : ' is'} ready to run on ${escH(box)}`, 'Nothing starts until someone presses Start at the machine.', go('Run tests'));
  return card('', 'Nothing needs your attention', 'Follow the progress below.', '');
}

function overviewCard() {
  if (!DVT || !DVT.catalog) return `<div class="card"><h2>Overview</h2><p class="mut">${DVT ? 'No DVT catalog has reached the portal yet - open the DVT tool once with the cloud connected.' : 'Loading…'}</p></div>`;
  const cat = DVT.catalog, runs = DVT.runs || [];
  const regOf = {};
  (DVT.units || []).forEach(x => { regOf[x.unit] = x; });
  const unitNames = [...new Set([...Object.values(cat.tests).flatMap(t => t.units || []), ...(DVT.units || []).map(x => x.unit)])].sort();
  const models = unitNames.map(u => dvtUnitModel(u, cat, runs, regOf[u] || { unit: u }, DVT.requests));
  const sum = k => models.reduce((n, m) => n + m.c[k], 0);
  const total = sum('total'), finished = models.reduce((n, m) => n + m.finished, 0);
  const pass = sum('PASS'), fail = sum('FAIL'), blocked = sum('BLOCKED'), invalid = sum('INVALID'), waived = sum('WAIVED');
  const totalMin = models.reduce((n, m) => n + m.c.totalMin, 0), doneMin = models.reduce((n, m) => n + m.c.doneMin, 0);
  const remaining = Math.max(0, totalMin - doneMin);
  const slowest = Math.max(0, ...models.map(m => m.remainingMin));
  const critical = sum('safetyFails') + blocked;
  const tile = (num, label, cls) => `<div class="dvt-tile"><div class="num ${cls || ''}">${num}</div><div class="mut">${label}</div></div>`;
  const pct = (a, b) => !b ? '—' : a / b * 100 < 10 && a ? `${(a / b * 100).toFixed(1)} %` : `${Math.round(a / b * 100)} %`;
  const active = models.filter(m => m.status === 'In progress' || m.active).length;
  const stale = DVT.build && DVT.build !== PORTAL_BUILD
    ? `<div class="dvt-prompt" style="margin-bottom:.8rem"><b>This page is out of date</b> - the portal was updated since it was opened.
       <button class="primary" onclick="location.reload()" style="margin-left:.6rem">Reload</button></div>` : '';
  const online = name => { const m = MACHINES.find(x => x.name === name); return m ? (m.online ? ' ●' : ' ○') : ''; };
  const inp = (u, f, v, ph, type) => `<input data-ov-unit="${escH(u)}" data-ov-field="${f}" type="${type || 'text'}" value="${escH(v || '')}" placeholder="${ph}" style="width:${type === 'date' ? '9.5' : '8'}rem">`;
  const rows = models.map(m => `<tr>
      <td><b>${escH(m.u)}</b><br><span class="mut">${escH(m.machine) || 'no machine yet'}${online(m.machine)}</span></td>
      <td data-l="Integrator">${inp(m.u, 'integrator', m.reg.integrator, 'Integrator')}</td>
      <td data-l="Revisions">${inp(m.u, 'hwRev', m.reg.hwRev, 'HW rev')}<br>${inp(m.u, 'fwVersion', m.reg.fwVersion, 'Firmware')}</td>
      <td data-l="Plan">${inp(m.u, 'planStart', m.reg.planStart, 'Start', 'date')}<br>${inp(m.u, 'planEnd', m.reg.planEnd, 'Planned end', 'date')}</td>
      <td data-l="Progress" style="min-width:9rem"><div class="dvt-bar" style="margin:.2rem 0"><div style="height:100%;width:${m.completion.toFixed(0)}%;background:${OV_COL.PASS}"></div></div>
        ${m.completion > 0 && m.completion < 10 ? m.completion.toFixed(1) : Math.round(m.completion)} % · ${m.finished}/${m.c.total} runs<br><span class="mut">${m.weighted > 0 && m.weighted < 10 ? m.weighted.toFixed(1) : Math.round(m.weighted)} % by time</span></td>
      <td data-l="Status"><span class="pill ${OV_STATUS_CLASS[m.status] || ''}">${m.status}</span>${m.late ? ' <span class="pill off">Delayed</span>' : ''}<br>
        <span class="mut">${m.c.PASS} pass · ${m.c.FAIL} fail${m.c.BLOCKED ? ' · ' + m.c.BLOCKED + ' blocked' : ''}${m.c.INVALID ? ' · ' + m.c.INVALID + ' invalid' : ''}</span></td>
      <td data-l="Remaining">${m.complete ? '—' : '≈ ' + ovHours(m.remainingMin)}</td></tr>`).join('');
  return stale + overviewNow(models, { failed: fail, blocked: blocked + invalid, critical }) + `<div class="card"><h2>DVT overview <span class="mut" style="font-weight:400">catalog ${escH(cat.version || '')} · ${models.length} units</span></h2>
    <div class="dvt-tiles ov-main" style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.6rem;margin-bottom:.6rem">
      ${tile(pct(finished, total), 'Completion', 'ok')}${tile(pass, 'Passed', 'ok')}${tile(fail, 'Failed', fail ? 'err' : '')}${tile(ovHours(remaining), 'Test time left')}
    </div>
    <details class="more"><summary>More numbers</summary>
    <div class="dvt-tiles" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.6rem;margin:.4rem 0 1rem">
      ${tile(models.length, 'Machines (units)')}${tile(active, 'Active')}${tile(total, 'Runs planned')}${tile(finished, 'Runs finished')}
      ${tile(blocked, 'Blocked', blocked ? 'warn' : '')}${tile(invalid, 'Invalid', invalid ? 'warn' : '')}${tile(waived, 'Waived')}
      ${tile(pct(pass, pass + fail), 'Pass rate')}${tile(pct(doneMin, totalMin), 'Progress by time')}
      ${tile(ovHours(slowest), 'Until the slowest unit is done')}${tile(critical, 'Critical issues', critical ? 'err' : '')}
    </div>
    <p class="mut" style="margin:.2rem 0 .8rem">Completion counts valid finished runs (pass, fail, waived) of the runs the catalog owes. The pass rate counts only finished runs.
      Time is the catalog's estimate for what is still open; units run in parallel, so the last column is the one to plan by.
      Critical issues = failed safety tests + blocked runs.</p></details></div>
    <div class="card"><h2>Machines and integrators</h2>
      <div style="overflow-x:auto"><table class="ov-units"><tr><th>Unit</th><th>Integrator</th><th>Revisions</th><th>Plan</th><th>Progress</th><th>Status</th><th>Remaining</th></tr>${rows}</table></div>
      <p class="mut" style="margin:.5rem 0 0">Changes are saved when you leave a field.</p></div>
    <div class="card"><h2>Gantt <span class="mut" style="font-weight:400;text-transform:none">each unit's tests end to end by their estimated duration · click a unit for its tests</span></h2>
      ${ganttSvg(models)}
      <div class="row" style="gap:.9rem;margin-top:.4rem;flex-wrap:wrap">${['PASS', 'FAIL', 'BLOCKED', 'WAIVED', 'INVALID', 'RUNNING', 'open'].map(k =>
        `<span class="mut" style="font-size:.8rem"><span style="display:inline-block;width:.8rem;height:.8rem;border-radius:2px;background:${OV_COL[k]};vertical-align:-1px"></span> ${k === 'open' ? 'not run' : k.toLowerCase()}</span>`).join('')}</div></div>`;
}

function overviewWire() {
  [...document.querySelectorAll('[data-now-go]')].forEach(b => b.onclick = () => {
    SELECTED = b.dataset.nowGo; VIEW = 'dvt';
    try { localStorage.setItem('scure-curebox', SELECTED); } catch (e) { /* no storage: the choice is just not remembered */ }
    render(); loadDvt(); dvtLongPoll();
  });
  [...document.querySelectorAll('[data-gantt]')].forEach(g => g.onclick = () => {
    const u = g.dataset.gantt;
    if (GANTT_OPEN.has(u)) GANTT_OPEN.delete(u); else GANTT_OPEN.add(u);
    render();
  });
  [...document.querySelectorAll('[data-ov-unit]')].forEach(i => i.onchange = async () => {
    i.style.outline = '';
    try {
      const r = await api('/api/dvt/unit', { method: 'POST', body: JSON.stringify({ unit: i.dataset.ovUnit, fields: { [i.dataset.ovField]: i.value } }) });
      if (!r.ok) { i.style.outline = '2px solid var(--err)'; i.title = r.message || 'not saved'; return; }
      i.title = 'saved';
      await loadDvt();
    } catch { i.style.outline = '2px solid var(--err)'; }
  });
}

// ---- Compare: the recorded results of one test side by side, and the measured curves laid over each other ----
// How it works (user, 2026-10-22: "build a system to compare the data"): every run records its values (numbers, yes/no
// checks, text) and its raw sample files. A comparison needs a fixed test and variant; then the columns are either the UNITS
// (is every machine the same?) or the RUNS of one unit (is it repeatable, did it drift after a change?). A number is compared with
// a reference column and flagged when it is off by more than the tolerance; a yes/no check is flagged when the columns disagree.
const CMP = { mode: 'units', test: '', variant: null, unit: '', basis: 'latest', ref: '', tol: 10, kind: '', col: '', texts: {}, loading: false, err: '' };
const CMP_COLORS = ['#2563eb', '#dc2626', '#16a34a', '#d97706', '#9333ea', '#0891b2', '#db2777', '#4b5563'];
const cmpIsStamp = k => /(^|_)(timestamp|time_stamp)$|^timestamp/i.test(k);
const cmpNum = v => typeof v === 'number' && isFinite(v);
const cmpFmt = v => cmpNum(v) ? (Math.abs(v) >= 1000 ? v.toFixed(0) : Math.abs(v) >= 100 ? v.toFixed(1) : String(Math.round(v * 1000) / 1000)) : v === true ? 'yes' : v === false ? 'no' : v == null ? '—' : String(v);

/** Runs that recorded something, with their values. */
const cmpRuns = () => ((DVT && DVT.runs) || []).filter(r => r.values && Object.keys(r.values).length);

/** The columns of the comparison: one per unit (latest run, or the mean of its repetitions) or one per run of a unit. */
function cmpColumns(runs) {
  const sel = runs.filter(r => r.testId === CMP.test && (CMP.variant === null || r.variant === CMP.variant));
  if (CMP.mode === 'runs') {
    return sel.filter(r => r.unit === CMP.unit).sort((a, b) => dvtWhen(a) - dvtWhen(b)).map(r => ({
      label: `r${r.rep}${r.variant ? ' ' + r.variant : ''}`, sub: fmtWhen(dvtWhen(r)), unit: r.unit, runs: [r], values: r.values, verdict: String(r.verdict || '').toUpperCase() }));
  }
  const byUnit = {};
  sel.forEach(r => { (byUnit[r.unit] = byUnit[r.unit] || []).push(r); });
  const owedBy = ((DVT.catalog.tests[CMP.test] || {}).units || []);
  return [...new Set([...owedBy, ...Object.keys(byUnit)])].sort().map(u => {
    if (!byUnit[u]) return { label: u, sub: 'no results yet', unit: u, runs: [], values: {}, verdict: '', empty: true };
    const rs = byUnit[u].sort((a, b) => dvtWhen(a) - dvtWhen(b));
    const last = rs[rs.length - 1];
    let values = last.values;
    if (CMP.basis === 'mean' && rs.length > 1) {
      values = {};
      const keys = [...new Set(rs.flatMap(r => Object.keys(r.values)))];
      keys.forEach(k => {
        const nums = rs.map(r => r.values[k]).filter(cmpNum);
        values[k] = nums.length === rs.filter(r => r.values[k] != null).length && nums.length ? nums.reduce((a, b) => a + b, 0) / nums.length : last.values[k];
      });
    }
    return { label: u, sub: rs.length > 1 ? `${rs.length} runs (${CMP.basis === 'mean' ? 'mean' : 'latest'})` : fmtWhen(dvtWhen(last)), unit: u, runs: rs, values, verdict: String(last.verdict || '').toUpperCase() };
  });
}

/** One row per recorded field: kind (number / check / text), the cells, and what stands out. */
function cmpRows(cols, tol, refIdx) {
  const keys = [];
  cols.forEach(c => Object.keys(c.values).forEach(k => { if (!keys.includes(k)) keys.push(k); }));
  const rows = keys.map(k => {
    const vals = cols.map(c => c.values[k]);
    const present = vals.filter(v => v != null);
    const kind = cmpIsStamp(k) ? 'stamp' : present.length && present.every(cmpNum) ? 'num' : present.length && present.every(v => typeof v === 'boolean') ? 'bool' : 'text';
    const row = { k, vals, kind, flag: 0, cells: vals.map(() => 0) };
    if (kind === 'num') {
      const ns = present;
      row.min = Math.min(...ns); row.max = Math.max(...ns); row.mean = ns.reduce((a, b) => a + b, 0) / ns.length;
      row.spread = row.max - row.min;
      row.spreadPct = row.mean ? row.spread / Math.abs(row.mean) * 100 : null;
      const ref = vals[refIdx];
      row.dev = vals.map((v, i) => !cmpNum(v) || !cmpNum(ref) || i === refIdx ? null : ref ? (v - ref) / Math.abs(ref) * 100 : (v - ref));
      row.dev.forEach((d, i) => { if (d == null) return; const a = Math.abs(d); row.cells[i] = a > 2 * tol ? 2 : a > tol ? 1 : 0; });
    } else if (kind === 'bool' || kind === 'text') {
      const first = vals[refIdx];
      vals.forEach((v, i) => { if (i !== refIdx && v != null && first != null && String(v) !== String(first)) row.cells[i] = kind === 'bool' ? 2 : 1; });
    }
    row.flag = Math.max(0, ...row.cells);
    return row;
  });
  const order = { num: 0, bool: 1, text: 2, stamp: 3 };
  return rows.sort((a, b) => order[a.kind] - order[b.kind]);
}

/** CSV text -> {header, rows} with numbers parsed (quote-aware, the tool's csvText). */
function cmpParseCsv(text) {
  const lines = String(text || '').split(/\r?\n/).filter(l => l.length);
  const split = l => {
    const out = []; let cur = '', q = false;
    for (let i = 0; i < l.length; i++) {
      const ch = l[i];
      if (q) { if (ch === '"' && l[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
      else if (ch === '"') q = true; else if (ch === ',') { out.push(cur); cur = ''; } else cur += ch;
    }
    out.push(cur);
    return out;
  };
  if (!lines.length) return { header: [], rows: [] };
  const header = split(lines[0]);
  const rows = lines.slice(1).map(l => split(l).map(v => (v !== '' && isFinite(Number(v)) ? Number(v) : v === '' ? null : v)));
  return { header, rows };
}

/** The sample files of the compared runs, by kind: {kind: [{id, name, col (column label), run}]}. */
function cmpFiles(cols) {
  const out = {};
  cols.forEach(c => c.runs.forEach(r => (r.files || []).forEach(f => {
    if (!/\.csv$/i.test(f.name)) return;
    (out[f.kind] = out[f.kind] || []).push({ id: f.id, name: f.name, label: CMP.mode === 'runs' ? `r${r.rep} ${fmtWhen(dvtWhen(r))}` : `${c.unit}${r.rep > 1 ? ' r' + r.rep : ''}`, run: r });
  })));
  return out;
}

async function cmpLoadFiles(list) {
  const need = list.filter(f => !(f.id in CMP.texts)).map(f => f.id).slice(0, 8);
  if (!need.length || CMP.loading) return;
  CMP.loading = true; CMP.err = '';
  if (VIEW === 'compare') render();
  try {
    const r = await api('/api/dvt/files', { method: 'POST', body: JSON.stringify({ ids: need }) });
    if (r && r.files) need.forEach(id => { CMP.texts[id] = r.files[id] ? cmpParseCsv(r.files[id].text) : { header: [], rows: [] }; });
    else CMP.err = (r && r.message) || 'the files could not be loaded';
  } catch { CMP.err = 'the files could not be loaded'; }
  CMP.loading = false;
  if (VIEW === 'compare') render();
}

/** The curves of the chosen column, one line per file, on shared axes. */
function cmpChart(series, xName, yName) {
  const W = 1000, H = 340, L = 56, R = 16, T = 12, B = 34;
  const pts = series.flatMap(s => s.pts);
  if (!pts.length) return '<p class="mut">No numeric samples in this column.</p>';
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (x1 === x0) x1 = x0 + 1;
  if (y1 === y0) { y1 += 1; y0 -= 1; }
  const pad = (y1 - y0) * 0.06; y0 -= pad; y1 += pad;
  const sx = x => L + (x - x0) / (x1 - x0) * (W - L - R), sy = y => T + (1 - (y - y0) / (y1 - y0)) * (H - T - B);
  let g = '';
  for (let i = 0; i <= 5; i++) {
    const yv = y0 + (y1 - y0) * i / 5, xv = x0 + (x1 - x0) * i / 5;
    g += `<line x1="${L}" y1="${sy(yv).toFixed(1)}" x2="${W - R}" y2="${sy(yv).toFixed(1)}" stroke="var(--line)"/><text x="${L - 6}" y="${(sy(yv) + 3).toFixed(1)}" font-size="10" text-anchor="end" fill="currentColor" opacity="0.7">${cmpFmt(Math.round(yv * 100) / 100)}</text>`;
    g += `<text x="${sx(xv).toFixed(1)}" y="${H - 18}" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.7">${cmpFmt(Math.round(xv * 10) / 10)}</text>`;
  }
  // a temperature curve gets a dashed line at 30 / 40 / 50 / 60 C: read across from it to see how long each temperature takes (drying times)
  const marks = /chamber|temp/i.test(yName) ? [30, 40, 50, 60].filter(v => v > y0 && v < y1).map(v =>
    `<line data-mark="${v}" x1="${L}" y1="${sy(v).toFixed(1)}" x2="${W - R}" y2="${sy(v).toFixed(1)}" stroke="currentColor" stroke-opacity="0.35" stroke-dasharray="5 4"/>` +
    `<text x="${W - R - 2}" y="${(sy(v) - 3).toFixed(1)}" font-size="10" text-anchor="end" fill="currentColor" opacity="0.6">${v} °C</text>`).join('') : '';
  const lines = series.map((s, i) => `<polyline fill="none" stroke="${CMP_COLORS[i % CMP_COLORS.length]}" stroke-width="1.6" points="${s.pts.map(p => sx(p[0]).toFixed(1) + ',' + sy(p[1]).toFixed(1)).join(' ')}"><title>${escH(s.label)}</title></polyline>`).join('');
  const legend = series.map((s, i) => `<span style="font-size:.8rem"><span style="display:inline-block;width:.9rem;height:3px;background:${CMP_COLORS[i % CMP_COLORS.length]};vertical-align:middle"></span> ${escH(s.label)}</span>`).join(' &nbsp; ');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;color:var(--text)" role="img" aria-label="Curve comparison">${g}${marks}${lines}
    <text x="${(L + W - R) / 2}" y="${H - 4}" font-size="11" text-anchor="middle" fill="currentColor">${escH(xName)}</text>
    <text x="12" y="${H / 2}" font-size="11" text-anchor="middle" fill="currentColor" transform="rotate(-90 12 ${H / 2})">${escH(yName)}</text></svg>
    <div class="row" style="gap:.4rem;flex-wrap:wrap;margin-top:.3rem">${legend}</div>`;
}


/** Every test against every unit of the campaign: who has run what, and where the units disagree. */
function cmpMatrix() {
  const cat = DVT.catalog, runs = DVT.runs || [];
  const regOf = {};
  (DVT.units || []).forEach(x => { regOf[x.unit] = x; });
  const unitNames = [...new Set(Object.values(cat.tests).flatMap(t => t.units || []))].sort();
  const models = unitNames.map(u => dvtUnitModel(u, cat, runs, regOf[u] || { unit: u }, DVT.requests));
  const head = models.map(m => `<th style="text-align:center">${escH(m.u)}<br><span class="mut" style="font-weight:400">${Math.round(m.completion)} % done</span></th>`).join('');
  let flagged = 0;
  const body = (cat.phases || []).map(p => {
    const rows = (p.tests || []).filter(tid => cat.tests[tid]).map(tid => {
      const cells = models.map(m => { const t = m.tests.find(x => x.tid === tid); return t ? (t.running ? 'RUNNING' : t.verdict) : null; });
      const done = cells.filter(v => ['PASS', 'FAIL', 'WAIVED'].includes(v));
      const differs = new Set(done).size > 1;
      if (differs) flagged++;
      const pill = v => v === null ? '<span class="mut">n/a</span>' : v === 'open' ? '<span class="mut">not run</span>' : v === 'progress' ? '<span class="pill">partly</span>' : v === 'RUNNING' ? '<span class="pill">running</span>' : `<span class="pill ${dvtClass(v)}">${escH(v)}</span>`;
      return `<tr class="cmp-mrow" data-test="${escH(tid)}" data-flag="${differs ? 1 : 0}" style="cursor:pointer;${differs ? 'background:rgba(220,38,38,.07)' : ''}">
        <td><b>${escH(tid)}</b> <span class="mut">${escH(cat.tests[tid].title)}</span>${differs ? ' <span class="pill off">units differ</span>' : ''}</td>${cells.map(v => `<td style="text-align:center">${pill(v)}</td>`).join('')}</tr>`;
    }).join('');
    return rows ? `<tr><td colspan="${models.length + 1}" class="mut" style="font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;padding-top:.8rem">${escH(p.name)}</td></tr>${rows}` : '';
  }).join('');
  return `<p class="mut" style="margin:.2rem 0 .8rem">${flagged ? flagged + ' test(s) have finished with a different result on different units.' : 'No test has finished with different results on different units.'}
      Click a test to compare its values.</p>
    <div style="overflow-x:auto"><table class="cmp-table"><tr><th>Test</th>${head}</tr>${body}</table></div>`;
}

function compareCard() {
  if (!DVT || !DVT.catalog) return `<div class="card"><h2>Compare</h2><p class="mut">${DVT ? 'No DVT catalog has reached the portal yet.' : 'Loading…'}</p></div>`;
  const runs = cmpRuns(), cat = DVT.catalog;
  const testIds = [...new Set(runs.map(r => r.testId))].sort();
  if (CMP.mode === 'matrix') return `<div class="card"><h2>Compare results <span class="mut" style="font-weight:400;text-transform:none">all units, all tests</span></h2>
    <div class="row" style="gap:1rem;align-items:flex-end;margin-bottom:.8rem">${cmpModeSelect()}</div>${cmpMatrix()}</div>`;
  if (!testIds.length) return `<div class="card"><h2>Compare</h2><div class="row" style="margin-bottom:.8rem">${cmpModeSelect()}</div><p class="mut">No run has recorded values yet. Once tests have results on the units, they can be compared here.</p></div>`;
  if (!testIds.includes(CMP.test)) { CMP.test = testIds[0]; CMP.variant = null; }
  const ofTest = runs.filter(r => r.testId === CMP.test);
  const variants = [...new Set(ofTest.map(r => r.variant))];
  if (CMP.variant === null || !variants.includes(CMP.variant)) CMP.variant = variants[0];
  const units = [...new Set(ofTest.map(r => r.unit))].sort();
  if (!units.includes(CMP.unit)) CMP.unit = units[0];
  const cols = cmpColumns(runs);
  const withData = cols.filter(c => !c.empty);
  if (!withData.some(c => c.unit === CMP.ref) || CMP.mode === 'runs') CMP.ref = withData[0] ? withData[0].unit : '';
  const refIdx = CMP.mode === 'runs' ? 0 : Math.max(0, cols.findIndex(c => c.unit === CMP.ref));
  const rows = cmpRows(cols, CMP.tol, refIdx);
  const title = t => `${t}${cat.tests[t] ? ' - ' + cat.tests[t].title : ''}`;
  const sel = (id, opts, cur, label) => `<label class="mut" style="font-size:.8rem">${label}<br><select id="${id}">${opts.map(([v, t, off]) => `<option value="${escH(v)}" ${off ? 'disabled' : ''} ${String(v) === String(cur) ? 'selected' : ''}>${escH(t)}</option>`).join('')}</select></label>`;
  const controls = `<div class="row cmp-controls" style="gap:1rem;align-items:flex-end;margin-bottom:.8rem;flex-wrap:wrap">
      ${sel('cmp-test', testIds.map(t => [t, title(t)]), CMP.test, 'Test')}
      ${variants.length > 1 || variants[0] ? sel('cmp-variant', variants.map(v => [v, v || '—']), CMP.variant, 'Variant') : ''}
      ${cmpModeSelect()}
      ${CMP.mode === 'runs' ? sel('cmp-unit', units.map(u => [u, u]), CMP.unit, 'Unit')
        : sel('cmp-ref', cols.map(c => [c.unit, c.empty ? c.unit + ' (no results)' : c.unit, c.empty]), CMP.ref, 'Reference unit') + sel('cmp-basis', [['latest', 'Latest run'], ['mean', 'Mean of repetitions']], CMP.basis, 'Value of a unit')}
      <label class="mut" style="font-size:.8rem">Tolerance<br><input id="cmp-tol" type="number" min="0.1" step="0.5" value="${CMP.tol}" style="width:5rem"> %</label></div>`;
  let table;
  if (!cols.length) table = '<p class="mut">No recorded run for this selection.</p>';
  else {
    const head = cols.map((c, i) => `<th style="text-align:right${c.empty ? ';opacity:.55' : ''}">${escH(c.label)}${i === refIdx ? ' <span class="badge">ref</span>' : ''}<br><span class="mut" style="font-weight:400">${escH(c.sub)}</span></th>`).join('');
    const showStats = withData.length > 1;
    const verdictCells = cols.map(c => `<td style="text-align:right">${c.empty ? '<span class="mut">—</span>' : `<span class="pill ${dvtClass(c.verdict)}">${escH(c.verdict) || 'open'}</span>`}</td>`).join('');
    const tint = f => f === 2 ? 'background:rgba(220,38,38,.14);font-weight:700' : f === 1 ? 'background:rgba(217,119,6,.16)' : '';
    const body = rows.map(r => {
      const cells = r.vals.map((v, i) => {
        const dev = r.dev && r.dev[i] != null ? `<br><span class="mut" style="font-size:.75rem">${r.dev[i] > 0 ? '+' : ''}${r.dev[i].toFixed(1)} %</span>` : '';
        return `<td style="text-align:right;${tint(r.cells[i])}">${r.kind === 'text' || r.kind === 'stamp' ? `<span class="mut" style="font-size:.8rem">${escH(cmpFmt(v))}</span>` : escH(cmpFmt(v))}${dev}</td>`;
      }).join('');
      const stats = !showStats ? '' : r.kind === 'num'
        ? `<td class="mut" style="text-align:right">${cmpFmt(r.min)} .. ${cmpFmt(r.max)}</td><td style="text-align:right;${r.spreadPct != null && r.spreadPct > CMP.tol ? 'font-weight:700' : ''}">${r.spreadPct == null ? cmpFmt(r.spread) : r.spreadPct.toFixed(1) + ' %'}</td>`
        : `<td></td><td style="text-align:right">${r.flag ? 'differs' : ''}</td>`;
      return `<tr class="cmp-row" data-flag="${r.flag}"><td><b>${escH(r.k)}</b></td>${cells}${stats}</tr>`;
    }).join('');
    const flagged = rows.filter(r => r.flag).length;
    table = `<div style="overflow-x:auto"><table class="cmp-table"><tr><th>Field</th>${head}${showStats ? '<th style="text-align:right">Range</th><th style="text-align:right">Spread</th>' : ''}</tr>
        <tr><td><b>Result</b></td>${verdictCells}${showStats ? '<td></td><td></td>' : ''}</tr>${body}</table></div>
      <p class="mut" style="margin:.5rem 0 0">${withData.length < 2 ? (CMP.mode === 'runs' ? 'Only one run of this unit recorded this test - nothing to compare yet.' : `Only one unit has results for this test - nothing to compare yet${cols.some(c => c.empty) ? ' (no results yet on ' + cols.filter(c => c.empty).map(c => c.unit).join(', ') + ')' : ''}.`)
        : `${flagged ? flagged + ' of ' + rows.length + ' fields stand out' : 'No field stands out'}: amber = off the reference by more than ${CMP.tol} % (or a text that differs), red = by more than ${2 * CMP.tol} % (or a yes / no check that differs).
          Spread = (max - min) / mean. The reference is the ${CMP.mode === 'runs' ? 'first run' : 'chosen unit'}.`}</p>`;
  }
  // the curves
  const files = cmpFiles(cols), kinds = Object.keys(files).sort();
  let curves = '';
  if (kinds.length) {
    if (!kinds.includes(CMP.kind)) { CMP.kind = kinds[0]; CMP.col = ''; }
    const list = files[CMP.kind];
    const loaded = list.filter(f => CMP.texts[f.id] && CMP.texts[f.id].header.length);
    const header = loaded.length ? CMP.texts[loaded[0].id].header : [];
    const numCols = header.filter((h, i) => i > 0 && loaded.some(f => CMP.texts[f.id].rows.some(r => cmpNum(r[i]))));
    if (!numCols.includes(CMP.col)) CMP.col = numCols[0] || '';
    let chart = '';
    if (CMP.err) chart = `<p class="pill off">${escH(CMP.err)}</p>`;
    else if (CMP.loading) chart = '<p class="mut">Loading the files…</p>';
    else if (list.some(f => !(f.id in CMP.texts))) chart = `<p class="mut">${list.filter(f => !(f.id in CMP.texts)).length} file(s) not loaded yet.</p>`;
    else if (CMP.col) {
      const xi = 0, yi = header.indexOf(CMP.col);
      const series = loaded.map(f => {
        const d = CMP.texts[f.id], step = Math.max(1, Math.floor(d.rows.length / 800));
        return { label: f.label, pts: d.rows.filter((r, i) => i % step === 0 && cmpNum(r[xi]) && cmpNum(r[d.header.indexOf(CMP.col)])).map(r => [r[xi], r[d.header.indexOf(CMP.col)]]) };
      }).filter(s => s.pts.length);
      chart = yi < 0 ? '' : series.length ? cmpChart(series, header[0], CMP.col) : '<p class="mut">No numeric samples in this column.</p>';
    } else chart = '<p class="mut">These files have no numeric column to plot.</p>';
    curves = `<div class="card"><h2>Curves <span class="mut" style="font-weight:400;text-transform:none">${list.length} file(s) of the compared ${CMP.mode === 'runs' ? 'runs' : 'units'}, laid on one chart</span></h2>
      <div class="row" style="gap:1rem;align-items:flex-end;margin-bottom:.6rem;flex-wrap:wrap">
        ${sel('cmp-kind', kinds.map(k => [k, k.replace(/_/g, ' ') + ' (' + files[k].length + ')']), CMP.kind, 'Measurement')}
        ${numCols.length ? sel('cmp-col', numCols.map(c => [c, c]), CMP.col, 'Column') : ''}
        <button id="cmp-load" ${CMP.loading ? 'disabled' : ''}>${loaded.length === list.length ? 'Reload' : 'Load the curves'}</button></div>${chart}</div>`;
  }
  return `<div class="card"><h2>Compare results <span class="mut" style="font-weight:400;text-transform:none">${escH(title(CMP.test))}</span></h2>${controls}${table}</div>${curves}`;
}

const cmpModeSelect = () => `<label class="mut" style="font-size:.8rem">Compare<br><select id="cmp-mode">${[['units', 'Across units'], ['runs', 'Across runs of one unit'], ['matrix', 'All units, all tests']]
  .map(([v, t]) => `<option value="${v}" ${v === CMP.mode ? 'selected' : ''}>${t}</option>`).join('')}</select></label>`;

function compareWire() {
  [...document.querySelectorAll('.cmp-mrow')].forEach(r => r.onclick = () => { CMP.test = r.dataset.test; CMP.variant = null; CMP.mode = 'units'; CMP.kind = ''; CMP.col = ''; render(); });
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onchange = () => { CMP.err = ''; fn(el.value); render(); }; };
  on('cmp-test', v => { CMP.test = v; CMP.variant = null; CMP.kind = ''; CMP.col = ''; });
  on('cmp-variant', v => { CMP.variant = v; CMP.kind = ''; });
  on('cmp-mode', v => { CMP.mode = v; CMP.kind = ''; });
  on('cmp-unit', v => { CMP.unit = v; CMP.kind = ''; });
  on('cmp-ref', v => { CMP.ref = v; });
  on('cmp-basis', v => { CMP.basis = v; });
  on('cmp-tol', v => { const n = Number(v); if (n > 0) CMP.tol = n; });
  on('cmp-kind', v => { CMP.kind = v; CMP.col = ''; });
  on('cmp-col', v => { CMP.col = v; });
  const load = document.getElementById('cmp-load');
  if (load) load.onclick = () => {
    const cols = cmpColumns(cmpRuns()), list = (cmpFiles(cols)[CMP.kind] || []);
    list.forEach(f => { delete CMP.texts[f.id]; });
    CMP.err = '';
    cmpLoadFiles(list);
  };
  // the curves of the chosen measurement load by themselves (a few files at a time) unless the last try failed
  const cols = cmpColumns(cmpRuns()), list = (cmpFiles(cols)[CMP.kind] || []);
  if (list.some(f => !(f.id in CMP.texts)) && !CMP.loading && !CMP.err) cmpLoadFiles(list);
}

// ---- Race: every machine runs its DVT against the clock, the fastest one wins (user, 2026-10-23) ----
// The clock of a unit runs from the start of the race (or, when nobody pressed Start, from the unit's first recorded activity) to the
// moment its last owed run is finished. Per test: how long it took (the request's start -> finish when the run was started from the
// site, else the gap since the previous result, marked with "~"), set against the catalog's estimate. Pace = estimated minutes of
// finished work per hour of the clock, so units that owe different tests can still be compared.
const RACE_OPEN = new Set();
let RACE_PICK = false;          // the "who is in the race" list is open
const RACE_MEDAL = ['🥇', '🥈', '🥉'];
const raceNow = () => Date.now() / 1000 + ((DVT && DVT.skew) || 0);
const fmtClock = s => {
  s = Math.max(0, Math.floor(s));
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), x = s % 60, p2 = n => String(n).padStart(2, '0');
  return d ? `${d} d ${h} h ${p2(m)} min` : h ? `${h} h ${p2(m)} min ${p2(x)} s` : `${m} min ${p2(x)} s`;
};
const fmtMin = m => m == null ? '—' : m >= 2880 ? `${(m / 1440).toFixed(1)} d` : m >= 120 ? `${(m / 60).toFixed(1)} h` : `${Math.round(m)} min`;

function raceModel() {
  const cat = DVT.catalog, runs = DVT.runs || [], race = DVT.race || { start: 0, units: [] };
  const regOf = {};
  (DVT.units || []).forEach(x => { regOf[x.unit] = x; });
  const every = [...new Set(Object.values(cat.tests).flatMap(t => t.units || []))].sort();
  const taking = race.units && race.units.length ? every.filter(u => race.units.includes(u)) : every;
  const start = race.start || 0;
  const rows = taking.map(u => {
    const m = dvtUnitModel(u, cat, runs, regOf[u] || { unit: u }, DVT.requests);
    const byId = {};
    runs.filter(r => r.unit === u).forEach(r => { byId[r.runId] = r; });
    const reqs = (DVT.requests || []).filter(q => q.unit === u);
    let total = 0, finished = 0, doneMin = 0;
    const tests = m.tests.map(t => {
      let fin = 0, end = 0;
      t.owed.forEach(id => {
        total++;
        const r = byId[id], v = r ? String(r.verdict || '').toUpperCase() : '';
        if (r && ['PASS', 'FAIL', 'WAIVED'].includes(v) && (!start || dvtWhen(r) >= start)) { fin++; finished++; doneMin += t.per; end = Math.max(end, dvtWhen(r)); }
      });
      const done = fin === t.owed.length && t.owed.length > 0;
      const exact = reqs.filter(q => q.testId === t.tid && q.status === 'done' && q.started && q.finished && (!start || q.started >= start));
      return { tid: t.tid, title: t.title, minutes: t.minutes, done, end: done ? end : 0, took: exact.length ? exact.reduce((n, q) => n + (q.finished - q.started), 0) / 60 : null, approx: false };
    });
    const times = [...runs.filter(r => r.unit === u && (!start || dvtWhen(r) >= start)).map(dvtWhen), ...reqs.filter(q => q.started && (!start || q.started >= start)).map(q => q.started)].filter(Boolean);
    const begin = start || (times.length ? Math.min(...times) : 0);
    const complete = total > 0 && finished === total;
    const finish = complete ? Math.max(...tests.map(t => t.end)) : 0;
    // the tests that were not started from the site: the gap since the previous result
    let prev = begin;
    tests.filter(t => t.done).sort((a, b) => a.end - b.end).forEach(t => { if (t.took == null && prev) { t.took = Math.max(0, (t.end - prev) / 60); t.approx = true; } prev = t.end; });
    const elapsed = begin ? (finish || raceNow()) - begin : 0;
    const pace = elapsed > 0 ? doneMin / (elapsed / 3600) : 0;
    const left = Math.max(0, m.c.totalMin - doneMin);
    return { u, m, reg: m.reg, tests, total, finished, doneMin, begin, complete, finish, elapsed, pace, left,
             eta: !complete && pace > 0 && finished / total >= 0.05 ? left / pace * 3600 : 0,   pct: total ? finished / total * 100 : 0, started: !!begin };
  });
  // the ranking: finished units by their time, then the units still running by what they have done, then those that have not begun
  rows.sort((a, b) => (b.complete - a.complete) || (a.complete && b.complete ? a.elapsed - b.elapsed : 0) || (b.started - a.started) || (b.pct - a.pct) || (b.pace - a.pace));
  const done = rows.filter(r => r.complete);
  return { rows, start, everyone: rows.length > 0 && done.length === rows.length, winner: rows.length && done.length === rows.length ? done[0] : null, every, taking };
}

/** The fastest unit per test: only tests at least two units have finished. */
function raceChampions(model) {
  const out = [];
  const tids = [...new Set(model.rows.flatMap(r => r.tests.map(t => t.tid)))];
  tids.forEach(tid => {
    const c = model.rows.map(r => ({ u: r.u, t: r.tests.find(x => x.tid === tid) })).filter(x => x.t && x.t.done && x.t.took != null);
    if (c.length < 2) return;
    c.sort((a, b) => a.t.took - b.t.took);
    out.push({ tid, title: c[0].t.title, best: c[0], second: c[1] });
  });
  return out;
}

function raceCard() {
  if (!DVT || !DVT.catalog) return `<div class="card"><h2>Race</h2><p class="mut">${DVT ? 'No DVT catalog has reached the portal yet.' : 'Loading…'}</p></div>`;
  const model = raceModel(), race = DVT.race || { start: 0, units: [] };
  const startTxt = race.start ? new Date(race.start * 1000).toLocaleString([], { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
  const banner = model.winner
    ? `<div class="race-win">🏆 <b>${escH(model.winner.u)}</b> wins${model.winner.reg.integrator ? ' · ' + escH(model.winner.reg.integrator) : ''} - the whole DVT in <b>${fmtClock(model.winner.elapsed)}</b></div>`
    : model.rows.length && model.rows[0].started
      ? `<div class="race-lead">${model.rows.filter(r => r.complete).length} of ${model.rows.length} finished · in front: <b>${escH(model.rows[0].u)}</b> (${Math.round(model.rows[0].pct)} %)</div>` : '';
  const controls = `<div class="row" style="gap:.6rem;margin-bottom:.8rem">
      ${race.start ? `<span class="mut">Race started ${escH(startTxt)} · <span data-clock="${race.start}" data-end="">${fmtClock(raceNow() - race.start)}</span></span>
         <button id="race-reset" style="margin-left:auto">Reset the race</button>`
        : `<span class="mut">No official start yet - every unit's clock runs from its first recorded run.</span>
         <button class="primary" id="race-start" style="margin-left:auto">🏁 Start the race</button>`}</div>`;
  const lane = (r, i) => {
    const open = RACE_OPEN.has(r.u);
    const medal = r.complete ? (RACE_MEDAL[i] || String(i + 1)) : r.started ? '🏃' : '⏳';
    const clock = r.started ? `<span class="race-clock" data-clock="${r.begin}" data-end="${r.finish || ''}">${fmtClock(r.elapsed)}</span>` : '<span class="mut">not started</span>';
    const sub = r.complete ? `finished · ${fmtMin(r.doneMin)} of tests · pace ${Math.round(r.pace)} min/h`
      : r.started ? `${r.finished}/${r.total} runs${r.pace ? ` · pace ${Math.round(r.pace)} min/h` : ''}${r.eta ? ` · about ${fmtMin(r.eta / 60)} to go` : ''}` : `${r.total} runs to do`;
    const testRows = r.tests.map(t => {
      const delta = t.took != null && t.minutes ? t.took - t.minutes : null;
      return `<tr><td>${escH(t.tid)} <span class="mut">${escH(t.title)}</span></td><td data-l="Took">${t.done ? (t.took != null ? (t.approx ? '~' : '') + fmtMin(t.took) : '—') : '<span class="mut">open</span>'}</td>
        <td data-l="Estimate">${fmtMin(t.minutes)}</td><td data-l="vs estimate">${delta == null ? '' : `<span class="${delta <= 0 ? 'ok-t' : 'err-t'}">${delta <= 0 ? '' : '+'}${Math.round(delta)} min</span>`}</td></tr>`;
    }).join('');
    return `<div class="race-card ${r.complete && i === 0 && model.everyone ? 'champ' : ''}" data-race="${escH(r.u)}">
        <div class="race-rank">${medal}</div>
        <div class="race-main"><b>${escH(r.u)}</b> <span class="mut">${escH(r.reg.integrator || '')}${r.m.machine ? ' · ' + escH(r.m.machine) : ''}</span>
          <div class="dvt-bar" style="margin:.35rem 0 .2rem"><div style="width:${r.pct.toFixed(0)}%"></div></div>
          <span class="mut" style="font-size:.85rem">${sub}</span></div>
        <div class="race-time">${clock}</div>
      </div>${open ? `<div style="overflow-x:auto;margin:-.3rem 0 .8rem"><table class="cards"><tr><th>Test</th><th>Took</th><th>Estimate</th><th>vs</th></tr>${testRows}</table></div>` : ''}`;
  };
  const champs = raceChampions(model);
  const champRows = champs.map(c => `<tr><td>${escH(c.tid)} <span class="mut">${escH(c.title)}</span></td><td data-l="Fastest"><b>${escH(c.best.u)}</b> ${fmtMin(c.best.t.took)}</td>
      <td data-l="Next">${escH(c.second.u)} ${fmtMin(c.second.t.took)}</td></tr>`).join('');
  const picker = model.every.length > 1 ? `<details id="race-pick" ${RACE_PICK ? 'open' : ''} style="margin-top:.8rem"><summary class="mut" style="cursor:pointer">Who is in the race (${model.taking.length} of ${model.every.length})</summary>
      <div class="row" style="gap:.8rem;margin-top:.5rem;flex-wrap:wrap">${model.every.map(u => `<label><input type="checkbox" data-race-unit="${escH(u)}" ${model.taking.includes(u) ? 'checked' : ''}> ${escH(u)}</label>`).join('')}</div></details>` : '';
  return `<div class="card"><h2>DVT race <span class="mut" style="font-weight:400;text-transform:none">who finishes the whole DVT first</span></h2>
      ${banner}${controls}${model.rows.map(lane).join('') || '<p class="mut">No unit in the race.</p>'}${picker}
      <p class="mut" style="margin:.6rem 0 0;font-size:.85rem">The clock of a unit stops when its last owed run is finished (pass, fail or waived). Pace = estimated minutes of finished tests per hour of the clock, so units that owe different tests can be compared. Tap a unit for its tests.</p></div>
    ${champRows ? `<div class="card"><h2>Test champions <span class="mut" style="font-weight:400;text-transform:none">fastest unit per test</span></h2><table class="cards"><tr><th>Test</th><th>Fastest</th><th>Next</th></tr>${champRows}</table></div>` : ''}`;
}

async function raceSet(d) {
  try { await api('/api/dvt/race', { method: 'POST', body: JSON.stringify(d) }); } catch { return; }
  await loadDvt();
  if (VIEW === 'race') render();          // also when a checkbox still has the focus (loadDvt leaves a field being used alone)
}

function raceWire() {
  [...document.querySelectorAll('[data-race]')].forEach(c => c.onclick = () => {
    const u = c.dataset.race;
    if (RACE_OPEN.has(u)) RACE_OPEN.delete(u); else RACE_OPEN.add(u);
    render();
  });
  const pick = document.getElementById('race-pick');
  if (pick) pick.ontoggle = () => { RACE_PICK = pick.open; };
  const st = document.getElementById('race-start');
  if (st) st.onclick = () => { if (confirm('Start the race now? Every unit\'s clock starts together; only runs finished from now on count.')) raceSet({ start: 'now' }); };
  const rs = document.getElementById('race-reset');
  if (rs) rs.onclick = () => { if (confirm('Reset the race? The clocks go back to each unit\'s first recorded run.')) raceSet({ start: 0 }); };
  [...document.querySelectorAll('[data-race-unit]')].forEach(cb => cb.onchange = () => {
    const picked = [...document.querySelectorAll('[data-race-unit]')].filter(x => x.checked).map(x => x.dataset.raceUnit);
    raceSet({ units: picked });
  });
}
