<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Stratasys</title>
<style>
html,body{margin:0;height:100%;background:#0e1418;color:#e6ebf0;font-family:"Segoe UI",system-ui,sans-serif;cursor:none;overflow:hidden}
.c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px}
img{width:38vw;max-width:520px}
p{margin:0;font-size:2.4vh;letter-spacing:.04em;color:#c5d0da}
.bar{width:28vw;height:4px;background:rgba(255,255,255,.18);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:30%;background:#3fb8ba;animation:s 1.4s ease-in-out infinite}
@keyframes s{0%{transform:translateX(-100%)}100%{transform:translateX(340%)}}
.err{color:#e06a60}
</style></head><body>
<div class="c"><img src="logo.png" alt="Stratasys"><p id="m">Starting system…</p><div class="bar"><i></i></div></div>
<script>
// Same look as the Plymouth splash. Poll the hardware service; hand over to
// the application the moment it answers. Never shows anything else.
const APP = "http://127.0.0.1:3001";
let tries = 0;
(async function poll() {
  try {
    const r = await fetch(APP + "/api/state", { cache: "no-store" });
    if (r.ok) { location.replace(APP + "/"); return; }
  } catch (e) {}
  tries++;
  if (tries > 120) document.getElementById("m").textContent = "Service required — the application did not start";
  setTimeout(poll, 1000);
})();
</script></body></html>
