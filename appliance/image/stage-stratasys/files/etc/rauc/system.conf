# RAUC A/B update configuration — CM5 with the Raspberry Pi tryboot bootloader
[system]
compatible=stratasys-scure-cm5
bootloader=custom
statusfile=/data/rauc.status
bundle-formats=verity
max-bundle-download-size=1500000000

[keyring]
path=/etc/rauc/ca.cert.pem
# bundles signed by a cert chained to the Stratasys update CA; anything else is rejected

[handlers]
# tryboot glue: sets autoboot.txt [tryboot] to the target slot and reboots once;
# mark-good rewrites autoboot.txt permanently. Refuses bundles below the version floor.
bootloader-custom-backend=/usr/lib/stratasys/rauc-tryboot.sh
pre-install=/usr/lib/stratasys/rauc-pre-install.sh

[slot.boot.0]
device=/dev/disk/by-partlabel/boot-a
type=vfat
bootname=A

[slot.boot.1]
device=/dev/disk/by-partlabel/boot-b
type=vfat
bootname=B

[slot.rootfs.0]
device=/dev/disk/by-partlabel/root-a
type=raw
parent=boot.0

[slot.rootfs.1]
device=/dev/disk/by-partlabel/root-b
type=raw
parent=boot.1

[slot.verity.0]
device=/dev/disk/by-partlabel/verity-a
type=raw
parent=boot.0

[slot.verity.1]
device=/dev/disk/by-partlabel/verity-b
type=raw
parent=boot.1
