# Stratasys production USB policy (usbguard). Default: block.
# Allowed: hubs, HID (touchscreen / keyboard / mouse), the machine's own
# interface boards. Mass storage is NOT allowed here — Service Mode adds a
# temporary rule for /media/update (30 min), then removes it.
allow with-interface equals { 09:00:* }                        # hubs
allow with-interface one-of { 03:00:* 03:01:* }                # HID
allow id 0ce9:1000                                             # PicoLog TC-08 (service / HDT calibration)
allow id 1a86:8091                                             # carrier USB hub
# Stratasys interface boards (VID:PID) — extend per carrier revision
allow id 2e8a:*                                                # Raspberry Pi (RP1/RP2040 based IO boards)
block
