# HDMI monitor / bench setup: force 1280x720@60 on HDMI-1 (hot-plug forced so
# the kiosk starts even if the panel is connected after power-on).
DISPLAY_NAME="HDMI 1280x720 (bench)"
CONFIG_TXT='hdmi_force_hotplug=1'
VIDEO="video=HDMI-A-1:1280x720@60D"
LOGICAL_W=1280
LOGICAL_H=720
BACKLIGHT_SYSFS=""
