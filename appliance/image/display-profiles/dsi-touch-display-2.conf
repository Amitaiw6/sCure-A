# Raspberry Pi Touch Display 2 (7", 720x1280 native, mounted landscape) on the
# CM5 carrier's DSI-1 connector. Selected at build/sign time:
#   DISPLAY_PROFILE=dsi-touch-display-2 make-boot-img.sh ...
# Everything here ends up INSIDE the signed boot.img (config.txt + cmdline).
DISPLAY_NAME="Raspberry Pi Touch Display 2 (DSI, landscape)"
# config.txt lines
CONFIG_TXT='dtoverlay=vc4-kms-dsi-ili9881-7-0
dtparam=touchscreen-swapped-x-y
dtparam=touchscreen-inverted-x'
# kernel cmdline: fixed mode + rotation so the panel is landscape from the
# first Plymouth frame; wlroots (cage) reads the same rotation for touch mapping
VIDEO="video=DSI-1:720x1280@60,rotate=90"
# logical size the app is scaled to (fitToScreen stretches the 800x480 canvas)
LOGICAL_W=1280
LOGICAL_H=720
BACKLIGHT_SYSFS="/sys/class/backlight/*"
